<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="gibbon">
  <!-- Vượn đen má vàng (yellow-cheeked gibbon) đu cành: dùng làm biểu tượng từ "gibbon" (i:gibbon.svg) -->
  <!-- cành cây -->
  <path d="M6 20 Q64 10 122 18" fill="none" stroke="#8B5A2B" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="20" cy="12" rx="9" ry="5" fill="#5DBB46" transform="rotate(-20 20 12)"/>
  <ellipse cx="108" cy="9" rx="9" ry="5" fill="#5DBB46" transform="rotate(25 108 9)"/>
  <ellipse cx="40" cy="9" rx="6" ry="3.5" fill="#7ED35F" transform="rotate(15 40 9)"/>
  <!-- tay phải dài, bám cành -->
  <path d="M66 60 Q74 40 84 19" fill="none" stroke="#24242B" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="85" cy="17" rx="6" ry="5" fill="#24242B"/>
  <!-- tay trái dài, dang ra -->
  <path d="M47 63 Q28 64 20 84" fill="none" stroke="#24242B" stroke-width="9" stroke-linecap="round"/>
  <circle cx="19" cy="88" r="5" fill="#24242B"/>
  <!-- chân co -->
  <path d="M51 94 Q42 102 46 114" fill="none" stroke="#24242B" stroke-width="8" stroke-linecap="round"/>
  <path d="M66 94 Q76 102 72 114" fill="none" stroke="#24242B" stroke-width="8" stroke-linecap="round"/>
  <!-- thân (không có đuôi) -->
  <ellipse cx="58" cy="78" rx="14" ry="20" fill="#24242B"/>
  <ellipse cx="54" cy="74" rx="5" ry="10" fill="#3A3A44"/>
  <!-- đầu và chỏm lông -->
  <circle cx="56" cy="45" r="16" fill="#24242B"/>
  <path d="M50 31 Q56 22 62 31 Z" fill="#24242B"/>
  <!-- má vàng -->
  <path d="M42 48 Q42 36 56 37 Q70 36 70 48 Q70 61 56 62 Q42 61 42 48 Z" fill="#F4C542"/>
  <!-- mặt -->
  <ellipse cx="56" cy="47" rx="8.5" ry="9" fill="#3B2E2A"/>
  <circle cx="52.5" cy="45" r="2.6" fill="#fff"/>
  <circle cx="59.5" cy="45" r="2.6" fill="#fff"/>
  <circle cx="53" cy="45.5" r="1.4" fill="#111"/>
  <circle cx="60" cy="45.5" r="1.4" fill="#111"/>
  <path d="M52.5 51 Q56 54.5 59.5 51" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
</svg>
