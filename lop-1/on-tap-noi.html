 units:LopHocVocab.units("lop-1", { only:/^g[0-9]+$/ }) /* từ vựng 16 Unit: assets/vocab/lop-1.js */,
 guide:"<h3>Vì sao có bài ôn nói?</h3>\n<p>Trang này đi cùng <b>Giáo án lớp 1</b> (16 Unit). Cứ học xong vài Unit, con có một buổi ôn nói gom từ và mẫu câu của <b>tất cả</b> các Unit đã học vào 5 kiểu bài nói khác nhau. Như vậy con dùng từ cũ cùng từ mới và nói thành đoạn, không chỉ trả lời một câu.</p>\n<h3>Khi nào ôn?</h3>\n<ul><li>Học xong <b>Unit 3</b>: Speaking 1, từ của Unit 1–3.</li><li>Sau đó cứ <b>2 Unit</b> một lần: Unit 1–5, 1–7, 1–9, 1–11, 1–13, 1–15.</li><li>Học xong cả 16 Unit: <b>Big Show</b>, bài ôn cuối năm.</li></ul>\n<h3>Một buổi ôn (30–35 phút)</h3>\n<ol><li><b>Khởi động (3 phút):</b> mở <i>Word bank</i>, nghe nhanh từ của 2 Unit mới (nhãn NEW). Cô chỉ hình, con nói từ, rồi đặt một câu với từ đó.</li>\n<li><b>Hai bài nói (15–20 phút):</b> mỗi bài 4 bước: 👂 Listen → 🦜 Repeat (hoặc 🎭 Be A / Be B) → 🙈 Say it alone → 🌟 On stage.</li>\n<li><b>Make it yours (7 phút):</b> con đổi từ in đậm thành chi tiết thật của mình.</li>\n<li><b>Teacher asks (5 phút):</b> cô hỏi thêm, con trả lời bằng câu của mình. Khuyến khích con nói 2 câu: một câu trả lời, một câu thêm thông tin.</li></ol>\n<p>3 bài còn lại để buổi sau hoặc cho con luyện ở nhà.</p>\n<h3>5 kiểu bài và kỹ năng con luyện</h3>\n<ul><li><b>Talk together:</b> hỏi – đáp, giữ lượt nói, đáp lời lịch sự.</li>\n<li><b>Tell a story:</b> kể theo tranh ở ngôi thứ ba (He / She / They), có rắc rối và kết thúc đẹp.</li>\n<li><b>Show and tell:</b> đứng trước lớp giới thiệu, có câu chào và câu cảm ơn.</li>\n<li><b>Compare:</b> hai bạn đứng cạnh nhau, mỗi bạn một bên; luyện <i>but, too, both</i>.</li>\n<li><b>My story:</b> con kể chuyện của mình theo thứ tự <i>First → Then → After that → Finally</i>.</li></ul>\n<h3>Bài Speech (thuyết trình mẫu)</h3>\n<p>Mỗi bài ôn có thêm tab <b>🎤 Speech</b>: một bài thuyết trình dài có tranh vẽ (gia đình, thú cưng, khu vườn, cơ thể, sở thú, hồ nước, đồ con thích, việc con làm được). Câu dài hơn, nhiều mẫu câu hơn: <i>There is / There are, He likes…, because…, can / can’t</i>. Con luyện như các bài khác rồi đổi chi tiết thành của mình.</p>\n<h3>🏠 Bài tập về nhà theo Unit</h3>\n<p>Cuối mỗi bài ôn có khối <b>🏠 Homework</b>, chia tab theo từng Unit mới của bài ôn đó (bấm <b>📚 All units</b> hoặc mục <b>Bài tập về nhà</b> trên menu để chọn thẳng Unit 1–16). Mỗi Unit có 12 dạng bài tự chấm, tự sinh từ từ vựng của Unit: <i>Listen and choose, Look and choose, Yes or no, Match, Missing letter, Spell it, Write the word, Fill the gap, Make a sentence, Memory, Say it, Talk at home</i>, cộng bài riêng (Unit 9, 16: đếm và viết số; Unit 10: con vật hoang dã – vật nuôi, sản phẩm, bộ phận cơ thể, nói 4 câu về con vật) và nút <b>🖨️ Worksheet</b> in phiếu 6 phần có trang đáp án cho ba mẹ. Mỗi lần in, phiếu đổi từ và thứ tự.</p>\n<ul><li>Mỗi ngày 2–3 bài, 10–15 phút. Ba mẹ ngồi cùng, bấm 🔊 để nghe mẫu. Con chọn sai thì cho chọn lại, không cần chấm điểm.</li><li>Mỗi bài có 3 sao; số bài đã làm hiện ở tab Unit (⭐ 5/14). Sao lưu trên máy đang dùng.</li><li>Bài <b>💬 Talk at home</b> là nói chuyện thật với con theo 4 kỹ thuật bên dưới, dùng đúng từ của Unit. Câu của con được che, con nói trước rồi mới bấm 👀 xem.</li></ul>\n<h3>4 kỹ thuật vàng khi nói cùng con ở nhà</h3>\n<ol><li><b>Mở rộng câu:</b> con nói một từ, ba mẹ nhắc lại thành câu đầy đủ và thêm một ý (màu, số, việc đang làm, ở đâu). Không chê, không bắt con nói lại. <i>Dog! → Yes! A big brown dog. The dog is running!</i></li><li><b>Tạo tình huống cần nói:</b> đừng phục vụ con quá nhanh. Cố tình thiếu một thứ hoặc nói sai cho con sửa, chờ 5 giây để con mở lời. <i>A cat says woof! → No! A cat says meow!</i></li><li><b>Câu hỏi lựa chọn:</b> đưa 2 lựa chọn, từ con cần nói đã có trong câu hỏi. Con quen rồi thì đổi sang câu hỏi mở. <i>Apple or banana? → A banana, please!</i></li><li><b>Đọc sách tranh trước khi ngủ:</b> 10 phút, chỉ vào tranh và hỏi <i>Who? What? Where? How many? What color?</i></li></ol>\n<p>Thêm: tường thuật việc con đang làm rồi đổi vai; làm quá nét mặt và dùng đồ thật; nói theo cụm (<i>a yellow banana, peel the banana</i>); mỗi tối con nói bài <b>Speech</b> cho cả nhà nghe. Cứ 5 phút cho con đứng dậy vận động; khen ngay khi con mở lời.</p>\n<h3>Mẹo</h3>\n<ul><li>Gõ tên con vào ô <b>My name</b>: tên con hiện trong bài.</li><li>Không ngắt lời để sửa. Con nói xong, cô nhắc lại câu đúng một lần.</li>\n<li>Trên sân khấu, tick <b>Record my voice</b> để con nghe lại và tự nhận xét.</li>\n<li>Bài học của con chỉ có tiếng Anh. Gợi ý dạy từng bài và nghĩa tiếng Việt của từng câu nằm ở mục <b>🔒 Cẩm nang</b> (mã PIN Đáp án).</li></ul>\n",

 {"id":"r1","n":"Speaking 1","ic":"🛒","title":"Friends, Food and Fun!","span":"Units 1–3","when":"Sau Unit 3 (tuần 6)","units":["g1","g2","g3"],"fresh":["g1","g2","g3"],tasks:[
  {"type":"talk","title":"A New Friend","ic":"🎠","roles":{"A":["👧🏽","Mia"],"B":["🧒","{name}"]},"tip":"Cô cầm quả bóng đóng vai Mia, trẻ đóng vai chính mình. Khi nói \"Here you are\" trẻ đưa đồ thật (bánh, táo nhựa) cho bạn.","lines":[["A","<b>Hello</b>! Is this your <b>ball</b>?","Xin chào! Đây là quả bóng của bạn à?","⚽"],["B","Yes, it is. Let's <b>play</b>!","Ừ, đúng rồi. Mình cùng chơi nhé!"],["A","Yay! I'm Mia. I'm new here.","Hay quá! Tớ là Mia. Tớ mới đến đây."],["B","<b>Hi</b>, Mia! I'm {name}. Be my <b>friend</b>!","Chào Mia! Tớ là {name}. Làm bạn với tớ nhé!","🧑‍🤝‍🧑"],["A","OK! Oh... I'm <b>hungry</b>.","Được! Ôi... tớ đói quá.","😋"],["B","I have a <b>cake</b> in my <b>bag</b>. <b>Here you are</b>!","Tớ có bánh trong túi. Của bạn đây!","🎂"],["A","<b>Thank you</b>! Do you like <b>apples</b>?","Cảm ơn bạn! Bạn có thích táo không?","🍎"],["B","Yes, I do!","Có, tớ thích lắm!"],["A","Here's a <b>big</b> apple for you!","Đây là một quả táo to cho bạn!","🍎"],["B","Wow! <b>Thank you</b>, Mia!","Ôi! Cảm ơn Mia nhé!"]],"swap":["<b>ball</b> → bike / book","<b>cake</b> → apple / orange","<b>big</b> → small"],"ask":["What's your friend's name?","What's in your bag?","Do you like cake?"]},
  {"type":"story","title":"Bi's Lost Hat","ic":"👒","tip":"Cô kể từng tranh, trẻ nhắc lại. Cho trẻ đội mũ thật, đến tranh \"Oh no!\" thì giấu mũ đi để cả lớp cùng tìm.","lines":[["🛒","Bi and Grandma are at the <b>market</b>.","Bi và bà đang ở chợ."],["👒","Bi has a <b>big</b> <b>hat</b>. He likes it!","Bi có một cái mũ to. Cậu rất thích nó!"],["🍊","Grandma buys <b>oranges</b> and <b>apples</b>.","Bà mua cam và táo."],["😮","Oh no! Where's Bi's <b>hat</b>?","Ôi không! Mũ của Bi đâu rồi?"],["👧","A <b>small</b> <b>girl</b> has it. \"Is this your hat?\"","Một bạn gái nhỏ đang cầm nó. \"Đây là mũ của bạn phải không?\""],["🙏","\"Yes! <b>Thank you</b>!\" says Bi.","\"Đúng rồi! Cảm ơn bạn!\" Bi nói."],["🍎","Bi gives her an apple. \"<b>Here you are</b>!\"","Bi tặng bạn ấy một quả táo. \"Của bạn đây!\""],["🧑‍🤝‍🧑","Now they are <b>friends</b>!","Bây giờ hai bạn đã là bạn của nhau!"]],"swap":["<b>hat</b> → bag / ball","<b>oranges</b> → apples / cakes"],"ask":["Where are Bi and Grandma?","Who has Bi's hat?","What does Bi give the girl?"]},
  {"type":"show","title":"My Picnic Bag","ic":"🧺","tip":"Trẻ mang một cái túi thật có sách, bóng, cốc, quả cam; vừa nói vừa lấy từng thứ ra giơ lên cho cả lớp xem.","lines":[["👜","This is my <b>bag</b>. It's <b>big</b>!","Đây là cái túi của tớ. Nó to lắm!"],["📕","In my bag, I have a <b>book</b>.","Trong túi tớ có một quyển sách."],["⚽","I have a <b>ball</b>, too. Let's <b>play</b>!","Tớ còn có một quả bóng. Cùng chơi nào!"],["☕","Look! A <b>cup</b> and a <b>can</b>.","Nhìn này! Một cái cốc và một cái lon."],["🍊","And an <b>orange</b>. Can you say \"orange\"?","Và một quả cam. Các bạn nói \"orange\" được không?"],["🐜","Oh! A <b>small</b> <b>ant</b> on my orange!","Ôi! Có một con kiến nhỏ trên quả cam của tớ!"],["👋","Wave with me and say: \"<b>Goodbye</b>, ant!\"","Vẫy tay cùng tớ và nói: \"Tạm biệt kiến nhé!\""]],"swap":["<b>book</b> → cake / hat","<b>orange</b> → apple / cake"],"ask":["What's in your bag?","Is your bag big or small?","Do you like oranges?"]},
  {"type":"compare","title":"Rice or Cake?","ic":"🍚","left":["👧","Na"],"right":["👦","Bi"],"tip":"Hai trẻ đứng hai bên, mỗi bạn nói câu của mình và chỉ vào tranh. Câu cuối cả hai nắm tay nói to cùng nhau.","lines":[["L","👧","I'm Na. I'm a <b>girl</b>.","Tớ là Na. Tớ là con gái."],["R","👦","I'm Bi. I'm a <b>boy</b>.","Tớ là Bi. Tớ là con trai."],["L","🍚","I like <b>rice</b>.","Tớ thích cơm."],["R","🎂","I like rice, too. And I like <b>cake</b>!","Tớ cũng thích cơm. Và tớ thích cả bánh ngọt!"],["L","🍎","I like <b>apples</b>.","Tớ thích táo."],["R","🍊","I don't like apples, but I like <b>oranges</b>.","Tớ không thích táo, nhưng tớ thích cam."],["L","🚲","I have a <b>bike</b>.","Tớ có một chiếc xe đạp."],["R","🚗","I don't have a bike, but I have a <b>car</b>!","Tớ không có xe đạp, nhưng tớ có một cái ô tô!"],["B","😋","We are both <b>hungry</b>! Let's <b>eat</b>!","Cả hai chúng tớ đều đói! Cùng ăn thôi!"]],"swap":["<b>rice</b> → cake / apples","<b>bike</b> → ball / book"],"ask":["Do you like rice?","Do you have a bike or a car?","What do you and your friend both like?"]},
  {"type":"me","title":"My Day at the Market","ic":"🛒","tip":"Trẻ kể theo thứ tự, giơ ngón tay đếm First, Then, After that, Finally. Có thể dùng tranh chợ hoặc giỏ đồ chơi làm đạo cụ.","lines":[["🛒","First, I go to the <b>market</b> with my <b>family</b>.","Đầu tiên, tớ đi chợ cùng gia đình."],["👒","Then, I see a <b>big</b> <b>hat</b>. I like it!","Sau đó, tớ thấy một cái mũ to. Tớ thích nó!"],["🍊","After that, Mom buys <b>oranges</b>. I say, \"<b>Thank you</b>!\"","Tiếp theo, mẹ mua cam. Tớ nói: \"Cảm ơn mẹ!\""],["🐱","I see a <b>cat</b> at the market. Hello, cat!","Tớ thấy một con mèo ở chợ. Chào mèo!"],["🍽️","Finally, we <b>eat</b> <b>rice</b> in the <b>dining room</b>.","Cuối cùng, cả nhà ăn cơm trong phòng ăn."],["😋","Mmm! I'm not <b>hungry</b> now!","Ngon quá! Giờ tớ hết đói rồi!"]],"swap":["<b>hat</b> → bag / cake","<b>oranges</b> → apples / cakes"],"ask":["Who do you go to the market with?","What do you see at the market?","What do you eat for dinner?"]},

 {"id":"r2","n":"Speaking 2","ic":"🍟","title":"Yummy Day, Rainy Day!","span":"Units 1–5","when":"Sau Unit 5 (tuần 10)","units":["g1","g2","g3","g4","g5"],"fresh":["g4","g5"],tasks:[
  {"type":"talk","title":"At the Fish and Chip Shop","ic":"🐟","roles":{"A":["👨","Dad"],"B":["🧒","{name}"]},"tip":"Kê bàn làm quầy cửa hàng, cô đóng vai bố. Đến câu \"It wants my fish!\" trẻ ôm đĩa đồ ăn lại và lắc đầu cho vui.","lines":[["A","We're at the <b>shop</b>. Are you <b>hungry</b>?","Mình đến cửa hàng rồi. Con có đói không?","🏪"],["B","Yes, I am! I like <b>fish</b> and <b>chips</b>.","Có ạ! Con thích cá và khoai tây chiên.","🍟"],["A","OK. Fish and chips, <b>please</b>. And <b>chicken</b>?","Được. Cho cá và khoai tây chiên ạ. Còn gà thì sao?"],["B","Yes, please! I like chicken, too.","Có ạ! Con cũng thích gà.","🍗"],["A","What do you want to <b>drink</b>? <b>Milk</b> or <b>juice</b>?","Con muốn uống gì? Sữa hay nước ép?"],["B","<b>Juice</b>, please!","Nước ép ạ!","🧃"],["A","<b>Here you are</b>. Oh! Look at the <b>cat</b> <b>near</b> the <b>door</b>.","Của con đây. Ơ! Nhìn con mèo ở gần cửa kìa.","🐱"],["B","It wants my fish! No, no, cat!","Nó muốn ăn cá của con! Không, không được đâu mèo ơi!"],["A","Ha ha! Eat your fish. Is it <b>yummy</b>?","Ha ha! Con ăn cá đi. Có ngon không?"],["B","Yes! Can I have an <b>ice cream</b>, too?","Ngon ạ! Con ăn thêm kem được không?","🍦"],["A","OK! A <b>small</b> ice cream for you.","Được! Một cây kem nhỏ cho con."],["B","<b>Thank you</b>, Dad!","Con cảm ơn bố!"]],"swap":["<b>fish</b> → chicken / chips","<b>juice</b> → milk","<b>cat</b> → dog / duck"],"ask":["Do you like fish and chips?","What do you like to drink?","Do you like ice cream?"]},
  {"type":"story","title":"Where's Na's Doll?","ic":"🎎","tip":"Dùng búp bê và một con chó đồ chơi. Trẻ chỉ và nói \"on / under / near\" khi tìm búp bê quanh lớp.","lines":[["🛌","Na is in her <b>bedroom</b>. Where's her <b>doll</b>?","Na đang ở trong phòng ngủ. Búp bê của bạn ấy đâu rồi?"],["🛏️","It isn't on the <b>bed</b>. It isn't under the <b>desk</b>.","Nó không ở trên giường. Nó không ở dưới bàn học."],["😟","Na cries, \"My doll! Where are you?\"","Na khóc: \"Búp bê ơi! Em ở đâu?\""],["🐶","Look! Her <b>dog</b> Lucky is <b>near</b> the <b>door</b>. He has the doll!","Nhìn kìa! Chú chó Lucky ở gần cửa. Nó đang giữ búp bê!"],["⚽","Bi says, \"Lucky! Here's a <b>ball</b>!\"","Bi nói: \"Lucky ơi! Bóng đây này!\""],["🎎","Lucky drops the doll. He likes the ball!","Lucky nhả búp bê ra. Nó thích quả bóng hơn!"],["🙏","\"<b>Thank you</b>, Bi!\" Na hugs her doll.","\"Cảm ơn Bi!\" Na ôm búp bê."],["🐟","Na gives Lucky a little <b>fish</b>. <b>Yummy</b>! Good dog!","Na cho Lucky một con cá nhỏ. Ngon quá! Chó ngoan!"]],"swap":["<b>doll</b> → duck / book","<b>under the desk</b> → under the bed / near the lamp"],"ask":["Where's the doll?","Who has the doll?","Do you have a dog?"]},
  {"type":"show","title":"My Bedroom","ic":"🛏️","tip":"Trẻ cầm tranh vẽ phòng ngủ của mình và chỉ từng đồ vật. Câu cuối mời cả lớp tìm con vịt trong tranh.","lines":[["🛌","This is my <b>bedroom</b>. It's <b>small</b>, but I like it.","Đây là phòng ngủ của tớ. Nó nhỏ, nhưng tớ thích nó."],["🛏️","Here's my <b>bed</b>. My <b>cat</b> is on it. Shh!","Đây là giường của tớ. Con mèo đang nằm trên đó. Suỵt!"],["🪑","This is my <b>desk</b>. My <b>books</b> are on the desk.","Đây là bàn học. Sách của tớ ở trên bàn."],["💡","My <b>lamp</b> is <b>near</b> the desk. Click! It's on!","Cái đèn ở gần bàn. Tách! Đèn sáng rồi!"],["🎎","My <b>doll</b> is in my <b>bag</b>. Say hi, doll!","Búp bê ở trong túi của tớ. Chào đi búp bê!"],["🦆","Where's my <b>duck</b>? Can you find it?","Con vịt của tớ đâu nhỉ? Các bạn tìm được không?"],["⬇️","Yes! It's <b>under</b> the bed! Hooray!","Đúng rồi! Nó ở dưới gầm giường! Hoan hô!"]],"swap":["<b>small</b> → big","<b>cat</b> → dog / doll","<b>under the bed</b> → on the desk / near the door"],"ask":["Is your bedroom big or small?","What's on your desk?","Where's your bed?"]},
  {"type":"compare","title":"Yummy or Yucky?","ic":"🍦","left":["👦🏼","Tom"],"right":["👧🏽","Mia"],"tip":"Hai trẻ đóng vai Tom và Mia, xoa bụng khi nói \"Yummy\", nhăn mặt khi nói \"Yucky\". Câu cuối cả hai cùng giơ kem tưởng tượng.","lines":[["L","🐟","I like <b>fish</b>. <b>Yummy</b>!","Tớ thích cá. Ngon tuyệt!"],["R","🤢","I don't like fish. It's <b>yucky</b>!","Tớ không thích cá. Dở lắm!"],["L","🍗","I like <b>chicken</b>, too.","Tớ cũng thích gà nữa."],["R","🍗","Me too! I like chicken.","Tớ cũng vậy! Tớ thích gà."],["L","🥛","I <b>drink</b> <b>milk</b>.","Tớ uống sữa."],["R","🧃","I drink <b>juice</b>, but I like milk, too.","Tớ uống nước ép, nhưng tớ cũng thích sữa."],["L","🐶","I have a <b>dog</b>.","Tớ có một con chó."],["R","🐖","I have a <b>pig</b>! A <b>small</b> pig!","Tớ có một con lợn! Một con lợn nhỏ!"],["B","🍦","We both like <b>ice cream</b>!","Cả hai chúng tớ đều thích kem!"]],"swap":["<b>fish</b> → chips / chicken","<b>dog</b> → cat / duck"],"ask":["Do you like fish?","What's yucky for you?","What do you and your friend both like?"]},
  {"type":"me","title":"My Rainy Saturday","ic":"🌧️","tip":"Trẻ kể một ngày mưa ở nhà và đi cửa hàng. Khuyến khích làm động tác: đọc sách, lái ô tô, uống nước ép.","lines":[["🌧️","It's a rainy day. First, I read a <b>book</b> on my <b>bed</b>.","Hôm đó trời mưa. Đầu tiên, tớ đọc sách trên giường."],["🎎","Then, I play with my <b>doll</b> and my <b>dog</b>.","Sau đó, tớ chơi với búp bê và con chó."],["🚗","After that, Dad and I go to the <b>shop</b> by <b>car</b>.","Tiếp theo, bố và tớ đi ô tô đến cửa hàng."],["🍟","We get <b>fish</b> and <b>chips</b>. <b>Yummy</b>!","Bố con tớ mua cá và khoai tây chiên. Ngon quá!"],["🧃","I <b>drink</b> <b>juice</b>. Dad drinks <b>milk</b>.","Tớ uống nước ép. Bố uống sữa."],["👨‍👩‍👧","Finally, my <b>family</b> eats in the <b>dining room</b>.","Cuối cùng, cả nhà tớ cùng ăn trong phòng ăn."],["🌧️","I like rainy days!","Tớ thích những ngày mưa!"]],"swap":["<b>book</b> → doll / ball","<b>fish and chips</b> → chicken / ice cream"],"ask":["What do you do on a rainy day?","Who do you go to the shop with?","What do you like to drink?"]},

 {"id":"r3","n":"Speaking 3","ic":"🌷","title":"Colours in the Garden!","span":"Units 1–7","when":"Sau Unit 7 (tuần 14)","units":["g1","g2","g3","g4","g5","g6","g7"],"fresh":["g6","g7"],tasks:[
  {"type":"talk","title":"Can I Have Your Eraser?","ic":"🧽","roles":{"A":["👦","Bi"],"B":["🧒","{name}"]},"tip":"Hai trẻ ngồi cạnh nhau với bút chì, cục tẩy và một bức vẽ. Đến câu \"Ring, ring!\" cô rung chuông thật.","lines":[["A","Psst! {name}! Can I have your <b>eraser</b>, <b>please</b>?","Suỵt! {name} ơi! Cho tớ mượn cục tẩy nhé?","🧽"],["B","Sure. <b>Here you are</b>!","Được chứ. Của bạn đây!"],["A","<b>Thank you</b>! Look at my <b>drawing</b>.","Cảm ơn bạn! Xem bức vẽ của tớ này.","🖼️"],["B","Wow! It's a <b>garden</b>! I see a <b>tree</b>.","Ồ! Một khu vườn! Tớ thấy một cái cây.","🌳"],["A","And a <b>bird</b> in the tree. It's <b>blue</b>!","Và một con chim trên cây. Nó màu xanh dương!","🐦"],["B","Can I have your <b>red</b> <b>pencil</b>?","Cho tớ mượn bút chì đỏ được không?","✏️"],["A","Here. What's your drawing?","Đây. Bạn vẽ gì thế?"],["B","A <b>pink</b> <b>flower</b> and a <b>butterfly</b>!","Một bông hoa hồng và một con bướm!","🦋"],["A","Shh! The <b>teacher</b>! Ring, ring! The <b>bell</b>!","Suỵt! Cô giáo đến! Reng reng! Chuông kêu rồi!","🔔"],["B","Let's show Miss Lan our drawings!","Mình cùng khoe tranh với cô Lan nhé!"]],"swap":["<b>eraser</b> → ruler / pen","<b>red pencil</b> → blue pen / yellow pencil","<b>butterfly</b> → bird / tree"],"ask":["What colour is your pencil?","What's in your garden drawing?","Can I have your ruler, please?"]},
  {"type":"story","title":"The Hungry Goat","ic":"🐐","tip":"Một trẻ đóng vai con dê kêu \"Meh!\", một trẻ là Mia. Nhấn mạnh kết thúc tử tế: Mia không giận mà còn cho dê một bông hoa.","lines":[["🌷","Mia and Grandma are in the <b>garden</b>.","Mia và bà đang ở trong vườn."],["🌸","Mia has <b>pink</b> and <b>purple</b> <b>flowers</b>.","Mia có những bông hoa màu hồng và màu tím."],["🚧","Oh no! The <b>gate</b> is open. A <b>goat</b> comes in!","Ôi không! Cổng đang mở. Một con dê đi vào!"],["🐐","The goat is <b>hungry</b>. It <b>eats</b> Mia's flowers!","Con dê đói bụng. Nó ăn hoa của Mia!"],["😟","\"No, no, goat!\" says Mia.","\"Không, không được đâu dê ơi!\" Mia nói."],["🍎","Grandma says, \"Here, goat! Have a <b>big</b> <b>apple</b>!\"","Bà nói: \"Dê ơi, lại đây! Ăn quả táo to này!\""],["🚧","The goat likes the apple. Mia closes the <b>gate</b>.","Con dê thích quả táo. Mia đóng cổng lại."],["🌸","Mia smiles. \"You can have this <b>small</b> flower, too!\"","Mia mỉm cười. \"Bạn được ăn thêm bông hoa nhỏ này nữa!\""]],"swap":["<b>apple</b> → orange / grapes","<b>pink</b> → red / yellow"],"ask":["What colour are Mia's flowers?","What does the goat eat?","What do you have in your garden?"]},
  {"type":"show","title":"My Garden Drawing","ic":"🖼️","tip":"Trẻ vẽ trước một bức tranh khu vườn, lên bảng giới thiệu. Mời cả lớp vỗ cánh như bướm và tìm con vịt trong tranh.","lines":[["🖼️","Look at my <b>drawing</b>! It's a <b>garden</b>.","Xem bức vẽ của tớ này! Đó là một khu vườn."],["🌳","This is a <b>big</b> <b>tree</b>. It's <b>green</b>.","Đây là một cái cây to. Nó màu xanh lá."],["🐦","A <b>bird</b> is in the tree. It's <b>yellow</b>. Tweet, tweet!","Có một con chim trên cây. Nó màu vàng. Chíp chíp!"],["🦋","Here's a <b>purple</b> <b>butterfly</b>. Flap, flap! Flap with me!","Đây là một con bướm tím. Vỗ cánh, vỗ cánh! Vỗ cùng tớ nào!"],["🐶","Can you see my <b>dog</b>? It's <b>under</b> the tree.","Các bạn có thấy con chó không? Nó ở dưới gốc cây."],["🥚","And look! A <b>duck</b> with an <b>egg</b>!","Và nhìn này! Một con vịt với một quả trứng!"],["✏️","I draw with my <b>pencils</b>. Do you like it?","Tớ vẽ bằng bút chì màu. Các bạn có thích không?"]],"swap":["<b>green</b> → red / pink","<b>butterfly</b> → bird / goat","<b>dog</b> → cat / duck"],"ask":["What colour is the tree?","Can you see the butterfly?","Do you like drawing?"]},
  {"type":"compare","title":"Bi's Pencil Case and Na's","ic":"✏️","left":["👦","Bi"],"right":["👧","Na"],"tip":"Mỗi trẻ cầm hộp bút của mình, giơ đúng đồ vật khi nói. Chú ý dùng \"too\" khi giống nhau và \"but\" khi khác nhau.","lines":[["L","✏️","I have a <b>red</b> <b>pencil</b>.","Tớ có một cái bút chì màu đỏ."],["R","✏️","I have a red pencil, too!","Tớ cũng có một cái bút chì đỏ!"],["L","🖊️","My <b>pen</b> is <b>blue</b>.","Bút mực của tớ màu xanh dương."],["R","🖊️","My pen is <b>green</b>.","Bút mực của tớ màu xanh lá."],["L","📏","My <b>ruler</b> is <b>big</b>.","Cái thước của tớ to."],["R","🧽","My ruler is small, but my <b>eraser</b> is big!","Thước của tớ nhỏ, nhưng cục tẩy của tớ to!"],["L","🍇","In my bag, I have <b>grapes</b>.","Trong túi tớ có nho."],["R","🍊","I have an <b>orange</b>. Yum!","Tớ có một quả cam. Ngon!"],["B","🖼️","We both like <b>drawing</b>!","Cả hai chúng tớ đều thích vẽ!"]],"swap":["<b>red</b> → yellow / pink","<b>pencil</b> → pen / eraser","<b>grapes</b> → apples / juice"],"ask":["What colour is your pen?","Is your ruler big or small?","What do you and your friend both have?"]},
  {"type":"me","title":"My Picnic in the Garden","ic":"🧺","tip":"Trẻ kể chuyến dã ngoại trong vườn, làm động tác bướm bay, hái hoa, đá bóng. Có thể trải khăn giả làm buổi picnic.","lines":[["🧺","First, my <b>family</b> and I go to the <b>garden</b>.","Đầu tiên, cả nhà tớ đi ra vườn."],["🦋","Then, I see a <b>butterfly</b> and a <b>bird</b>.","Sau đó, tớ thấy một con bướm và một con chim."],["🌸","I find a <b>pink</b> <b>flower</b> for Mom.","Tớ tìm được một bông hoa hồng tặng mẹ."],["🍗","After that, we eat <b>chicken</b> and <b>grapes</b>. I drink <b>juice</b>.","Tiếp theo, cả nhà ăn gà và nho. Tớ uống nước ép."],["⚽","I play <b>ball</b> with my <b>friends</b>.","Tớ chơi bóng với các bạn."],["🐐","A <b>goat</b> says, \"Meh!\" Ha ha!","Một con dê kêu: \"Be-e!\" Ha ha!"],["🌳","Finally, we sit under a big <b>tree</b>. What a day!","Cuối cùng, cả nhà ngồi dưới một cái cây to. Thật là một ngày tuyệt vời!"]],"swap":["<b>pink flower</b> → red flower / purple flower","<b>chicken</b> → fish / cake"],"ask":["What do you see in a garden?","What colour flowers do you like?","Who do you play with?"]},

 {"id":"r4","n":"Speaking 4","ic":"🎂","title":"Count, Touch and Smile!","span":"Units 1–9","when":"Sau Unit 9 (tuần 18)","units":["g1","g2","g3","g4","g5","g6","g7","g8","g9"],"fresh":["g8","g9"],tasks:[
  {"type":"talk","title":"Happy Birthday, Tom!","ic":"🎂","roles":{"A":["👦🏼","Tom"],"B":["🧒","{name}"]},"tip":"Chuẩn bị một hộp quà có đôi tất. Tom sờ hộp để đoán, sau đó đeo tất vào tay cho cả lớp cười, rồi cả lớp cùng đếm bóng bay.","lines":[["A","<b>Hello</b>, {name}! Come in! It's my birthday!","Chào {name}! Vào đi! Hôm nay là sinh nhật tớ!","🎉"],["B","<b>Happy</b> birthday, Tom! This is for you.","Chúc mừng sinh nhật Tom! Cái này tặng bạn.","🎁"],["A","<b>Thank you</b>! What is it?","Cảm ơn bạn! Cái gì vậy?"],["B","Guess! It's <b>small</b>. <b>Touch</b> it!","Đoán đi! Nó nhỏ thôi. Sờ thử xem!"],["A","Hmm... is it a <b>clock</b>? Tick tock?","Hừm... có phải đồng hồ không? Tích tắc?","🕰️"],["B","No! It's <b>socks</b>! Funny socks with an <b>octopus</b>!","Không phải! Là tất! Tất ngộ nghĩnh có hình bạch tuộc!","🧦"],["A","Ha ha! Look! The socks are on my <b>hands</b>!","Ha ha! Nhìn này! Tất ở trên tay tớ!","🧤"],["B","Silly Tom! Socks go on your feet!","Tom ngốc quá! Tất phải đi ở chân chứ!"],["A","Ha ha! Let's eat <b>cake</b>. How <b>many</b> balloons? Count with me!","Ha ha! Mình ăn bánh đi. Có bao nhiêu bóng bay? Đếm cùng tớ nào!","🎈"],["B","<b>One</b>, <b>two</b>, <b>three</b>, <b>four</b>, <b>five</b>! Five balloons!","Một, hai, ba, bốn, năm! Năm quả bóng bay!"],["A","Yay! I'm so <b>happy</b>!","Hay quá! Tớ vui quá!","😊"]],"swap":["<b>socks</b> → a clock / a doll","<b>five</b> → three / four","<b>cake</b> → ice cream / chips"],"ask":["What do you like for your birthday?","How many balloons can you see?","Are you happy now?"]},
  {"type":"story","title":"The Lost Baby Duck","ic":"🦆","tip":"Cô kể, trẻ giơ ngón tay đếm vịt con. Đến tranh \"Peep, peep!\" cả lớp đưa tay lên tai lắng nghe.","lines":[["🌳","Mia and Dad are in the <b>park</b>.","Mia và bố đang ở công viên."],["🦆","Mia sees a big <b>duck</b> and <b>four</b> baby ducks.","Mia thấy một con vịt lớn và bốn con vịt con."],["😢","\"Quack, quack!\" The big duck is <b>sad</b>. Where's baby number <b>five</b>?","\"Cạc, cạc!\" Vịt lớn buồn lắm. Vịt con thứ năm đâu rồi?"],["🔍","Mia looks <b>near</b> the <b>gate</b>. She looks under the <b>tree</b>.","Mia tìm gần cổng. Bạn ấy tìm dưới gốc cây."],["👂","Mia listens with her <b>ears</b>. \"Peep, peep!\"","Mia lắng tai nghe. \"Chíp, chíp!\""],["👒","There it is! The baby duck is in a <b>hat</b>!","Nó kia rồi! Vịt con đang ở trong một cái mũ!"],["✋","Mia picks it up with her <b>hands</b>. Gently, gently!","Mia nâng vịt con lên bằng hai tay. Nhẹ thôi, nhẹ thôi!"],["😊","Now there are <b>five</b> baby ducks. The big duck is <b>happy</b>!","Bây giờ có đủ năm vịt con. Vịt lớn vui lắm!"]],"swap":["<b>duck</b> → bird / goat","<b>in a hat</b> → in a bag / under a bed"],"ask":["How many baby ducks can you see?","Where's the baby duck?","Is the big duck happy or sad?"]},
  {"type":"show","title":"Meet My Monster!","ic":"👾","tip":"Trẻ vẽ hoặc nặn một con quái vật vui nhộn, chỉ vào từng bộ phận khi nói. Cả lớp cùng đếm tay và vẫy chào quái vật.","lines":[["👾","This is my monster. His name is Bobo!","Đây là con quái vật của tớ. Tên nó là Bobo!"],["🧑","Bobo has <b>two</b> <b>heads</b>. Wow!","Bobo có hai cái đầu. Ồ!"],["👀","He has <b>three</b> <b>eyes</b>. Blink, blink!","Nó có ba con mắt. Chớp, chớp!"],["👂","He has <b>big</b> <b>ears</b> and a <b>small</b> <b>nose</b>.","Nó có đôi tai to và cái mũi nhỏ."],["💇","His <b>hair</b> is <b>green</b> and <b>purple</b>!","Tóc của nó màu xanh lá và màu tím!"],["👄","His <b>mouth</b> is <b>red</b>. He likes <b>ice cream</b>!","Miệng của nó màu đỏ. Nó thích ăn kem!"],["✋","How <b>many</b> <b>hands</b>? Count with me: one, two, three, four!","Có bao nhiêu bàn tay? Đếm cùng tớ: một, hai, ba, bốn!"],["😊","Bobo is <b>happy</b>. Wave <b>hello</b> to Bobo!","Bobo đang vui. Vẫy tay chào Bobo nào!"]],"swap":["<b>two heads</b> → three heads / one head","<b>green</b> → pink / yellow","<b>ice cream</b> → fish / cake"],"ask":["How many eyes do you have?","What colour is your hair?","Can you touch your nose?"]},
  {"type":"compare","title":"Shopping with Grandma","ic":"🛍️","left":["👧","Na"],"right":["👦","Bi"],"tip":"Bày đồ thật hoặc tranh (tất, đồng hồ, khóa, nồi, cây lau nhà) trên bàn làm cửa hàng. Mỗi trẻ cầm món đồ của mình khi nói.","lines":[["L","🧦","I buy <b>socks</b> for Dad.","Tớ mua tất cho bố."],["R","🧦","I buy socks, too. They're <b>yellow</b>!","Tớ cũng mua tất. Chúng màu vàng!"],["L","🕰️","I see a <b>big</b> <b>clock</b>. Tick tock!","Tớ thấy một cái đồng hồ to. Tích tắc!"],["R","🔒","I see a <b>small</b> <b>lock</b>.","Tớ thấy một cái ổ khóa nhỏ."],["L","🍲","Grandma wants a <b>pot</b>.","Bà muốn mua một cái nồi."],["R","🧹","Mom wants a <b>mop</b>, but not a pot.","Mẹ muốn mua cây lau nhà, không phải cái nồi."],["L","😊","I'm <b>happy</b>!","Tớ vui quá!"],["R","😋","I'm happy, too, but I'm <b>hungry</b>!","Tớ cũng vui, nhưng tớ đói bụng!"],["B","🍦","We both want <b>ice cream</b>! Let's go!","Cả hai chúng tớ đều muốn ăn kem! Đi thôi!"]],"swap":["<b>socks</b> → a clock / a pot","<b>yellow</b> → blue / red"],"ask":["What do you buy at the shop?","How many socks do you have?","Are you happy or hungry now?"]},
  {"type":"me","title":"My Day in the Park","ic":"🌳","tip":"Trẻ kể kèm động tác: vuốt đầu ngựa, đạp xe, đếm chim. Gợi ý trẻ kể thêm một điều thật của mình.","lines":[["🌳","First, I go to the <b>park</b> with my <b>friend</b>.","Đầu tiên, tớ đi công viên với bạn của tớ."],["🐴","Then, I see a <b>horse</b>. I <b>touch</b> its <b>head</b>. It's soft!","Sau đó, tớ thấy một con ngựa. Tớ sờ đầu nó. Mềm lắm!"],["🚲","After that, we play <b>ball</b> and ride our <b>bikes</b>.","Tiếp theo, chúng tớ chơi bóng và đạp xe."],["🐦","I see <b>three</b> <b>birds</b>! Count with me: one, two, three!","Tớ thấy ba con chim! Đếm cùng tớ: một, hai, ba!"],["🍗","We eat <b>chicken</b> and drink <b>juice</b>.","Chúng tớ ăn gà và uống nước ép."],["😊","Finally, I'm <b>happy</b> but very tired. Bye-bye, park!","Cuối cùng, tớ rất vui nhưng mệt lắm. Tạm biệt công viên!"]],"swap":["<b>horse</b> → dog / goat","<b>three birds</b> → two ducks / five butterflies"],"ask":["What do you do in the park?","How many birds can you see?","Can you touch your head?"]},

 {"id":"r5","n":"Speaking 5","ic":"🦒","title":"Off to the Zoo!","span":"Units 1–11","when":"Sau Unit 11 (tuần 22)","units":["g1","g2","g3","g4","g5","g6","g7","g8","g9","g10","g11"],"fresh":["g10","g11"],tasks:[
  {"type":"talk","title":"Wait for the Bus!","ic":"🚏","roles":{"A":["👩","Mom"],"B":["🧒","{name}"]},"tip":"Xếp ghế thành trạm xe buýt, cô đóng vai mẹ. Câu cuối trẻ giơ tay ra hiệu \"Stop!\" rồi cả hai \"lên xe\" chạy quanh lớp.","lines":[["A","Hurry! The <b>bus</b> is coming. Let's <b>run</b>!","Nhanh lên con! Xe buýt đến rồi. Mình chạy thôi!","🚌"],["B","Wait, Mom! Where's my <b>umbrella</b>?","Mẹ ơi, đợi con! Cái ô của con đâu?","☂️"],["A","It's in your <b>school bag</b>.","Nó ở trong cặp sách của con.","🎒"],["B","Oh yes! <b>Thank you</b>, Mom.","À đúng rồi! Con cảm ơn mẹ."],["A","Look! The <b>sun</b> is out. No rain!","Nhìn kìa! Mặt trời ló ra rồi. Không mưa nữa!","☀️"],["B","Yay! Is this bus for the <b>zoo</b>?","Hay quá! Xe buýt này đi sở thú phải không mẹ?"],["A","Yes! We can see <b>monkeys</b> and <b>lions</b>.","Đúng rồi! Mình sẽ được xem khỉ và sư tử.","🐒"],["B","And <b>elephants</b>? I like elephants!","Còn voi nữa ạ? Con thích voi lắm!","🐘"],["A","Yes! Oh, here's the bus. <b>Stop</b>, please!","Có chứ! Ồ, xe buýt đây rồi. Dừng lại ạ!","🛑"],["B","Hooray! Let's <b>go</b>! Bye-bye, <b>bus stop</b>!","Hoan hô! Đi thôi! Tạm biệt trạm xe buýt!"]],"swap":["<b>umbrella</b> → hat / ball","<b>monkeys</b> → giraffes / zebras","<b>bus</b> → truck / car"],"ask":["Do you go to school by bus?","What animals do you like at the zoo?","What colour is your umbrella?"]},
  {"type":"story","title":"The Monkey and the Mango","ic":"🐒","tip":"Ba trẻ đóng vai Bi, con khỉ và con voi. Kết thúc nhấn mạnh việc chia sẻ: Bi chia xoài cho khỉ.","lines":[["🏞️","Bi and his class are at the <b>zoo</b>.","Bi và các bạn cùng lớp đang ở sở thú."],["🐒","A <b>monkey</b> sees Bi's <b>mango</b>. It's <b>hungry</b>!","Một con khỉ nhìn thấy quả xoài của Bi. Nó đói bụng!"],["🌳","Oh no! The monkey takes the mango and <b>runs</b> up a <b>tree</b>!","Ôi không! Con khỉ lấy quả xoài rồi chạy lên cây!"],["😢","Bi is <b>sad</b>. \"My mango!\"","Bi buồn lắm. \"Xoài của tớ!\""],["🐘","A big <b>elephant</b> sees it. It <b>walks</b> to the tree.","Một con voi to nhìn thấy. Nó đi bộ đến gốc cây."],["🌳","The elephant shakes the tree. Shake, shake!","Con voi rung cái cây. Rung, rung!"],["🥭","Plop! The mango is on the grass. \"<b>Thank you</b>, elephant!\"","Bịch! Quả xoài rơi xuống cỏ. \"Cảm ơn bạn voi!\""],["🤝","Bi shares the mango with the monkey. \"<b>Here you are</b>!\"","Bi chia xoài cho chú khỉ. \"Của bạn đây!\""]],"swap":["<b>mango</b> → apple / orange","<b>elephant</b> → giraffe / bear"],"ask":["What does the monkey take?","Who helps Bi?","Do you share your food with friends?"]},
  {"type":"show","title":"My Zoo Drawing","ic":"🦒","tip":"Trẻ giới thiệu tranh vẽ sở thú, chỉ từng con vật và mời cả lớp bắt chước tiếng kêu, dáng đi của con vật.","lines":[["🦒","This is my zoo <b>drawing</b>. Can you see the <b>giraffe</b>?","Đây là bức vẽ sở thú của tớ. Các bạn có thấy hươu cao cổ không?"],["🦓","Here's a <b>zebra</b>. It's black and white.","Đây là một con ngựa vằn. Nó màu đen và trắng."],["🦁","This is a <b>lion</b>. Roar! Can you roar with me?","Đây là sư tử. Gừm! Các bạn gầm cùng tớ được không?"],["🐻","The <b>bear</b> is <b>big</b>. The <b>mouse</b> is <b>small</b>.","Con gấu thì to. Con chuột thì nhỏ."],["🐘","How <b>many</b> <b>elephants</b>? Count with me... <b>three</b>!","Có bao nhiêu con voi? Đếm cùng tớ nào... ba con!"],["🚌","We go to the zoo by <b>bus</b>. Beep, beep!","Chúng tớ đi sở thú bằng xe buýt. Bíp bíp!"],["🐒","And this is my best friend: the <b>monkey</b>! Ooh-ooh, aah-aah!","Và đây là bạn thân nhất của tớ: chú khỉ! U-u, a-a!"]],"swap":["<b>giraffe</b> → zebra / lion","<b>three</b> → two / five","<b>bus</b> → car / truck"],"ask":["What animals can you see at the zoo?","Is a mouse big or small?","Can you walk like an elephant?"]},
  {"type":"compare","title":"Bus or Walk?","ic":"🚌","left":["👦🏼","Tom"],"right":["👧🏽","Mia"],"tip":"Tom làm động tác lái xe buýt, Mia làm động tác đi bộ. Cả hai che ô khi nói về cái ô màu xanh.","lines":[["L","🚌","I go to <b>school</b> by <b>bus</b>.","Tớ đi học bằng xe buýt."],["R","🚶","I <b>walk</b> to school with my <b>mother</b>.","Tớ đi bộ đến trường cùng mẹ."],["L","☂️","I have a <b>blue</b> <b>umbrella</b>.","Tớ có một cái ô màu xanh dương."],["R","☂️","I have a blue umbrella, too!","Tớ cũng có một cái ô màu xanh dương!"],["L","🏃","I like to <b>run</b>.","Tớ thích chạy."],["R","🚶","I don't like to run, but I like to <b>walk</b>.","Tớ không thích chạy, nhưng tớ thích đi bộ."],["L","🎒","My <b>school bag</b> is <b>red</b>.","Cặp sách của tớ màu đỏ."],["R","🎒","My school bag is <b>pink</b>.","Cặp sách của tớ màu hồng."],["B","🏫","We both like our <b>school</b>! See you at school!","Cả hai chúng tớ đều yêu trường mình! Hẹn gặp ở trường nhé!"]],"swap":["<b>bus</b> → car / bike","<b>red</b> → yellow / green"],"ask":["How do you go to school?","Do you like to run or walk?","What colour is your school bag?"]},
  {"type":"me","title":"My Trip to the Zoo","ic":"🦁","tip":"Trẻ kể chuyến đi sở thú theo thứ tự, làm động tác nhảy khỏi giường, lên xe buýt, mở ô.","lines":[["🛏️","First, I get up and jump out of <b>bed</b>!","Đầu tiên, tớ thức dậy và nhảy ra khỏi giường!"],["🚏","Then, I walk to the <b>bus stop</b> with my <b>friends</b>.","Sau đó, tớ đi bộ ra trạm xe buýt cùng các bạn."],["🚌","We get on the <b>bus</b>. <b>Hello</b>, zoo!","Chúng tớ lên xe buýt. Xin chào sở thú!"],["🦒","After that, I see a tall <b>giraffe</b> and a <b>zebra</b>.","Tiếp theo, tớ thấy một con hươu cao cổ và một con ngựa vằn."],["🍦","I eat <b>ice cream</b>, and the <b>bear</b> eats <b>fish</b>!","Tớ ăn kem, còn con gấu thì ăn cá!"],["☂️","Oh! Rain! I open my <b>umbrella</b>.","Ôi! Mưa rồi! Tớ mở ô ra."],["🚌","Finally, we go back by bus. What a great day!","Cuối cùng, chúng tớ đi xe buýt về. Thật là một ngày tuyệt vời!"]],"swap":["<b>giraffe</b> → lion / elephant","<b>ice cream</b> → mango / juice"],"ask":["What animals do you like?","Do you go to the zoo by bus or by car?","What does a bear eat?"]},

 {"id":"r6","n":"Speaking 6","ic":"🏞️","title":"Lunch by the Lake!","span":"Units 1–13","when":"Sau Unit 13 (tuần 26)","units":["g1","g2","g3","g4","g5","g6","g7","g8","g9","g10","g11","g12","g13"],"fresh":["g12","g13"],tasks:[
  {"type":"talk","title":"A New Friend in the Canteen","ic":"🍜","roles":{"A":["👧🏽","Mia"],"B":["🧒","{name}"]},"tip":"Hai trẻ ngồi cùng bàn với khay đồ ăn giả. Trẻ đóng vai bạn cũ, chủ động mời bạn mới ngồi cùng và chia sẻ đồ ăn.","lines":[["A","Hi! Can I sit here?","Chào bạn! Tớ ngồi đây được không?"],["B","Sure! I'm {name}. Are you new?","Được chứ! Tớ là {name}. Bạn mới đến à?"],["A","Yes, I'm Mia. Is this the <b>canteen</b>?","Ừ, tớ là Mia. Đây là nhà ăn phải không?","🍽️"],["B","Yes, it is. It's <b>lunch</b> time!","Đúng rồi. Đến giờ ăn trưa rồi!","🍱"],["A","What's for lunch <b>today</b>?","Hôm nay ăn trưa có gì thế?"],["B","<b>Noodles</b> and <b>chicken</b>. <b>Yummy</b>!","Mì và gà. Ngon lắm!","🍜"],["A","Oh... I don't like noodles.","Ôi... tớ không thích mì."],["B","Try my <b>bread</b>, then. <b>Here you are</b>!","Vậy bạn ăn thử bánh mì của tớ nhé. Của bạn đây!","🍞"],["A","<b>Thank you</b>! It's <b>nice</b>. You're nice, too!","Cảm ơn bạn! Ngon lắm. Bạn cũng tốt bụng nữa!"],["B","Do you like <b>bananas</b>?","Bạn có thích chuối không?","🍌"],["A","Yes, I do! Mmm... now I'm <b>full</b>!","Có chứ! Ừm... giờ tớ no rồi!"],["B","Let's play in the <b>playground</b>, new <b>friend</b>!","Mình ra sân chơi chơi đi, bạn mới!"]],"swap":["<b>noodles</b> → rice / fish","<b>bread</b> → banana / nuts","<b>playground</b> → garden / park"],"ask":["What's for lunch today?","Do you like noodles?","Are you full or hungry now?"]},
  {"type":"story","title":"The Frog Helps","ic":"🐸","tip":"Dùng một chiếc lá thật và con bọ rùa giấy để diễn. Cả lớp cùng kêu \"Help! Help!\" và nhảy như ếch.","lines":[["🏞️","Na and Bi are at the <b>lake</b>. They have a picnic.","Na và Bi đang ở bên hồ. Hai bạn đi dã ngoại."],["🐞","A <b>little</b> <b>ladybird</b> is on a <b>leaf</b>.","Một chú bọ rùa nhỏ đang đậu trên chiếc lá."],["🍃","Whoosh! The wind blows. The leaf <b>falls</b> into the lake.","Vù! Gió thổi. Chiếc lá rơi xuống hồ."],["😟","The ladybird can't <b>swim</b>! \"Help! Help!\"","Bọ rùa không biết bơi! \"Cứu với! Cứu với!\""],["🐸","A <b>green</b> <b>frog</b> sees it. Jump! The frog swims to the leaf.","Một chú ếch xanh nhìn thấy. Nhảy! Ếch bơi đến chiếc lá."],["🐞","The ladybird climbs on the frog's <b>head</b>. Hop, hop! It's OK now.","Bọ rùa trèo lên đầu ếch. Nhảy, nhảy! Giờ thì an toàn rồi."],["🙏","Bi says, \"Good frog! <b>Thank you</b>!\"","Bi nói: \"Ếch giỏi quá! Cảm ơn ếch nhé!\""],["😊","The ladybird is <b>happy</b>. The frog is happy, too!","Bọ rùa rất vui. Chú ếch cũng vui!"]],"swap":["<b>ladybird</b> → ant / butterfly","<b>frog</b> → duck / fish"],"ask":["Where's the ladybird?","Can a frog swim?","Who helps the ladybird?"]},
  {"type":"show","title":"My Lunch Box","ic":"🍱","tip":"Trẻ mang hộp cơm (thật hoặc đồ chơi), mở ra và giới thiệu từng món. Đến quả chanh, cả lớp cùng nhăn mặt \"chua quá\".","lines":[["🍱","This is my <b>lunch</b> box. Let's open it!","Đây là hộp cơm trưa của tớ. Mình mở ra nào!"],["🍜","I have <b>noodles</b>. Slurp, slurp!","Tớ có mì. Sụp, sụp!"],["🍌","Here's a <b>banana</b> and some <b>nuts</b>.","Đây là một quả chuối và một ít hạt."],["🍋","And a <b>lemon</b>! Taste it... Ooh, it's sour!","Và một quả chanh! Nếm thử nào... Ui, chua quá!"],["🍎","I have <b>two</b> <b>apples</b>. One for me, one for you!","Tớ có hai quả táo. Một quả cho tớ, một quả cho bạn!"],["🥛","I drink <b>milk</b>. It's good for me.","Tớ uống sữa. Sữa tốt cho tớ."],["😌","Now I'm <b>full</b>. <b>Today</b>'s lunch is very <b>nice</b>!","Giờ tớ no rồi. Bữa trưa hôm nay ngon lắm!"]],"swap":["<b>noodles</b> → bread / rice","<b>two apples</b> → three oranges / five bananas","<b>milk</b> → juice"],"ask":["What's in your lunch box?","Do you like lemons?","What do you drink at lunch?"]},
  {"type":"compare","title":"Splash or Look?","ic":"🏞️","left":["👦","Bi"],"right":["👧","Na"],"tip":"Bi làm động tác bơi, Na làm động tác nhìn qua ống nhòm bằng tay. Dùng tranh hồ có ếch, bọ rùa, tổ chim.","lines":[["L","🏊","I like to <b>swim</b> in the <b>lake</b>.","Tớ thích bơi ở hồ."],["R","👀","I don't like to swim, but I like to look at <b>fish</b>.","Tớ không thích bơi, nhưng tớ thích ngắm cá."],["L","🐸","I see a <b>frog</b>. It has long <b>legs</b>!","Tớ thấy một con ếch. Nó có đôi chân dài!"],["R","🐞","I see a <b>ladybird</b>. It has <b>little</b> legs.","Tớ thấy một con bọ rùa. Nó có những cái chân nhỏ xíu."],["L","🐣","Look! A <b>nest</b> in the <b>tree</b>!","Nhìn kìa! Có một cái tổ chim trên cây!"],["R","🥚","I see <b>three</b> <b>eggs</b> in the nest!","Tớ thấy ba quả trứng trong tổ!"],["L","🍞","I have <b>bread</b> and <b>juice</b>.","Tớ có bánh mì và nước ép."],["R","🍜","I have <b>noodles</b> and juice, too.","Tớ có mì và cũng có nước ép."],["B","🏞️","We both love the <b>lake</b>! Splash!","Cả hai chúng tớ đều yêu cái hồ! Tõm!"]],"swap":["<b>frog</b> → duck / fish","<b>three eggs</b> → two eggs / four eggs"],"ask":["Can you swim?","What can you see at a lake?","What do you and your friend both like?"]},
  {"type":"me","title":"My Weekend at the Lake","ic":"🚌","tip":"Trẻ kể chuyến đi chơi hồ theo thứ tự, làm động tác bơi, cho vịt ăn. Có thể thả lá giấy rơi lên đầu trẻ cho vui.","lines":[["🚌","First, my <b>family</b> and I go to the <b>lake</b> by <b>bus</b>.","Đầu tiên, cả nhà tớ đi xe buýt ra hồ."],["☀️","The <b>sun</b> is hot. I have my <b>hat</b>.","Trời nắng nóng. Tớ đội mũ."],["🏊","Then, I <b>swim</b> with Dad. Splash, splash!","Sau đó, tớ bơi cùng bố. Tõm, tõm!"],["🦆","After that, I feed the <b>ducks</b>. Quack, quack!","Tiếp theo, tớ cho vịt ăn. Cạc, cạc!"],["🥭","We eat <b>mangoes</b> and <b>nuts</b>. <b>Yummy</b>!","Cả nhà ăn xoài và các loại hạt. Ngon quá!"],["🍂","Leaves <b>fall</b> on my <b>head</b>. Ha ha!","Lá rơi lên đầu tớ. Ha ha!"],["🚌","Finally, we go back by bus. Bye-bye, <b>lake</b>!","Cuối cùng, cả nhà đi xe buýt về. Tạm biệt hồ nhé!"]],"swap":["<b>bus</b> → car / bike","<b>ducks</b> → fish / frogs","<b>mangoes</b> → bananas / lemons"],"ask":["Can you swim?","What do you eat on a picnic?","Do you go out with your family?"]},

 {"id":"r7","n":"Speaking 7","ic":"⚽","title":"Goal! Toys and Football!","span":"Units 1–15","when":"Sau Unit 15 (tuần 30)","units":["g1","g2","g3","g4","g5","g6","g7","g8","g9","g10","g11","g12","g13","g14","g15"],"fresh":["g14","g15"],tasks:[
  {"type":"talk","title":"At the Toy Shop","ic":"🧸","roles":{"A":["👵","Grandma"],"B":["🧒","{name}"]},"tip":"Xếp đồ chơi thật lên kệ, để tàu hỏa ở trên cao. Trẻ kiễng chân với không tới, bà (cô) lấy giúp rồi trẻ cầm tàu chạy \"choo choo\".","lines":[["A","Here we are at the <b>toy</b> shop. What do you <b>want</b>?","Mình đến cửa hàng đồ chơi rồi. Cháu muốn gì nào?","🪀"],["B","Wow! Look at all the <b>toys</b>!","Ôi! Nhìn bao nhiêu là đồ chơi!"],["A","Do you like the <b>robot</b>?","Cháu có thích con người máy không?","🤖"],["B","Yes, but I want the <b>train</b>! Choo choo!","Có ạ, nhưng cháu muốn cái tàu hỏa! Tu tu!","🚂"],["A","Where is it?","Nó ở đâu nhỉ?"],["B","It's on the <b>top</b> <b>shelf</b>. I can't get it.","Nó ở trên kệ cao nhất. Cháu không với tới."],["A","I can help. Here, <b>hold</b> it.","Bà giúp cho. Đây, cháu cầm lấy.","✊"],["B","Thank you, Grandma! Look, it's <b>fast</b>!","Cháu cảm ơn bà! Nhìn này, nó chạy nhanh lắm!","⚡"],["A","And look! A <b>teddy bear</b> for your sister.","Nhìn này! Một con gấu bông cho em gái cháu.","🧸"],["B","She likes <b>bears</b>. She has <b>many</b>! Ha ha!","Em ấy thích gấu lắm. Em ấy có nhiều lắm rồi! Ha ha!"],["A","OK. The train for you, and the bear for her.","Được rồi. Tàu hỏa cho cháu, còn gấu bông cho em."],["B","You're the best, Grandma!","Bà là tuyệt nhất!"]],"swap":["<b>train</b> → robot / top","<b>teddy bear</b> → tiger / turtle","<b>top shelf</b> → small shelf / big shelf"],"ask":["What toy do you want?","Do you have a teddy bear?","Where are your toys?"]},
  {"type":"story","title":"Tom's Lost Teddy","ic":"🏟️","tip":"Hai trẻ đóng vai Tom và bạn gái đội mũ cáo, một con gấu bông giấu dưới ghế. Cả lớp cùng hô \"Goal!\" và nhảy lên.","lines":[["🏟️","Tom and his <b>father</b> are at the football <b>match</b>.","Tom và bố đang xem trận bóng đá."],["🧸","Tom <b>holds</b> his <b>teddy bear</b>. Go, team, go!","Tom ôm con gấu bông. Cố lên, cố lên!"],["⚽","Goal! Everyone jumps up. Tom jumps, too!","Vào! Mọi người nhảy lên. Tom cũng nhảy lên!"],["😢","Oh no! Where's Teddy? Tom is <b>sad</b>.","Ôi không! Gấu bông đâu rồi? Tom buồn quá."],["🦊","A girl in a <b>fox</b> <b>hat</b> <b>points</b>. \"Look! Under your seat!\"","Một bạn gái đội mũ hình cáo chỉ tay. \"Nhìn kìa! Dưới ghế của bạn!\""],["🧸","There's Teddy! Tom <b>holds</b> him tight.","Gấu bông kia rồi! Tom ôm chặt nó."],["🙏","\"<b>Thank you</b>!\" Tom and the girl <b>watch</b> the match together.","\"Cảm ơn bạn!\" Tom và bạn gái cùng xem trận đấu."],["🎉","It's a <b>fun</b> day for Tom, Teddy and his new <b>friend</b>!","Đó là một ngày vui của Tom, gấu bông và người bạn mới!"]],"swap":["<b>teddy bear</b> → robot / ball","<b>fox hat</b> → red hat / tiger hat"],"ask":["Where are Tom and his father?","Where's Teddy?","Do you like football?"]},
  {"type":"show","title":"My Toy Shelf","ic":"🗄️","tip":"Trẻ mang 3–4 đồ chơi, xếp lên bàn như cái kệ và giới thiệu từng món. Mời cả lớp quay như con quay và gầm như hổ.","lines":[["🗄️","This is my toy <b>shelf</b>. It's in my <b>bedroom</b>.","Đây là kệ đồ chơi của tớ. Nó ở trong phòng ngủ."],["🤖","Here's my <b>robot</b>. It can <b>walk</b>! Beep, beep!","Đây là người máy của tớ. Nó biết đi đấy! Bíp, bíp!"],["🌀","This is my <b>top</b>. <b>Watch</b> it spin! Can you spin with me?","Đây là con quay của tớ. Xem nó quay này! Các bạn xoay cùng tớ nhé?"],["🐢","My <b>turtle</b> is <b>green</b>. It's slow, not <b>fast</b>!","Con rùa của tớ màu xanh lá. Nó chậm, không nhanh!"],["🐯","My <b>tiger</b> is <b>yellow</b>. Roar! Roar with me!","Con hổ của tớ màu vàng. Gừm! Gầm cùng tớ nào!"],["🚂","My <b>train</b> is long. Choo choo!","Tàu hỏa của tớ dài lắm. Tu tu!"],["🧸","And this is my <b>teddy bear</b>. I <b>hold</b> him at night.","Và đây là gấu bông. Tớ ôm nó mỗi tối."]],"swap":["<b>robot</b> → train / doll","<b>green</b> → blue / purple","<b>tiger</b> → turtle / teddy bear"],"ask":["What toys do you have?","What colour is your toy?","Can your toy walk?"]},
  {"type":"compare","title":"Football Friends","ic":"⚽","left":["👦","Bi"],"right":["👧","Na"],"tip":"Hai trẻ cầm quả bóng, làm động tác đá bóng, chạy tại chỗ. Câu cuối cả hai đập tay \"high five\".","lines":[["L","⚽","I like <b>football</b>. I <b>kick</b> the ball with my <b>foot</b>.","Tớ thích bóng đá. Tớ đá bóng bằng chân."],["R","⚽","I like football, too!","Tớ cũng thích bóng đá!"],["L","⚡","I can run <b>fast</b>!","Tớ chạy nhanh lắm!"],["R","🦵","I can't run fast, but I can <b>kick</b> high!","Tớ không chạy nhanh được, nhưng tớ đá bóng được cao!"],["L","👕","My T-shirt is <b>red</b>.","Áo phông của tớ màu đỏ."],["R","👕","My T-shirt is <b>blue</b>.","Áo phông của tớ màu xanh dương."],["L","📺","My dad likes to <b>watch</b> the <b>match</b> on TV.","Bố tớ thích xem trận đấu trên tivi."],["R","👨","My <b>father</b> likes to play football with me.","Bố tớ thích chơi bóng đá cùng tớ."],["L","😀","I paint my <b>face</b> red! Ha ha!","Tớ vẽ mặt màu đỏ! Ha ha!"],["R","🦊","I have a <b>fox</b> hat!","Tớ có một cái mũ hình con cáo!"],["B","🎉","We both have <b>fun</b> at <b>football</b>!","Cả hai chúng tớ đều chơi bóng đá rất vui!"]],"swap":["<b>red</b> → yellow / green","<b>fox hat</b> → tiger hat / big hat"],"ask":["Do you like football?","Can you run fast?","Who do you play football with?"]},
  {"type":"me","title":"My Football Saturday","ic":"🥅","tip":"Trẻ kể một ngày thứ bảy, làm động tác sút bóng, ngã và đứng dậy. Nhấn mạnh câu \"It's OK\" khi bị ngã.","lines":[["🥛","First, I drink <b>milk</b> and eat <b>bread</b>.","Đầu tiên, tớ uống sữa và ăn bánh mì."],["🚌","Then, I go to the <b>park</b> by <b>bus</b> with Dad.","Sau đó, tớ đi xe buýt ra công viên với bố."],["⚽","After that, we play <b>football</b>. I <b>kick</b> the ball! Goal!","Tiếp theo, bố con tớ chơi bóng đá. Tớ sút bóng! Vào!"],["🦵","Oops! I <b>fall</b> down. My <b>leg</b> hurts a <b>little</b>.","Ối! Tớ bị ngã. Chân tớ hơi đau."],["🤗","Dad says, \"It's OK.\" I get up. I'm OK!","Bố nói: \"Không sao đâu.\" Tớ đứng dậy. Tớ ổn rồi!"],["🤖","Then, we go to the <b>toy</b> shop. I <b>want</b> a <b>robot</b>.","Sau đó, bố con tớ đến cửa hàng đồ chơi. Tớ muốn một con người máy."],["🍦","Finally, Dad gets me an <b>ice cream</b>. What a <b>fun</b> day!","Cuối cùng, bố mua cho tớ một cây kem. Thật là một ngày vui!"]],"swap":["<b>football</b> → ball / tag","<b>robot</b> → train / teddy bear","<b>ice cream</b> → banana / juice"],"ask":["What do you do on Saturday?","Can you kick a ball?","What toy do you want?"]},

  {"type":"talk","title":"Bedtime at Home","ic":"🛁","roles":{"A":["👩","Mom"],"B":["🧒","{name}"]},"tip":"Cô đóng vai mẹ, trẻ diễn các việc trước khi ngủ bằng động tác: tắm, rửa mặt, đánh răng, đóng cửa sổ. Kết thúc bằng một cái ôm chúc ngủ ngon.","lines":[["A","It's <b>eight</b> o'clock. Time for bed!","Tám giờ rồi. Đến giờ đi ngủ rồi con!","🕗"],["B","Oh, Mom! Can I <b>watch</b> TV, please?","Mẹ ơi! Con xem tivi được không ạ?","📺"],["A","No, sorry. First, <b>take a bath</b>.","Không được con ạ. Trước tiên con đi tắm đã.","🛁"],["B","OK! Can my <b>duck</b> come, too?","Vâng! Con vịt của con đi tắm cùng được không?","🦆"],["A","Yes. Now <b>wash</b> your <b>hands</b> and <b>face</b>.","Được. Giờ con rửa tay và rửa mặt nhé.","🧼"],["B","Done! Now I <b>brush my teeth</b>. Scrub, scrub!","Xong rồi ạ! Giờ con đánh răng. Chải, chải!","🦷"],["A","Good! Do you want some <b>water</b>?","Giỏi lắm! Con có muốn uống chút nước không?","💧"],["B","Yes, please. <b>Thank you</b>, Mom.","Có ạ. Con cảm ơn mẹ."],["A","Close the <b>window</b>, please. It's cold.","Con đóng cửa sổ lại nhé. Trời lạnh rồi.","🔲"],["B","OK! Good night, Mom. I love you!","Vâng ạ! Chúc mẹ ngủ ngon. Con yêu mẹ!"],["A","I love you, too. <b>Sleep</b> well!","Mẹ cũng yêu con. Ngủ ngon nhé!","😴"]],"swap":["<b>eight</b> → seven / nine","<b>duck</b> → teddy bear / robot","<b>window</b> → door"],"ask":["What time do you go to bed?","Do you brush your teeth at night?","What do you do before you sleep?"]},
  {"type":"story","title":"The Littlest Star","ic":"☀️","tip":"Ba trẻ đóng vai Bi (sư tử), Na (khỉ) và bé Ben (mặt trời cầm đèn). Nhấn mạnh việc rủ em nhỏ cùng chơi để không ai bị bỏ lại.","lines":[["🏠","Bi and Na are at <b>home</b>. They have a big show <b>today</b>!","Bi và Na đang ở nhà. Hôm nay hai bạn có một buổi biểu diễn lớn!"],["🎭","Bi is a <b>lion</b>. Na is a <b>monkey</b>. Roar! Ooh-ooh!","Bi đóng vai sư tử. Na đóng vai khỉ. Gừm! U-u!"],["👶","Their <b>little</b> brother Ben is <b>sad</b>. \"I want to play, too!\"","Em trai nhỏ Ben buồn lắm. \"Em cũng muốn chơi!\""],["🤔","But Ben is only <b>two</b>. He can't say the lines.","Nhưng Ben mới có hai tuổi. Em chưa nói được lời thoại."],["💡","Na has an idea. \"You can be the <b>sun</b>! <b>Hold</b> this <b>lamp</b>!\"","Na nghĩ ra một ý. \"Em làm mặt trời nhé! Cầm cái đèn này!\""],["☀️","Ben <b>holds</b> the lamp up high. He is a big, <b>yellow</b> sun!","Ben giơ cao cái đèn. Em là một ông mặt trời to, màu vàng!"],["🕖","At <b>seven</b> o'clock, the show starts.","Đúng bảy giờ, buổi biểu diễn bắt đầu."],["👨‍👩‍👧","Mom, Dad and Grandma <b>watch</b>. They clap and clap!","Bố, mẹ và bà ngồi xem. Mọi người vỗ tay mãi!"],["🦁","The lion roars. The monkey jumps. The sun shines!","Sư tử gầm. Khỉ nhảy. Mặt trời chiếu sáng!"],["😊","Ben is very <b>happy</b>. It's a <b>fun</b> show for the whole <b>family</b>!","Ben vui lắm. Đó là một buổi diễn vui cho cả gia đình!"]],"swap":["<b>lion</b> → tiger / bear","<b>sun</b> → tree / flower","<b>seven</b> → six / eight"],"ask":["Who is sad in the story?","What can Ben be in the show?","Do you play with your brother or sister?"]},
  {"type":"show","title":"Welcome to My Home","ic":"🏠","tip":"Trẻ cầm tranh vẽ ngôi nhà của mình như một hướng dẫn viên, dẫn cả lớp \"đi thăm\" từng phòng và cùng đếm cửa sổ.","lines":[["🏠","This is my <b>home</b>. Come in, everyone!","Đây là nhà của tớ. Mời mọi người vào!"],["🔲","It has <b>ten</b> <b>windows</b>. Count with me: one, two... ten!","Nhà có mười cái cửa sổ. Đếm cùng tớ: một, hai... mười!"],["🍽️","This is the <b>dining room</b>. We <b>eat</b> <b>rice</b> here.","Đây là phòng ăn. Cả nhà ăn cơm ở đây."],["🛌","This is my <b>bedroom</b>. I <b>sleep</b> in this <b>bed</b>.","Đây là phòng ngủ của tớ. Tớ ngủ trên chiếc giường này."],["🛁","Here's the bathroom. I <b>take a bath</b> and <b>brush my teeth</b> here.","Đây là phòng tắm. Tớ tắm và đánh răng ở đây."],["🐱","My <b>cat</b> sits <b>near</b> the window. She likes the <b>sun</b>.","Con mèo của tớ ngồi gần cửa sổ. Nó thích nắng."],["🌷","Look outside! We have a small <b>garden</b> with <b>flowers</b>.","Nhìn ra ngoài kìa! Nhà tớ có một khu vườn nhỏ với nhiều hoa."],["🐸","There's a <b>little</b> <b>frog</b> in the garden, too. Ribbit!","Trong vườn còn có một chú ếch nhỏ nữa. Ộp ộp!"],["🐶","And this is my <b>dog</b>, Max. Say <b>hello</b>, Max! Woof!","Và đây là chú chó Max. Chào mọi người đi Max! Gâu!"],["❤️","I love my home. Do you love your home, too?","Tớ yêu ngôi nhà của tớ. Các bạn có yêu nhà mình không?"]],"swap":["<b>ten windows</b> → six windows / eight windows","<b>cat</b> → dog / fish","<b>garden</b> → park / lake"],"ask":["How many windows are there in your home?","Where do you sleep?","Do you have a garden?"]},
  {"type":"compare","title":"Good Night, Tom and Mia","ic":"😴","left":["👦🏼","Tom"],"right":["👧🏽","Mia"],"tip":"Hai trẻ mặc áo ngủ tưởng tượng, làm động tác tắm, đánh răng, ôm gấu bông. Câu cuối cả hai giả vờ ngáy \"Zzz\".","lines":[["L","🛁","At night, I <b>take a bath</b>.","Buổi tối, tớ đi tắm."],["R","💦","I <b>take a bath</b>, too. I like bubbles!","Tớ cũng đi tắm. Tớ thích bong bóng xà phòng!"],["L","🦷","I <b>brush my teeth</b> with a <b>blue</b> brush.","Tớ đánh răng bằng bàn chải màu xanh dương."],["R","🦷","My brush is <b>pink</b>.","Bàn chải của tớ màu hồng."],["L","📕","Dad reads me a <b>book</b>.","Bố đọc sách cho tớ nghe."],["R","🎵","Mom sings me a song.","Mẹ hát cho tớ nghe một bài hát."],["L","🧸","I <b>sleep</b> with my <b>teddy bear</b>.","Tớ ngủ cùng gấu bông."],["R","🐱","I don't have a teddy bear, but I sleep with my <b>cat</b>!","Tớ không có gấu bông, nhưng tớ ngủ cùng con mèo!"],["L","🕗","I go to bed at <b>eight</b>.","Tớ đi ngủ lúc tám giờ."],["R","🕘","I go to bed at <b>nine</b>.","Tớ đi ngủ lúc chín giờ."],["B","😴","We both <b>sleep</b> well! Good night!","Cả hai chúng tớ đều ngủ ngon! Chúc ngủ ngon!"]],"swap":["<b>blue</b> → red / green","<b>teddy bear</b> → doll / robot","<b>eight</b> → seven / nine"],"ask":["What time do you go to bed?","Who reads you a book?","What do you sleep with?"]},
