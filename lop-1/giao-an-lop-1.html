  {"type":"story","title":"Little Red Riding Hood","ic":"🧺","tip":"Xem phim hoạt hình Little Red Riding Hood, dừng ở cảnh gặp sói trong rừng hỏi \"Who is this? Where is she?\". Đoạn \"What big eyes you have!\", cô và bé chỉ vào mắt, tai, răng và nói theo nhân vật.","lines":[["👧","<b>Once upon a time</b>, there was a girl in a red hood.","Ngày xửa ngày xưa, có một cô bé đội mũ trùm đỏ."],["🧺","Her mom said, “Take this basket to Grandma. Don't stop!”","Mẹ dặn: “Con mang giỏ này đến cho bà nhé. Đừng dừng lại!”"],["🐺","In the <b>forest</b>, she met a <b>wolf</b>. “Where are you going?”","Trong rừng, cô bé gặp một con sói. “Cháu đi đâu đấy?”"],["🏠","The wolf ran to Grandma's house. Grandma hid in the cupboard!","Sói chạy đến nhà bà. Bà trốn vào trong tủ!"],["👀","“Grandma, what big eyes you have!” “To see you better!”","“Bà ơi, sao mắt bà to thế!” “Để bà nhìn cháu rõ hơn!”"],["🦷","“What big teeth you have!” “To eat you up!”","“Sao răng bà to thế!” “Để ăn thịt cháu đấy!”"],["😨","She was <b>scared</b>. “<b>Help</b>! Help!” A woodcutter heard her and came.","Cô bé sợ hãi. “Cứu với! Cứu với!” Bác tiều phu nghe thấy và chạy đến."],["🪓","The wolf ran far away. Grandma and the girl were safe!","Sói chạy mất. Bà và cô bé được an toàn!"]],"swap":["what big <b>eyes</b> → ears / teeth / hands","a <b>red</b> hood → blue / pink"],"ask":["Who did the girl meet in the forest?","Where did Grandma hide?","Who came to help?"]},
  {"type":"story","title":"The Gingerbread Man","ic":"🍪","tip":"Xem phim hoạt hình The Gingerbread Man, mỗi lần nhân vật hát \"Run, run, as fast as you can!\" thì dừng cho bé hát theo và chạy tại chỗ. Dừng ở cảnh bờ sông hỏi \"Who is this? Is the fox nice?\".","lines":[["👵","<b>Once upon a time</b>, an old woman made a gingerbread man.","Ngày xửa ngày xưa, có một bà cụ làm một chiếc bánh gừng hình người."],["🔥","She opened the oven. The gingerbread man jumped out!","Bà mở lò nướng. Chú bánh gừng nhảy ra ngoài!"],["🏃","“Run, run, as fast as you can! You can't catch me!”","“Chạy đi, chạy đi, chạy nhanh hết sức! Không bắt được ta đâu!”"],["🐄","The old woman, a cow and a horse ran after him.","Bà cụ, con bò và con ngựa đuổi theo chú."],["🍪","“I'm the Gingerbread Man! I can <b>run away</b> from you!”","“Ta là Người Bánh Gừng! Ta chạy thoát khỏi các ngươi!”"],["🌲","He ran into the <b>forest</b>. A big river! He was <b>scared</b>.","Chú chạy vào rừng. Một con sông lớn! Chú sợ hãi."],["🦊","A fox said, “Jump on my nose. I can <b>help</b> you!”","Một con cáo nói: “Nhảy lên mũi ta. Ta giúp cho!”"],["😮","Snap! The fox ate him up. Be careful with tricky friends!","Phập! Cáo ăn mất chú bánh gừng. Hãy cẩn thận với bạn xấu nhé!"]],"swap":["Jump on my <b>nose</b> → back / tail","a <b>cow</b> and a horse → a dog / a pig"],"ask":["Who made the Gingerbread Man?","What did he say when he ran?","Who ate him up?"]},
  {"type":"story","title":"The Tortoise and the Hare","ic":"🐢","tip":"Xem phim hoạt hình The Tortoise and the Hare, dừng ở cảnh thỏ ngủ dưới gốc cây, hỏi \"What is the hare doing? Who is slow?\". Cho bé diễn rùa đi chậm và thỏ chạy nhanh.","lines":[["🐇","<b>Once upon a time</b>, there was a fast hare.","Ngày xửa ngày xưa, có một chú thỏ chạy rất nhanh."],["🐢","“You are so slow!” the hare laughed at the tortoise.","“Cậu chậm quá!” thỏ cười chê rùa."],["🏁","“Let's have a race!” said the tortoise. All the animals came.","“Mình thi chạy đi!” rùa nói. Các con vật đều đến xem."],["🐻","The <b>bear</b> said, “Ready, steady, go!” The hare ran very fast.","Bác gấu hô: “Chuẩn bị, sẵn sàng, chạy!” Thỏ chạy rất nhanh."],["😴","The hare stopped under a tree in the <b>forest</b>. He fell asleep.","Thỏ dừng lại dưới gốc cây trong rừng. Thỏ ngủ quên mất."],["🐢","Slowly, slowly, the tortoise walked to <b>the end</b> of the race.","Chầm chậm, chầm chậm, rùa bò về đến đích."],["🙀","The hare woke up. Oh no! He ran and ran.","Thỏ tỉnh dậy. Ôi không! Thỏ chạy thục mạng."],["🏆","Too late! The tortoise won. Slow and steady wins the race!","Muộn rồi! Rùa thắng cuộc. Chậm mà chắc thì về đích!"]],"swap":["a fast <b>hare</b> → horse / dog","The <b>bear</b> said → The lion / The monkey"],"ask":["Who was fast?","What did the hare do under the tree?","Who won the race?"]}]},
 {"id":"speeches","n":"Speeches","ic":"🎤","title":"Animal Speeches","span":"Easy and Challenge","when":"Từ tuần 10","units":["m3","g4","g6","g8","g9","g16"],"fresh":[],"noCards":true,"noGames":true,tasks:[
  {"type":"show","own":true,"badge":"🌱 Easy","title":"The Cow","ic":"🐄","tip":"Câu 1 bé cười tươi. Câu \"Haha, it is so cute!\" bé ôm má cười. Bé cầm tranh con bò và chỉ vào từng bộ phận khi nói.","lines":[["😊","Hello, everyone! My name is {name}. I'm <b>six</b> years old, and I'm very <b>happy</b> today!","Xin chào mọi người! Con tên là … Con 6 tuổi, hôm nay con rất vui!"],["🖼️","Look at this picture! It is a big <b>cow</b>.","Nhìn bức tranh này kìa! Đây là một con bò to."],["🐄","The cow is <b>black</b> and <b>white</b>. It has <b>four</b> legs.","Con bò màu đen và trắng. Nó có 4 cái chân."],["🌾","It lives on a <b>farm</b>. It can walk and <b>eat</b> green grass.","Nó sống ở nông trại. Nó có thể đi bộ và ăn cỏ xanh."],["🥰","It says \"<b>Moo, moo</b>!\" Haha, it is so cute!","Nó kêu \"Ùm bò, ùm bò!\" Haha, nó dễ thương quá!"],["👋","I like cows! Thank you and bye-bye!","Con thích bò! Cảm ơn và tạm biệt!"]],"swap":["<b>six</b> → your age","<b>black</b> and <b>white</b> → brown","<b>cow</b> → sheep (Baa, baa!) / pig (Oink, oink!)"],"ask":["What colour is the cow?","What does the cow eat?","What does the cow say?"]},
  {"type":"show","own":true,"badge":"⭐ Challenge","title":"My Favorite Farm Animal: The Cow","ic":"🐄","tip":"Bản dài cho bé lanh. Dừng nhẹ một nhịp ở \"Today…\" và \"Look at the cow.\" để giọng có ngữ điệu. Câu cuối bé đặt tay lên ngực khi nói \"I love cows!\".","lines":[["👋","Hello, everyone! My name is {name}, and I'm <b>six</b> years old.","Xin chào mọi người! Con tên là …, con 6 tuổi."],["😊","I'm very <b>happy</b> today!","Hôm nay con rất vui!"],["🐄","Today, I want to talk about my favorite <b>farm animal</b>. It is a <b>cow</b>!","Hôm nay con muốn nói về con vật nông trại con thích nhất. Đó là một con bò!"],["👀","Look at the cow. It is <b>big</b>, and it is <b>black</b> and <b>white</b>.","Nhìn con bò kìa. Nó rất to, có màu đen và trắng."],["🐄","It has <b>four</b> legs and a long <b>tail</b>.","Nó có 4 cái chân và một cái đuôi dài."],["🌾","The cow lives on a <b>farm</b>. It likes to <b>eat</b> green grass.","Con bò sống ở nông trại. Nó thích ăn cỏ xanh."],["🥛","It gives us yummy <b>milk</b> every day, and it says \"<b>Moo, moo</b>!\"","Nó cho chúng ta sữa ngon mỗi ngày, và nó kêu \"Ùm bò, ùm bò!\""],["❤️","I love cows! Thank you for listening. Goodbye!","Con yêu những chú bò! Cảm ơn mọi người đã lắng nghe. Tạm biệt!"]],"swap":["<b>cow</b> → sheep (it gives us wool) / chicken (it gives us eggs)","long <b>tail</b> → two wings"],"ask":["Is a cow a farm animal or a wild animal?","What does a cow give us?","How many legs does a cow have?"]},
  {"type":"show","own":true,"badge":"🌱 Easy","title":"The Duck","ic":"🦆","tip":"Câu 1 bé vỗ tay nhẹ. Đến \"Quack, quack!\" bé làm mỏ vịt bằng tay và đi lạch bạch.","lines":[["👏","Hi, everyone! I'm {name}. I'm so excited today!","Chào mọi người! Con là … Hôm nay con rất hào hứng!"],["🖼️","Look at this picture! I see a <b>yellow</b> <b>duck</b>.","Nhìn bức tranh này kìa! Con thấy một chú vịt màu vàng."],["🦆","It has <b>two</b> <b>eyes</b>, an orange <b>mouth</b>, and two feet.","Nó có hai mắt, một cái mỏ màu cam và hai bàn chân."],["🏊","The duck can swim and walk. It says \"<b>Quack, quack</b>!\"","Chú vịt có thể bơi và đi bộ. Nó kêu \"Cạp, cạp!\""],["😄","The duck is so funny! It makes me <b>happy</b>!","Chú vịt thật mắc cười! Nó làm con thấy rất vui!"],["👋","I love ducks! Goodbye!","Con yêu vịt! Tạm biệt!"]],"swap":["<b>duck</b> → chicken (Cluck, cluck!)","<b>yellow</b> → white"],"ask":["What colour is the duck?","Can a duck swim?","What does a duck say?"]},
  {"type":"show","own":true,"badge":"🌱 Easy","title":"The Octopus","ic":"🐙","tip":"Câu 1 bé giơ ngón cái 👍. Câu \"Wow, it is an octopus!\" bé mở to mắt ngạc nhiên. Khi đếm, bé giơ từng ngón tay và mời cả lớp đếm cùng.","lines":[["👍","Hello! My name is {name}. I feel great today!","Xin chào! Con tên là … Hôm nay con thấy rất tuyệt!"],["😮","Look at this picture! Wow, it is an <b>octopus</b>!","Nhìn bức tranh này kìa! Ôi chao, đây là một con bạch tuộc!"],["🟣","It is <b>purple</b>. It has two big <b>eyes</b> and <b>eight</b> legs!","Nó màu tím. Nó có hai mắt to và 8 cái chân!"],["🔢","Let's count: <b>one</b>, <b>two</b>, <b>three</b>, <b>four</b>, <b>five</b>, <b>six</b>, <b>seven</b>, <b>eight</b>!","Cùng đếm nào: 1 đến 8!"],["🌊","It can swim, swim, swim in the sea. I think it is so cool!","Nó có thể bơi, bơi, bơi dưới biển. Con thấy nó ngầu lắm!"],["👋","Thank you for listening! Bye-bye!","Cảm ơn mọi người đã lắng nghe! Tạm biệt!"]],"swap":["<b>purple</b> → red / pink","<b>octopus</b> → crab (ten legs) / starfish (five arms)"],"ask":["How many legs does an octopus have?","Where does an octopus live?","What colour is your octopus?"]},
  {"type":"show","own":true,"badge":"⭐ Challenge","title":"Under the Sea: The Octopus","ic":"🐙","tip":"Bản dài. Câu \"How are you today?\" bé nhìn cả lớp và chờ các bạn trả lời. Câu \"Can you count to eight?\" bé mời cả lớp đếm cùng: tương tác giúp bé dạn dĩ, không như trả bài.","lines":[["👋","Hi, everyone! I'm {name}. How are you today?","Chào mọi người! Con là … Hôm nay mọi người thế nào?"],["🌊","Let's go under the sea with me!","Hãy cùng con lặn xuống dưới biển nhé!"],["🐙","Look! This is an <b>octopus</b>. It lives in the <b>blue</b> ocean.","Nhìn kìa! Đây là một con bạch tuộc. Nó sống ở đại dương xanh."],["👀","It has a big <b>head</b>, two big <b>eyes</b>, and <b>eight</b> long legs!","Nó có một cái đầu to, hai mắt to và 8 cái chân dài!"],["🔢","Can you count to eight? <b>One</b>, <b>two</b>, <b>three</b>, <b>four</b>, <b>five</b>, <b>six</b>, <b>seven</b>, <b>eight</b>!","Mọi người đếm tới 8 cùng con nhé!"],["🧠","The octopus is very smart.","Bạch tuộc rất thông minh."],["⛰️","It can swim very fast, and it can hide in the rocks.","Nó có thể bơi rất nhanh và trốn trong các tảng đá."],["🤩","I think sea animals are amazing! Thank you and bye-bye!","Con thấy động vật biển thật tuyệt vời! Cảm ơn và tạm biệt!"]],"swap":["<b>octopus</b> → whale (very big) / crab (red)","<b>eight</b> long legs → two big fins"],"ask":["Where does an octopus live?","What can an octopus do?","Which sea animal do you like?"]},
  {"type":"show","own":true,"badge":"⭐ Challenge","title":"My Cute Dog","ic":"🐶","tip":"Bản dài về thú cưng. Đến \"it wags its tail\" bé lắc hông như chó vẫy đuôi. Có thể thay \"Hello\" bằng \"Good morning\" nếu nói buổi sáng.","lines":[["👋","Hello, everyone! My name is {name}.","Chào mọi người! Con tên là …"],["🐶","Today, I want to tell you about a cute pet. It is a <b>dog</b>!","Hôm nay con muốn kể về một thú cưng dễ thương. Đó là một chú chó!"],["🐕","The dog is <b>brown</b> and <b>white</b>. It has two floppy <b>ears</b> and a wet <b>nose</b>.","Chú chó có màu nâu và trắng. Nó có hai chiếc tai cụp và một cái mũi ướt."],["🤗","It is very friendly and playful.","Nó rất thân thiện và thích chơi đùa."],["⚽","It can run fast, jump high, and catch a <b>red</b> <b>ball</b>!","Nó có thể chạy nhanh, nhảy cao và bắt quả bóng màu đỏ!"],["🐕","When it is <b>happy</b>, it wags its <b>tail</b> and says \"<b>Woof, woof</b>!\"","Khi vui, nó vẫy đuôi và sủa \"Gâu, gâu!\""],["❤️","Dogs are our best friends. Thank you for listening!","Chó là người bạn tốt nhất của chúng ta. Cảm ơn mọi người đã lắng nghe!"]],"swap":["<b>dog</b> → cat (Meow!)","<b>brown</b> and <b>white</b> → your pet's colours","Hello → Good morning"],"ask":["Do you have a pet?","What colour is your dog?","What can your dog do?"]},
  {"type":"show","own":true,"badge":"🌱 Easy","title":"On the Farm, In the Sea","ic":"🐖","tip":"Bé cầm 2 bức tranh (nông trại và biển). Câu cá voi bé dang rộng tay thật to. Câu \"They make me smile\" bé cười tươi.","lines":[["😄","Hello, everyone! I'm {name}. I'm super <b>happy</b> today!","Xin chào mọi người! Con là … Hôm nay con siêu vui!"],["🖼️","Look at these pictures! I'm excited to talk about animals.","Nhìn những bức tranh này nhé! Con rất hào hứng kể về các con vật."],["🐖","On the farm, I see <b>two</b> <b>pink</b> <b>pigs</b>.","Ở nông trại, con thấy 2 con heo hồng."],["🥰","They can eat and sleep. They are so cute!","Chúng có thể ăn và ngủ. Chúng dễ thương quá!"],["🐳","In the sea, I see <b>one</b> <b>blue</b> whale.","Ở dưới biển, con thấy 1 con cá voi xanh."],["🙌","Wow, it is very <b>big</b> and it can swim!","Ôi, nó rất to và biết bơi!"],["😊","I love animals so much! They make me smile.","Con yêu động vật lắm! Chúng làm con mỉm cười."],["👋","Thank you! Goodbye!","Cảm ơn! Tạm biệt!"]],"swap":["<b>two</b> <b>pink</b> <b>pigs</b> → three white sheep","<b>blue</b> whale → red crab"],"ask":["What do you see on the farm?","What do you see in the sea?","Which animal do you like?"]},
  {"type":"show","own":true,"badge":"⭐ Challenge","title":"A Day at the Farm and the Sea","ic":"🌊","tip":"Bản dài nhất. Dừng một nhịp ở \"First…\" và \"Next…\". Câu con cua bé bò ngang như cua. Câu \"Which animal do you like?\" bé hỏi cả lớp và chờ vài bạn trả lời.","lines":[["👋","Hello, teachers and friends! I'm {name}, and I'm feeling great today!","Xin chào thầy cô và các bạn! Con là …, hôm nay con cảm thấy rất tuyệt!"],["🐾","I love animals very much.","Con rất yêu động vật."],["🗺️","Today, I want to show you two places: the <b>farm</b> and the sea.","Hôm nay con muốn dẫn mọi người tới 2 nơi: nông trại và biển cả."],["🐖","First, on the farm, I see <b>two</b> <b>pink</b> <b>pigs</b> and <b>three</b> <b>yellow</b> <b>ducks</b>.","Đầu tiên, ở nông trại, con thấy 2 con heo màu hồng và 3 con vịt màu vàng."],["😴","The pigs like to eat and sleep.","Heo thích ăn và ngủ."],["🦆","The ducks can swim in the pond and say \"<b>Quack, quack</b>!\"","Vịt có thể bơi trong ao và kêu \"Cạp, cạp!\""],["🐳","Next, under the sea, I see a huge <b>blue</b> whale and a little <b>red</b> crab.","Tiếp theo, dưới biển, con thấy một con cá voi xanh khổng lồ và một chú cua nhỏ màu đỏ."],["🦀","The whale can swim deep in the <b>water</b>, and the crab walks sideways like this!","Cá voi bơi sâu dưới nước, còn cua thì bò ngang thế này nè!"],["🤔","Animals make our world so fun! Which animal do you like?","Động vật làm thế giới của chúng ta thật vui! Mọi người thích con vật nào?"],["👋","Thank you for listening to me. Goodbye!","Cảm ơn mọi người đã lắng nghe con. Tạm biệt!"]],"swap":["<b>pigs</b> / <b>ducks</b> → cows / chickens","whale / crab → octopus / turtle"],"ask":["What animals are on the farm?","What can the whale do?","How does a crab walk?"]}]}
