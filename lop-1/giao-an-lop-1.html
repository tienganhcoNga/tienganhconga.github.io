  {"type":"talk","title":"At the Playground","ic":"⚽","roles":{"A":["👦","Bi"],"B":["🧒","{name}"]},"tip":"Cô đóng vai Bi, cầm một quả bóng thật; trẻ đóng vai B, vẫy tay khi chào và tung bắt bóng khi nói. Sau đó cho hai bạn đóng cặp, thay tên của mình.","lines":[["A","<b>Hello</b>! I'm Bi. What's your name?","Xin chào! Tớ là Bi. Bạn tên là gì?","👋"],["B","<b>Hi</b>, Bi! My name's {name}.","Chào Bi! Tớ tên là {name}."],["A","How are you, {name}?","Bạn có khỏe không, {name}?"],["B","I'm <b>fine</b>, thanks. And you?","Tớ khỏe, cảm ơn bạn. Còn bạn thì sao?"],["A","Great! Let's <b>play</b> at the <b>playground</b>!","Tớ khỏe lắm! Mình ra sân chơi chơi đi!","🎠"],["B","OK! Is that your <b>bike</b>?","Được! Kia là xe đạp của bạn à?","🚲"],["A","Yes! And my <b>ball</b> and my <b>book</b>, too!","Ừ! Cả quả bóng và quyển sách của tớ nữa!"],["B","Wow! Bi has a <b>bike</b>, a <b>ball</b> and a <b>book</b>!","Oa! Bi có xe đạp, quả bóng và quyển sách!","⚽"],["A","Ha ha! Catch the <b>ball</b>, {name}!","Ha ha! Bắt bóng này, {name}!"],["B","Yay! Jump, jump! You're my <b>friend</b>, Bi!","Hay quá! Nhảy, nhảy! Bạn là bạn của tớ đấy, Bi!","🧑‍🤝‍🧑"],["A","Oh, there's my Mom. <b>Goodbye</b>, {name}!","Ôi, mẹ tớ đến rồi. Tạm biệt {name} nhé!"],["B","<b>Goodbye</b>, Bi! Bye-bye!","Tạm biệt Bi! Bai bai!","🚶"]],"swap":["my <b>bike</b> → my ball / my book","I'm <b>fine</b> → I'm great / I'm OK"],"ask":["What's your name?","How are you?","Do you have a bike?"]},
  {"type":"story","title":"Bi's New Ball","ic":"⚽","tip":"Cô kể từng tranh, trẻ nhắc lại câu. Ở tranh 2 cả lớp làm động tác đập bóng và nói \"Boing, boing\"; ở tranh 5 trẻ vẫy tay mời bạn chơi.","lines":[["🎠","Bi and Na are at the <b>playground</b>.","Bi và Na đang ở sân chơi."],["⚽","Bi has a new <b>ball</b>. Boing, boing, boing!","Bi có một quả bóng mới. Bịch, bịch, bịch!"],["📕","Na has a <b>book</b>, but she has no <b>ball</b>.","Na có một quyển sách, nhưng bạn ấy không có bóng."],["🪑","Na sits on the bench. Oh, no!","Na ngồi một mình trên ghế. Ôi, tội quá!"],["👋","Bi says, \"<b>Hi</b>, Na! Let's <b>play</b> ball!\"","Bi nói: \"Chào Na! Mình chơi bóng đi!\""],["🤸","The <b>boy</b> and the <b>girl</b> play together.","Bạn trai và bạn gái cùng chơi với nhau."],["📕","Then Na reads her <b>book</b> to Bi.","Sau đó Na đọc sách cho Bi nghe."],["🧑‍🤝‍🧑","Bi and Na are good <b>friends</b>!","Bi và Na là đôi bạn tốt!"]],"swap":["a new <b>ball</b> → a new bike / a new book","<b>Na</b> → Mia / Tom"],"ask":["What does Bi have?","Is Na a boy or a girl?","Who is your friend?"]}]},

  {"type":"talk","title":"Dinner Time","ic":"🍚","roles":{"A":["👩","Mom"],"B":["🧒","{name}"]},"tip":"Bày bàn ăn giả: bát, cốc, một ô tô đồ chơi và một con mèo bông. Cô đóng vai Mẹ, trẻ xoa bụng khi nói \"hungry\" và cất ô tô khi bị nhắc.","lines":[["A","{name}, come to the <b>dining room</b>!","{name} ơi, vào phòng ăn nào!","🍽️"],["B","Coming, Mom! I'm so <b>hungry</b>!","Con đến đây mẹ ơi! Con đói quá!","😋"],["A","<b>Here you are</b>. Some hot <b>rice</b>.","Của con đây. Cơm nóng nè.","🍚"],["B","<b>Thank you</b>, Mom. Let's <b>eat</b>!","Con cảm ơn mẹ. Cả nhà ăn thôi!"],["A","Wait! No <b>car</b> at the table, {name}.","Khoan đã! Không mang ô tô lên bàn ăn nhé, {name}.","🚗"],["B","Sorry, Mom. Vroom... bye-bye, <b>car</b>!","Con xin lỗi mẹ. Brừm... tạm biệt ô tô!"],["A","Oh no! The <b>cat</b> is on the table!","Ôi không! Con mèo nhảy lên bàn rồi!","🐱"],["B","Ha ha! The <b>cat</b> <b>drinks</b> from my <b>cup</b>!","Ha ha! Con mèo uống trong cốc của con!","☕"],["A","Silly <b>cat</b>! Now, <b>cake</b> for the <b>family</b>!","Mèo nghịch quá! Giờ thì bánh ngọt cho cả nhà!","🎂"],["B","Yay! <b>Cat</b>, <b>cup</b>, <b>cake</b>! C, c, c!","Hay quá! Mèo, cốc, bánh! C, c, c!"]],"swap":["some hot <b>rice</b> → some cake","I'm so <b>hungry</b> → I'm fine"],"ask":["Are you hungry?","Who is in your family?","Do you have a cat?"]},
  {"type":"show","title":"My Family Cake","ic":"🎂","tip":"Trẻ cầm hình chiếc bánh tự vẽ (có ô tô và mèo trên bánh) lên trước lớp. Ở câu 6 cả lớp xoa bụng nói \"Mmm!\", câu cuối cả lớp vỗ tay nói theo.","lines":[["🎂","This is my <b>cake</b>. It's for my <b>family</b>.","Đây là chiếc bánh của tớ. Bánh dành cho cả nhà tớ."],["🍽️","We <b>eat</b> it in the <b>dining room</b>.","Cả nhà ăn bánh ở phòng ăn."],["🚗","There is a <b>car</b> on my <b>cake</b>. Vroom, vroom!","Trên bánh của tớ có một chiếc ô tô. Brừm brừm!"],["🐱","And there's a <b>cat</b>, too! Meow!","Và có cả một con mèo nữa! Meo!"],["☕","Dad <b>drinks</b> tea from his <b>cup</b>.","Bố uống trà bằng cốc của bố."],["😋","Are you <b>hungry</b>? Say \"Mmm!\" with me!","Các bạn có đói không? Cùng nói \"Ừm!\" với tớ nào!"],["🤲","<b>Here you are</b>! Some <b>cake</b> for you!","Của các bạn đây! Một ít bánh cho các bạn!"],["👏","Clap and say: <b>cat</b>, <b>cake</b>, <b>cup</b>!","Vỗ tay và nói: mèo, bánh, cốc!"]],"swap":["a <b>car</b> → a cat / a ball","for my <b>family</b> → for my friend"],"ask":["What's on your cake?","Where do you eat?","Are you hungry?"]}]},

  {"type":"talk","title":"At the Street Market","ic":"🍎","roles":{"A":["👵","Grandma"],"B":["🧒","{name}"]},"tip":"Cô đóng vai bà bán hàng với táo, cam (thật hoặc tranh) và một con kiến giấy. Trẻ cầm túi, chọn quả to/nhỏ bằng tay và nhớ nói \"please\".","lines":[["A","Good morning! Welcome to the <b>market</b>!","Chào buổi sáng! Chào mừng cháu đến chợ!","🛒"],["B","Good morning, Grandma! An <b>apple</b>, <b>please</b>.","Cháu chào bà ạ! Bà bán cho cháu một quả táo ạ.","🍎"],["A","A <b>big</b> apple or a <b>small</b> apple?","Táo to hay táo nhỏ hả cháu?"],["B","A <b>big</b> apple, <b>please</b>!","Quả to ạ!"],["A","Here you are. Anything else?","Của cháu đây. Cháu mua gì nữa không?"],["B","Some <b>oranges</b>, <b>please</b>.","Cho cháu mấy quả cam ạ.","🍊"],["A","OK! Put them in your <b>bag</b>.","Được rồi! Cháu bỏ vào túi nhé.","👜"],["B","Oh! An <b>ant</b> on my <b>apple</b>!","Ôi! Có con kiến trên quả táo của cháu!","🐜"],["A","Ha ha! An <b>ant</b> and an <b>apple</b> in a <b>bag</b>!","Ha ha! Kiến với táo ở trong túi!"],["B","Thank you, Grandma. <b>Goodbye</b>!","Cháu cảm ơn bà. Cháu chào bà ạ!","🚶"],["A","Goodbye! What a pretty <b>hat</b>, {name}!","Tạm biệt cháu! Mũ của cháu đẹp quá, {name}!","👒"]],"swap":["An <b>apple</b> → An orange / A cake","A <b>big</b> apple → A small apple"],"ask":["Big apple or small apple?","What's in your bag?","Do you have a hat?"]},
  {"type":"me","title":"My Market Morning","ic":"👜","tip":"Trẻ kể theo thứ tự First, Then, After that, Finally, giơ ngón tay đếm từng bước. Ở câu có con kiến, cả lớp cùng phẩy tay nói \"Shoo!\".","lines":[["🛒","I'm {name}. On Sunday, I go to the <b>market</b>.","Tớ là {name}. Chủ nhật, tớ đi chợ."],["👒","First, I put on my <b>hat</b> and take my <b>bag</b>.","Đầu tiên, tớ đội mũ và mang theo túi."],["🍎","Then, I say, \"<b>Apples</b>, <b>please</b>!\"","Sau đó, tớ nói: \"Cho cháu táo ạ!\""],["🍊","After that, I pick a <b>big</b> <b>orange</b>.","Tiếp theo, tớ chọn một quả cam to."],["🐜","Oh! An <b>ant</b> is on my apple! Can you say \"Shoo!\"?","Ôi! Có con kiến trên quả táo! Các bạn nói \"Xùy!\" giúp tớ nhé?"],["🥫","Finally, Grandma gets a <b>can</b> of cat food.","Cuối cùng, bà mua một hộp thức ăn cho mèo."],["🎵","Say it with me: <b>apple</b>, <b>ant</b>, <b>hat</b>! A, a, a!","Cùng nói với tớ nào: táo, kiến, mũ! A, a, a!"]],"swap":["a <b>big</b> orange → a small apple","my <b>hat</b> → my bag"],"ask":["What do you take to the market?","Apples or oranges?","Big or small?"]}]},

  {"type":"talk","title":"Bedtime Hunt","ic":"🦆","roles":{"A":["👨","Dad"],"B":["🧒","{name}"]},"tip":"Giấu một con vịt đồ chơi trong lớp; cô đóng vai Bố, trẻ đi tìm và chỉ đúng chỗ khi nói on / under / near. Có thể cho một bạn đóng vai chú chó Dodo.","lines":[["A","{name}, it's bedtime. Come to your <b>bedroom</b>!","{name} ơi, đến giờ đi ngủ rồi. Vào phòng ngủ nào!","🛌"],["B","OK, Dad. But where's my <b>duck</b>?","Vâng ạ. Nhưng con vịt của con đâu rồi bố?","🦆"],["A","Is it <b>on</b> the <b>bed</b>?","Nó ở trên giường à?","🛏️"],["B","No. My <b>doll</b> is <b>on</b> the bed.","Không ạ. Búp bê của con ở trên giường.","🎎"],["A","Is it <b>under</b> the <b>desk</b>?","Thế nó ở dưới bàn học à?","🪑"],["B","No. My book is <b>under</b> the desk.","Không ạ. Quyển sách của con ở dưới bàn."],["A","Hmm... Oh! Dodo is <b>near</b> the <b>door</b>.","Hừm... Ồ! Dodo đang ở gần cửa kìa.","🚪"],["B","Dodo has my <b>duck</b>! Bad <b>dog</b>!","Dodo ngậm con vịt của con! Chó hư!","🐶"],["A","Ha ha! Dodo the <b>dog</b>, drop the <b>duck</b>!","Ha ha! Chó Dodo ơi, nhả con vịt ra nào!"],["B","Thank you, Dad! Good night, <b>duck</b>. Good night, <b>doll</b>.","Con cảm ơn bố! Vịt ngủ ngon nhé. Búp bê ngủ ngon nhé."],["A","Good night, {name}. Click! The <b>lamp</b> is off.","Chúc con ngủ ngon. Tách! Tắt đèn rồi.","💡"]],"swap":["<b>on</b> the bed → under the bed / near the door","my <b>duck</b> → my doll / my ball"],"ask":["Where's your bed?","Do you have a doll or a duck?","What's on your desk?"]},
  {"type":"compare","title":"Dodo and Didi","ic":"🐶","left":["🐶","A dog"],"right":["🦆","A duck"],"tip":"Hai bạn đứng hai bên, một bạn làm chó Dodo, một bạn làm vịt Didi, vừa nói vừa bắt chước tiếng kêu và động tác. Câu cuối cả hai nắm tay nói cùng nhau.","lines":[["L","🐶","This is Dodo, the <b>dog</b> in my <b>bedroom</b>.","Đây là Dodo, chú chó trong phòng ngủ của tớ."],["R","🦆","This is Didi. Didi is a <b>duck</b>.","Đây là Didi. Didi là một chú vịt."],["L","🛏️","Dodo is <b>under</b> the <b>bed</b>.","Dodo nằm dưới gầm giường."],["R","🛏️","But Didi is <b>on</b> the <b>bed</b>!","Còn Didi thì ở trên giường!"],["L","🐶","Dodo says, \"Woof, woof!\"","Dodo kêu: \"Gâu gâu!\""],["R","🦆","Didi says, \"Quack, quack!\"","Didi kêu: \"Quạc quạc!\""],["L","🚪","Dodo can jump <b>near</b> the <b>door</b>. Hop!","Dodo nhảy được ở gần cửa. Nhảy!"],["R","🪑","Didi can jump, too! Hop onto the <b>desk</b>!","Didi cũng nhảy được! Nhảy lên bàn học!"],["L","🎎","Dodo plays with my <b>doll</b>.","Dodo chơi với búp bê của tớ."],["R","💡","But Didi plays <b>near</b> the <b>lamp</b>.","Còn Didi thì chơi ở gần cái đèn."],["B","🧑‍🤝‍🧑","Dodo the <b>dog</b> and Didi the <b>duck</b> are both my friends!","Chó Dodo và vịt Didi đều là bạn của tớ!"]],"swap":["<b>under</b> the bed → on the desk / near the lamp","Dodo is a <b>dog</b> → Dodo is a cat"],"ask":["Where's Dodo?","Is Didi a dog or a duck?","Do you have a dog?"]}]},
 {"id":"u5","n":"Unit 5","ic":"🐟","title":"At the fish and chip shop","span":"Letter I i · Fish and Chips, Please!","when":"Tuần 9–10","units":["g5"],"fresh":["g5"],tasks:[
  {"type":"talk","title":"Mr Pig's Shop","ic":"🍟","roles":{"A":["🐖","Mr Pig"],"B":["🧒","{name}"]},"tip":"Cô đeo mũi lợn bằng giấy đóng vai ông Lợn bán hàng. Trẻ làm mặt nhăn khi nói \"yucky\" và xoa bụng khi nói \"yummy\".","lines":[["A","Hello! Welcome to my <b>shop</b>!","Xin chào! Chào mừng cháu đến cửa hàng của tôi!","🏪"],["B","Hello! Wow, a <b>pig</b> in a <b>fish</b> and chip shop!","Xin chào! Oa, một chú lợn trong tiệm cá và khoai chiên!","🐖"],["A","Yes! I'm Mr Pig. Are you hungry?","Đúng vậy! Tôi là ông Lợn. Cháu có đói không?"],["B","Yes, I am. <b>Fish</b> and <b>chips</b>, please!","Có ạ. Cho cháu cá và khoai tây chiên ạ!","🐟"],["A","<b>Milk</b> or <b>juice</b>?","Cháu uống sữa hay nước ép?","🥛"],["B","<b>Juice</b>, please. I <b>like</b> orange juice.","Nước ép ạ. Cháu thích nước cam.","🧃"],["A","And try my <b>fish</b> <b>ice cream</b>!","Và thử kem cá của tôi nhé!","🍦"],["B","<b>Fish</b> <b>ice cream</b>? Ew, <b>yucky</b>!","Kem cá á? Eo, dở lắm!","🤢"],["A","Ha ha! OK, a chocolate <b>ice cream</b>, then.","Ha ha! Được rồi, vậy thì kem sô-cô-la nhé."],["B","Mmm, <b>yummy</b>! Thank you, Mr Pig!","Ừm, ngon quá! Cháu cảm ơn ông Lợn!","😋"],["A","You're welcome! Big <b>fish</b>, big <b>chips</b>, big <b>pig</b>!","Không có gì! Cá to, khoai to, lợn cũng to!"]],"swap":["<b>Fish</b> and chips → Chicken and chips","<b>Juice</b>, please → Milk, please"],"ask":["Do you like fish?","Milk or juice?","What's yummy? What's yucky?"]},
  {"type":"story","title":"Pip and Kitty","ic":"🐖","tip":"Cô kể từng tranh, hai bạn đóng vai lợn Pip và mèo Kitty. Nhấn mạnh câu \"I'm sorry\" và \"That's OK\", cho trẻ nói kèm động tác cúi đầu và bắt tay.","lines":[["🏪","Pip the <b>pig</b> is in the fish and chip <b>shop</b>.","Lợn Pip đang ở tiệm cá và khoai tây chiên."],["🍦","Pip has a big <b>ice cream</b>. <b>Yummy</b>!","Pip có một cây kem to. Ngon quá!"],["🐱","Kitty the cat comes in with her <b>milk</b>.","Mèo Kitty đi vào, cầm theo hộp sữa."],["💥","Oops! Pip bumps into Kitty. The <b>milk</b> is on the floor!","Ối! Pip va vào Kitty. Sữa đổ hết ra sàn!"],["🙇","Pip says, \"I'm sorry, Kitty!\"","Pip nói: \"Tớ xin lỗi, Kitty!\""],["🤝","Kitty says, \"That's OK, Pip.\"","Kitty nói: \"Không sao đâu, Pip.\""],["🐟","Pip gives Kitty some <b>fish</b> and <b>chips</b>.","Pip mời Kitty ăn cá và khoai tây chiên."],["😋","Kitty says, \"I <b>like</b> <b>fish</b>! Thank you, Pip!\"","Kitty nói: \"Tớ thích cá! Cảm ơn Pip!\""]],"swap":["some <b>fish</b> → some chicken / some chips","her <b>milk</b> → her juice"],"ask":["What does Pip have?","What does Pip say?","Do you like ice cream?"]}]},
 {"id":"u6","n":"Unit 6","ic":"🏫","title":"In the classroom","span":"Letter E e · Eggs on the Board!","when":"Tuần 11–12","units":["g6"],"fresh":["g6"],tasks:[
  {"type":"talk","title":"In the Classroom","ic":"🔔","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Cô đóng vai cô Lan, chuẩn bị bút đỏ, bút xanh và cục tẩy vàng. Trẻ lên bảng vẽ quả trứng thật, rồi cầm cục tẩy xóa khi nói \"Rub, rub, rub!\".","lines":[["A","Good morning, class! Ding-dong, there's the <b>bell</b>!","Chào cả lớp! Kính coong, chuông reo rồi!","🔔"],["B","Good morning, Miss Lan!","Chúng em chào cô Lan ạ!"],["A","{name}, please come to the <b>board</b>.","{name}, em lên bảng nhé.","🟩"],["B","Yes, Miss Lan. Can I have a <b>pen</b>?","Vâng ạ. Cô cho em mượn bút ạ?","🖊️"],["A","Here you are. A <b>red</b> pen or a <b>blue</b> pen?","Của em đây. Bút đỏ hay bút xanh?"],["B","A <b>red</b> pen, please. Thank you!","Bút đỏ ạ. Em cảm ơn cô!"],["A","Now draw an <b>egg</b> on the <b>board</b>.","Bây giờ em vẽ một quả trứng lên bảng nhé.","🥚"],["B","OK! A big <b>egg</b>... and a small <b>egg</b>!","Vâng! Một quả trứng to... và một quả trứng nhỏ!"],["A","Wow! <b>Eggs</b>, <b>eggs</b>, everywhere! Excellent!","Oa! Trứng ở khắp nơi! Xuất sắc lắm!"],["B","Oops! Can I have an <b>eraser</b>, please?","Ối! Cô cho em mượn cục tẩy được không ạ?","🧽"],["A","Ha ha! Here's a <b>yellow</b> eraser.","Ha ha! Đây là cục tẩy màu vàng."],["B","Rub, rub, rub! Bye-bye, <b>eggs</b>!","Xóa, xóa, xóa! Tạm biệt những quả trứng!"]],"swap":["a <b>red</b> pen → a blue pencil / a yellow ruler","an <b>egg</b> → a cat / a duck"],"ask":["What's in your bag?","What colour is your pen?","Where's the board?"]},
  {"type":"show","title":"My Drawing","ic":"🖼️","tip":"Trẻ vẽ lớp học của mình ở nhà rồi cầm bức vẽ lên trước lớp, chỉ vào từng thứ khi nói. Ở câu chuông, cả lớp cùng nói \"Ding-dong\".","lines":[["🖼️","This is my <b>drawing</b>. It's my <b>classroom</b>!","Đây là bức vẽ của tớ. Đó là lớp học của tớ!"],["👩‍🏫","This is my <b>teacher</b>, Miss Lan. She's great!","Đây là cô giáo của tớ, cô Lan. Cô tuyệt lắm!"],["🟩","This is the <b>board</b>. There's an <b>egg</b> on it!","Đây là cái bảng. Trên bảng có một quả trứng!"],["🔔","And this is the <b>bell</b>. Can you say \"Ding-dong\"?","Còn đây là cái chuông. Các bạn nói \"Kính coong\" được không?"],["✏️","I draw with a <b>pencil</b> and a <b>ruler</b>.","Tớ vẽ bằng bút chì và thước kẻ."],["c:#E53935","The door is <b>red</b>. The desks are <b>blue</b>.","Cửa màu đỏ. Bàn học màu xanh dương."],["🧽","Can you find the <b>yellow</b> <b>eraser</b>? Yes, here!","Các bạn có tìm thấy cục tẩy màu vàng không? Đây này!"],["🥚","<b>Egg</b>, <b>bell</b>, <b>pen</b>, red. Hey, E is everywhere!","Trứng, chuông, bút, màu đỏ. Ô, chữ E ở khắp nơi!"]],"swap":["my <b>classroom</b> → my bedroom / my family","The door is <b>red</b> → blue / yellow"],"ask":["What's in your drawing?","What colour is your pencil?","Who is your teacher?"]}]},
 {"id":"u7","n":"Unit 7","ic":"🌷","title":"In the garden","span":"Letter G g · A Goat in the Garden!","when":"Tuần 13–14","units":["g7"],"fresh":["g7"],tasks:[
  {"type":"talk","title":"In Grandma's Garden","ic":"🌸","roles":{"A":["👵","Grandma"],"B":["🧒","{name}"]},"tip":"Dán tranh hoa, cây, chim, bướm quanh lớp làm khu vườn. Cô đóng vai Bà; trẻ làm động tác mở cổng, chỉ tranh, và xua con dê khi nói \"Go, go, goat!\".","lines":[["A","Come in, {name}! Open the <b>gate</b>.","Vào đi cháu! Cháu mở cổng ra nào.","🚧"],["B","Wow, Grandma! Your <b>garden</b> is so pretty!","Oa, bà ơi! Khu vườn của bà đẹp quá!","🌷"],["A","Thank you! Can you <b>see</b> the <b>flowers</b>?","Cảm ơn cháu! Cháu có thấy những bông hoa không?","🌸"],["B","Yes! <b>Pink</b> flowers and <b>purple</b> flowers!","Có ạ! Hoa màu hồng và hoa màu tím!"],["A","And what's in the <b>tree</b>?","Thế trên cây có gì nào?","🌳"],["B","A <b>bird</b>! Tweet, tweet! And a <b>butterfly</b>, too!","Một con chim! Chíp chíp! Và cả một con bướm nữa!","🐦"],["A","Do you like <b>grapes</b>?","Cháu có thích nho không?","🍇"],["B","Yes, I do! <b>Green</b> grapes are yummy!","Có ạ! Nho xanh ngon lắm!"],["A","Oh no! A <b>goat</b> is in the <b>garden</b>!","Ôi không! Con dê vào vườn rồi!","🐐"],["B","Go, go, <b>goat</b>! Go out the <b>garden</b> <b>gate</b>!","Đi đi, dê ơi! Ra cổng vườn đi!"],["A","Good job, {name}! Now close the <b>gate</b>.","Giỏi lắm, {name}! Giờ cháu đóng cổng lại nhé."]],"swap":["<b>Pink</b> flowers → Red flowers / Yellow flowers","a <b>bird</b> → a butterfly / a cat"],"ask":["What can you see in a garden?","Do you like grapes?","What colour are the flowers?"]},
  {"type":"me","title":"My Garden Day","ic":"🦋","tip":"Trẻ kể theo thứ tự First, Then, After that, Finally kèm động tác: mở cổng, ngửi hoa, vỗ cánh bướm. Ở câu chim hót, cả lớp hát \"La la\" cùng bạn.","lines":[["🌷","I'm {name}. This is my day in the <b>garden</b>.","Tớ là {name}. Đây là một ngày của tớ trong vườn."],["🚧","First, I open the <b>gate</b>. Hello, <b>garden</b>!","Đầu tiên, tớ mở cổng. Chào khu vườn!"],["🌸","Then, I smell the <b>pink</b> <b>flowers</b>. Mmm!","Sau đó, tớ ngửi những bông hoa màu hồng. Thơm quá!"],["🦋","After that, I <b>see</b> a <b>butterfly</b>. Flap, flap!","Tiếp theo, tớ thấy một con bướm. Vỗ cánh, vỗ cánh!"],["🐦","A <b>bird</b> sings in the <b>tree</b>. Can you sing, too? La la!","Một chú chim hót trên cây. Các bạn hát cùng không? La la!"],["🍇","Finally, I pick <b>green</b> <b>grapes</b> with Grandma.","Cuối cùng, tớ hái nho xanh cùng bà."],["🐐","Uh-oh! A greedy <b>goat</b> eats my <b>grapes</b>! Go, go, goat!","Ôi thôi! Một con dê tham ăn ăn mất nho của tớ! Đi đi, dê ơi!"]],"swap":["the <b>pink</b> flowers → the purple flowers","a <b>butterfly</b> → a bird / a goat"],"ask":["What do you see in the garden?","Do you like grapes?","What colour is a butterfly?"]}]},
 {"id":"u8","n":"Unit 8","ic":"🌳","title":"In the park","span":"Letter H h · A Happy Horse!","when":"Tuần 15–16","units":["g8"],"fresh":["g8"],tasks:[
  {"type":"talk","title":"At the Park","ic":"🐴","roles":{"A":["👦🏼","Tom"],"B":["🧒","{name}"]},"tip":"Một bạn đóng vai chú ngựa (đội một chiếc mũ). Trẻ chạm nhẹ vào đầu, tóc của \"ngựa\" khi nói, rồi làm mặt buồn và vui theo lời thoại.","lines":[["A","Hi, {name}! Let's play at the <b>park</b>!","Chào {name}! Mình ra công viên chơi đi!","🌳"],["B","OK, Tom! Oh, wow! A <b>horse</b>!","Được, Tom! Ôi, oa! Một con ngựa!","🐴"],["A","It has a long <b>nose</b> and big <b>ears</b>.","Nó có cái mũi dài và đôi tai to."],["B","Can I <b>touch</b> it?","Tớ sờ nó được không?","✋"],["A","Yes! <b>Touch</b> its <b>head</b>. Gently!","Được! Sờ vào đầu nó đi. Nhẹ nhàng thôi!"],["B","Hello, horse! Your <b>hair</b> is so soft.","Chào ngựa! Bờm của bạn mềm quá."],["A","The <b>horse</b> is <b>happy</b>! Neigh!","Con ngựa vui lắm! Hí hí!","😊"],["B","Hey! The horse has my hat in its <b>mouth</b>!","Ơ kìa! Con ngựa ngậm mũ của tớ rồi!","👒"],["A","Ha ha! A happy <b>horse</b> with a <b>hat</b> on its <b>head</b>!","Ha ha! Một chú ngựa vui vẻ đội mũ trên đầu!"],["B","It's funny, but I'm <b>sad</b>. My hat!","Buồn cười thật, nhưng tớ buồn lắm. Mũ của tớ!","😢"],["A","Here you are, {name}. Don't be <b>sad</b>!","Mũ của bạn đây, {name}. Đừng buồn nhé!"],["B","Thank you, Tom! Bye-bye, <b>horse</b>!","Cảm ơn Tom! Tạm biệt ngựa nhé!"]],"swap":["<b>Touch</b> its <b>head</b> → Touch its nose / Touch its hair","I'm <b>sad</b> → I'm happy"],"ask":["Do you like horses?","Touch your nose!","Are you happy or sad?"]},
  {"type":"compare","title":"The Horse and Me","ic":"🐴","left":["🐴","A horse"],"right":["🧒","Me"],"tip":"Một bạn cầm tranh con ngựa, một bạn nói về chính mình và chạm vào bộ phận cơ thể tương ứng. Cả lớp làm theo khi nghe \"Touch your nose\" và \"Clap, clap\".","lines":[["L","🐴","Hello, <b>horse</b>! A horse has a big <b>head</b>.","Chào ngựa! Con ngựa có cái đầu to."],["R","🧒","I have a small <b>head</b>.","Tớ có cái đầu nhỏ."],["L","👂","A <b>horse</b> has long <b>ears</b>.","Con ngựa có đôi tai dài."],["R","👂","My <b>ears</b> are small, but I can hear you!","Tai tớ nhỏ, nhưng tớ nghe thấy các bạn đấy!"],["L","👃","A horse has a big <b>nose</b> and a big <b>mouth</b>.","Con ngựa có cái mũi to và cái miệng to."],["R","👃","I have a small <b>nose</b>. Touch your nose with me!","Tớ có cái mũi nhỏ. Các bạn chạm vào mũi cùng tớ nào!"],["L","💇","A horse has long <b>hair</b> on its neck.","Con ngựa có bờm dài trên cổ."],["R","💇","I have <b>hair</b>, too! Ha ha!","Tớ cũng có tóc nữa! Ha ha!"],["L","🐴","A horse has no <b>hands</b>.","Con ngựa không có bàn tay."],["R","✋","But I have <b>hands</b>. Clap, clap!","Nhưng tớ có đôi bàn tay. Vỗ tay nào!"],["B","😊","We both have <b>eyes</b>, and we're both <b>happy</b>!","Chúng tớ đều có mắt, và cả hai đều vui!"]],"swap":["a big <b>nose</b> → a big head / a big mouth","both <b>happy</b> → both sad"],"ask":["Do you have a big nose or a small nose?","Touch your ears!","What does a horse have?"]}]},
 {"id":"u9","n":"Unit 9","ic":"🏬","title":"In the shop","span":"Letter O o · Shopping with Grandma","when":"Tuần 17–18","units":["g9"],"fresh":["g9"],tasks:[
  {"type":"talk","title":"At the Shop","ic":"🛍️","roles":{"A":["👵","Grandma"],"B":["🧒","{name}"]},"tip":"Bày \"cửa hàng\" bằng đồ thật hoặc tranh (nồi, cây lau nhà, tất, đồng hồ, ổ khóa). Bé đóng vai cháu đi mua đồ cùng bà, cầm đồ đưa cho bà và giơ ngón tay đếm số tất.","lines":[["A","Come on, {name}! Look, this <b>shop</b> has <b>many</b> things.","Đi nào, {name}! Nhìn kìa, cửa hàng này có nhiều đồ quá."],["B","Wow! I can see a big <b>clock</b>. Tick, tock!","Ồ! Cháu thấy một cái đồng hồ to. Tích, tắc!","🕰️"],["A","I need a <b>pot</b> for rice. Where's a pot?","Bà cần một cái nồi để nấu cơm. Nồi ở đâu nhỉ?"],["B","There, Grandma! The red <b>pot</b> is near the door.","Kia bà ơi! Cái nồi màu đỏ ở gần cửa ấy.","🍲"],["A","Good! And <b>one</b> <b>mop</b>, please.","Giỏi lắm! Lấy thêm một cây lau nhà nữa nhé."],["B","Here you are. One big <b>mop</b>!","Của bà đây ạ. Một cây lau nhà to!","🧹"],["A","Thank you! Now <b>socks</b> for you. How many?","Cảm ơn cháu! Giờ mua tất cho cháu. Bao nhiêu chiếc?"],["B","<b>Three</b>, please! One, two, three... One for my dog!","Ba chiếc ạ! Một, hai, ba... Một chiếc cho con chó của cháu!","🧦"],["A","Ha ha! Look over there, {name}. What's this?","Ha ha! Nhìn đằng kia kìa, {name}. Cái gì đây?"],["B","Oh! An <b>octopus</b> in orange <b>socks</b>! So funny!","Ôi! Một con bạch tuộc đi tất màu cam! Buồn cười quá!","🐙"],["A","And a <b>lock</b> for the gate. OK, let's go!","Và một cái ổ khóa cho cổng nữa. Xong rồi, mình về thôi!"],["B","OK, Grandma! Bye-bye, <b>shop</b>!","Vâng ạ! Tạm biệt cửa hàng!","👋"]],"swap":["a <b>pot</b> → a clock / a lock","<b>Three</b> socks → two / four / five"],"ask":["What can you see in a shop?","How many socks do you have?","Can you say: Oh, an octopus in orange socks?"]},
  {"type":"story","title":"Where's the Pink Sock?","ic":"🧦","tip":"Kể theo tranh; đến mỗi câu \"Is it in…?\" dừng lại cho cả lớp đoán và đáp \"No, it isn't!\". Có thể giấu một chiếc tất thật trong lớp để bé đi tìm.","lines":[["🧦","Bi has <b>five</b> <b>socks</b>. They're red, blue, yellow, green and pink.","Bi có năm chiếc tất: đỏ, xanh dương, vàng, xanh lá và hồng."],["😮","Oh no! One, two, three, <b>four</b>. Where's the pink sock?","Ôi không! Một, hai, ba, bốn. Chiếc tất hồng đâu rồi?"],["🍲","Is it in the <b>pot</b>? No, it isn't.","Nó ở trong nồi à? Không phải."],["🧹","Is it under the <b>mop</b>? No, it isn't.","Nó ở dưới cây lau nhà à? Không phải."],["🐙","Is it on the big <b>octopus</b> doll? No, it isn't.","Nó ở trên con búp bê bạch tuộc to à? Cũng không phải."],["🕰️","Tick, tock, goes the <b>clock</b>. Bi is sad.","Đồng hồ kêu tích, tắc. Bi buồn lắm."],["🎎","Look! Na's doll has a pink hat. It's the pink <b>sock</b>!","Nhìn kìa! Búp bê của Na đội mũ hồng. Đó chính là chiếc tất hồng!"],["🤗","\"Sorry, Bi!\" says Na. \"That's OK!\" says Bi. <b>Five</b> socks again!","Na nói: \"Xin lỗi Bi nhé!\" Bi đáp: \"Không sao đâu!\" Lại đủ năm chiếc tất rồi!"]],"swap":["the pink <b>sock</b> → the red / blue sock","in the <b>pot</b> → under the bed / on the desk"],"ask":["Where's the pink sock?","How many socks does Bi have?","What do you say when you're sorry?"]}]},
 {"id":"u10","n":"Unit 10","ic":"🦒","title":"At the zoo","span":"Letter M m · Hello, Zoo Animals! · Mammals, birds, reptiles","when":"Tuần 19–20","units":["g10"],"fresh":["g10"],tasks:[
  {"type":"talk","title":"A Day at the Zoo","ic":"🎟️","roles":{"A":["👩","Mom"],"B":["🧒","{name}"]},"tip":"Dán tranh con vật quanh lớp làm \"sở thú\". Cô giáo đóng vai mẹ dắt bé đi xem; bé chỉ tay vào tranh và bắt chước con vật (vươn cổ như hươu, gầm như sư tử, gãi đầu như khỉ).","lines":[["A","Here we are at the <b>zoo</b>! What can you see?","Mình đến sở thú rồi! Con nhìn thấy gì nào?"],["B","I can see a big <b>elephant</b>! It's grey.","Con thấy một con voi to! Nó màu xám.","🐘"],["A","Yes! Now look up. What's that?","Đúng rồi! Giờ con nhìn lên cao xem. Con gì kia?"],["B","It's a <b>giraffe</b>! It's so tall!","Là hươu cao cổ! Nó cao quá!","🦒"],["A","Listen! Roar! What animal is it?","Nghe này! Grừ! Con gì thế nhỉ?"],["B","A <b>lion</b>! I'm scared, Mom!","Sư tử! Con sợ quá mẹ ơi!","🦁"],["A","It's OK. Look, a <b>zebra</b>. It's black and white.","Không sao đâu. Nhìn kìa, con ngựa vằn. Nó có màu đen và trắng."],["B","Can I touch the <b>zebra</b>?","Con chạm vào ngựa vằn được không ạ?","🦓"],["A","No, sorry. Don't touch. Look at the <b>monkeys</b>!","Không được con ạ. Đừng chạm vào nhé. Nhìn mấy con khỉ kìa!"],["B","Ha ha! <b>Many</b> <b>monkeys</b>, many <b>mangoes</b>! Mmm!","Ha ha! Bao nhiêu là khỉ, bao nhiêu là xoài! Ngon ghê!","🐒"],["A","Do you like the <b>zoo</b>?","Con có thích sở thú không?"],["B","Yes, I do! I love the zoo, and I love you, Mom!","Có ạ! Con thích sở thú, và con yêu mẹ!","❤️"]],"swap":["a big <b>elephant</b> → a big bear / a big lion","a <b>giraffe</b> → a zebra / a monkey"],"ask":["What animals can you see at the zoo?","Do you like monkeys?","Can you roar like a lion?"]},
  {"type":"show","title":"My Zoo Drawing","ic":"🖍️","tip":"Bé vẽ hoặc dán tranh sở thú lên giấy A4, cầm lên giới thiệu và chỉ vào từng con vật. Ở câu khỉ, mời cả lớp đứng lên làm điệu khỉ \"Oo-oo, aa-aa!\".","lines":[["🖼️","This is my drawing. It's the <b>zoo</b>!","Đây là bức vẽ của tớ. Đó là sở thú!"],["👩","I go to the zoo with my <b>mother</b>.","Tớ đi sở thú cùng mẹ."],["🐘","This is an <b>elephant</b>. It's big. It has big ears.","Đây là con voi. Nó to lắm. Nó có đôi tai to."],["🦒","That is a <b>giraffe</b>. It's very, very tall!","Kia là hươu cao cổ. Nó cao ơi là cao!"],["🐒","Many <b>monkeys</b> eat many <b>mangoes</b>. Mmm, yummy!","Bao nhiêu khỉ ăn bao nhiêu xoài. Ừm, ngon quá!"],["🐭","Can you see the small <b>mouse</b>? It's under the tree!","Các bạn có thấy chú chuột nhỏ không? Nó ở dưới gốc cây đấy!"],["🐻","The brown <b>bear</b> is my favourite. It's happy.","Tớ thích nhất là chú gấu nâu. Nó đang vui."],["🙌","Can you be a monkey with me? Oo-oo, aa-aa!","Các bạn làm khỉ cùng tớ nhé? U-u, a-a!"]],"swap":["an <b>elephant</b> → a lion / a zebra","The brown <b>bear</b> → The small mouse / The tall giraffe"],"ask":["What's your favourite zoo animal?","What colour is a zebra?","Who do you go to the zoo with?"]},{"type":"talk","title":"At Saigon Zoo","ic":"🐯","roles":{"A":["👨","Dad"],"B":["🧒","{name}"]},"tip":"Kẻ bảng 3 cột: Mammals 🐾 / Birds 🐦 / Reptiles 🐢. Nói xong mỗi câu, bé dán tranh con vật vào đúng cột. Mẹo: có lông mao → mammal; có lông vũ và cánh → bird; có vảy → reptile. Hổ Đông Dương và vượn đen má vàng ở Thảo Cầm Viên là loài quý hiếm: dạy thêm câu \"It is rare. Let's keep it safe.\" Bé khá có thể học thêm (không có trong trò chơi): pelican (bồ nông), crane (sếu), hornbill (hồng hoàng), civet (cầy).","lines":[["A","Welcome to Saigon Zoo! What can you see?","Chào mừng con đến Thảo Cầm Viên Sài Gòn! Con nhìn thấy gì nào?"],["B","I can see a tall <b>giraffe</b> and a pink <b>flamingo</b>!","Con thấy một con hươu cao cổ cao và một con hồng hạc màu hồng!","🦩"],["A","Look! A big <b>tiger</b>. What animal group is a tiger?","Nhìn kìa! Một con hổ to. Hổ thuộc nhóm động vật nào?"],["B","It is a <b>mammal</b>. It has fur, like the <b>leopard</b>.","Nó là động vật có vú. Nó có lông mao, giống con báo.","🐯"],["A","This tiger is rare. Let's keep it safe.","Con hổ này rất quý hiếm. Mình cùng bảo vệ nó nhé."],["B","Look up! A <b>gibbon</b> in the tree. Hello, gibbon!","Nhìn lên kìa! Một con vượn trên cây. Chào vượn!","i:gibbon.svg"],["A","Listen. \"Hello! Hello!\" Who is it?","Nghe này. \"Hello! Hello!\" Ai thế nhỉ?"],["B","It's a <b>parrot</b>! A parrot is a <b>bird</b>. It has wings.","Là con vẹt! Vẹt là chim. Nó có cánh.","🦜"],["A","And here is a big <b>python</b>. Do you like the python?","Còn đây là một con trăn to. Con có thích con trăn không?"],["B","No, I don't! It's a <b>reptile</b>. Reptiles are scary!","Con không thích đâu! Nó là bò sát. Bò sát đáng sợ lắm!","🐍"],["A","Ha ha! The <b>iguana</b> is a reptile too. Look, it's green.","Ha ha! Con cự đà cũng là bò sát. Nhìn kìa, nó màu xanh lá."],["B","Mammals, birds and reptiles. I love Saigon Zoo!","Thú, chim và bò sát. Con yêu Thảo Cầm Viên!","❤️"]],"swap":["a tall <b>giraffe</b> → a big hippo / a funny raccoon","a big <b>tiger</b> → a brown bear / a leopard","a <b>parrot</b> → a flamingo / a peacock"],"ask":["What animal group is a tiger?","Is a flamingo a bird or a reptile?","Do you like the python? Why?"]}]},
 {"id":"u11","n":"Unit 11","ic":"🚏","title":"At the bus stop","span":"Letter U u · Bus, Stop, Go!","when":"Tuần 21–22","units":["g11"],"fresh":["g11"],tasks:[
  {"type":"talk","title":"At the Bus Stop","ic":"🚌","roles":{"A":["👨","Dad"],"B":["🧒","{name}"]},"tip":"Xếp ghế thành \"xe buýt\", đặt biển BUS STOP. Bé cầm ô (thật hoặc giấy), giơ ô lên khi nói \"Up, up, umbrella!\", giơ tay làm biển dừng khi bố nói \"Stop!\", rồi cả nhóm lên xe.","lines":[["A","Let's <b>walk</b> to the <b>bus stop</b>, {name}.","Mình đi bộ ra trạm xe buýt nhé, {name}."],["B","OK, Dad! Let's go! Can I <b>run</b>?","Vâng bố! Đi thôi! Con chạy được không ạ?","🏃"],["A","No, no. <b>Stop</b>! Look, a big <b>truck</b>.","Không, không. Dừng lại! Nhìn kìa, một chiếc xe tải to."],["B","Wow! It's a big blue <b>truck</b>. Bye, truck!","Ồ! Xe tải to màu xanh. Tạm biệt xe tải!","🚚"],["A","Here's the <b>bus stop</b>. Oh no, it's raining!","Trạm xe buýt đây rồi. Ôi không, trời mưa rồi!"],["B","Up, up, <b>umbrella</b>! Come under my umbrella, Dad!","Bung, bung, ô ơi! Bố vào trú dưới ô của con này!","☂️"],["A","Thank you! Where's the <b>bus</b>?","Cảm ơn con! Xe buýt đâu nhỉ?"],["B","There! The yellow <b>bus</b>! It's here!","Kia kìa! Xe buýt màu vàng! Nó đến rồi!","🚌"],["A","Give me your hand, please. Let's get on.","Đưa tay cho bố nào. Mình lên xe thôi."],["B","Here you are, Dad. Hello, bus!","Đây bố ạ. Xin chào xe buýt!","🤝"],["A","Next <b>stop</b>: <b>school</b>! Are you happy?","Điểm dừng tiếp theo: trường học! Con có vui không?"],["B","Yes! Look, Dad. The rain stops. The <b>sun</b> is up!","Có ạ! Bố nhìn này. Tạnh mưa rồi. Mặt trời lên rồi!","☀️"]],"swap":["a big <b>truck</b> → a big bus / a big car","The yellow <b>bus</b> → The red / blue bus"],"ask":["How do you go to school?","Do you have an umbrella?","What colour is your school bus?"]},
  {"type":"me","title":"My Way to School","ic":"🎒","tip":"Bé kể theo thứ tự, mỗi câu làm một động tác: đi bộ tại chỗ, giơ tay \"stop\", lắc lư như ngồi xe buýt, chạy tại chỗ. Giáo viên giơ thẻ First / Then / After that / Finally để nhắc bé.","lines":[["☀️","Good morning! The <b>sun</b> is up. I go to <b>school</b>.","Chào buổi sáng! Mặt trời lên rồi. Tớ đi học."],["🎒","First, I take my school bag and my <b>umbrella</b>.","Đầu tiên, tớ lấy cặp sách và cái ô."],["🚶","Then, I <b>walk</b> to the <b>bus stop</b> with my mom.","Sau đó, tớ đi bộ ra trạm xe buýt với mẹ."],["🛑","Cars and <b>trucks</b> <b>stop</b>. We look left and right.","Ô tô và xe tải dừng lại. Chúng tớ nhìn trái, nhìn phải."],["🚌","After that, I get on the yellow <b>bus</b>. Hello, driver!","Tiếp theo, tớ lên chiếc xe buýt màu vàng. Chào bác tài!"],["⬆️","Up, <b>up</b>, up the hill! Can you go up with me?","Xe buýt leo lên, lên, lên dốc! Các bạn cùng lên với tớ nhé?"],["🏃","Finally, I <b>run</b> to my classroom. Hello, Miss Lan!","Cuối cùng, tớ chạy vào lớp. Chào cô Lan ạ!"]],"swap":["I <b>walk</b> → I run","the yellow <b>bus</b> → the red / blue bus"],"ask":["How do you go to school?","Who do you walk with?","Can you stop like a bus? Stop!"]}]},
 {"id":"u12","n":"Unit 12","ic":"🏞️","title":"At the lake","span":"Letter L l · Look at the Lake!","when":"Tuần 23–24","units":["g12"],"fresh":["g12"],tasks:[
  {"type":"talk","title":"By the Lake","ic":"🐸","roles":{"A":["👧","Na"],"B":["🧒","{name}"]},"tip":"Trải tấm vải xanh làm \"hồ\". Bé nhảy như ếch, thả chiếc lá giấy lên đầu bạn, chỉ tranh bọ rùa để đếm chân. Nhấn rõ âm /l/ trong \"little ladybird, little leaf\".","lines":[["A","Look, {name}! It's a big blue <b>lake</b>!","Nhìn kìa, {name}! Một cái hồ xanh thật to!"],["B","Wow! Can we <b>swim</b> in the <b>lake</b>?","Ồ! Mình bơi trong hồ được không?","🏊"],["A","No, we can't. But the ducks can swim!","Không được đâu. Nhưng mấy chú vịt thì bơi được!"],["B","Quack, quack! And look, a green <b>frog</b>!","Quạc, quạc! Nhìn kìa, một chú ếch xanh!","🐸"],["A","It's jumping! Can you jump like a <b>frog</b>?","Nó đang nhảy kìa! Bạn nhảy như ếch được không?"],["B","Yes, I can! Ribbit, ribbit! Jump, jump!","Được chứ! Ộp, ộp! Nhảy, nhảy!","🤸"],["A","Oh! Look! A <b>leaf</b> <b>falls</b> on your head!","Ơ! Nhìn kìa! Một chiếc lá rơi lên đầu bạn!"],["B","Ha ha! And look. A little <b>ladybird</b> on a little <b>leaf</b>!","Ha ha! Nhìn này. Một chú bọ rùa nhỏ trên chiếc lá nhỏ!","🐞"],["A","It's red and black. Let's count its <b>legs</b>!","Nó màu đỏ và đen. Mình đếm chân nó đi!"],["B","One, two, three... Oh, so many <b>legs</b>!","Một, hai, ba... Ôi, nhiều chân quá!","🦵"],["A","Let's drink <b>lemon</b> juice. Here you are!","Mình uống nước chanh nhé. Của bạn đây!"],["B","Thank you, Na! Mmm, it's sour! I like the <b>lake</b>.","Cảm ơn Na! Ừm, chua quá! Tớ thích cái hồ này.","🍋"]],"swap":["a green <b>frog</b> → a little duck / a big fish","<b>lemon</b> juice → apple / orange juice"],"ask":["What can you see at a lake?","Can you swim?","Can you jump like a frog?"]},
  {"type":"compare","title":"A Frog and a Ladybird","ic":"🐞","left":["🐸","A frog"],"right":["🐞","A ladybird"],"tip":"Chia lớp hai nhóm: nhóm Ếch nói câu bên trái (L), nhóm Bọ rùa nói câu bên phải (R), câu cuối cả lớp nói chung. Làm động tác nhảy (ếch) và vỗ cánh bay (bọ rùa).","lines":[["L","🐸","This is a <b>frog</b>. It's green.","Đây là con ếch. Nó màu xanh lá."],["R","🐞","This is a <b>ladybird</b>. It's red and black.","Đây là con bọ rùa. Nó màu đỏ và đen."],["L","🏞️","A frog lives at the <b>lake</b>. It can <b>swim</b>.","Ếch sống ở hồ. Nó biết bơi."],["R","🍃","It lives on a <b>leaf</b>. It can't swim, but it can fly!","Bọ rùa sống trên lá. Nó không biết bơi, nhưng nó biết bay!"],["L","🦵","A frog has four long <b>legs</b>. It can jump!","Ếch có bốn cái chân dài. Nó nhảy được!"],["R","🤏","A ladybird is <b>little</b>. It has many little <b>legs</b>.","Bọ rùa thì bé xíu. Nó có nhiều chân nhỏ."],["L","👄","A frog has a big mouth. Ribbit!","Ếch có cái miệng to. Ộp ộp!"],["R","🌸","A ladybird likes flowers. It likes the garden too.","Bọ rùa thích hoa. Nó cũng thích khu vườn nữa."],["B","💚","They're both little, and they both love the <b>lake</b>!","Cả hai đều nhỏ bé, và cả hai đều yêu cái hồ!"]],"swap":["a <b>frog</b> → a fish / a duck","red and black → yellow and black"],"ask":["Can a frog swim?","What colour is a ladybird?","Can a ladybird fly?"]}]},
 {"id":"u13","n":"Unit 13","ic":"🍜","title":"In the school canteen","span":"Letter N n · Lunch Time!","when":"Tuần 25–26","units":["g13"],"fresh":["g13"],tasks:[
  {"type":"talk","title":"In the School Canteen","ic":"🍱","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Bày khay ăn bằng đồ chơi hoặc tranh. Cô giáo đóng vai cô ở nhà ăn, bé xếp hàng, chọn món và nói please / thank you; cuối bài bé xoa bụng nói \"I'm full!\".","lines":[["A","It's <b>lunch</b> time! Come to the <b>canteen</b>, children.","Đến giờ ăn trưa rồi! Các con vào nhà ăn nào."],["B","Yay! I'm so hungry, Miss Lan.","Hoan hô! Con đói lắm cô Lan ơi.","😋"],["A","Rice or <b>noodles</b> for you <b>today</b>?","Hôm nay con ăn cơm hay mì?"],["B","<b>Noodles</b>, please! <b>Nice</b> noodles now! Num-num!","Mì ạ! Mì ngon, cho con ngay nhé! Măm măm!","🍜"],["A","Ha ha! Here you are. Do you like <b>bananas</b>?","Ha ha! Của con đây. Con có thích chuối không?"],["B","Yes, I do. One <b>banana</b>, please. Thank you!","Có ạ. Cho con một quả chuối. Con cảm ơn cô!","🍌"],["A","And some <b>bread</b>? It's warm.","Thêm ít bánh mì nhé? Bánh còn ấm đấy."],["B","No, thank you. Can I have some <b>nuts</b>?","Dạ thôi ạ. Con xin ít hạt được không ạ?","🥜"],["A","Sure! Now sit down with Tom and eat, please.","Được chứ! Giờ con ngồi cùng bạn Tom và ăn nhé."],["B","Mmm! The noodles are very <b>nice</b>. Yummy!","Ừm! Mì ngon lắm ạ. Tuyệt quá!","😋"],["A","Some more noodles, {name}?","Con ăn thêm ít mì nữa không, {name}?"],["B","No, thank you, Miss Lan. I'm <b>full</b>!","Dạ thôi ạ, cô Lan. Con no rồi!","😊"]],"swap":["<b>Noodles</b> → rice / bread","One <b>banana</b> → one apple / one orange"],"ask":["What do you eat for lunch?","Do you like noodles?","Are you hungry or full now?"]},
  {"type":"story","title":"The Little Bird's Lunch","ic":"🐣","tip":"Kể chuyện với tranh tổ chim trên bảng. Hỏi lớp \"Is the bird hungry?\" rồi cho bé đóng vai Tom đặt \"hạt\" (giấy vo tròn) cho chim; cả lớp hót \"Tweet, tweet!\" ở tranh cuối.","lines":[["🍱","It's <b>lunch</b> time. Tom has <b>bread</b>, a <b>banana</b> and some <b>nuts</b>.","Đến giờ ăn trưa. Tom có bánh mì, một quả chuối và ít hạt."],["🐣","He looks up. There's a <b>nest</b> in the tree.","Cậu nhìn lên. Có một cái tổ chim trên cây."],["🐦","A little bird is in the <b>nest</b>. It's sad and hungry.","Một chú chim nhỏ ở trong tổ. Nó vừa buồn vừa đói."],["🤔","Tom says, \"Oh no! The bird has no <b>lunch</b> <b>today</b>.\"","Tom nói: \"Ôi không! Hôm nay chú chim không có gì ăn trưa.\""],["🥜","Tom puts some <b>nuts</b> and <b>bread</b> near the tree.","Tom đặt ít hạt và bánh mì cạnh gốc cây."],["😋","The bird eats. Peck, peck! \"<b>Nice</b> nuts! Yummy!\"","Chú chim ăn. Mổ, mổ! \"Hạt ngon quá! Tuyệt!\""],["🍌","Tom eats his <b>banana</b>. Now Tom and the bird are <b>full</b>.","Tom ăn quả chuối của mình. Giờ cả Tom và chú chim đều no."],["🎶","The bird sings a happy song for Tom. Tweet, tweet!","Chú chim hót một bài hát vui tặng Tom. Líu lo, líu lo!"]],"swap":["some <b>nuts</b> → some bread / some rice","a little <b>bird</b> → a little cat / a little dog"],"ask":["What does Tom have for lunch?","Is the bird happy or sad?","Do you share your food with friends?"]}]},
 {"id":"u14","n":"Unit 14","ic":"🧸","title":"In the toy shop","span":"Letter T t · Toys, Toys, Toys!","when":"Tuần 27–28","units":["g14"],"fresh":["g14"],tasks:[
  {"type":"talk","title":"In the Toy Shop","ic":"🤖","roles":{"A":["🐢","Mr Turtle"],"B":["🧒","{name}"]},"tip":"Bày đồ chơi thật lên kệ (gấu bông, rô-bốt, tàu hỏa, con quay). Giáo viên đội mũ rùa làm chủ cửa hàng; bé cầm đồ chơi bằng hai tay, đi như rô-bốt và nói \"Beep, beep!\".","lines":[["A","Hello! Come in to my <b>toy</b> <b>shop</b>!","Xin chào! Mời vào cửa hàng đồ chơi của tôi!"],["B","Hello, Mr <b>Turtle</b>! Wow, so many <b>toys</b>!","Chào bác Rùa! Ồ, nhiều đồ chơi quá!","🐢"],["A","What do you <b>want</b>? A <b>robot</b> or a <b>train</b>?","Cháu muốn gì nào? Rô-bốt hay tàu hỏa?"],["B","Hmm... Can I see the <b>robot</b>, please?","Ừm... Cho cháu xem con rô-bốt được không ạ?","🤖"],["A","Here you are. <b>Hold</b> it with two hands.","Của cháu đây. Cầm bằng hai tay nhé."],["B","Beep, beep! I'm a <b>robot</b>! Look, it can walk!","Bíp, bíp! Cháu là rô-bốt! Nhìn này, nó biết đi!","🚶"],["A","Ha ha! And look at this <b>top</b>. Round and round!","Ha ha! Còn đây là con quay. Quay tròn, quay tròn!"],["B","Wow! And two <b>tigers</b> on the top <b>shelf</b>!","Ồ! Còn có hai con hổ trên kệ cao nhất kìa!","🐯"],["A","Do you like this <b>teddy bear</b>?","Cháu có thích con gấu bông này không?"],["B","Yes, I do! It's soft. Can I have it, please?","Có ạ! Nó mềm quá. Cháu lấy nó được không ạ?","🧸"],["A","Sure! <b>Hold</b> it tight. Here you are!","Được chứ! Ôm chặt nhé. Của cháu đây!"],["B","Thank you, Mr <b>Turtle</b>! Bye-bye!","Cảm ơn bác Rùa! Tạm biệt bác!","👋"]],"swap":["a <b>robot</b> → a train / a top","this <b>teddy bear</b> → this tiger / this turtle"],"ask":["What toys do you have?","Do you like robots?","Can you walk like a robot?"]},
  {"type":"show","title":"My Favourite Toys","ic":"🪀","tip":"Bé mang 2–3 món đồ chơi thật đến lớp, cầm lên giới thiệu từng món. Đến câu con quay, mời cả lớp đứng lên xoay tròn; câu cuối nhấn mạnh việc chơi chung với bạn.","lines":[["🪀","Look! These are my <b>toys</b>.","Các bạn nhìn này! Đây là đồ chơi của tớ."],["🧸","This is my <b>teddy bear</b>. Her name is Tutu. She's soft.","Đây là gấu bông của tớ. Bạn ấy tên là Tutu. Bạn ấy mềm lắm."],["🤖","This is my <b>robot</b>. It's red and blue. Beep, beep!","Đây là rô-bốt của tớ. Nó màu đỏ và xanh dương. Bíp, bíp!"],["🚂","And this is my <b>train</b>. Choo-choo! It's long.","Còn đây là tàu hỏa của tớ. Tu tu! Nó dài lắm."],["🌀","My <b>top</b> goes round and round. Can you go round with me?","Con quay của tớ quay tròn, quay tròn. Các bạn quay cùng tớ nhé?"],["🐯","Two <b>tigers</b> and a <b>turtle</b> sit on my <b>shelf</b>. Tee-hee!","Hai chú hổ và một chú rùa ngồi trên kệ của tớ. Hi hi!"],["🎁","I <b>want</b> a big <b>train</b> for my birthday!","Sinh nhật tớ muốn có một chiếc tàu hỏa thật to!"],["🤝","I love my <b>toys</b>. I play with my friends too!","Tớ yêu đồ chơi của tớ. Tớ cũng chơi chung với các bạn nữa!"]],"swap":["my <b>robot</b> → my doll / my car","red and blue → green and yellow"],"ask":["What's your favourite toy?","What colour is your toy?","Do you play with your friends?"]}]},
 {"id":"u15","n":"Unit 15","ic":"⚽","title":"At the football match","span":"Letter F f · Fun Football Day!","when":"Tuần 29–30","units":["g15"],"fresh":["g15"],tasks:[
  {"type":"talk","title":"At the Football Match","ic":"🏟️","roles":{"A":["👦🏼","Tom"],"B":["🧒","{name}"]},"tip":"Cho bé cầm cờ cổ vũ, dán sticker lên má như vẽ mặt. Khi nói \"Go, go, go! Goal!\" cả lớp vỗ tay reo hò; bé chỉ tay vào tranh chú cáo linh vật.","lines":[["A","Hi, {name}! Let's <b>watch</b> the football <b>match</b>!","Chào {name}! Mình cùng xem trận bóng đá nhé!"],["B","Yay! I love <b>football</b>! Who's playing?","Hoan hô! Tớ thích bóng đá lắm! Ai đang đá thế?","⚽"],["A","My <b>father</b>! Look, he's number five.","Bố tớ đấy! Nhìn kìa, bố tớ mặc áo số năm."],["B","Wow! Your <b>father</b> is so <b>fast</b>!","Ồ! Bố cậu chạy nhanh quá!","⚡"],["A","Look! He can <b>kick</b> with his left <b>foot</b>.","Nhìn kìa! Bố tớ sút được bằng chân trái."],["B","Kick, kick! Go, go, go! Goal!","Sút, sút! Cố lên, cố lên! Vào rồi!","🥅"],["A","Ha ha! And look at the big orange <b>fox</b>. <b>Point</b> to him!","Ha ha! Nhìn chú cáo cam to kia kìa. Cậu chỉ vào chú ấy đi!"],["B","There! Funny <b>fox</b>, <b>fast</b> feet, fun <b>football</b>!","Kia kìa! Cáo vui nhộn, chân nhanh thoăn thoắt, bóng đá vui quá!","🦊"],["A","Let's paint our <b>faces</b>! Red or blue?","Mình vẽ mặt đi! Màu đỏ hay xanh dương?"],["B","Red, please! Look at my <b>face</b>. I'm a fox!","Màu đỏ nhé! Nhìn mặt tớ này. Tớ là cáo đây!","😀"],["A","Ha ha! Is it <b>fun</b>?","Ha ha! Có vui không?"],["B","Yes! It's so much <b>fun</b>. Thank you, Tom!","Vui lắm! Vui ơi là vui. Cảm ơn Tom nhé!","🎉"]],"swap":["Your <b>father</b> → Your mother / Your friend","his left <b>foot</b> → his right foot"],"ask":["Do you like football?","Can you kick a ball?","Who's fast in your family?"]},
  {"type":"me","title":"My Football Day","ic":"🥅","tip":"Bé kể theo thứ tự và làm động tác: vẽ mặt, ngồi xem, chỉ tay, đá bóng. Ở câu \"Go, go, go!\" mời cả lớp hô theo và vỗ tay.","lines":[["🏟️","I go to a football <b>match</b> with my <b>father</b>.","Tớ đi xem một trận bóng đá cùng bố."],["😀","First, we paint our <b>faces</b>. Red and white!","Đầu tiên, hai bố con vẽ mặt. Màu đỏ và trắng!"],["📺","Then, we sit and <b>watch</b>. The players are so <b>fast</b>!","Sau đó, hai bố con ngồi xem. Các cầu thủ chạy nhanh quá!"],["🦶","A player <b>kicks</b> the ball with his <b>foot</b>. Goal!","Một cầu thủ sút bóng bằng chân. Vào rồi!"],["👉","After that, I <b>point</b> at the big orange <b>fox</b>. He's funny!","Tiếp theo, tớ chỉ vào chú cáo cam to. Chú ấy buồn cười lắm!"],["📣","Funny fox, fast feet! Can you shout with me? Go, go, go!","Cáo vui nhộn, chân thoăn thoắt! Các bạn hô cùng tớ nhé? Cố lên, cố lên!"],["⚽","Finally, I play <b>football</b> with my father in the park. Kick!","Cuối cùng, tớ chơi bóng đá với bố ở công viên. Sút!"],["🎉","Football is so much <b>fun</b>!","Bóng đá vui ơi là vui!"]],"swap":["my <b>father</b> → my mother / my friend","Red and white → Blue and yellow"],"ask":["Who do you play football with?","Can you run fast?","Do you like watching football?"]}]},
 {"id":"u16","n":"Unit 16","ic":"🏠","title":"At home","span":"Letter W w · Home, Sweet Home!","when":"Tuần 31–32","units":["g16"],"fresh":["g16"],tasks:[
  {"type":"talk","title":"Good Night at Home","ic":"🌙","roles":{"A":["👩","Mom"],"B":["🧒","{name}"]},"tip":"Dùng khăn, bàn chải đánh răng, gối làm đạo cụ. Bé vừa nói vừa làm động tác rửa tay, tắm, đánh răng rồi nằm xuống \"ngủ\". Đây là bài tổng kết cả năm, nhớ khen bé thật nhiều.","lines":[["A","Welcome <b>home</b>, {name}! How are you?","Con về nhà rồi à, {name}! Con có khỏe không?"],["B","I'm fine, Mom. But I'm hungry!","Con khỏe ạ. Nhưng con đói rồi mẹ ơi!","😋"],["A","OK! First, let's <b>wash</b> your hands with <b>water</b>.","Được rồi! Trước hết, mình rửa tay bằng nước nhé."],["B","Wash, wash, warm <b>water</b>! Wiggle, wiggle!","Rửa, rửa, nước ấm! Ngọ nguậy, ngọ nguậy!","🧼"],["A","Good! Now let's eat with the family.","Giỏi lắm! Giờ cả nhà mình cùng ăn cơm nào."],["B","Yummy! Thank you, Mom. I'm full.","Ngon quá! Con cảm ơn mẹ. Con no rồi.","🍚"],["A","It's <b>seven</b> o'clock. Time to <b>take a bath</b>!","Bảy giờ rồi. Đến giờ đi tắm thôi!"],["B","OK! Splash, splash! I love bath time!","Vâng ạ! Tõm, tõm! Con thích giờ tắm lắm!","🛁"],["A","Good! What's next, {name}?","Giỏi lắm! Tiếp theo là gì nào, {name}?"],["B","I <b>brush my teeth</b>. Up and down, up and down!","Con đánh răng. Lên xuống, lên xuống!","🦷"],["A","Look out of the <b>window</b>. Can you see the moon?","Nhìn ra cửa sổ đi con. Con có thấy mặt trăng không?"],["B","Yes! Good night, moon. Good night, Mom. Time to <b>sleep</b>!","Có ạ! Chúc trăng ngủ ngon. Chúc mẹ ngủ ngon. Đến giờ ngủ rồi!","😴"]],"swap":["<b>seven</b> o'clock → eight / nine o'clock","<b>wash</b> your hands → wash your face"],"ask":["What do you do before you sleep?","Do you like bath time?","Who's in your family?"]},
  {"type":"compare","title":"Morning and Night","ic":"🌗","left":["☀️","Morning"],"right":["🌙","Night"],"tip":"Chia bảng làm hai nửa Mặt trời và Mặt trăng. Bé làm động tác mở/đóng cửa sổ, rửa mặt, đánh răng, ngủ; câu cuối cả lớp nắm tay nhau nói chung. Đây là bài kết thúc cả năm học.","lines":[["L","☀️","In the morning, I open the <b>window</b>. Hello, sun!","Buổi sáng, tớ mở cửa sổ. Chào mặt trời!"],["R","🌙","At night, I close the <b>window</b>. Good night, moon!","Buổi tối, tớ đóng cửa sổ. Chúc trăng ngủ ngon!"],["L","🔢","I wake up at <b>six</b>. I go to school at <b>seven</b>.","Tớ thức dậy lúc sáu giờ. Tớ đi học lúc bảy giờ."],["R","😴","I <b>sleep</b> at <b>nine</b>. Count with me: <b>eight</b>, nine, <b>ten</b>... Zzz!","Tớ đi ngủ lúc chín giờ. Đếm cùng tớ nào: tám, chín, mười... Khò khò!"],["L","🧼","In the morning, I <b>wash</b> my face with <b>water</b>.","Buổi sáng, tớ rửa mặt bằng nước."],["R","🛁","At night, I <b>take a bath</b>. Splash, splash!","Buổi tối, tớ đi tắm. Tõm, tõm!"],["L","🦷","In the morning, I <b>brush my teeth</b>.","Buổi sáng, tớ đánh răng."],["R","🦷","At night, I <b>brush my teeth</b> too!","Buổi tối, tớ cũng đánh răng nữa!"],["L","👋","In the morning, I say goodbye to my family.","Buổi sáng, tớ chào tạm biệt cả nhà."],["R","🤗","At night, I hug my family. But I don't hug the cat!","Buổi tối, tớ ôm cả nhà. Nhưng tớ không ôm con mèo đâu!"],["B","🏠","Morning and night, I love my <b>home</b> and my family!","Sáng hay tối, tớ đều yêu ngôi nhà và gia đình của tớ!"]],"swap":["I wake up at <b>six</b> → seven","I <b>sleep</b> at <b>nine</b> → eight / ten"],"ask":["What do you do in the morning?","What time do you sleep?","Who's in your family?"]}]},
 {"id":"math1","n":"Shapes","ic":"🔷","title":"Math 1: Basic Shapes","span":"2D shapes, cube and cuboid","when":"Toán iSMART Unit 1 · xen 10 phút mỗi tuần","units":["ma1"],"fresh":["ma1"],tasks:[
  {"type":"talk","title":"What Shape Is It?","ic":"🧊","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Giống bài Lesson 2 trên iSMART (\"What shape is it? It is a cube.\"). Bày đồ thật: xúc xắc, hộp sữa, hộp bút, quả bóng, lon nước, mũ sinh nhật. Cô giơ từng đồ, bé cầm lên, xoay xem các mặt rồi trả lời cả câu.","lines":[["A","Look at this dice. What <b>shape</b> is it?","Nhìn con xúc xắc này. Nó là hình gì?","🎲"],["B","It is a <b>cube</b>.","Nó là khối lập phương ạ.","s:cube:#1E88E5"],["A","Good! How many <b>faces</b> does a cube have?","Giỏi! Khối lập phương có mấy mặt?","📦"],["B","Six faces. They are all <b>squares</b>!","Sáu mặt ạ. Mặt nào cũng là hình vuông!","s:square:#1E88E5"],["A","Now look at the milk box. What shape is it?","Giờ nhìn hộp sữa. Nó là hình gì?","🥛"],["B","It is a <b>cuboid</b>. It is long.","Nó là khối hộp chữ nhật ạ. Nó dài.","s:cuboid:#FDD835"],["A","What shape is the ball?","Quả bóng là hình gì?","⚽"],["B","It is a <b>sphere</b>. It is <b>round</b>. It can roll!","Nó là khối cầu ạ. Nó tròn. Nó lăn được!","s:sphere:#E53935"],["A","And the can of juice?","Còn lon nước ép thì sao?","🥫"],["B","It is a <b>cylinder</b>.","Nó là khối trụ ạ.","s:cylinder:#8E24AA"],["A","Last one! What shape is the party hat?","Câu cuối! Mũ sinh nhật là hình gì?","🥳"],["B","It is a <b>cone</b>. Happy birthday!","Nó là khối nón ạ. Chúc mừng sinh nhật!","s:cone:#FB8C00"]],"swap":["the <b>dice</b> → the toy block / the ice cube","the <b>milk box</b> → the book / the school bag"],"ask":["What shape is a box of tissues?","Can a cube roll?","Find a cylinder in the kitchen!"]},
  {"type":"talk","title":"Flat Shapes Quiz","ic":"❓","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Cô chỉ đồ vật thật trong lớp (đồng hồ, cửa sổ, cửa ra vào, miếng bánh hình tam giác). Bé vẽ hình lên không trung và đếm cạnh bằng ngón tay.","lines":[["A","Look at the clock. What shape is it?","Nhìn đồng hồ. Nó là hình gì?","🕰️"],["B","It is a <b>circle</b>. It's <b>flat</b> and round.","Nó là hình tròn ạ. Nó phẳng và tròn.","s:circle:#E53935"],["A","What shape is the window?","Cửa sổ là hình gì?","🔲"],["B","It is a <b>square</b>. It has four <b>sides</b>.","Nó là hình vuông ạ. Nó có bốn cạnh.","s:square:#1E88E5"],["A","How many sides does a <b>triangle</b> have?","Hình tam giác có mấy cạnh?","🍕"],["B","Three sides. One, two, three!","Ba cạnh ạ. Một, hai, ba!","s:triangle:#43A047"],["A","What shape is the door?","Cái cửa là hình gì?","🚪"],["B","It is a <b>rectangle</b>. Two long sides and two short sides.","Nó là hình chữ nhật ạ. Hai cạnh dài và hai cạnh ngắn.","s:rectangle:#FB8C00"],["A","Is a circle flat? Is a sphere flat?","Hình tròn có phẳng không? Khối cầu có phẳng không?","🤔"],["B","A circle is flat. A sphere is not flat!","Hình tròn thì phẳng. Khối cầu thì không ạ!","s:sphere:#E53935"]],"swap":["the <b>clock</b> → the plate / the coin","the <b>door</b> → the board / the book"],"ask":["What shape is our board?","How many sides does a square have?","Can you draw a triangle in the air?"]},
  {"type":"show","title":"My Shape Hunt","ic":"🔍","tip":"Bài về nhà: bé đi tìm đồ trong nhà có đủ 6 hình khối, chụp ảnh hoặc mang đến lớp rồi giới thiệu như nhà thám hiểm. Câu cuối bé đố cả lớp.","lines":[["🔍","I'm a shape hunter! Look what I found at home.","Tớ là thợ săn hình khối! Nhìn xem tớ tìm được gì ở nhà nè."],["s:cube:#1E88E5","My toy block is a <b>cube</b>. It has six faces.","Khối đồ chơi của tớ là khối lập phương. Nó có sáu mặt."],["s:cuboid:#FDD835","My lunch box is a <b>cuboid</b>.","Hộp cơm của tớ là khối hộp chữ nhật."],["s:sphere:#E53935","My orange is a <b>sphere</b>. It can roll!","Quả cam của tớ là khối cầu. Nó lăn được!"],["s:cylinder:#8E24AA","My cup is a <b>cylinder</b>.","Cái cốc của tớ là khối trụ."],["s:cone:#FB8C00","My ice cream is a <b>cone</b>. Yummy!","Kem ốc quế của tớ là khối nón. Ngon quá!"],["s:circle:#E53935","And my plate is a <b>circle</b>. It's flat.","Còn cái đĩa của tớ là hình tròn. Nó phẳng."],["❓","Now you! What <b>shape</b> is your school bag?","Đến lượt các bạn! Cặp sách của các bạn là hình gì?"]],"swap":["My <b>toy block</b> is a cube → My dice","My <b>cup</b> is a cylinder → My pencil case / My drum"],"ask":["What shape is your bed?","What is a sphere at home?","Which shapes can roll?"]},
  {"type":"show","title":"My Shape Robot","ic":"🤖","tip":"Bé ghép một con robot bằng các hình cắt giấy (tròn, vuông, tam giác, chữ nhật) rồi giới thiệu như người dẫn chương trình. Cuối bài mời cả lớp tìm hình trong lớp.","lines":[["🤖","Look! This is my shape robot. His name is Bob.","Nhìn này! Đây là robot hình khối của tớ. Bạn ấy tên là Bob."],["s:circle:#E53935","His head is a big red <b>circle</b>.","Đầu của bạn ấy là một hình tròn to màu đỏ."],["s:triangle:#43A047","His nose is a <b>small</b> green <b>triangle</b>.","Mũi của bạn ấy là một hình tam giác nhỏ màu xanh lá."],["s:rectangle:#FB8C00","His body is a <b>big</b> orange <b>rectangle</b>.","Thân của bạn ấy là một hình chữ nhật to màu cam."],["s:square:#1E88E5","His hands are two blue <b>squares</b>. Wave, wave!","Hai bàn tay là hai hình vuông màu xanh. Vẫy, vẫy!"],["📏","His legs are <b>long</b>. He is very <b>tall</b>!","Chân bạn ấy dài. Bạn ấy cao lắm!"],["❓","Can you find a circle in our classroom? Point to it!","Các bạn tìm được hình tròn trong lớp mình không? Chỉ vào nhé!"]],"swap":["His head is a <b>circle</b> → square / triangle","His legs are <b>long</b> → short"],"ask":["What shape is the robot's nose?","Is the robot tall or short?","Can you make a robot with shapes?"]}]},
 {"id":"math2","n":"Positions","ic":"📍","title":"Math 2: Positions","span":"On, under, in front of, behind, between, left, right","when":"Toán iSMART Unit 2 · xen 10 phút mỗi tuần","units":["ma2"],"fresh":["ma2"],tasks:[
  {"type":"talk","title":"Where Is Teddy?","ic":"🧸","roles":{"A":["👩","Mom"],"B":["🧒","{name}"]},"tip":"Mẹ giấu gấu bông ở các chỗ khác nhau (trên ghế, dưới bàn, sau rèm, giữa hai cái gối). Bé đi tìm, chạm vào đúng chỗ rồi nói cả câu.","lines":[["A","Oh no! <b>Where</b> is Teddy?","Ôi không! Gấu bông đâu rồi?","🧸"],["B","Teddy is <b>on</b> the chair!","Gấu bông ở trên ghế ạ!","⬆️"],["A","Now where is he?","Giờ bạn ấy ở đâu?","❓"],["B","He is <b>under</b> the table.","Bạn ấy ở dưới bàn ạ.","⬇️"],["A","And now?","Còn bây giờ?","❓"],["B","He is <b>behind</b> the curtain. Peekaboo!","Bạn ấy ở sau rèm cửa. Ú òa!","⏪"],["A","Where is Teddy now?","Gấu bông giờ ở đâu?","❓"],["B","He is <b>between</b> the two pillows.","Bạn ấy ở giữa hai cái gối ạ.","⏸️"],["A","Is the ball <b>on the left</b> or <b>on the right</b> of Teddy?","Quả bóng ở bên trái hay bên phải gấu bông?","⚽"],["B","The ball is on the right.","Quả bóng ở bên phải ạ.","➡️"],["A","And where is the car?","Còn ô tô ở đâu?","🚗"],["B","The car is <b>in front of</b> Teddy. Beep, beep!","Ô tô ở phía trước gấu bông ạ. Bíp bíp!","⏩"]],"swap":["<b>Teddy</b> → the doll / the cat","<b>on</b> the chair → in the box / next to the bed"],"ask":["Where is your school bag?","Who sits next to you?","What is behind you?"]},
  {"type":"show","title":"My Bedroom Map","ic":"🛏️","tip":"Bé vẽ phòng ngủ của mình lên giấy A4 rồi chỉ vào từng đồ khi nói. Cô hỏi thêm \"Where is your lamp?\" để bé dùng giới từ khác.","lines":[["🛏️","This is my bedroom. Let me show you!","Đây là phòng ngủ của tớ. Tớ chỉ cho các bạn xem nhé!"],["🛏️","My bed is <b>on the left</b>.","Giường của tớ ở bên trái."],["🪑","My desk is <b>on the right</b>.","Bàn học của tớ ở bên phải."],["💡","My lamp is <b>on</b> the desk.","Đèn của tớ ở trên bàn học."],["🐱","My cat sleeps <b>under</b> the bed. Shh!","Con mèo của tớ ngủ dưới gầm giường. Suỵt!"],["🧸","My teddy is <b>between</b> the pillows.","Gấu bông của tớ ở giữa hai cái gối."],["🔲","The window is <b>behind</b> my desk.","Cửa sổ ở sau bàn học của tớ."],["📚","My books are <b>next to</b> my bed. I love my room!","Sách của tớ ở cạnh giường. Tớ yêu phòng của tớ!"]],"swap":["My <b>bed</b> is on the left → My toy box","My <b>cat</b> sleeps under the bed → My dog"],"ask":["Where is your bed?","What is on your desk?","What is next to your door?"]}]},
 {"id":"math3","n":"Numbers","ic":"🔢","title":"Math 3: Numbers and Comparison","span":"Numbers within ten · greater than, less than, equal to","when":"Toán iSMART Unit 3–4 · xen 10 phút mỗi tuần","units":["ma3"],"fresh":["ma3"],tasks:[
  {"type":"talk","title":"Number Quiz Time","ic":"❓","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Cô đóng vai ứng dụng hỏi đáp: đọc câu hỏi chậm, rõ như app, bé trả lời cả câu to rõ. Có thể bày đồ vật thật (táo, mèo, chó đồ chơi) để bé đếm.","lines":[["A","Quiz time, {name}! <b>How many</b> apples are there?","Đến giờ đố vui rồi, {name}! Có bao nhiêu quả táo?","🍎"],["B","Let me <b>count</b>: 1, 2, 3… 7! There are 7 apples.","Để con đếm: 1, 2, 3… 7! Có 7 quả táo ạ.","🍎"],["A","Good! Which number comes <b>after</b> 6?","Giỏi lắm! Số nào đứng liền sau số 6?","⏭️"],["B","7 comes after 6.","Số 7 đứng liền sau số 6 ạ.","n:7"],["A","Which number comes <b>before</b> 10?","Số nào đứng liền trước số 10?","⏮️"],["B","9 comes before 10.","Số 9 đứng liền trước số 10 ạ.","n:9"],["A","Look at 8 and 5. Is 8 <b>bigger</b> or <b>smaller</b>?","Nhìn số 8 và số 5 nhé. Số 8 lớn hơn hay nhỏ hơn?","🔼"],["B","8 is <b>bigger</b>. 5 is <b>smaller</b>.","Số 8 lớn hơn. Số 5 nhỏ hơn ạ.","n:8"],["A","Look at the cats and the dogs. Which group has <b>more</b>?","Nhìn các bạn mèo và các bạn chó. Nhóm nào nhiều hơn?","🐱"],["B","The cats have more. The dogs have <b>fewer</b>.","Nhóm mèo nhiều hơn. Nhóm chó ít hơn ạ.","🐶"],["A","Super! You get five stars! Clap, clap!","Tuyệt vời! Con được năm ngôi sao! Vỗ tay nào!","⭐"],["B","Yay! Numbers are fun!","Hoan hô! Học số vui quá!","🎉"]],"swap":["Which number comes after <b>6</b> → 3 / 8","How many <b>apples</b> → cats / balls / pencils"],"ask":["How many fingers do you have on one hand?","Which number comes after 4?","Is 2 bigger or smaller? Look at 2 and 9."]},
  {"type":"talk","title":"Greater, Less or Equal?","ic":"⚖️","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Giống bài Comparison trên iSMART. Cô viết hai số lên bảng, bé dùng thẻ dấu >, <, = (hoặc làm miệng cá sấu bằng tay: miệng há về phía số lớn).","lines":[["A","Look at seven and three. Which number is <b>greater</b>?","Nhìn số bảy và số ba. Số nào lớn hơn?","🔢"],["B","Seven is <b>greater than</b> three.","Bảy lớn hơn ba ạ.","n:>"],["A","Look at two and six.","Nhìn số hai và số sáu.","🔢"],["B","Two is <b>less than</b> six.","Hai bé hơn sáu ạ.","n:<"],["A","Look at five and five.","Nhìn số năm và số năm.","🔢"],["B","Five is <b>equal to</b> five. They are <b>the same</b>!","Năm bằng năm ạ. Chúng bằng nhau!","n:="],["A","Four cats and two dogs. Are there <b>more</b> cats or more dogs?","Bốn con mèo và hai con chó. Mèo nhiều hơn hay chó nhiều hơn?","🐱"],["B","There are more cats. There are <b>fewer</b> dogs.","Mèo nhiều hơn ạ. Chó ít hơn.","🐶"],["A","Which number comes <b>after</b> nine?","Số nào đứng liền sau số chín?","⏭️"],["B","<b>Ten</b> comes after nine!","Số mười đứng liền sau số chín ạ!","n:10"]],"swap":["seven and <b>three</b> → eight and one","Four <b>cats</b> → five apples / three ducks"],"ask":["Is eight greater than four?","Is zero less than one?","How many fingers do you have?"]},
  {"type":"show","title":"My Number Line","ic":"📏","tip":"Bé cầm một dải giấy có số 0–10 (trục số), vừa nói vừa chỉ. Khi nói \"plus/minus\", cả lớp vỗ tay hoặc nhảy đúng số lần.","lines":[["🔢","This is my number line. Can you <b>count</b> with me?","Đây là trục số của tớ. Các bạn đếm cùng tớ nhé?"],["n:0","It starts at <b>zero</b>. 0, 1, 2, 3… up to 10!","Nó bắt đầu từ số không. 0, 1, 2, 3… đến 10!"],["⏭️","Look! 4 comes <b>after</b> 3.","Nhìn nè! Số 4 đứng liền sau số 3."],["⏮️","And 9 comes <b>before</b> 10.","Còn số 9 đứng liền trước số 10."],["🔼","Look at 2 and 7. 7 is <b>bigger</b>. 2 is <b>smaller</b>.","Nhìn số 2 và số 7. Số 7 lớn hơn. Số 2 nhỏ hơn."],["➕","1 <b>plus</b> 1 is 2. Clap two times!","1 cộng 1 bằng 2. Vỗ tay hai cái nào!"],["➖","3 <b>minus</b> 1 is 2. Jump two times!","3 trừ 1 bằng 2. Nhảy hai cái nào!"],["❓","Now you! <b>How many</b> fingers can you show me?","Đến lượt các bạn! Các bạn giơ được mấy ngón tay?"]],"swap":["4 comes after <b>3</b> → 5 after 4 / 8 after 7","1 plus 1 is <b>2</b> → 2 plus 2 is 4"],"ask":["Which number comes before 5?","What is 2 plus 3?","Can you count from 10 to zero?"]}]},
 {"id":"math4","n":"+ and −","ic":"➕","title":"Math 4: Addition and Subtraction","span":"Plus, minus, altogether, take away, word problems","when":"Toán iSMART Unit 5 · xen 10 phút mỗi tuần","units":["ma4"],"fresh":["ma4"],tasks:[
  {"type":"talk","title":"Math Story Time","ic":"📝","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Bài toán có lời văn như trên iSMART. Dùng đồ thật (kẹo, táo, xe đồ chơi) để bé xếp, gộp lại hoặc lấy đi rồi mới trả lời.","lines":[["A","Let's read a <b>word problem</b>. Tom has three apples. Mom gives him two more. How many apples <b>altogether</b>?","Mình đọc một bài toán có lời văn. Tom có ba quả táo. Mẹ cho Tom hai quả nữa. Tom có tất cả bao nhiêu quả táo?","🍎"],["B","Three <b>plus</b> two <b>equals</b> five. Five apples!","Ba cộng hai bằng năm. Năm quả táo ạ!","n:5"],["A","Great! That's <b>addition</b>. Next one. There are six cookies. Bi eats two. How many are <b>left</b>?","Giỏi lắm! Đó là phép cộng. Bài tiếp. Có sáu cái bánh quy. Bi ăn hai cái. Còn lại mấy cái?","🍪"],["B","Six <b>minus</b> two equals four. Four cookies are left.","Sáu trừ hai bằng bốn. Còn lại bốn cái ạ.","n:4"],["A","Yes! That's <b>subtraction</b>. Last one: five birds. <b>Take away</b> one.","Đúng rồi! Đó là phép trừ. Bài cuối: năm con chim. Bay đi một con.","🐦"],["B","Five take away one is four. The <b>answer</b> is four!","Năm bớt một còn bốn. Đáp án là bốn ạ!","✅"]],"swap":["three <b>apples</b> → three cars / three ducks","six <b>cookies</b> → six sweets / six balloons"],"ask":["What is four plus one?","What is seven minus two?","You have two pens. Dad gives you one more. How many pens?"]},
  {"type":"story","title":"The Hungry Monkeys","ic":"🐒","tip":"Kể truyện và đếm chuối thật (hoặc vẽ) sau mỗi tranh. Cả lớp nói to phép tính ở tranh 3 và 5.","lines":[["🐒","Three little monkeys live in the jungle.","Ba chú khỉ nhỏ sống trong rừng."],["🍌","They find four bananas. Then they find three more bananas.","Chúng tìm được bốn quả chuối. Rồi tìm thêm ba quả nữa."],["n:7","Four <b>plus</b> three is seven. Seven bananas <b>altogether</b>!","Bốn cộng ba là bảy. Tất cả bảy quả chuối!"],["😋","Yum, yum! The monkeys eat five bananas.","Ngon quá! Các chú khỉ ăn năm quả chuối."],["n:2","Seven <b>minus</b> five is two. Two bananas are <b>left</b>.","Bảy trừ năm là hai. Còn lại hai quả chuối."],["🐘","An elephant comes. \"Can I have one, please?\"","Một chú voi đi tới. \"Cho tớ một quả được không?\""],["🤝","\"Yes! Here you are!\" Now one banana is left. Sharing is fun!","\"Được chứ! Của bạn đây!\" Giờ còn lại một quả. Chia sẻ thật vui!"]],"swap":["four <b>bananas</b> → mangoes / nuts","An <b>elephant</b> comes → A parrot / A tiger"],"ask":["How many bananas did they find altogether?","How many bananas were left?","Do you like to share?"]}]},
 {"id":"math5","n":"To 100","ic":"💯","title":"Math 5: Numbers to One Hundred","span":"Eleven to twenty · count by tens · tens and ones","when":"Toán iSMART Unit 6–7 · xen 10 phút mỗi tuần","units":["ma5"],"fresh":["ma5"],tasks:[
  {"type":"talk","title":"Count by Tens","ic":"🔟","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Dùng que tính bó thành chục (10 que một bó) hoặc khối lập phương ghép thanh 10. Bé đếm bó (tens) và que lẻ (ones) rồi nói số.","lines":[["A","Let's count by tens! Ten, twenty...","Mình đếm theo chục nào! Mười, hai mươi...","🔟"],["B","<b>Thirty</b>, <b>forty</b>, <b>fifty</b>, <b>sixty</b>!","Ba mươi, bốn mươi, năm mươi, sáu mươi!","n:60"],["A","Keep going!","Đếm tiếp đi!","➡️"],["B","<b>Seventy</b>, <b>eighty</b>, <b>ninety</b>, <b>one hundred</b>!","Bảy mươi, tám mươi, chín mươi, một trăm!","n:100"],["A","Wow! Look at these sticks. How many <b>tens</b>?","Ôi! Nhìn những bó que này. Có mấy chục?","📦"],["B","Four tens.","Bốn chục ạ.","n:40"],["A","And how many <b>ones</b>?","Còn mấy que lẻ (đơn vị)?","🧩"],["B","Two ones. Four tens and two ones make forty-two!","Hai đơn vị. Bốn chục và hai đơn vị là bốn mươi hai ạ!","n:42"],["A","Super! What comes after <b>nineteen</b>?","Tuyệt! Số nào đứng sau mười chín?","⏭️"],["B","<b>Twenty</b> comes after nineteen.","Hai mươi đứng sau mười chín ạ.","n:20"]],"swap":["Four tens and <b>two</b> ones → three tens and five ones","after <b>nineteen</b> → after fourteen / after twelve"],"ask":["Can you count from eleven to twenty?","Is twenty a multiple of ten?","How many tens are in fifty?"]},
  {"type":"show","title":"Our Class in Numbers","ic":"🏫","tip":"Bé làm \"phóng viên\" đếm đồ trong lớp rồi báo cáo. Thay số bằng số thật của lớp bé.","lines":[["🏫","Hello! Let's count things in our class.","Xin chào! Mình cùng đếm đồ trong lớp nhé."],["🧒","There are <b>thirty</b> children in my class.","Lớp tớ có ba mươi bạn."],["🪑","There are <b>fifteen</b> desks.","Có mười lăm cái bàn."],["🔲","There are <b>twelve</b> windows. So bright!","Có mười hai cái cửa sổ. Sáng quá!"],["✏️","I have <b>eleven</b> crayons in my box.","Hộp của tớ có mười một bút sáp."],["📚","Our class has <b>one hundred</b> books! Ten tens!","Lớp mình có một trăm quyển sách! Mười chục đấy!"],["❓","Now you! How many children are in your class?","Đến lượt các bạn! Lớp các bạn có bao nhiêu bạn?"]],"swap":["<b>thirty</b> children → your class number","<b>fifteen</b> desks → chairs / bags"],"ask":["How many windows are in our class?","Can you count to fifty?","What is ten plus ten?"]}]},
 {"id":"sci1","n":"Plants","ic":"🌱","title":"Science 1: Exploring Plants","span":"Parts of a plant, flowers, fruits","when":"Khoa học iSMART Unit 1 · xen 10 phút mỗi tuần","units":["sc1"],"fresh":["sc1"],tasks:[
  {"type":"talk","title":"Plant Quiz Time","ic":"❓","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Mang một cây nhỏ có rễ (hoặc tranh) vào lớp, cô chỉ từng bộ phận rồi hỏi như app. Bé chỉ đúng chỗ và trả lời cả câu.","lines":[["A","Science quiz! Which part of the <b>plant</b> is under the ground?","Đố vui khoa học! Bộ phận nào của cây ở dưới đất?","🌱"],["B","The <b>root</b> is under the ground.","Rễ cây ở dưới đất ạ.","🟫"],["A","What does a plant need to <b>grow</b>?","Cây cần gì để lớn lên?","🌱"],["B","A plant needs <b>water</b> and <b>sun</b>.","Cây cần nước và ánh nắng ạ.","💧"],["A","What colour is the <b>leaf</b>?","Chiếc lá màu gì?","🍃"],["B","The leaf is green.","Chiếc lá màu xanh lá ạ.","c:#43A047"],["A","Which part holds the plant up?","Bộ phận nào giữ cho cây đứng thẳng?","🌿"],["B","The <b>stem</b>! It's long and green.","Thân cây ạ! Nó dài và màu xanh.","🌿"],["A","Look at the apple. Where are the <b>seeds</b>?","Nhìn quả táo nhé. Hạt ở đâu?","🍎"],["B","The seeds are in the apple. The apple is a <b>fruit</b>.","Hạt ở trong quả táo. Quả táo là một loại quả.","🌰"],["A","What's this? It's pink and it smells nice.","Đây là gì? Nó màu hồng và thơm lắm.","🌸"],["B","It's a <b>flower</b>! Mmm, it smells nice.","Là bông hoa ạ! Ừm, thơm quá.","🌸"]],"swap":["The <b>root</b> is under the ground → The seed","It's a <b>flower</b> → leaf / fruit"],"ask":["What does a plant need?","Which part of the plant is green?","Can you name a fruit?"]},
  {"type":"show","title":"This Is My Plant","ic":"🌱","tip":"Bé cầm cây thật hoặc tranh vẽ cây có đủ rễ, thân, lá, hoa, quả và chỉ vào từng phần như người dẫn chương trình khoa học. Cuối bài cả lớp đứng lên \"lớn lên\" cùng bé.","lines":[["🌱","This is my <b>plant</b>. Let me show you the parts.","Đây là cái cây của tớ. Tớ chỉ cho các bạn các bộ phận nhé."],["🟫","This is the <b>root</b>. It's under the ground. It drinks water.","Đây là rễ cây. Nó ở dưới đất. Nó uống nước."],["🌿","This is the <b>stem</b>. It's long and green.","Đây là thân cây. Nó dài và màu xanh."],["🍃","This is a <b>leaf</b>. It's green, and it likes the sun.","Đây là chiếc lá. Nó màu xanh và nó thích ánh nắng."],["🌸","This is the <b>flower</b>. It's pink and pretty.","Đây là bông hoa. Nó màu hồng và rất đẹp."],["🍎","After the flower, we get a <b>fruit</b>. Look, an apple!","Sau bông hoa là quả. Nhìn này, một quả táo!"],["🌰","There are <b>seeds</b> in the fruit. New plants <b>grow</b> from seeds!","Trong quả có hạt. Cây mới mọc lên từ hạt!"],["🙌","Can you be a plant? Stretch up and grow with me!","Các bạn làm cái cây được không? Vươn người lên và lớn lên cùng tớ nào!"]],"swap":["This is the <b>root</b> → stem / leaf / flower","Look, an <b>apple</b> → orange / mango"],"ask":["Where is the root?","What colour is your flower?","What do plants grow from?"]},
  {"type":"talk","title":"At the Flower and Fruit Market","ic":"🌻","roles":{"A":["👵","Grandma"],"B":["🧒","{name}"]},"tip":"Bày hoa và quả thật (hoặc tranh) như sạp chợ: hoa cúc, hoa sen, hoa hồng, hoa hướng dương; táo, chuối, xoài, dưa hấu. Bé chọn và tả màu sắc.","lines":[["A","Good morning! Do you want some flowers?","Chào cháu! Cháu muốn mua hoa không?","💐"],["B","Yes, please! What's this flower?","Dạ có ạ! Đây là hoa gì ạ?","🌼"],["A","It's a <b>daisy</b>. It's white and yellow.","Đây là hoa cúc. Nó màu trắng và vàng.","🌼"],["B","I like the big yellow flower. Is it a <b>sunflower</b>?","Cháu thích bông hoa to màu vàng. Có phải hoa hướng dương không ạ?","🌻"],["A","Yes! It looks at the Sun. Do you like <b>roses</b>?","Đúng rồi! Nó nhìn về phía Mặt Trời. Cháu có thích hoa hồng không?","🌹"],["B","Yes! Roses are red, and they smell nice.","Có ạ! Hoa hồng màu đỏ và thơm lắm.","🌹"],["A","And this is a <b>lotus</b>. It grows in the pond.","Còn đây là hoa sen. Nó mọc trong ao.","💮"],["B","It's beautiful! Can I have some <b>fruit</b> too?","Đẹp quá ạ! Cháu mua thêm ít quả được không ạ?","🧺"],["A","Sure! <b>Mangoes</b>, <b>bananas</b> or a <b>watermelon</b>?","Được chứ! Xoài, chuối hay dưa hấu?","🍉"],["B","A watermelon, please. It's red inside! Thank you!","Cho cháu một quả dưa hấu ạ. Bên trong màu đỏ! Cháu cảm ơn bà!","🍉"]],"swap":["a <b>watermelon</b> → two mangoes / a banana","<b>roses</b> → daisies / lotuses"],"ask":["What colour is a sunflower?","Where does a lotus grow?","What is your favourite fruit?"]}]},
 {"id":"sci2","n":"Animals","ic":"🐾","title":"Science 2: Animal World","span":"Wild animals, farm animals, animal products, body parts","when":"Khoa học iSMART Unit 2 · xen 10 phút mỗi tuần","units":["sc2"],"fresh":["sc2"],tasks:[
  {"type":"talk","title":"Animal Quiz Time","ic":"❓","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Cô giơ tranh con vật và hỏi như app khoa học. Bé trả lời cả câu và kêu tiếng con vật (Moo! Cluck!) để thêm vui.","lines":[["A","Science quiz! Which animal gives us <b>milk</b>?","Đố vui khoa học! Con vật nào cho chúng ta sữa?","🥛"],["B","The <b>cow</b> gives us milk. Moo!","Con bò cho chúng ta sữa. Ùm bò!","🐄"],["A","Which animal gives us <b>eggs</b>?","Con vật nào cho chúng ta trứng?","🥚"],["B","The <b>chicken</b> gives us eggs. Cluck, cluck!","Con gà cho chúng ta trứng. Cục ta cục tác!","🐔"],["A","What does a <b>sheep</b> give us?","Con cừu cho chúng ta cái gì?","🐑"],["B","A sheep gives us <b>wool</b>. It's soft and warm.","Con cừu cho chúng ta lông cừu. Nó mềm và ấm.","🧶"],["A","Is a <b>tiger</b> a farm animal or a wild animal?","Con hổ là vật nuôi hay động vật hoang dã?","🐯"],["B","A tiger is a <b>wild animal</b>. It lives in the <b>forest</b>.","Con hổ là động vật hoang dã. Nó sống trong rừng.","🌲"],["A","Is a cow a farm animal or a wild animal?","Con bò là vật nuôi hay động vật hoang dã?","🐄"],["B","A cow is a <b>farm animal</b>. It lives on the farm.","Con bò là vật nuôi. Nó sống ở trang trại.","🏡"],["A","Last one! What has a long nose and big ears?","Câu cuối nè! Con gì có mũi dài và tai to?","👂"],["B","An <b>elephant</b>! It's a wild animal too.","Con voi! Nó cũng là động vật hoang dã.","🐘"]],"swap":["The <b>cow</b> gives us milk → The goat","A <b>tiger</b> is a wild animal → A lion / A monkey"],"ask":["Which animal gives us wool?","Is a duck a farm animal or a wild animal?","Where does a tiger live?"]},
  {"type":"compare","title":"A Lion and a Cow","ic":"🦁","left":["🦁","A lion"],"right":["🐄","A cow"],"tip":"Hai bé đứng hai bên, một bé làm sư tử (gầm \"Roar!\"), một bé làm bò (\"Moo!\"). Câu chung ở giữa cả hai cùng nói và chỉ vào bộ phận cơ thể.","lines":[["L","🌲","A lion is a <b>wild animal</b>.","Sư tử là động vật hoang dã."],["R","🚜","A cow is a <b>farm animal</b>.","Bò là động vật nông trại."],["L","🌾","It lives on the grassland.","Nó sống trên đồng cỏ."],["R","🏡","It lives on the farm.","Nó sống ở nông trại."],["L","🥩","It eats <b>meat</b>. Roar!","Nó ăn thịt. Gừ!"],["R","🌿","It eats grass. Moo!","Nó ăn cỏ. Ùm bò!"],["R","🥛","It gives us <b>milk</b>.","Nó cho chúng ta sữa."],["B","🦵","Both have a <b>head</b>, a <b>body</b>, a <b>tail</b> and four <b>legs</b>!","Cả hai đều có đầu, thân, đuôi và bốn chân!"]],"swap":["A <b>lion</b> → A tiger / A hippo","A <b>cow</b> → A sheep / A pig"],"ask":["Is a hippo a wild animal or a farm animal?","What does a sheep give us?","How many legs does a duck have?"]},
  {"type":"show","title":"All About Chickens","ic":"🐔","tip":"Bé làm \"nhà khoa học nhí\" giới thiệu con gà bằng tranh hoặc gà đồ chơi. Cả lớp làm theo động tác: mổ thóc, vỗ cánh.","lines":[["🐔","This is a <b>chicken</b>. It's a <b>farm animal</b>.","Đây là con gà. Nó là vật nuôi."],["🐤","It has a small <b>beak</b>. Peck, peck, peck!","Nó có cái mỏ nhỏ. Mổ, mổ, mổ!"],["🕊️","It has two <b>wings</b>. Flap your wings with me!","Nó có hai cái cánh. Vỗ cánh cùng tớ nào!"],["🐒","It has a <b>tail</b> with pretty feathers.","Nó có cái đuôi với bộ lông đẹp."],["🥚","A chicken gives us <b>eggs</b>. Yummy!","Gà cho chúng ta trứng. Ngon quá!"],["🐥","Baby chickens come out of eggs. They're so little!","Gà con chui ra từ quả trứng. Chúng bé xíu à!"],["❓","Is a chicken a <b>wild animal</b>? No! It's a farm animal!","Gà có phải động vật hoang dã không? Không! Nó là vật nuôi!"]],"swap":["This is a <b>chicken</b> → duck","It has two <b>wings</b> → legs / eyes"],"ask":["What does a chicken give us?","How many wings does a chicken have?","Is a chicken a farm animal?"]}]},
 {"id":"sci3","n":"Animal homes","ic":"🏞️","title":"Science 3: Where Do Animals Live?","span":"Forest, jungle, grassland, desert, ocean, river, pond, ice","when":"Mở rộng sau Khoa học iSMART Unit 2 · xen 10 phút mỗi tuần","units":["sc3"],"fresh":["sc3"],tasks:[
  {"type":"talk","title":"Where Do They Live?","ic":"🗺️","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Dán 8 tranh nơi sống quanh lớp (rừng, rừng nhiệt đới, đồng cỏ, sa mạc, đại dương, sông, ao, băng tuyết). Cô giơ tranh con vật, bé chạy đến đúng chỗ rồi trả lời cả câu.","lines":[["A","Where does a monkey <b>live</b>?","Con khỉ sống ở đâu?","🐒"],["B","A monkey lives in the <b>jungle</b>. It swings in the trees!","Khỉ sống trong rừng nhiệt đới ạ. Nó đu trên cây!","🌴"],["A","Where does a <b>camel</b> live?","Lạc đà sống ở đâu?","🐫"],["B","A camel lives in the <b>desert</b>. It's hot and <b>dry</b>.","Lạc đà sống ở sa mạc ạ. Ở đó nóng và khô.","🏜️"],["A","Where does a <b>whale</b> live?","Cá voi sống ở đâu?","🐋"],["B","A whale lives in the <b>ocean</b>. Splash!","Cá voi sống ở đại dương ạ. Ùm!","🌊"],["A","Where does a <b>penguin</b> live?","Chim cánh cụt sống ở đâu?","🐧"],["B","A penguin lives on the <b>ice</b>. It's very <b>cold</b>. Brrr!","Chim cánh cụt sống trên băng ạ. Lạnh lắm. Brrr!","🧊"],["A","Where does a <b>zebra</b> live?","Ngựa vằn sống ở đâu?","🦓"],["B","A zebra lives on the <b>grassland</b>.","Ngựa vằn sống trên đồng cỏ ạ.","🌾"],["A","Where does a frog live?","Con ếch sống ở đâu?","🐸"],["B","A frog lives in the <b>pond</b>. Ribbit!","Ếch sống ở ao ạ. Ộp ộp!","🐸"],["A","And a <b>crocodile</b>?","Còn cá sấu?","🐊"],["B","A crocodile lives in the <b>river</b>. Snap, snap!","Cá sấu sống ở sông ạ. Táp táp!","🏞️"]],"swap":["a <b>monkey</b> → a parrot / a snake","a <b>whale</b> → a shark / an octopus","a <b>penguin</b> → a seal"],"ask":["Where does a bear live?","Where does a bat sleep?","Where do worms live?"]},
  {"type":"show","title":"My Animal Homes Book","ic":"📖","tip":"Bé làm một cuốn sách nhỏ 8 trang, mỗi trang vẽ một nơi sống và dán con vật. Bé lật từng trang và giới thiệu.","lines":[["📖","This is my animal homes book. Let's read it together!","Đây là cuốn sách về nhà của các con vật. Mình cùng đọc nhé!"],["🌳","Page one: the <b>forest</b>. Bears and deer live here.","Trang một: khu rừng. Gấu và hươu sống ở đây."],["🐦","Look up! A bird lives in a <b>nest</b> in the tree.","Nhìn lên kìa! Chim sống trong tổ trên cây."],["🕳️","Look down! Worms and rabbits live <b>under the ground</b>.","Nhìn xuống nè! Giun và thỏ sống dưới lòng đất."],["🦇","Page two: a <b>cave</b>. Bats sleep here in the day.","Trang hai: hang động. Dơi ngủ ở đây vào ban ngày."],["⛰️","Page three: the <b>mountain</b>. Goats can climb up high!","Trang ba: ngọn núi. Dê có thể leo lên cao!"],["🌊","Page four: the <b>ocean</b>. Whales and fish swim here.","Trang bốn: đại dương. Cá voi và cá bơi ở đây."],["🏠","Every animal has a <b>home</b>. My home is my house!","Mỗi con vật đều có nhà. Nhà của tớ là ngôi nhà của tớ!"]],"swap":["the <b>forest</b> → the jungle / the farm","Bears and <b>deer</b> → foxes / owls"],"ask":["Where does a bird live?","Where do bats sleep?","Where is your home?"]},
