  {"type":"talk","title":"Good Night at Home","ic":"🌙","roles":{"A":["👩","Mom"],"B":["🧒","{name}"]},"tip":"Dùng khăn, bàn chải đánh răng, gối làm đạo cụ. Bé vừa nói vừa làm động tác rửa tay, tắm, đánh răng rồi nằm xuống \"ngủ\". Đây là bài tổng kết cả năm, nhớ khen bé thật nhiều.","lines":[["A","Welcome <b>home</b>, {name}! How are you?","Con về nhà rồi à, {name}! Con có khỏe không?"],["B","I'm fine, Mom. But I'm hungry!","Con khỏe ạ. Nhưng con đói rồi mẹ ơi!","😋"],["A","OK! First, let's <b>wash</b> your hands with <b>water</b>.","Được rồi! Trước hết, mình rửa tay bằng nước nhé."],["B","Wash, wash, warm <b>water</b>! Wiggle, wiggle!","Rửa, rửa, nước ấm! Ngọ nguậy, ngọ nguậy!","🧼"],["A","Good! Now let's eat with the family.","Giỏi lắm! Giờ cả nhà mình cùng ăn cơm nào."],["B","Yummy! Thank you, Mom. I'm full.","Ngon quá! Con cảm ơn mẹ. Con no rồi.","🍚"],["A","It's <b>seven</b> o'clock. Time to <b>take a bath</b>!","Bảy giờ rồi. Đến giờ đi tắm thôi!"],["B","OK! Splash, splash! I love bath time!","Vâng ạ! Tõm, tõm! Con thích giờ tắm lắm!","🛁"],["A","Good! What's next, {name}?","Giỏi lắm! Tiếp theo là gì nào, {name}?"],["B","I <b>brush my teeth</b>. Up and down, up and down!","Con đánh răng. Lên xuống, lên xuống!","🦷"],["A","Look out of the <b>window</b>. Can you see the moon?","Nhìn ra cửa sổ đi con. Con có thấy mặt trăng không?"],["B","Yes! Good night, moon. Good night, Mom. Time to <b>sleep</b>!","Có ạ! Chúc trăng ngủ ngon. Chúc mẹ ngủ ngon. Đến giờ ngủ rồi!","😴"]],"swap":["<b>seven</b> o'clock → eight / nine o'clock","<b>wash</b> your hands → wash your face"],"ask":["What do you do before you sleep?","Do you like bath time?","Who's in your family?"]},
  {"type":"compare","title":"Morning and Night","ic":"🌗","left":["☀️","Morning"],"right":["🌙","Night"],"tip":"Chia bảng làm hai nửa Mặt trời và Mặt trăng. Bé làm động tác mở/đóng cửa sổ, rửa mặt, đánh răng, ngủ; câu cuối cả lớp nắm tay nhau nói chung. Đây là bài kết thúc cả năm học.","lines":[["L","☀️","In the morning, I open the <b>window</b>. Hello, sun!","Buổi sáng, tớ mở cửa sổ. Chào mặt trời!"],["R","🌙","At night, I close the <b>window</b>. Good night, moon!","Buổi tối, tớ đóng cửa sổ. Chúc trăng ngủ ngon!"],["L","🔢","I wake up at <b>six</b>. I go to school at <b>seven</b>.","Tớ thức dậy lúc sáu giờ. Tớ đi học lúc bảy giờ."],["R","😴","I <b>sleep</b> at <b>nine</b>. Count with me: <b>eight</b>, nine, <b>ten</b>... Zzz!","Tớ đi ngủ lúc chín giờ. Đếm cùng tớ nào: tám, chín, mười... Khò khò!"],["L","🧼","In the morning, I <b>wash</b> my face with <b>water</b>.","Buổi sáng, tớ rửa mặt bằng nước."],["R","🛁","At night, I <b>take a bath</b>. Splash, splash!","Buổi tối, tớ đi tắm. Tõm, tõm!"],["L","🦷","In the morning, I <b>brush my teeth</b>.","Buổi sáng, tớ đánh răng."],["R","🦷","At night, I <b>brush my teeth</b> too!","Buổi tối, tớ cũng đánh răng nữa!"],["L","👋","In the morning, I say goodbye to my family.","Buổi sáng, tớ chào tạm biệt cả nhà."],["R","🤗","At night, I hug my family. But I don't hug the cat!","Buổi tối, tớ ôm cả nhà. Nhưng tớ không ôm con mèo đâu!"],["B","🏠","Morning and night, I love my <b>home</b> and my family!","Sáng hay tối, tớ đều yêu ngôi nhà và gia đình của tớ!"]],"swap":["I wake up at <b>six</b> → seven","I <b>sleep</b> at <b>nine</b> → eight / ten"],"ask":["What do you do in the morning?","What time do you sleep?","Who's in your family?"]}]},
 {"id":"math1","n":"Shapes","ic":"🔷","title":"Math 1: Basic Shapes","span":"2D shapes, cube and cuboid","when":"Toán iSMART Unit 1 · xen 10 phút mỗi tuần","units":["ma1"],"fresh":["ma1"],tasks:[
  {"type":"talk","title":"What Shape Is It?","ic":"🧊","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Giống bài Lesson 2 trên iSMART (\"What shape is it? It is a cube.\"). Bày đồ thật: xúc xắc, hộp sữa, hộp bút, quả bóng, lon nước, mũ sinh nhật. Cô giơ từng đồ, bé cầm lên, xoay xem các mặt rồi trả lời cả câu.","lines":[["A","Look at this dice. What <b>shape</b> is it?","Nhìn con xúc xắc này. Nó là hình gì?","🎲"],["B","It is a <b>cube</b>.","Nó là khối lập phương ạ.","s:cube:#1E88E5"],["A","Good! How many <b>faces</b> does a cube have?","Giỏi! Khối lập phương có mấy mặt?","📦"],["B","Six faces. They are all <b>squares</b>!","Sáu mặt ạ. Mặt nào cũng là hình vuông!","s:square:#1E88E5"],["A","Now look at the milk box. What shape is it?","Giờ nhìn hộp sữa. Nó là hình gì?","🥛"],["B","It is a <b>cuboid</b>. It is long.","Nó là khối hộp chữ nhật ạ. Nó dài.","s:cuboid:#FDD835"],["A","What shape is the ball?","Quả bóng là hình gì?","⚽"],["B","It is a <b>sphere</b>. It is <b>round</b>. It can roll!","Nó là khối cầu ạ. Nó tròn. Nó lăn được!","s:sphere:#E53935"],["A","And the can of juice?","Còn lon nước ép thì sao?","🥫"],["B","It is a <b>cylinder</b>.","Nó là khối trụ ạ.","s:cylinder:#8E24AA"],["A","Last one! What shape is the party hat?","Câu cuối! Mũ sinh nhật là hình gì?","🥳"],["B","It is a <b>cone</b>. Happy birthday!","Nó là khối nón ạ. Chúc mừng sinh nhật!","s:cone:#FB8C00"]],"swap":["the <b>dice</b> → the toy block / the ice cube","the <b>milk box</b> → the book / the school bag"],"ask":["What shape is a box of tissues?","Can a cube roll?","Find a cylinder in the kitchen!"]},
  {"type":"talk","title":"Flat Shapes Quiz","ic":"❓","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Cô chỉ đồ vật thật trong lớp (đồng hồ, cửa sổ, cửa ra vào, miếng bánh hình tam giác). Bé vẽ hình lên không trung và đếm cạnh bằng ngón tay.","lines":[["A","Look at the clock. What shape is it?","Nhìn đồng hồ. Nó là hình gì?","🕰️"],["B","It is a <b>circle</b>. It's <b>flat</b> and round.","Nó là hình tròn ạ. Nó phẳng và tròn.","s:circle:#E53935"],["A","What shape is the window?","Cửa sổ là hình gì?","🔲"],["B","It is a <b>square</b>. It has four <b>sides</b>.","Nó là hình vuông ạ. Nó có bốn cạnh.","s:square:#1E88E5"],["A","How many sides does a <b>triangle</b> have?","Hình tam giác có mấy cạnh?","🍕"],["B","Three sides. One, two, three!","Ba cạnh ạ. Một, hai, ba!","s:triangle:#43A047"],["A","What shape is the door?","Cái cửa là hình gì?","🚪"],["B","It is a <b>rectangle</b>. Two long sides and two short sides.","Nó là hình chữ nhật ạ. Hai cạnh dài và hai cạnh ngắn.","s:rectangle:#FB8C00"],["A","Is a circle flat? Is a sphere flat?","Hình tròn có phẳng không? Khối cầu có phẳng không?","🤔"],["B","A circle is flat. A sphere is not flat!","Hình tròn thì phẳng. Khối cầu thì không ạ!","s:sphere:#E53935"]],"swap":["the <b>clock</b> → the plate / the coin","the <b>door</b> → the board / the book"],"ask":["What shape is our board?","How many sides does a square have?","Can you draw a triangle in the air?"]},
  {"type":"show","title":"My Shape Hunt","ic":"🔍","tip":"Bài về nhà: bé đi tìm đồ trong nhà có đủ 6 hình khối, chụp ảnh hoặc mang đến lớp rồi giới thiệu như nhà thám hiểm. Câu cuối bé đố cả lớp.","lines":[["🔍","I'm a shape hunter! Look what I found at home.","Tớ là thợ săn hình khối! Nhìn xem tớ tìm được gì ở nhà nè."],["s:cube:#1E88E5","My toy block is a <b>cube</b>. It has six faces.","Khối đồ chơi của tớ là khối lập phương. Nó có sáu mặt."],["s:cuboid:#FDD835","My lunch box is a <b>cuboid</b>.","Hộp cơm của tớ là khối hộp chữ nhật."],["s:sphere:#E53935","My orange is a <b>sphere</b>. It can roll!","Quả cam của tớ là khối cầu. Nó lăn được!"],["s:cylinder:#8E24AA","My cup is a <b>cylinder</b>.","Cái cốc của tớ là khối trụ."],["s:cone:#FB8C00","My ice cream is a <b>cone</b>. Yummy!","Kem ốc quế của tớ là khối nón. Ngon quá!"],["s:circle:#E53935","And my plate is a <b>circle</b>. It's flat.","Còn cái đĩa của tớ là hình tròn. Nó phẳng."],["❓","Now you! What <b>shape</b> is your school bag?","Đến lượt các bạn! Cặp sách của các bạn là hình gì?"]],"swap":["My <b>toy block</b> is a cube → My dice","My <b>cup</b> is a cylinder → My pencil case / My drum"],"ask":["What shape is your bed?","What is a sphere at home?","Which shapes can roll?"]},
  {"type":"show","title":"My Shape Robot","ic":"🤖","tip":"Bé ghép một con robot bằng các hình cắt giấy (tròn, vuông, tam giác, chữ nhật) rồi giới thiệu như người dẫn chương trình. Cuối bài mời cả lớp tìm hình trong lớp.","lines":[["🤖","Look! This is my shape robot. His name is Bob.","Nhìn này! Đây là robot hình khối của tớ. Bạn ấy tên là Bob."],["s:circle:#E53935","His head is a big red <b>circle</b>.","Đầu của bạn ấy là một hình tròn to màu đỏ."],["s:triangle:#43A047","His nose is a <b>small</b> green <b>triangle</b>.","Mũi của bạn ấy là một hình tam giác nhỏ màu xanh lá."],["s:rectangle:#FB8C00","His body is a <b>big</b> orange <b>rectangle</b>.","Thân của bạn ấy là một hình chữ nhật to màu cam."],["s:square:#1E88E5","His hands are two blue <b>squares</b>. Wave, wave!","Hai bàn tay là hai hình vuông màu xanh. Vẫy, vẫy!"],["📏","His legs are <b>long</b>. He is very <b>tall</b>!","Chân bạn ấy dài. Bạn ấy cao lắm!"],["❓","Can you find a circle in our classroom? Point to it!","Các bạn tìm được hình tròn trong lớp mình không? Chỉ vào nhé!"]],"swap":["His head is a <b>circle</b> → square / triangle","His legs are <b>long</b> → short"],"ask":["What shape is the robot's nose?","Is the robot tall or short?","Can you make a robot with shapes?"]}]},
 {"id":"math2","n":"Positions","ic":"📍","title":"Math 2: Positions","span":"On, under, in front of, behind, between, left, right","when":"Toán iSMART Unit 2 · xen 10 phút mỗi tuần","units":["ma2"],"fresh":["ma2"],tasks:[
  {"type":"talk","title":"Where Is Teddy?","ic":"🧸","roles":{"A":["👩","Mom"],"B":["🧒","{name}"]},"tip":"Mẹ giấu gấu bông ở các chỗ khác nhau (trên ghế, dưới bàn, sau rèm, giữa hai cái gối). Bé đi tìm, chạm vào đúng chỗ rồi nói cả câu.","lines":[["A","Oh no! <b>Where</b> is Teddy?","Ôi không! Gấu bông đâu rồi?","🧸"],["B","Teddy is <b>on</b> the chair!","Gấu bông ở trên ghế ạ!","⬆️"],["A","Now where is he?","Giờ bạn ấy ở đâu?","❓"],["B","He is <b>under</b> the table.","Bạn ấy ở dưới bàn ạ.","⬇️"],["A","And now?","Còn bây giờ?","❓"],["B","He is <b>behind</b> the curtain. Peekaboo!","Bạn ấy ở sau rèm cửa. Ú òa!","⏪"],["A","Where is Teddy now?","Gấu bông giờ ở đâu?","❓"],["B","He is <b>between</b> the two pillows.","Bạn ấy ở giữa hai cái gối ạ.","⏸️"],["A","Is the ball <b>on the left</b> or <b>on the right</b> of Teddy?","Quả bóng ở bên trái hay bên phải gấu bông?","⚽"],["B","The ball is on the right.","Quả bóng ở bên phải ạ.","➡️"],["A","And where is the car?","Còn ô tô ở đâu?","🚗"],["B","The car is <b>in front of</b> Teddy. Beep, beep!","Ô tô ở phía trước gấu bông ạ. Bíp bíp!","⏩"]],"swap":["<b>Teddy</b> → the doll / the cat","<b>on</b> the chair → in the box / next to the bed"],"ask":["Where is your school bag?","Who sits next to you?","What is behind you?"]},
  {"type":"show","title":"My Bedroom Map","ic":"🛏️","tip":"Bé vẽ phòng ngủ của mình lên giấy A4 rồi chỉ vào từng đồ khi nói. Cô hỏi thêm \"Where is your lamp?\" để bé dùng giới từ khác.","lines":[["🛏️","This is my bedroom. Let me show you!","Đây là phòng ngủ của tớ. Tớ chỉ cho các bạn xem nhé!"],["🛏️","My bed is <b>on the left</b>.","Giường của tớ ở bên trái."],["🪑","My desk is <b>on the right</b>.","Bàn học của tớ ở bên phải."],["💡","My lamp is <b>on</b> the desk.","Đèn của tớ ở trên bàn học."],["🐱","My cat sleeps <b>under</b> the bed. Shh!","Con mèo của tớ ngủ dưới gầm giường. Suỵt!"],["🧸","My teddy is <b>between</b> the pillows.","Gấu bông của tớ ở giữa hai cái gối."],["🔲","The window is <b>behind</b> my desk.","Cửa sổ ở sau bàn học của tớ."],["📚","My books are <b>next to</b> my bed. I love my room!","Sách của tớ ở cạnh giường. Tớ yêu phòng của tớ!"]],"swap":["My <b>bed</b> is on the left → My toy box","My <b>cat</b> sleeps under the bed → My dog"],"ask":["Where is your bed?","What is on your desk?","What is next to your door?"]}]},
 {"id":"math3","n":"Numbers","ic":"🔢","title":"Math 3: Numbers and Comparison","span":"Numbers within ten · greater than, less than, equal to","when":"Toán iSMART Unit 3–4 · xen 10 phút mỗi tuần","units":["ma3"],"fresh":["ma3"],tasks:[
  {"type":"talk","title":"Number Quiz Time","ic":"❓","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Cô đóng vai ứng dụng hỏi đáp: đọc câu hỏi chậm, rõ như app, bé trả lời cả câu to rõ. Có thể bày đồ vật thật (táo, mèo, chó đồ chơi) để bé đếm.","lines":[["A","Quiz time, {name}! <b>How many</b> apples are there?","Đến giờ đố vui rồi, {name}! Có bao nhiêu quả táo?","🍎"],["B","Let me <b>count</b>: 1, 2, 3… 7! There are 7 apples.","Để con đếm: 1, 2, 3… 7! Có 7 quả táo ạ.","🍎"],["A","Good! Which number comes <b>after</b> 6?","Giỏi lắm! Số nào đứng liền sau số 6?","⏭️"],["B","7 comes after 6.","Số 7 đứng liền sau số 6 ạ.","n:7"],["A","Which number comes <b>before</b> 10?","Số nào đứng liền trước số 10?","⏮️"],["B","9 comes before 10.","Số 9 đứng liền trước số 10 ạ.","n:9"],["A","Look at 8 and 5. Is 8 <b>bigger</b> or <b>smaller</b>?","Nhìn số 8 và số 5 nhé. Số 8 lớn hơn hay nhỏ hơn?","🔼"],["B","8 is <b>bigger</b>. 5 is <b>smaller</b>.","Số 8 lớn hơn. Số 5 nhỏ hơn ạ.","n:8"],["A","Look at the cats and the dogs. Which group has <b>more</b>?","Nhìn các bạn mèo và các bạn chó. Nhóm nào nhiều hơn?","🐱"],["B","The cats have more. The dogs have <b>fewer</b>.","Nhóm mèo nhiều hơn. Nhóm chó ít hơn ạ.","🐶"],["A","Super! You get five stars! Clap, clap!","Tuyệt vời! Con được năm ngôi sao! Vỗ tay nào!","⭐"],["B","Yay! Numbers are fun!","Hoan hô! Học số vui quá!","🎉"]],"swap":["Which number comes after <b>6</b> → 3 / 8","How many <b>apples</b> → cats / balls / pencils"],"ask":["How many fingers do you have on one hand?","Which number comes after 4?","Is 2 bigger or smaller? Look at 2 and 9."]},
  {"type":"talk","title":"Greater, Less or Equal?","ic":"⚖️","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Giống bài Comparison trên iSMART. Cô viết hai số lên bảng, bé dùng thẻ dấu >, <, = (hoặc làm miệng cá sấu bằng tay: miệng há về phía số lớn).","lines":[["A","Look at seven and three. Which number is <b>greater</b>?","Nhìn số bảy và số ba. Số nào lớn hơn?","🔢"],["B","Seven is <b>greater than</b> three.","Bảy lớn hơn ba ạ.","n:>"],["A","Look at two and six.","Nhìn số hai và số sáu.","🔢"],["B","Two is <b>less than</b> six.","Hai bé hơn sáu ạ.","n:<"],["A","Look at five and five.","Nhìn số năm và số năm.","🔢"],["B","Five is <b>equal to</b> five. They are <b>the same</b>!","Năm bằng năm ạ. Chúng bằng nhau!","n:="],["A","Four cats and two dogs. Are there <b>more</b> cats or more dogs?","Bốn con mèo và hai con chó. Mèo nhiều hơn hay chó nhiều hơn?","🐱"],["B","There are more cats. There are <b>fewer</b> dogs.","Mèo nhiều hơn ạ. Chó ít hơn.","🐶"],["A","Which number comes <b>after</b> nine?","Số nào đứng liền sau số chín?","⏭️"],["B","<b>Ten</b> comes after nine!","Số mười đứng liền sau số chín ạ!","n:10"]],"swap":["seven and <b>three</b> → eight and one","Four <b>cats</b> → five apples / three ducks"],"ask":["Is eight greater than four?","Is zero less than one?","How many fingers do you have?"]},
  {"type":"show","title":"My Number Line","ic":"📏","tip":"Bé cầm một dải giấy có số 0–10 (trục số), vừa nói vừa chỉ. Khi nói \"plus/minus\", cả lớp vỗ tay hoặc nhảy đúng số lần.","lines":[["🔢","This is my number line. Can you <b>count</b> with me?","Đây là trục số của tớ. Các bạn đếm cùng tớ nhé?"],["n:0","It starts at <b>zero</b>. 0, 1, 2, 3… up to 10!","Nó bắt đầu từ số không. 0, 1, 2, 3… đến 10!"],["⏭️","Look! 4 comes <b>after</b> 3.","Nhìn nè! Số 4 đứng liền sau số 3."],["⏮️","And 9 comes <b>before</b> 10.","Còn số 9 đứng liền trước số 10."],["🔼","Look at 2 and 7. 7 is <b>bigger</b>. 2 is <b>smaller</b>.","Nhìn số 2 và số 7. Số 7 lớn hơn. Số 2 nhỏ hơn."],["➕","1 <b>plus</b> 1 is 2. Clap two times!","1 cộng 1 bằng 2. Vỗ tay hai cái nào!"],["➖","3 <b>minus</b> 1 is 2. Jump two times!","3 trừ 1 bằng 2. Nhảy hai cái nào!"],["❓","Now you! <b>How many</b> fingers can you show me?","Đến lượt các bạn! Các bạn giơ được mấy ngón tay?"]],"swap":["4 comes after <b>3</b> → 5 after 4 / 8 after 7","1 plus 1 is <b>2</b> → 2 plus 2 is 4"],"ask":["Which number comes before 5?","What is 2 plus 3?","Can you count from 10 to zero?"]}]},
 {"id":"math4","n":"+ and −","ic":"➕","title":"Math 4: Addition and Subtraction","span":"Plus, minus, altogether, take away, word problems","when":"Toán iSMART Unit 5 · xen 10 phút mỗi tuần","units":["ma4"],"fresh":["ma4"],tasks:[
  {"type":"talk","title":"Math Story Time","ic":"📝","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Bài toán có lời văn như trên iSMART. Dùng đồ thật (kẹo, táo, xe đồ chơi) để bé xếp, gộp lại hoặc lấy đi rồi mới trả lời.","lines":[["A","Let's read a <b>word problem</b>. Tom has three apples. Mom gives him two more. How many apples <b>altogether</b>?","Mình đọc một bài toán có lời văn. Tom có ba quả táo. Mẹ cho Tom hai quả nữa. Tom có tất cả bao nhiêu quả táo?","🍎"],["B","Three <b>plus</b> two <b>equals</b> five. Five apples!","Ba cộng hai bằng năm. Năm quả táo ạ!","n:5"],["A","Great! That's <b>addition</b>. Next one. There are six cookies. Bi eats two. How many are <b>left</b>?","Giỏi lắm! Đó là phép cộng. Bài tiếp. Có sáu cái bánh quy. Bi ăn hai cái. Còn lại mấy cái?","🍪"],["B","Six <b>minus</b> two equals four. Four cookies are left.","Sáu trừ hai bằng bốn. Còn lại bốn cái ạ.","n:4"],["A","Yes! That's <b>subtraction</b>. Last one: five birds. <b>Take away</b> one.","Đúng rồi! Đó là phép trừ. Bài cuối: năm con chim. Bay đi một con.","🐦"],["B","Five take away one is four. The <b>answer</b> is four!","Năm bớt một còn bốn. Đáp án là bốn ạ!","✅"]],"swap":["three <b>apples</b> → three cars / three ducks","six <b>cookies</b> → six sweets / six balloons"],"ask":["What is four plus one?","What is seven minus two?","You have two pens. Dad gives you one more. How many pens?"]},
  {"type":"story","title":"The Hungry Monkeys","ic":"🐒","tip":"Kể truyện và đếm chuối thật (hoặc vẽ) sau mỗi tranh. Cả lớp nói to phép tính ở tranh 3 và 5.","lines":[["🐒","Three little monkeys live in the jungle.","Ba chú khỉ nhỏ sống trong rừng."],["🍌","They find four bananas. Then they find three more bananas.","Chúng tìm được bốn quả chuối. Rồi tìm thêm ba quả nữa."],["n:7","Four <b>plus</b> three is seven. Seven bananas <b>altogether</b>!","Bốn cộng ba là bảy. Tất cả bảy quả chuối!"],["😋","Yum, yum! The monkeys eat five bananas.","Ngon quá! Các chú khỉ ăn năm quả chuối."],["n:2","Seven <b>minus</b> five is two. Two bananas are <b>left</b>.","Bảy trừ năm là hai. Còn lại hai quả chuối."],["🐘","An elephant comes. \"Can I have one, please?\"","Một chú voi đi tới. \"Cho tớ một quả được không?\""],["🤝","\"Yes! Here you are!\" Now one banana is left. Sharing is fun!","\"Được chứ! Của bạn đây!\" Giờ còn lại một quả. Chia sẻ thật vui!"]],"swap":["four <b>bananas</b> → mangoes / nuts","An <b>elephant</b> comes → A parrot / A tiger"],"ask":["How many bananas did they find altogether?","How many bananas were left?","Do you like to share?"]}]},
 {"id":"math5","n":"To 100","ic":"💯","title":"Math 5: Numbers to One Hundred","span":"Eleven to twenty · count by tens · tens and ones","when":"Toán iSMART Unit 6–7 · xen 10 phút mỗi tuần","units":["ma5"],"fresh":["ma5"],tasks:[
  {"type":"talk","title":"Count by Tens","ic":"🔟","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Dùng que tính bó thành chục (10 que một bó) hoặc khối lập phương ghép thanh 10. Bé đếm bó (tens) và que lẻ (ones) rồi nói số.","lines":[["A","Let's count by tens! Ten, twenty...","Mình đếm theo chục nào! Mười, hai mươi...","🔟"],["B","<b>Thirty</b>, <b>forty</b>, <b>fifty</b>, <b>sixty</b>!","Ba mươi, bốn mươi, năm mươi, sáu mươi!","n:60"],["A","Keep going!","Đếm tiếp đi!","➡️"],["B","<b>Seventy</b>, <b>eighty</b>, <b>ninety</b>, <b>one hundred</b>!","Bảy mươi, tám mươi, chín mươi, một trăm!","n:100"],["A","Wow! Look at these sticks. How many <b>tens</b>?","Ôi! Nhìn những bó que này. Có mấy chục?","📦"],["B","Four tens.","Bốn chục ạ.","n:40"],["A","And how many <b>ones</b>?","Còn mấy que lẻ (đơn vị)?","🧩"],["B","Two ones. Four tens and two ones make forty-two!","Hai đơn vị. Bốn chục và hai đơn vị là bốn mươi hai ạ!","n:42"],["A","Super! What comes after <b>nineteen</b>?","Tuyệt! Số nào đứng sau mười chín?","⏭️"],["B","<b>Twenty</b> comes after nineteen.","Hai mươi đứng sau mười chín ạ.","n:20"]],"swap":["Four tens and <b>two</b> ones → three tens and five ones","after <b>nineteen</b> → after fourteen / after twelve"],"ask":["Can you count from eleven to twenty?","Is twenty a multiple of ten?","How many tens are in fifty?"]},
  {"type":"show","title":"Our Class in Numbers","ic":"🏫","tip":"Bé làm \"phóng viên\" đếm đồ trong lớp rồi báo cáo. Thay số bằng số thật của lớp bé.","lines":[["🏫","Hello! Let's count things in our class.","Xin chào! Mình cùng đếm đồ trong lớp nhé."],["🧒","There are <b>thirty</b> children in my class.","Lớp tớ có ba mươi bạn."],["🪑","There are <b>fifteen</b> desks.","Có mười lăm cái bàn."],["🔲","There are <b>twelve</b> windows. So bright!","Có mười hai cái cửa sổ. Sáng quá!"],["✏️","I have <b>eleven</b> crayons in my box.","Hộp của tớ có mười một bút sáp."],["📚","Our class has <b>one hundred</b> books! Ten tens!","Lớp mình có một trăm quyển sách! Mười chục đấy!"],["❓","Now you! How many children are in your class?","Đến lượt các bạn! Lớp các bạn có bao nhiêu bạn?"]],"swap":["<b>thirty</b> children → your class number","<b>fifteen</b> desks → chairs / bags"],"ask":["How many windows are in our class?","Can you count to fifty?","What is ten plus ten?"]}]},
 {"id":"sci1","n":"Plants","ic":"🌱","title":"Science 1: Exploring Plants","span":"Parts of a plant, flowers, fruits","when":"Khoa học iSMART Unit 1 · xen 10 phút mỗi tuần","units":["sc1"],"fresh":["sc1"],tasks:[
  {"type":"talk","title":"Plant Quiz Time","ic":"❓","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Mang một cây nhỏ có rễ (hoặc tranh) vào lớp, cô chỉ từng bộ phận rồi hỏi như app. Bé chỉ đúng chỗ và trả lời cả câu.","lines":[["A","Science quiz! Which part of the <b>plant</b> is under the ground?","Đố vui khoa học! Bộ phận nào của cây ở dưới đất?","🌱"],["B","The <b>root</b> is under the ground.","Rễ cây ở dưới đất ạ.","🟫"],["A","What does a plant need to <b>grow</b>?","Cây cần gì để lớn lên?","🌱"],["B","A plant needs <b>water</b> and <b>sun</b>.","Cây cần nước và ánh nắng ạ.","💧"],["A","What colour is the <b>leaf</b>?","Chiếc lá màu gì?","🍃"],["B","The leaf is green.","Chiếc lá màu xanh lá ạ.","c:#43A047"],["A","Which part holds the plant up?","Bộ phận nào giữ cho cây đứng thẳng?","🌿"],["B","The <b>stem</b>! It's long and green.","Thân cây ạ! Nó dài và màu xanh.","🌿"],["A","Look at the apple. Where are the <b>seeds</b>?","Nhìn quả táo nhé. Hạt ở đâu?","🍎"],["B","The seeds are in the apple. The apple is a <b>fruit</b>.","Hạt ở trong quả táo. Quả táo là một loại quả.","🌰"],["A","What's this? It's pink and it smells nice.","Đây là gì? Nó màu hồng và thơm lắm.","🌸"],["B","It's a <b>flower</b>! Mmm, it smells nice.","Là bông hoa ạ! Ừm, thơm quá.","🌸"]],"swap":["The <b>root</b> is under the ground → The seed","It's a <b>flower</b> → leaf / fruit"],"ask":["What does a plant need?","Which part of the plant is green?","Can you name a fruit?"]},
  {"type":"show","title":"This Is My Plant","ic":"🌱","tip":"Bé cầm cây thật hoặc tranh vẽ cây có đủ rễ, thân, lá, hoa, quả và chỉ vào từng phần như người dẫn chương trình khoa học. Cuối bài cả lớp đứng lên \"lớn lên\" cùng bé.","lines":[["🌱","This is my <b>plant</b>. Let me show you the parts.","Đây là cái cây của tớ. Tớ chỉ cho các bạn các bộ phận nhé."],["🟫","This is the <b>root</b>. It's under the ground. It drinks water.","Đây là rễ cây. Nó ở dưới đất. Nó uống nước."],["🌿","This is the <b>stem</b>. It's long and green.","Đây là thân cây. Nó dài và màu xanh."],["🍃","This is a <b>leaf</b>. It's green, and it likes the sun.","Đây là chiếc lá. Nó màu xanh và nó thích ánh nắng."],["🌸","This is the <b>flower</b>. It's pink and pretty.","Đây là bông hoa. Nó màu hồng và rất đẹp."],["🍎","After the flower, we get a <b>fruit</b>. Look, an apple!","Sau bông hoa là quả. Nhìn này, một quả táo!"],["🌰","There are <b>seeds</b> in the fruit. New plants <b>grow</b> from seeds!","Trong quả có hạt. Cây mới mọc lên từ hạt!"],["🙌","Can you be a plant? Stretch up and grow with me!","Các bạn làm cái cây được không? Vươn người lên và lớn lên cùng tớ nào!"]],"swap":["This is the <b>root</b> → stem / leaf / flower","Look, an <b>apple</b> → orange / mango"],"ask":["Where is the root?","What colour is your flower?","What do plants grow from?"]},
  {"type":"talk","title":"At the Flower and Fruit Market","ic":"🌻","roles":{"A":["👵","Grandma"],"B":["🧒","{name}"]},"tip":"Bày hoa và quả thật (hoặc tranh) như sạp chợ: hoa cúc, hoa sen, hoa hồng, hoa hướng dương; táo, chuối, xoài, dưa hấu. Bé chọn và tả màu sắc.","lines":[["A","Good morning! Do you want some flowers?","Chào cháu! Cháu muốn mua hoa không?","💐"],["B","Yes, please! What's this flower?","Dạ có ạ! Đây là hoa gì ạ?","🌼"],["A","It's a <b>daisy</b>. It's white and yellow.","Đây là hoa cúc. Nó màu trắng và vàng.","🌼"],["B","I like the big yellow flower. Is it a <b>sunflower</b>?","Cháu thích bông hoa to màu vàng. Có phải hoa hướng dương không ạ?","🌻"],["A","Yes! It looks at the Sun. Do you like <b>roses</b>?","Đúng rồi! Nó nhìn về phía Mặt Trời. Cháu có thích hoa hồng không?","🌹"],["B","Yes! Roses are red, and they smell nice.","Có ạ! Hoa hồng màu đỏ và thơm lắm.","🌹"],["A","And this is a <b>lotus</b>. It grows in the pond.","Còn đây là hoa sen. Nó mọc trong ao.","💮"],["B","It's beautiful! Can I have some <b>fruit</b> too?","Đẹp quá ạ! Cháu mua thêm ít quả được không ạ?","🧺"],["A","Sure! <b>Mangoes</b>, <b>bananas</b> or a <b>watermelon</b>?","Được chứ! Xoài, chuối hay dưa hấu?","🍉"],["B","A watermelon, please. It's red inside! Thank you!","Cho cháu một quả dưa hấu ạ. Bên trong màu đỏ! Cháu cảm ơn bà!","🍉"]],"swap":["a <b>watermelon</b> → two mangoes / a banana","<b>roses</b> → daisies / lotuses"],"ask":["What colour is a sunflower?","Where does a lotus grow?","What is your favourite fruit?"]}]},
 {"id":"sci2","n":"Animals","ic":"🐾","title":"Science 2: Animal World","span":"Wild animals, farm animals, animal products, body parts","when":"Khoa học iSMART Unit 2 · xen 10 phút mỗi tuần","units":["sc2"],"fresh":["sc2"],tasks:[
  {"type":"talk","title":"Animal Quiz Time","ic":"❓","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Cô giơ tranh con vật và hỏi như app khoa học. Bé trả lời cả câu và kêu tiếng con vật (Moo! Cluck!) để thêm vui.","lines":[["A","Science quiz! Which animal gives us <b>milk</b>?","Đố vui khoa học! Con vật nào cho chúng ta sữa?","🥛"],["B","The <b>cow</b> gives us milk. Moo!","Con bò cho chúng ta sữa. Ùm bò!","🐄"],["A","Which animal gives us <b>eggs</b>?","Con vật nào cho chúng ta trứng?","🥚"],["B","The <b>chicken</b> gives us eggs. Cluck, cluck!","Con gà cho chúng ta trứng. Cục ta cục tác!","🐔"],["A","What does a <b>sheep</b> give us?","Con cừu cho chúng ta cái gì?","🐑"],["B","A sheep gives us <b>wool</b>. It's soft and warm.","Con cừu cho chúng ta lông cừu. Nó mềm và ấm.","🧶"],["A","Is a <b>tiger</b> a farm animal or a wild animal?","Con hổ là vật nuôi hay động vật hoang dã?","🐯"],["B","A tiger is a <b>wild animal</b>. It lives in the <b>forest</b>.","Con hổ là động vật hoang dã. Nó sống trong rừng.","🌲"],["A","Is a cow a farm animal or a wild animal?","Con bò là vật nuôi hay động vật hoang dã?","🐄"],["B","A cow is a <b>farm animal</b>. It lives on the farm.","Con bò là vật nuôi. Nó sống ở trang trại.","🏡"],["A","Last one! What has a long nose and big ears?","Câu cuối nè! Con gì có mũi dài và tai to?","👂"],["B","An <b>elephant</b>! It's a wild animal too.","Con voi! Nó cũng là động vật hoang dã.","🐘"]],"swap":["The <b>cow</b> gives us milk → The goat","A <b>tiger</b> is a wild animal → A lion / A monkey"],"ask":["Which animal gives us wool?","Is a duck a farm animal or a wild animal?","Where does a tiger live?"]},
  {"type":"compare","title":"A Lion and a Cow","ic":"🦁","left":["🦁","A lion"],"right":["🐄","A cow"],"tip":"Hai bé đứng hai bên, một bé làm sư tử (gầm \"Roar!\"), một bé làm bò (\"Moo!\"). Câu chung ở giữa cả hai cùng nói và chỉ vào bộ phận cơ thể.","lines":[["L","🌲","A lion is a <b>wild animal</b>.","Sư tử là động vật hoang dã."],["R","🚜","A cow is a <b>farm animal</b>.","Bò là động vật nông trại."],["L","🌾","It lives on the grassland.","Nó sống trên đồng cỏ."],["R","🏡","It lives on the farm.","Nó sống ở nông trại."],["L","🥩","It eats <b>meat</b>. Roar!","Nó ăn thịt. Gừ!"],["R","🌿","It eats grass. Moo!","Nó ăn cỏ. Ùm bò!"],["R","🥛","It gives us <b>milk</b>.","Nó cho chúng ta sữa."],["B","🦵","Both have a <b>head</b>, a <b>body</b>, a <b>tail</b> and four <b>legs</b>!","Cả hai đều có đầu, thân, đuôi và bốn chân!"]],"swap":["A <b>lion</b> → A tiger / A hippo","A <b>cow</b> → A sheep / A pig"],"ask":["Is a hippo a wild animal or a farm animal?","What does a sheep give us?","How many legs does a duck have?"]},
  {"type":"show","title":"All About Chickens","ic":"🐔","tip":"Bé làm \"nhà khoa học nhí\" giới thiệu con gà bằng tranh hoặc gà đồ chơi. Cả lớp làm theo động tác: mổ thóc, vỗ cánh.","lines":[["🐔","This is a <b>chicken</b>. It's a <b>farm animal</b>.","Đây là con gà. Nó là vật nuôi."],["🐤","It has a small <b>beak</b>. Peck, peck, peck!","Nó có cái mỏ nhỏ. Mổ, mổ, mổ!"],["🕊️","It has two <b>wings</b>. Flap your wings with me!","Nó có hai cái cánh. Vỗ cánh cùng tớ nào!"],["🐒","It has a <b>tail</b> with pretty feathers.","Nó có cái đuôi với bộ lông đẹp."],["🥚","A chicken gives us <b>eggs</b>. Yummy!","Gà cho chúng ta trứng. Ngon quá!"],["🐥","Baby chickens come out of eggs. They're so little!","Gà con chui ra từ quả trứng. Chúng bé xíu à!"],["❓","Is a chicken a <b>wild animal</b>? No! It's a farm animal!","Gà có phải động vật hoang dã không? Không! Nó là vật nuôi!"]],"swap":["This is a <b>chicken</b> → duck","It has two <b>wings</b> → legs / eyes"],"ask":["What does a chicken give us?","How many wings does a chicken have?","Is a chicken a farm animal?"]}]},
 {"id":"sci3","n":"Animal homes","ic":"🏞️","title":"Science 3: Where Do Animals Live?","span":"Forest, jungle, grassland, desert, ocean, river, pond, ice","when":"Mở rộng sau Khoa học iSMART Unit 2 · xen 10 phút mỗi tuần","units":["sc3"],"fresh":["sc3"],tasks:[
  {"type":"talk","title":"Where Do They Live?","ic":"🗺️","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Dán 8 tranh nơi sống quanh lớp (rừng, rừng nhiệt đới, đồng cỏ, sa mạc, đại dương, sông, ao, băng tuyết). Cô giơ tranh con vật, bé chạy đến đúng chỗ rồi trả lời cả câu.","lines":[["A","Where does a monkey <b>live</b>?","Con khỉ sống ở đâu?","🐒"],["B","A monkey lives in the <b>jungle</b>. It swings in the trees!","Khỉ sống trong rừng nhiệt đới ạ. Nó đu trên cây!","🌴"],["A","Where does a <b>camel</b> live?","Lạc đà sống ở đâu?","🐫"],["B","A camel lives in the <b>desert</b>. It's hot and <b>dry</b>.","Lạc đà sống ở sa mạc ạ. Ở đó nóng và khô.","🏜️"],["A","Where does a <b>whale</b> live?","Cá voi sống ở đâu?","🐋"],["B","A whale lives in the <b>ocean</b>. Splash!","Cá voi sống ở đại dương ạ. Ùm!","🌊"],["A","Where does a <b>penguin</b> live?","Chim cánh cụt sống ở đâu?","🐧"],["B","A penguin lives on the <b>ice</b>. It's very <b>cold</b>. Brrr!","Chim cánh cụt sống trên băng ạ. Lạnh lắm. Brrr!","🧊"],["A","Where does a <b>zebra</b> live?","Ngựa vằn sống ở đâu?","🦓"],["B","A zebra lives on the <b>grassland</b>.","Ngựa vằn sống trên đồng cỏ ạ.","🌾"],["A","Where does a frog live?","Con ếch sống ở đâu?","🐸"],["B","A frog lives in the <b>pond</b>. Ribbit!","Ếch sống ở ao ạ. Ộp ộp!","🐸"],["A","And a <b>crocodile</b>?","Còn cá sấu?","🐊"],["B","A crocodile lives in the <b>river</b>. Snap, snap!","Cá sấu sống ở sông ạ. Táp táp!","🏞️"]],"swap":["a <b>monkey</b> → a parrot / a snake","a <b>whale</b> → a shark / an octopus","a <b>penguin</b> → a seal"],"ask":["Where does a bear live?","Where does a bat sleep?","Where do worms live?"]},
  {"type":"show","title":"My Animal Homes Book","ic":"📖","tip":"Bé làm một cuốn sách nhỏ 8 trang, mỗi trang vẽ một nơi sống và dán con vật. Bé lật từng trang và giới thiệu.","lines":[["📖","This is my animal homes book. Let's read it together!","Đây là cuốn sách về nhà của các con vật. Mình cùng đọc nhé!"],["🌳","Page one: the <b>forest</b>. Bears and deer live here.","Trang một: khu rừng. Gấu và hươu sống ở đây."],["🐦","Look up! A bird lives in a <b>nest</b> in the tree.","Nhìn lên kìa! Chim sống trong tổ trên cây."],["🕳️","Look down! Worms and rabbits live <b>under the ground</b>.","Nhìn xuống nè! Giun và thỏ sống dưới lòng đất."],["🦇","Page two: a <b>cave</b>. Bats sleep here in the day.","Trang hai: hang động. Dơi ngủ ở đây vào ban ngày."],["⛰️","Page three: the <b>mountain</b>. Goats can climb up high!","Trang ba: ngọn núi. Dê có thể leo lên cao!"],["🌊","Page four: the <b>ocean</b>. Whales and fish swim here.","Trang bốn: đại dương. Cá voi và cá bơi ở đây."],["🏠","Every animal has a <b>home</b>. My home is my house!","Mỗi con vật đều có nhà. Nhà của tớ là ngôi nhà của tớ!"]],"swap":["the <b>forest</b> → the jungle / the farm","Bears and <b>deer</b> → foxes / owls"],"ask":["Where does a bird live?","Where do bats sleep?","Where is your home?"]},
  {"type":"compare","title":"Hot Desert, Cold Ice","ic":"🏜️","left":["🐫","A camel"],"right":["🐧","A penguin"],"tip":"Hai bé đóng vai lạc đà và chim cánh cụt. Bé lạc đà quạt tay vì nóng, bé chim cánh cụt run vì lạnh. Câu cuối cả hai cùng nói.","lines":[["L","🏜️","I live in the <b>desert</b>.","Tớ sống ở sa mạc."],["R","🧊","I live on the <b>ice</b>.","Tớ sống trên băng."],["L","🥵","It's very hot and <b>dry</b>. Phew!","Ở đó rất nóng và khô. Phù!"],["R","🥶","It's very <b>cold</b>. Brrr!","Ở đó rất lạnh. Brrr!"],["L","💧","I can walk a long way with no water.","Tớ có thể đi rất xa mà không cần uống nước."],["R","🐟","I can't fly, but I can swim and catch fish.","Tớ không biết bay nhưng tớ biết bơi và bắt cá."],["B","🏠","Our homes are very different, but we love our <b>homes</b>!","Nhà của chúng tớ rất khác nhau, nhưng chúng tớ đều yêu nhà mình!"]],"swap":["A <b>camel</b> → A snake (desert)","A <b>penguin</b> → A seal (ice)"],"ask":["Is the desert hot or cold?","Can a penguin fly?","Would you like to live on the ice?"]}]},
 {"id":"sci4","n":"My body","ic":"🧍","title":"Science 4: My Body","span":"Head, body, arms, legs, five senses","when":"Khoa học iSMART Unit 3 · xen 10 phút mỗi tuần","units":["sc4"],"fresh":["sc4"],tasks:[
  {"type":"talk","title":"Simon Says","ic":"🙋","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Chơi \"Simon says\": cô ra lệnh, bé chạm đúng bộ phận và nói lại cả câu. Khi cô không nói \"Simon says\" mà bé vẫn làm thì bé bị \"out\" (cười vui, chơi lại).","lines":[["A","Simon says: touch your <b>head</b>!","Simon bảo: chạm vào đầu!","🗣️"],["B","I touch my head.","Con chạm vào đầu ạ.","🗣️"],["A","Simon says: point to your <b>eyes</b>!","Simon bảo: chỉ vào mắt!","👁️"],["B","These are my eyes. I <b>see</b> with my eyes.","Đây là mắt của con. Con nhìn bằng mắt.","👀"],["A","Simon says: touch your <b>ears</b>!","Simon bảo: chạm vào tai!","👂"],["B","These are my ears. I <b>hear</b> with my ears.","Đây là tai của con. Con nghe bằng tai.","🎧"],["A","Simon says: wave your <b>arms</b>!","Simon bảo: vẫy hai cánh tay!","💪"],["B","I wave my arms. Hello!","Con vẫy tay ạ. Xin chào!","👋"],["A","Simon says: touch your <b>neck</b>!","Simon bảo: chạm vào cổ!","🧣"],["B","This is my neck.","Đây là cổ của con ạ.","🧣"],["A","Stamp your <b>feet</b>!","Dậm chân nào!","👣"],["B","Ha ha! Simon didn't say! I'm not stamping!","Ha ha! Simon chưa bảo! Con không dậm đâu!","😄"]],"swap":["touch your <b>head</b> → hair / nose / mouth","wave your <b>arms</b> → hands / legs"],"ask":["How many eyes do you have?","What do you hear with?","What do you kick a ball with?"]},
  {"type":"talk","title":"Senses Quiz Time","ic":"❓","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Cô hỏi như app, bé vừa trả lời vừa chỉ vào bộ phận cơ thể. Có thể cho bé nếm chanh, sờ gấu bông, chạm cốc nước đá thật.","lines":[["A","Science quiz! What do we use to <b>smell</b>?","Đố vui khoa học! Chúng ta dùng gì để ngửi?","👃"],["B","We use our nose to smell. Sniff, sniff!","Chúng ta dùng mũi để ngửi. Hít hít!","👃"],["A","What do we use to <b>hear</b>?","Chúng ta dùng gì để nghe?","👂"],["B","We use our ears to hear.","Chúng ta dùng tai để nghe ạ.","👂"],["A","What do we use to <b>taste</b>?","Chúng ta dùng gì để nếm?","👅"],["B","We use our <b>tongue</b> to taste.","Chúng ta dùng lưỡi để nếm ạ.","👅"],["A","Is a lemon <b>sweet</b> or <b>sour</b>?","Quả chanh ngọt hay chua?","🍋"],["B","A lemon is sour! Yuck!","Quả chanh chua lắm! Eo ơi!","😖"],["A","Is ice <b>hot</b> or <b>cold</b>?","Đá nóng hay lạnh?","🧊"],["B","Ice is cold. Brrr!","Đá lạnh ạ. Brrr!","🥶"],["A","<b>Touch</b> the teddy bear. Is it soft or hard?","Sờ thử gấu bông xem. Nó mềm hay cứng?","🧸"],["B","It's <b>soft</b>. I touch it with my hand.","Nó mềm ạ. Con sờ nó bằng tay.","✋"]],"swap":["What do we use to <b>smell</b> → see / hear / taste","Is a lemon <b>sour</b> → Is a cake sweet"],"ask":["What do we use to see?","Is ice cream hot or cold?","Is a lemon sweet or sour?"]},
  {"type":"show","title":"My Five Senses","ic":"🖐️","tip":"Bé chỉ vào mắt, tai, mũi, lưỡi, tay khi nói từng giác quan. Câu cuối bé hô cho cả lớp làm theo như trò \"Simon says\".","lines":[["🖐️","I have five senses. Point with me!","Tớ có năm giác quan. Chỉ cùng tớ nào!"],["👀","I <b>see</b> with my eyes. I see a rainbow!","Tớ nhìn bằng mắt. Tớ thấy cầu vồng!"],["👂","I <b>hear</b> with my ears. The drum is <b>loud</b>! Boom, boom!","Tớ nghe bằng tai. Tiếng trống to quá! Bùm, bùm!"],["👃","I <b>smell</b> with my nose. Mmm, flowers!","Tớ ngửi bằng mũi. Ừm, hoa thơm quá!"],["👅","I <b>taste</b> with my <b>tongue</b>. Ice cream is <b>sweet</b>.","Tớ nếm bằng lưỡi. Kem ngọt lắm."],["✋","I <b>touch</b> with my hands. My cat is <b>soft</b>.","Tớ sờ bằng tay. Con mèo của tớ mềm lắm."],["🔥","Don't touch the pot. It's <b>hot</b>! Ouch!","Đừng chạm vào cái nồi. Nó nóng lắm! Úi!"],["❓","Now you! Touch your nose. Touch your ears!","Đến lượt các bạn! Chạm vào mũi. Chạm vào tai nào!"]],"swap":["I see a <b>rainbow</b> → bird / flower","My cat is <b>soft</b> → My teddy bear"],"ask":["What do you hear with?","What is sweet?","What is hot in your kitchen?"]}]},
 {"id":"sci5","n":"Food","ic":"🥗","title":"Science 5: Foods and Drinks","span":"Healthy and unhealthy foods and drinks","when":"Khoa học iSMART Unit 4 · xen 10 phút mỗi tuần","units":["sc5"],"fresh":["sc5"],tasks:[
  {"type":"talk","title":"Healthy or Unhealthy?","ic":"🥦","roles":{"A":["👩‍🏫","Miss Lan"],"B":["🧒","{name}"]},"tip":"Cô giơ tranh đồ ăn, bé phân loại vào hai giỏ: \"Healthy\" (mặt cười) và \"Unhealthy\" (mặt mếu), rồi nói cả câu.","lines":[["A","Look at this carrot. Is it <b>healthy</b> or <b>unhealthy</b>?","Nhìn củ cà rốt này. Nó tốt hay không tốt cho sức khỏe?","🥕"],["B","It's healthy. It's a <b>vegetable</b>!","Nó tốt cho sức khỏe ạ. Nó là rau củ!","🥦"],["A","What about a <b>hamburger</b>?","Còn bánh hăm-bơ-gơ thì sao?","🍔"],["B","It's <b>unhealthy</b>. Not every day!","Nó không tốt cho sức khỏe ạ. Không ăn mỗi ngày!","🍩"],["A","<b>Soda</b> or <b>milk</b>? Which is healthy?","Nước có ga hay sữa? Cái nào tốt cho sức khỏe?","🥤"],["B","Milk is healthy. Soda has lots of sugar.","Sữa tốt cho sức khỏe ạ. Nước có ga có nhiều đường.","🥛"],["A","Is <b>fried chicken</b> healthy?","Gà rán có tốt cho sức khỏe không?","🍗"],["B","No, it's unhealthy. <b>Fish</b> and <b>rice</b> are healthy.","Không ạ, nó không tốt. Cá và cơm thì tốt cho sức khỏe.","🐟"],["A","What's the best drink?","Đồ uống tốt nhất là gì?","❓"],["B","<b>Water</b>! And orange <b>juice</b> is good too.","Nước ạ! Nước cam cũng tốt nữa.","💧"]],"swap":["this <b>carrot</b> → this apple / this banana","a <b>hamburger</b> → pizza / chips / sweets"],"ask":["Is pizza healthy?","What fruit do you eat every day?","What do you drink in the morning?"]},
  {"type":"show","title":"My Healthy Lunch Box","ic":"🍱","tip":"Bé mang hộp cơm thật (hoặc vẽ) và giới thiệu từng món. Cả lớp giơ ngón cái 👍 khi nghe món tốt cho sức khỏe.","lines":[["🍱","This is my lunch box. It's a <b>healthy</b> lunch!","Đây là hộp cơm của tớ. Bữa trưa tốt cho sức khỏe!"],["🍚","I have <b>rice</b> and <b>fish</b>.","Tớ có cơm và cá."],["🥦","I have green <b>vegetables</b>. They make me strong!","Tớ có rau xanh. Rau giúp tớ khỏe mạnh!"],["🍎","For <b>fruit</b>, I have an apple and a banana.","Hoa quả thì tớ có một quả táo và một quả chuối."],["🧃","I drink orange <b>juice</b> and <b>water</b>.","Tớ uống nước cam và nước lọc."],["🍔","No <b>hamburger</b>, no <b>soda</b>, no <b>sweets</b> today!","Hôm nay không hăm-bơ-gơ, không nước có ga, không kẹo!"],["💪","Healthy food makes me happy and strong. Thank you!","Đồ ăn tốt cho sức khỏe giúp tớ vui và khỏe. Cảm ơn các bạn!"]],"swap":["<b>rice</b> and fish → noodles and chicken","an <b>apple</b> → a mango / some watermelon"],"ask":["What's in your lunch box?","Do you like vegetables?","Are chips healthy or unhealthy?"]}]},
 {"id":"sci6","n":"Sky & weather","ic":"🌈","title":"Science 6: The Sky and Weather","span":"Day sky, the Sun, night sky, weather and clothes","when":"Khoa học iSMART Unit 5–6 · xen 10 phút mỗi tuần","units":["sc6"],"fresh":["sc6"],tasks:[
  {"type":"compare","title":"Day Sky and Night Sky","ic":"🌗","left":["🌅","Day sky"],"right":["🌃","Night sky"],"tip":"Chia bảng hai nửa: ban ngày (giấy xanh) và ban đêm (giấy đen). Hai bé dán Mặt Trời, mây, cầu vồng, Mặt Trăng, sao vào đúng nửa khi nói.","lines":[["L","☀️","In the <b>day</b>, I see the <b>Sun</b>.","Ban ngày, tớ thấy Mặt Trời."],["R","🌙","At <b>night</b>, I see the <b>Moon</b>.","Ban đêm, tớ thấy Mặt Trăng."],["L","🔆","The day sky is <b>bright</b> and blue.","Bầu trời ban ngày sáng và xanh."],["R","🌑","The night sky is <b>dark</b>.","Bầu trời ban đêm tối."],["L","☁️","I see white <b>clouds</b> and a <b>rainbow</b>.","Tớ thấy mây trắng và cầu vồng."],["R","⭐","I see lots of little <b>stars</b>. Twinkle, twinkle!","Tớ thấy nhiều ngôi sao nhỏ. Lấp lánh, lấp lánh!"],["B","🌤️","We love the <b>sky</b>, day and night!","Chúng tớ yêu bầu trời, cả ngày lẫn đêm!"]],"swap":["I see the <b>Sun</b> → birds / a plane","I see <b>stars</b> → the Moon"],"ask":["What do you see in the night sky?","Is the day sky bright or dark?","What colours are in a rainbow?"]},
  {"type":"show","title":"All About the Sun","ic":"☀️","tip":"Bé làm \"nhà khoa học nhí\" cầm tranh Mặt Trời. Nhắc bé: không bao giờ nhìn thẳng vào Mặt Trời.","lines":[["☀️","This is the <b>Sun</b>. It's a star!","Đây là Mặt Trời. Nó là một ngôi sao!"],["🔥","The Sun is a big, big <b>fireball</b>.","Mặt Trời là một quả cầu lửa rất, rất to."],["💡","It gives us <b>light</b>. The day is <b>bright</b>.","Nó cho chúng ta ánh sáng. Ban ngày sáng sủa."],["🥵","It makes us warm. Sometimes it's very <b>hot</b>!","Nó sưởi ấm cho chúng ta. Có khi rất nóng!"],["🌻","Plants need the Sun to grow.","Cây cần Mặt Trời để lớn lên."],["🕶️","Don't look at the Sun! Wear your <b>sunglasses</b>.","Đừng nhìn thẳng vào Mặt Trời! Hãy đeo kính râm."],["🌙","At night, the Sun goes away. Hello, <b>Moon</b>!","Ban đêm, Mặt Trời đi mất. Chào Mặt Trăng!"]],"swap":["a big <b>fireball</b> → very hot","Hello, <b>Moon</b> → Hello, stars"],"ask":["What does the Sun give us?","Can we look at the Sun?","When do we see the Moon?"]},
  {"type":"talk","title":"What's the Weather Like?","ic":"🌦️","roles":{"A":["👩","Mom"],"B":["🧒","{name}"]},"tip":"Mỗi sáng mẹ hỏi bé nhìn ra cửa sổ và trả lời theo thời tiết thật. Bày mũ, kính râm, ô, áo mưa để bé chọn đúng đồ.","lines":[["A","Good morning! What's the weather like today?","Chào buổi sáng! Hôm nay thời tiết thế nào?","🔲"],["B","It's <b>sunny</b>! The Sun is <b>bright</b>.","Trời nắng ạ! Mặt Trời sáng lắm.","🌞"],["A","What do you need on a sunny day?","Ngày nắng con cần gì?","❓"],["B","I need a <b>hat</b> and <b>sunglasses</b>.","Con cần mũ và kính râm ạ.","🕶️"],["A","Look! Now it's <b>cloudy</b>. Oh, it's <b>rainy</b>!","Nhìn kìa! Giờ trời nhiều mây. Ôi, trời mưa rồi!","🌧️"],["B","I need an <b>umbrella</b> and a <b>raincoat</b>.","Con cần ô và áo mưa ạ.","☂️"],["A","Is it <b>windy</b> today?","Hôm nay có gió không?","🌬️"],["B","Yes! Let's fly a kite after the rain.","Có ạ! Mưa tạnh mình đi thả diều nhé.","🪁"],["A","Look at the sky. What can you see?","Nhìn bầu trời đi. Con thấy gì?","🌤️"],["B","A <b>rainbow</b>! Red, orange, yellow, green, blue!","Cầu vồng ạ! Đỏ, cam, vàng, xanh lá, xanh dương!","🌈"]],"swap":["It's <b>sunny</b> → cloudy / rainy / windy","a <b>hat</b> → sunglasses"],"ask":["What's the weather like today?","What do you wear on a rainy day?","Do you like sunny or rainy days?"]},
  {"type":"show","title":"My Weather Report","ic":"📺","tip":"Bé làm phát thanh viên thời tiết trên TV: đứng cạnh bản đồ vẽ tay, chỉ vào biểu tượng nắng, mây, mưa khi nói. Ghi hình cho bé xem lại.","lines":[["📺","Good evening! Here is the weather.","Chào buổi tối! Sau đây là bản tin thời tiết."],["🌞","In Ha Noi, it's <b>sunny</b> and <b>hot</b>. Wear a hat!","Ở Hà Nội, trời nắng và nóng. Hãy đội mũ!"],["🌥️","In Hue, it's <b>cloudy</b>. No Sun today.","Ở Huế, trời nhiều mây. Hôm nay không có nắng."],["🌧️","In Ho Chi Minh City, it's <b>rainy</b>. Take an <b>umbrella</b>!","Ở Thành phố Hồ Chí Minh, trời mưa. Hãy mang ô!"],["🌬️","By the sea, it's <b>windy</b>. Hold your hat!","Ở biển, trời có gió. Giữ chặt mũ nhé!"],["🌃","Tonight, the sky is <b>dark</b>. You can see the Moon and stars.","Tối nay, trời tối. Các bạn có thể thấy Mặt Trăng và các vì sao."],["👋","That's the weather. Have a nice day!","Bản tin thời tiết đến đây là hết. Chúc một ngày tốt lành!"]],"swap":["In <b>Ha Noi</b> → your town","it's <b>sunny</b> → today's weather"],"ask":["What's the weather like in your town?","What do you take on a rainy day?","Can you see stars at night?"]}]},
 {"id":"days","n":"Days","ic":"📅","title":"Days and Months","span":"Time, days, months, birthday","when":"Học xen 10 phút mỗi tuần; mỗi sáng hỏi \"What day is it today?\"","units":["m6"],"fresh":["m6"],tasks:[
  {"type":"talk","title":"What Day Is It Today?","ic":"📅","roles":{"A":["👩","Mom"],"B":["🧒","{name}"]},"tip":"Hỏi bé mỗi sáng trước khi đi học. Bé nhìn lịch thật và trả lời theo đúng ngày hôm đó.","lines":[["A","Good <b>morning</b>, {name}! What day is it <b>today</b>?","Chào buổi sáng …! Hôm nay là thứ mấy?","📅"],["B","It's <b>Monday</b>!","Hôm nay là thứ Hai ạ!"],["A","What time is it?","Mấy giờ rồi?","🕐"],["B","It's seven <b>o'clock</b>. Time for school!","Bảy giờ rồi ạ. Đến giờ đi học!"],["A","What month is it?","Bây giờ là tháng mấy?","🗓️"],["B","It's <b>May</b>. My <b>birthday</b> is in May!","Tháng Năm ạ. Sinh nhật con vào tháng Năm!"],["A","Yes! Do you want a <b>party</b>?","Đúng rồi! Con có muốn tổ chức tiệc không?"],["B","Yes, please! With a big cake and six <b>candles</b>!","Có ạ! Có bánh to và sáu cây nến!"],["A","OK! Now, let's go to school.","Được! Giờ mình đi học nào."],["B","Bye, Mom! See you in the <b>afternoon</b>!","Con chào mẹ! Chiều gặp lại mẹ!"]],"swap":["<b>Monday</b> → today's day","<b>May</b> → your birthday month","seven <b>o'clock</b> → six thirty"],"ask":["What day is it today?","What time do you get up?","When is your birthday?"]},
  {"type":"me","title":"My Week","ic":"🗓️","tip":"Bé kể tuần của mình theo thứ tự các ngày. Cô gợi ý từng ngày: \"On Tuesday, what do you do?\"","lines":[["n:2","First, on <b>Monday</b>, I go to school.","Đầu tiên, thứ Hai, tớ đi học."],["n:3","On <b>Tuesday</b> and <b>Wednesday</b>, I draw and sing at school.","Thứ Ba và thứ Tư, tớ vẽ và hát ở trường."],["n:5","On <b>Thursday</b>, I read a book with my friend.","Thứ Năm, tớ đọc sách cùng bạn."],["n:6","Then on <b>Friday</b>, I play football in the <b>afternoon</b>.","Rồi thứ Sáu, tớ chơi bóng đá vào buổi chiều."],["n:7","After that, it's the <b>weekend</b>! On <b>Saturday</b>, I go to the park.","Sau đó là cuối tuần! Thứ Bảy, tớ đi công viên."],["n:CN","Finally, on <b>Sunday</b>, I visit Grandma. I love my <b>week</b>!","Cuối cùng, Chủ nhật, tớ đến thăm bà. Tớ yêu tuần của tớ!"]],"swap":["I draw and sing → I play and read","visit Grandma → swim / watch TV"],"ask":["What do you do on Saturday?","What is your favourite day?","How many days are there in a week?"]},
  {"type":"show","title":"My Birthday","ic":"🎂","tip":"Bé mang ảnh sinh nhật (hoặc vẽ bánh kem) và giới thiệu. Đổi tháng, số nến cho đúng với bé.","lines":[["🗓️","My <b>birthday</b> is in <b>May</b>.","Sinh nhật tớ vào tháng Năm."],["🎈","I have a big <b>party</b> at home.","Tớ có một bữa tiệc lớn ở nhà."],["🎂","I have a cake with six <b>candles</b>.","Tớ có một cái bánh với sáu cây nến."],["🎁","My friends give me <b>presents</b>.","Các bạn tặng quà cho tớ."],["🎶","We sing \"Happy <b>birthday</b>!\"","Chúng tớ hát \"Chúc mừng sinh nhật!\""],["😊","I am very happy on my birthday!","Tớ rất vui vào ngày sinh nhật!"]],"swap":["<b>May</b> → your birthday month","six <b>candles</b> → seven candles"],"ask":["When is your birthday?","What do you want for your birthday?","What month is it now?"]}]},
 {"id":"dirs","n":"Directions","ic":"🧭","title":"Left, Right, Go Straight!","span":"Directions and the way to school","when":"Học sau Math 2 (Positions), mỗi tuần 10 phút; đi bộ cùng bé thì hỏi “Left or right?”","units":["dr"],"fresh":["dr"],tasks:[
  {"type":"talk","title":"Excuse Me, Where Is the Park?","ic":"👮","roles":{"A":["🧒","{name}"],"B":["👮","Police officer"]},"tip":"Cô đóng vai chú công an, bé hỏi đường. Dùng bản đồ vẽ trên giấy, bé lấy ngón tay đi theo từng câu chỉ đường.","lines":[["A","<b>Excuse me</b>. Where is the park?","Cháu chào chú, cho cháu hỏi công viên ở đâu ạ?","🙋"],["B","<b>Go straight</b>. Then <b>turn left</b> at the shop.","Cháu đi thẳng. Rồi rẽ trái ở cửa hàng.","⬆️"],["A","Go straight, turn left. Is it <b>far</b>?","Đi thẳng, rẽ trái. Có xa không ạ?","🗺️"],["B","No, it's <b>near</b>. It's next to the school.","Không, gần thôi. Nó ở cạnh trường học.","🏠"],["B","<b>Stop</b> at the <b>traffic light</b>. Go when it's green.","Dừng ở đèn giao thông. Đèn xanh thì đi nhé.","🚦"],["A","Thank you very much!","Cháu cảm ơn chú ạ!","😊"],["B","You're welcome. Bye!","Không có gì. Tạm biệt cháu!","👋"]],"swap":["the <b>park</b> → the zoo / the bus stop","<b>turn left</b> → turn right","<b>near</b> → far"],"ask":["Where is your school? Is it near or far?","What do you do at a red light?","How do you ask for the way?"]},
  {"type":"show","title":"My Way to School","ic":"🏫","tip":"Bé vẽ bản đồ từ nhà đến trường rồi chỉ theo khi nói. Đổi các chỗ rẽ thành đường thật của bé.","lines":[["🏠","This is my house. My school is <b>near</b> my house.","Đây là nhà tớ. Trường tớ ở gần nhà."],["⬆️","First, I <b>go straight</b>.","Đầu tiên, tớ đi thẳng."],["↩️","Then I <b>turn left</b> at the shop.","Sau đó tớ rẽ trái ở cửa hàng."],["🚦","I <b>stop</b> at the <b>traffic light</b>. Red means stop. Green means go!","Tớ dừng ở đèn giao thông. Đèn đỏ là dừng. Đèn xanh là đi!"],["↪️","I <b>turn right</b> at the bus stop.","Tớ rẽ phải ở trạm xe buýt."],["🏫","Here is my school! It's next to the park.","Trường tớ đây rồi! Trường ở cạnh công viên."]],"swap":["<b>near</b> → far","<b>turn left</b> at the shop → turn right at the park"],"ask":["How do you go to school?","Do you turn left or right?","What is next to your school?"]},
  {"type":"me","title":"Robot Game","ic":"🤖","tip":"Một bé làm rô-bốt bịt mắt, bé kia đọc lệnh để dẫn bạn đến chỗ giấu đồ chơi. Đổi vai sau mỗi lượt.","lines":[["🤖","I am a robot. Tell me where to go!","Tớ là rô-bốt. Hãy bảo tớ đi đâu!"],["⬆️","<b>Go straight</b>. One, two, three steps.","Đi thẳng. Một, hai, ba bước."],["⬅️","<b>Turn left</b>. Now go straight again.","Rẽ trái. Giờ lại đi thẳng."],["🔽","Look <b>down</b>. Is it under the table?","Nhìn xuống. Nó ở dưới gầm bàn à?"],["🛑","<b>Stop</b>! The teddy bear is here!","Dừng lại! Gấu bông ở đây rồi!"]],"swap":["<b>turn left</b> → turn right","under the table → behind the door"],"ask":["Which is your left hand?","Where is the teddy bear?"]}]},
 {"id":"opp","n":"Opposites","ic":"↔️","title":"Big and Small, Old and New","span":"Opposite adjectives","when":"Học xen sau Unit 10 (At the zoo) và Unit 14 (In the toy shop); mỗi ngày tìm một cặp đối nghĩa trong nhà","units":["op"],"fresh":["op"],tasks:[
  {"type":"compare","title":"The Elephant and the Mouse","ic":"🐘","left":["🐘","The elephant"],"right":["🐭","The mouse"],"tip":"Hai bé đứng hai bên: một bé làm voi (dang tay to, bước chậm), một bé làm chuột (co người, chạy nhanh). Câu cuối cả hai cùng nói.","lines":[["L","🐘","The elephant is <b>big</b>.","Con voi thì to."],["R","🐭","The mouse is <b>small</b>.","Con chuột thì nhỏ."],["L","🐢","It is <b>slow</b>. Stomp, stomp!","Nó đi chậm. Thình thịch!"],["R","🏎️","It is <b>fast</b>. Zoom!","Nó chạy nhanh. Vèo!"],["L","🔊","It is <b>noisy</b>. Toot, toot!","Nó ồn ào. Toe toe!"],["R","🤫","It is <b>quiet</b>. Shh!","Nó yên lặng. Suỵt!"],["B","🤝","Big or small, we are friends!","To hay nhỏ, chúng mình là bạn!"]],"swap":["The <b>elephant</b> → The giraffe (tall)","The <b>mouse</b> → The turtle (slow)"],"ask":["Is the elephant big or small?","Which animal is fast?","Are you big or small?"]},
  {"type":"talk","title":"At the Toy Shop","ic":"🧸","roles":{"A":["🧒","{name}"],"B":["👩","Shopkeeper"]},"tip":"Bày đồ chơi thật: một món mới, một món cũ, một món to, một món nhỏ. Bé chọn và nói lý do (because…).","lines":[["B","Hello! What do you want?","Chào cháu! Cháu muốn mua gì?","👩"],["A","I want a <b>new</b> robot, please.","Cháu muốn một con rô-bốt mới ạ.","🤖"],["B","This robot is <b>big</b>. That robot is <b>small</b>.","Con rô-bốt này to. Con kia nhỏ.","🤖"],["A","I want the <b>small</b> one, because it is <b>fast</b>!","Cháu lấy con nhỏ, vì nó chạy nhanh!","🏎️"],["B","Here you are. It's <b>beautiful</b>!","Của cháu đây. Đẹp lắm!","🎁"],["A","Thank you! My old robot is <b>dirty</b>. This one is <b>clean</b>!","Cháu cảm ơn! Rô-bốt cũ của cháu bẩn rồi. Con này sạch sẽ!","😊"]],"swap":["<b>robot</b> → teddy bear / kite","<b>small</b> → big","<b>fast</b> → quiet"],"ask":["Do you like big toys or small toys?","Is your bike old or new?","Are your hands clean?"]},
  {"type":"show","title":"My Room: Old and New","ic":"🛏️","tip":"Bé chụp hoặc vẽ phòng mình, giới thiệu mỗi món đồ bằng một tính từ. Nhắc bé không dùng ugly để nói về bạn bè.","lines":[["🛏️","This is my bedroom. It is <b>small</b>, but it is <b>beautiful</b>.","Đây là phòng ngủ của tớ. Phòng nhỏ nhưng đẹp."],["🧸","This is my teddy bear. It is <b>old</b>, but I love it.","Đây là gấu bông của tớ. Nó cũ rồi, nhưng tớ vẫn thương nó."],["🚲","This is my <b>new</b> bike. It is <b>fast</b>!","Đây là xe đạp mới của tớ. Nó chạy nhanh lắm!"],["🐍","This is my toy snake. It is <b>long</b>. Sss!","Đây là con rắn đồ chơi. Nó dài. Xì xì!"],["👹","This is my monster mask. It is <b>ugly</b>! Boo!","Đây là mặt nạ quái vật. Nó xấu xí! Hù!"],["🧼","I tidy my room every day. It is <b>clean</b>!","Ngày nào tớ cũng dọn phòng. Phòng sạch sẽ!"]],"swap":["<b>old</b> → new","<b>long</b> → short","<b>clean</b> → quiet"],"ask":["Is your room big or small?","What is new in your room?","What is old in your room?"]}]},
 {"id":"tastes","n":"Tastes","ic":"👅","title":"Sweet, Sour, Spicy!","span":"Tastes and food words","when":"Học cùng Science 5 (Foods and drinks); nếm thử thật một chút ở nhà: mật ong, chanh, muối, mướp đắng","units":["ta"],"fresh":["ta"],tasks:[
  {"type":"talk","title":"Taste This!","ic":"👅","roles":{"A":["👩","Mom"],"B":["🧒","{name}"]},"tip":"Chuẩn bị 4 đĩa nhỏ: đường, chanh, muối, một lát mướp đắng. Bé nếm từng thứ (rất ít) rồi làm mặt và nói vị.","lines":[["A","<b>Taste</b> this. Is it <b>sweet</b>?","Nếm thử đi con. Có ngọt không?","🍯"],["B","Yes! It's <b>sweet</b>. It's honey. <b>Yummy</b>!","Có ạ! Ngọt lắm. Là mật ong. Ngon quá!","😋"],["A","Now taste this lemon.","Giờ nếm thử quả chanh này.","🍋"],["B","Ooh! It's <b>sour</b>!","Ui! Chua quá!","😖"],["A","And this is <b>bitter melon</b>.","Còn đây là mướp đắng.","🥒"],["B","Bleh! It's <b>bitter</b>. I don't like it.","Ẹ! Đắng quá. Con không thích.","😝"],["A","It's <b>bitter</b>, but it's good for you!","Đắng nhưng tốt cho con đấy!","💪"]],"swap":["honey → candy / mango","lemon → orange","<b>bitter melon</b> → coffee"],"ask":["What is sweet?","Do you like sour food?","Is chili spicy?"]},
  {"type":"show","title":"My Taste Test","ic":"🧪","tip":"Bé làm “nhà khoa học” giới thiệu thí nghiệm nếm vị. Mỗi câu bé giơ đúng món đồ hoặc tranh.","lines":[["👅","Today, I am a scientist. I <b>taste</b> five things!","Hôm nay tớ là nhà khoa học. Tớ nếm năm thứ!"],["🍬","Candy is <b>sweet</b>. <b>Yummy</b>!","Kẹo thì ngọt. Ngon quá!"],["🍋","A lemon is <b>sour</b>. My face goes like this!","Quả chanh thì chua. Mặt tớ nhăn thế này này!"],["🧂","Chips are <b>salty</b>. I drink water.","Khoai tây chiên thì mặn. Tớ uống nước."],["☕","Coffee is <b>bitter</b>. It's for Dad, not for me!","Cà phê thì đắng. Của bố, không phải của tớ!"],["🌶️","Chili is <b>spicy</b>! <b>Hot</b>, hot! Water, please!","Ớt cay quá! Nóng, nóng! Cho tớ nước với!"],["🍦","My favorite is ice cream. It is <b>sweet</b> and <b>cold</b>. <b>Delicious</b>!","Món tớ thích nhất là kem. Ngọt và lạnh. Ngon tuyệt!"]],"swap":["candy → honey / cake","chips → fish sauce (nước mắm)","ice cream → mango"],"ask":["What is your favorite taste?","Is coffee sweet or bitter?","What do you drink when food is spicy?"]},
  {"type":"compare","title":"Candy and Lemon","ic":"🍬","left":["🍬","Candy"],"right":["🍋","Lemon"],"tip":"Hai bé, mỗi bé cầm một thứ. Bé cầm kẹo cười tươi, bé cầm chanh nhăn mặt. Câu cuối cả hai cùng nói.","lines":[["L","🍬","Candy is <b>sweet</b>.","Kẹo thì ngọt."],["R","🍋","A lemon is <b>sour</b>.","Quả chanh thì chua."],["L","🎨","It is red and pink.","Nó màu đỏ và hồng."],["R","🟡","It is yellow.","Nó màu vàng."],["L","🦷","Too much candy is bad for my teeth.","Ăn nhiều kẹo thì hại răng."],["R","🍹","Lemon juice is good for me.","Nước chanh tốt cho tớ."],["B","🤝","We like sweet and sour drinks!","Chúng tớ thích nước chua chua ngọt ngọt!"]],"swap":["Candy → Honey","Lemon → Orange"],"ask":["Is candy sweet or sour?","What color is a lemon?","Is too much candy good for your teeth?"]}]},
 {"id":"seasons","n":"Seasons","ic":"🍂","title":"Hot and Cold: Four Seasons","span":"Hot, cold, weather and seasons","when":"Học sau Science 6 (Sky and weather); mỗi sáng hỏi “What's the weather like? Is it hot or cold?”","units":["ws","sc6"],"fresh":["ws"],tasks:[
  {"type":"talk","title":"What's the Weather Like?","ic":"🌡️","roles":{"A":["👩","Mom"],"B":["🧒","{name}"]},"tip":"Hỏi bé mỗi sáng trước khi ra khỏi nhà. Bé nhìn trời thật rồi trả lời, chọn quần áo theo thời tiết.","lines":[["A","Good morning! What's the weather like today?","Chào buổi sáng! Hôm nay thời tiết thế nào?","🪟"],["B","It's cloudy and windy. Brrr! It's <b>cold</b>!","Trời nhiều mây và có gió. Brừ! Lạnh quá!","🥶"],["A","Yes. It's <b>winter</b> now. Put on your <b>coat</b>.","Ừ. Giờ là mùa đông rồi. Mặc áo khoác vào con.","🧥"],["B","And my <b>scarf</b>, too!","Cả khăn quàng nữa ạ!","🧣"],["A","Good job! Do you like winter?","Ngoan lắm! Con có thích mùa đông không?","⛄"],["B","No. I like <b>summer</b>, because it's <b>hot</b> and I can swim!","Không ạ. Con thích mùa hè, vì trời nóng và con được đi bơi!","🏖️"]],"swap":["<b>cold</b> → hot / cool","<b>winter</b> → summer / autumn","<b>coat</b> → hat / T-shirt"],"ask":["What's the weather like today?","Is it hot or cold?","What season is it now?"]},
  {"type":"show","title":"My Favorite Season","ic":"🌸","tip":"Bé cầm 4 tranh 4 mùa, giơ từng tranh khi nói. Câu cuối bé nói mùa mình thích thật và lý do với because.","lines":[["🗓️","There are four <b>seasons</b>: spring, summer, autumn and winter.","Có bốn mùa: xuân, hạ, thu, đông."],["🌸","In <b>spring</b>, it's <b>warm</b>. We have Tet and many flowers.","Mùa xuân trời ấm. Có Tết và nhiều hoa."],["🏖️","In <b>summer</b>, it's <b>hot</b>. I go to the beach and swim.","Mùa hè trời nóng. Tớ đi biển và bơi."],["🍂","In <b>autumn</b>, it's <b>cool</b>. The leaves are yellow and brown.","Mùa thu trời mát. Lá cây vàng và nâu."],["⛄","In <b>winter</b>, it's <b>cold</b>. I wear my <b>coat</b> and <b>scarf</b>.","Mùa đông trời lạnh. Tớ mặc áo khoác và quàng khăn."],["❤️","My favorite season is <b>spring</b>, because I get lucky money at Tet!","Mùa tớ thích nhất là mùa xuân, vì Tết tớ được lì xì!"]],"swap":["<b>spring</b> → summer / autumn / winter","lucky money → I can swim / I can fly a kite"],"ask":["What's your favorite season? Why?","What do you wear in winter?","What do you do in summer?"]},
  {"type":"compare","title":"Summer and Winter","ic":"⛄","left":["🏖️","Summer"],"right":["⛄","Winter"],"tip":"Hai bé đứng hai bên: bé mùa hè quạt tay, đội mũ; bé mùa đông run run, quàng khăn. Câu cuối cả hai cùng nói.","lines":[["L","🥵","In summer, it's <b>hot</b> and sunny.","Mùa hè trời nóng và nắng."],["R","🥶","In winter, it's <b>cold</b> and windy.","Mùa đông trời lạnh và có gió."],["L","👕","I wear a T-shirt and a hat.","Tớ mặc áo phông và đội mũ."],["R","🧥","I wear a <b>coat</b> and a <b>scarf</b>.","Tớ mặc áo khoác và quàng khăn."],["L","🍦","I eat ice cream. It's cold and yummy!","Tớ ăn kem. Mát lạnh và ngon!"],["R","🍜","I eat hot noodles. Yummy!","Tớ ăn mì nóng. Ngon quá!"],["B","🤝","Hot or cold, we play together!","Nóng hay lạnh, chúng mình vẫn chơi cùng nhau!"]],"swap":["Summer → Spring (warm)","Winter → Autumn (cool)"],"ask":["Is summer hot or cold?","What do you wear in winter?","Which season do you like?"]}]},
 {"id":"tales","n":"Story Time","ic":"🏰","title":"Fairy Tales","span":"Five fairy tales","when":"3 tuần một truyện","units":["f1"],"fresh":["f1"],tasks:[
  {"type":"story","title":"The Three Little Pigs","ic":"🐷","tip":"Kể truyện trước, sau đó cho bé xem phim hoạt hình Three Little Pigs một lần trọn vẹn. Lần xem thứ hai, dừng ở cảnh sói gõ cửa, hỏi \"Who is this?\" và để bé hô \"Little pig, little pig, let me come in!\".","lines":[["🐷","<b>Once upon a time</b>, there were three little pigs.","Ngày xửa ngày xưa, có ba chú heo con."],["🏠","They made three houses: straw, sticks and bricks.","Ba chú làm ba ngôi nhà: nhà rơm, nhà gỗ và nhà gạch."],["🐺","One day, a big bad <b>wolf</b> came. Knock, knock!","Một hôm, một con sói to xấu xa đến. Cốc, cốc!"],["🚪","“Little pig, little pig, let me come in!”","“Heo con, heo con, cho ta vào!”"],["🐷","“No! Not by the hair of my chinny chin chin!”","“Không! Không đời nào, thề bằng bộ râu cằm của ta!”"],["💨","Huff and puff! The straw house and stick house fell down!","Thổi phù phù! Nhà rơm và nhà gỗ đổ sập!"],["😨","“<b>Help</b>! <b>Run away</b>!” The <b>scared</b> pigs ran to the brick house.","“Cứu với! Chạy mau!” Các chú heo sợ hãi chạy sang nhà gạch."],["🧱","Huff and puff! But the brick house did not fall. Hooray!","Thổi phù phù! Nhưng nhà gạch không đổ. Hoan hô!"]],"swap":["a house of <b>straw</b> → sticks / bricks","<b>three</b> little pigs → two / four"],"ask":["Who came to the houses?","What did the wolf say?","Which house did not fall down?"]},
  {"type":"story","title":"Goldilocks and the Three Bears","ic":"🐻","tip":"Xem phim hoạt hình Goldilocks một lần, lần hai dừng ở ba bát cháo và ba cái ghế, hỏi \"Too hot or too cold?\", \"Big or small?\". Khi gấu về nhà, cho bé nói giọng Bố Gấu trầm và Gấu Con thật nhỏ.","lines":[["🏡","<b>Once upon a time</b>, three <b>bears</b> lived in the <b>forest</b>.","Ngày xửa ngày xưa, có ba chú gấu sống trong rừng."],["👧","A girl, Goldilocks, came to their house. Nobody was home.","Một cô bé tên là Goldilocks đến nhà các chú gấu. Không có ai ở nhà."],["🥣","She tasted the porridge. Too hot! Too cold! Just right!","Cô bé nếm cháo. Nóng quá! Nguội quá! Vừa ngon!"],["🪑","She sat on the little chair. Crack! It broke.","Cô bé ngồi lên cái ghế nhỏ. Rắc! Ghế gãy mất."],["🛏️","She was tired. She went to sleep in the little bed.","Cô bé mệt. Cô bé ngủ trên cái giường nhỏ."],["🐻","The bears came home. “Someone is eating my porridge!”","Ba chú gấu về nhà. “Có ai đã ăn cháo của tớ!”"],["🧸","Baby Bear cried, “Someone is sleeping in my bed!”","Gấu Con kêu lên: “Có ai đang ngủ trên giường của con!”"],["😨","Goldilocks woke up. She was <b>scared</b>. “Sorry, bears!” She ran home.","Goldilocks tỉnh dậy. Cô bé sợ hãi. “Cháu xin lỗi các bác gấu!” Rồi cô bé chạy về nhà."]],"swap":["Too <b>hot</b> → cold","the little <b>chair</b> → bed / bowl"],"ask":["Who lived in the forest?","What did Goldilocks eat?","Where did Goldilocks sleep?"]},
  {"type":"story","title":"Little Red Riding Hood","ic":"🧺","tip":"Xem phim hoạt hình Little Red Riding Hood, dừng ở cảnh gặp sói trong rừng hỏi \"Who is this? Where is she?\". Đoạn \"What big eyes you have!\", cô và bé chỉ vào mắt, tai, răng và nói theo nhân vật.","lines":[["👧","<b>Once upon a time</b>, there was a girl in a red hood.","Ngày xửa ngày xưa, có một cô bé đội mũ trùm đỏ."],["🧺","Her mom said, “Take this basket to Grandma. Don't stop!”","Mẹ dặn: “Con mang giỏ này đến cho bà nhé. Đừng dừng lại!”"],["🐺","In the <b>forest</b>, she met a <b>wolf</b>. “Where are you going?”","Trong rừng, cô bé gặp một con sói. “Cháu đi đâu đấy?”"],["🏠","The wolf ran to Grandma's house. Grandma hid in the cupboard!","Sói chạy đến nhà bà. Bà trốn vào trong tủ!"],["👀","“Grandma, what big eyes you have!” “To see you better!”","“Bà ơi, sao mắt bà to thế!” “Để bà nhìn cháu rõ hơn!”"],["🦷","“What big teeth you have!” “To eat you up!”","“Sao răng bà to thế!” “Để ăn thịt cháu đấy!”"],["😨","She was <b>scared</b>. “<b>Help</b>! Help!” A woodcutter heard her and came.","Cô bé sợ hãi. “Cứu với! Cứu với!” Bác tiều phu nghe thấy và chạy đến."],["🪓","The wolf ran far away. Grandma and the girl were safe!","Sói chạy mất. Bà và cô bé được an toàn!"]],"swap":["what big <b>eyes</b> → ears / teeth / hands","a <b>red</b> hood → blue / pink"],"ask":["Who did the girl meet in the forest?","Where did Grandma hide?","Who came to help?"]},
  {"type":"story","title":"The Gingerbread Man","ic":"🍪","tip":"Xem phim hoạt hình The Gingerbread Man, mỗi lần nhân vật hát \"Run, run, as fast as you can!\" thì dừng cho bé hát theo và chạy tại chỗ. Dừng ở cảnh bờ sông hỏi \"Who is this? Is the fox nice?\".","lines":[["👵","<b>Once upon a time</b>, an old woman made a gingerbread man.","Ngày xửa ngày xưa, có một bà cụ làm một chiếc bánh gừng hình người."],["🔥","She opened the oven. The gingerbread man jumped out!","Bà mở lò nướng. Chú bánh gừng nhảy ra ngoài!"],["🏃","“Run, run, as fast as you can! You can't catch me!”","“Chạy đi, chạy đi, chạy nhanh hết sức! Không bắt được ta đâu!”"],["🐄","The old woman, a cow and a horse ran after him.","Bà cụ, con bò và con ngựa đuổi theo chú."],["🍪","“I'm the Gingerbread Man! I can <b>run away</b> from you!”","“Ta là Người Bánh Gừng! Ta chạy thoát khỏi các ngươi!”"],["🌲","He ran into the <b>forest</b>. A big river! He was <b>scared</b>.","Chú chạy vào rừng. Một con sông lớn! Chú sợ hãi."],["🦊","A fox said, “Jump on my nose. I can <b>help</b> you!”","Một con cáo nói: “Nhảy lên mũi ta. Ta giúp cho!”"],["😮","Snap! The fox ate him up. Be careful with tricky friends!","Phập! Cáo ăn mất chú bánh gừng. Hãy cẩn thận với bạn xấu nhé!"]],"swap":["Jump on my <b>nose</b> → back / tail","a <b>cow</b> and a horse → a dog / a pig"],"ask":["Who made the Gingerbread Man?","What did he say when he ran?","Who ate him up?"]},
  {"type":"story","title":"The Tortoise and the Hare","ic":"🐢","tip":"Xem phim hoạt hình The Tortoise and the Hare, dừng ở cảnh thỏ ngủ dưới gốc cây, hỏi \"What is the hare doing? Who is slow?\". Cho bé diễn rùa đi chậm và thỏ chạy nhanh.","lines":[["🐇","<b>Once upon a time</b>, there was a fast hare.","Ngày xửa ngày xưa, có một chú thỏ chạy rất nhanh."],["🐢","“You are so slow!” the hare laughed at the tortoise.","“Cậu chậm quá!” thỏ cười chê rùa."],["🏁","“Let's have a race!” said the tortoise. All the animals came.","“Mình thi chạy đi!” rùa nói. Các con vật đều đến xem."],["🐻","The <b>bear</b> said, “Ready, steady, go!” The hare ran very fast.","Bác gấu hô: “Chuẩn bị, sẵn sàng, chạy!” Thỏ chạy rất nhanh."],["😴","The hare stopped under a tree in the <b>forest</b>. He fell asleep.","Thỏ dừng lại dưới gốc cây trong rừng. Thỏ ngủ quên mất."],["🐢","Slowly, slowly, the tortoise walked to <b>the end</b> of the race.","Chầm chậm, chầm chậm, rùa bò về đến đích."],["🙀","The hare woke up. Oh no! He ran and ran.","Thỏ tỉnh dậy. Ôi không! Thỏ chạy thục mạng."],["🏆","Too late! The tortoise won. Slow and steady wins the race!","Muộn rồi! Rùa thắng cuộc. Chậm mà chắc thì về đích!"]],"swap":["a fast <b>hare</b> → horse / dog","The <b>bear</b> said → The lion / The monkey"],"ask":["Who was fast?","What did the hare do under the tree?","Who won the race?"]}]},
 {"id":"speeches","n":"Speeches","ic":"🎤","title":"Animal Speeches","span":"Easy and Challenge","when":"Từ tuần 10","units":["sc2","g4","g6","g8","g9","g16"],"fresh":[],"noCards":true,"noGames":true,tasks:[
  {"type":"show","own":true,"badge":"🌱 Easy","title":"The Cow","ic":"🐄","tip":"Câu 1 bé cười tươi. Câu \"Haha, it is so cute!\" bé ôm má cười. Bé cầm tranh con bò và chỉ vào từng bộ phận khi nói.","lines":[["😊","Hello, everyone! My name is {name}. I'm <b>six</b> years old, and I'm very <b>happy</b> today!","Xin chào mọi người! Con tên là … Con 6 tuổi, hôm nay con rất vui!"],["🖼️","Look at this picture! It is a big <b>cow</b>.","Nhìn bức tranh này kìa! Đây là một con bò to."],["🐄","The cow is <b>black</b> and <b>white</b>. It has <b>four</b> legs.","Con bò màu đen và trắng. Nó có 4 cái chân."],["🌾","It lives on a <b>farm</b>. It can walk and <b>eat</b> green grass.","Nó sống ở nông trại. Nó có thể đi bộ và ăn cỏ xanh."],["🥰","It says \"<b>Moo, moo</b>!\" Haha, it is so cute!","Nó kêu \"Ùm bò, ùm bò!\" Haha, nó dễ thương quá!"],["👋","I like cows! Thank you and bye-bye!","Con thích bò! Cảm ơn và tạm biệt!"]],"swap":["<b>six</b> → your age","<b>black</b> and <b>white</b> → brown","<b>cow</b> → sheep (Baa, baa!) / pig (Oink, oink!)"],"ask":["What colour is the cow?","What does the cow eat?","What does the cow say?"]},
  {"type":"show","own":true,"badge":"⭐ Challenge","title":"My Favorite Farm Animal: The Cow","ic":"🐄","tip":"Bản dài cho bé lanh. Dừng nhẹ một nhịp ở \"Today…\" và \"Look at the cow.\" để giọng có ngữ điệu. Câu cuối bé đặt tay lên ngực khi nói \"I love cows!\".","lines":[["👋","Hello, everyone! My name is {name}, and I'm <b>six</b> years old.","Xin chào mọi người! Con tên là …, con 6 tuổi."],["😊","I'm very <b>happy</b> today!","Hôm nay con rất vui!"],["🐄","Today, I want to talk about my favorite <b>farm animal</b>. It is a <b>cow</b>!","Hôm nay con muốn nói về con vật nông trại con thích nhất. Đó là một con bò!"],["👀","Look at the cow. It is <b>big</b>, and it is <b>black</b> and <b>white</b>.","Nhìn con bò kìa. Nó rất to, có màu đen và trắng."],["🐄","It has <b>four</b> legs and a long <b>tail</b>.","Nó có 4 cái chân và một cái đuôi dài."],["🌾","The cow lives on a <b>farm</b>. It likes to <b>eat</b> green grass.","Con bò sống ở nông trại. Nó thích ăn cỏ xanh."],["🥛","It gives us yummy <b>milk</b> every day, and it says \"<b>Moo, moo</b>!\"","Nó cho chúng ta sữa ngon mỗi ngày, và nó kêu \"Ùm bò, ùm bò!\""],["❤️","I love cows! Thank you for listening. Goodbye!","Con yêu những chú bò! Cảm ơn mọi người đã lắng nghe. Tạm biệt!"]],"swap":["<b>cow</b> → sheep (it gives us wool) / chicken (it gives us eggs)","long <b>tail</b> → two wings"],"ask":["Is a cow a farm animal or a wild animal?","What does a cow give us?","How many legs does a cow have?"]},
  {"type":"show","own":true,"badge":"🌱 Easy","title":"The Duck","ic":"🦆","tip":"Câu 1 bé vỗ tay nhẹ. Đến \"Quack, quack!\" bé làm mỏ vịt bằng tay và đi lạch bạch.","lines":[["👏","Hi, everyone! I'm {name}. I'm so excited today!","Chào mọi người! Con là … Hôm nay con rất hào hứng!"],["🖼️","Look at this picture! I see a <b>yellow</b> <b>duck</b>.","Nhìn bức tranh này kìa! Con thấy một chú vịt màu vàng."],["🦆","It has <b>two</b> <b>eyes</b>, an orange <b>mouth</b>, and two feet.","Nó có hai mắt, một cái mỏ màu cam và hai bàn chân."],["🏊","The duck can swim and walk. It says \"<b>Quack, quack</b>!\"","Chú vịt có thể bơi và đi bộ. Nó kêu \"Cạp, cạp!\""],["😄","The duck is so funny! It makes me <b>happy</b>!","Chú vịt thật mắc cười! Nó làm con thấy rất vui!"],["👋","I love ducks! Goodbye!","Con yêu vịt! Tạm biệt!"]],"swap":["<b>duck</b> → chicken (Cluck, cluck!)","<b>yellow</b> → white"],"ask":["What colour is the duck?","Can a duck swim?","What does a duck say?"]},
  {"type":"show","own":true,"badge":"🌱 Easy","title":"The Octopus","ic":"🐙","tip":"Câu 1 bé giơ ngón cái 👍. Câu \"Wow, it is an octopus!\" bé mở to mắt ngạc nhiên. Khi đếm, bé giơ từng ngón tay và mời cả lớp đếm cùng.","lines":[["👍","Hello! My name is {name}. I feel great today!","Xin chào! Con tên là … Hôm nay con thấy rất tuyệt!"],["😮","Look at this picture! Wow, it is an <b>octopus</b>!","Nhìn bức tranh này kìa! Ôi chao, đây là một con bạch tuộc!"],["🟣","It is <b>purple</b>. It has two big <b>eyes</b> and <b>eight</b> legs!","Nó màu tím. Nó có hai mắt to và 8 cái chân!"],["🔢","Let's count: <b>one</b>, <b>two</b>, <b>three</b>, <b>four</b>, <b>five</b>, <b>six</b>, <b>seven</b>, <b>eight</b>!","Cùng đếm nào: 1 đến 8!"],["🌊","It can swim, swim, swim in the sea. I think it is so cool!","Nó có thể bơi, bơi, bơi dưới biển. Con thấy nó ngầu lắm!"],["👋","Thank you for listening! Bye-bye!","Cảm ơn mọi người đã lắng nghe! Tạm biệt!"]],"swap":["<b>purple</b> → red / pink","<b>octopus</b> → crab (ten legs) / starfish (five arms)"],"ask":["How many legs does an octopus have?","Where does an octopus live?","What colour is your octopus?"]},
  {"type":"show","own":true,"badge":"⭐ Challenge","title":"Under the Sea: The Octopus","ic":"🐙","tip":"Bản dài. Câu \"How are you today?\" bé nhìn cả lớp và chờ các bạn trả lời. Câu \"Can you count to eight?\" bé mời cả lớp đếm cùng: tương tác giúp bé dạn dĩ, không như trả bài.","lines":[["👋","Hi, everyone! I'm {name}. How are you today?","Chào mọi người! Con là … Hôm nay mọi người thế nào?"],["🌊","Let's go under the sea with me!","Hãy cùng con lặn xuống dưới biển nhé!"],["🐙","Look! This is an <b>octopus</b>. It lives in the <b>blue</b> ocean.","Nhìn kìa! Đây là một con bạch tuộc. Nó sống ở đại dương xanh."],["👀","It has a big <b>head</b>, two big <b>eyes</b>, and <b>eight</b> long legs!","Nó có một cái đầu to, hai mắt to và 8 cái chân dài!"],["🔢","Can you count to eight? <b>One</b>, <b>two</b>, <b>three</b>, <b>four</b>, <b>five</b>, <b>six</b>, <b>seven</b>, <b>eight</b>!","Mọi người đếm tới 8 cùng con nhé!"],["🧠","The octopus is very smart.","Bạch tuộc rất thông minh."],["⛰️","It can swim very fast, and it can hide in the rocks.","Nó có thể bơi rất nhanh và trốn trong các tảng đá."],["🤩","I think sea animals are amazing! Thank you and bye-bye!","Con thấy động vật biển thật tuyệt vời! Cảm ơn và tạm biệt!"]],"swap":["<b>octopus</b> → whale (very big) / crab (red)","<b>eight</b> long legs → two big fins"],"ask":["Where does an octopus live?","What can an octopus do?","Which sea animal do you like?"]},
  {"type":"show","own":true,"badge":"⭐ Challenge","title":"My Cute Dog","ic":"🐶","tip":"Bản dài về thú cưng. Đến \"it wags its tail\" bé lắc hông như chó vẫy đuôi. Có thể thay \"Hello\" bằng \"Good morning\" nếu nói buổi sáng.","lines":[["👋","Hello, everyone! My name is {name}.","Chào mọi người! Con tên là …"],["🐶","Today, I want to tell you about a cute pet. It is a <b>dog</b>!","Hôm nay con muốn kể về một thú cưng dễ thương. Đó là một chú chó!"],["🐕","The dog is <b>brown</b> and <b>white</b>. It has two floppy <b>ears</b> and a wet <b>nose</b>.","Chú chó có màu nâu và trắng. Nó có hai chiếc tai cụp và một cái mũi ướt."],["🤗","It is very friendly and playful.","Nó rất thân thiện và thích chơi đùa."],["⚽","It can run fast, jump high, and catch a <b>red</b> <b>ball</b>!","Nó có thể chạy nhanh, nhảy cao và bắt quả bóng màu đỏ!"],["🐕","When it is <b>happy</b>, it wags its <b>tail</b> and says \"<b>Woof, woof</b>!\"","Khi vui, nó vẫy đuôi và sủa \"Gâu, gâu!\""],["❤️","Dogs are our best friends. Thank you for listening!","Chó là người bạn tốt nhất của chúng ta. Cảm ơn mọi người đã lắng nghe!"]],"swap":["<b>dog</b> → cat (Meow!)","<b>brown</b> and <b>white</b> → your pet's colours","Hello → Good morning"],"ask":["Do you have a pet?","What colour is your dog?","What can your dog do?"]},
  {"type":"show","own":true,"badge":"🌱 Easy","title":"On the Farm, In the Sea","ic":"🐖","tip":"Bé cầm 2 bức tranh (nông trại và biển). Câu cá voi bé dang rộng tay thật to. Câu \"They make me smile\" bé cười tươi.","lines":[["😄","Hello, everyone! I'm {name}. I'm super <b>happy</b> today!","Xin chào mọi người! Con là … Hôm nay con siêu vui!"],["🖼️","Look at these pictures! I'm excited to talk about animals.","Nhìn những bức tranh này nhé! Con rất hào hứng kể về các con vật."],["🐖","On the farm, I see <b>two</b> <b>pink</b> <b>pigs</b>.","Ở nông trại, con thấy 2 con heo hồng."],["🥰","They can eat and sleep. They are so cute!","Chúng có thể ăn và ngủ. Chúng dễ thương quá!"],["🐳","In the sea, I see <b>one</b> <b>blue</b> whale.","Ở dưới biển, con thấy 1 con cá voi xanh."],["🙌","Wow, it is very <b>big</b> and it can swim!","Ôi, nó rất to và biết bơi!"],["😊","I love animals so much! They make me smile.","Con yêu động vật lắm! Chúng làm con mỉm cười."],["👋","Thank you! Goodbye!","Cảm ơn! Tạm biệt!"]],"swap":["<b>two</b> <b>pink</b> <b>pigs</b> → three white sheep","<b>blue</b> whale → red crab"],"ask":["What do you see on the farm?","What do you see in the sea?","Which animal do you like?"]},
  {"type":"show","own":true,"badge":"⭐ Challenge","title":"A Day at the Farm and the Sea","ic":"🌊","tip":"Bản dài nhất. Dừng một nhịp ở \"First…\" và \"Next…\". Câu con cua bé bò ngang như cua. Câu \"Which animal do you like?\" bé hỏi cả lớp và chờ vài bạn trả lời.","lines":[["👋","Hello, teachers and friends! I'm {name}, and I'm feeling great today!","Xin chào thầy cô và các bạn! Con là …, hôm nay con cảm thấy rất tuyệt!"],["🐾","I love animals very much.","Con rất yêu động vật."],["🗺️","Today, I want to show you two places: the <b>farm</b> and the sea.","Hôm nay con muốn dẫn mọi người tới 2 nơi: nông trại và biển cả."],["🐖","First, on the farm, I see <b>two</b> <b>pink</b> <b>pigs</b> and <b>three</b> <b>yellow</b> <b>ducks</b>.","Đầu tiên, ở nông trại, con thấy 2 con heo màu hồng và 3 con vịt màu vàng."],["😴","The pigs like to eat and sleep.","Heo thích ăn và ngủ."],["🦆","The ducks can swim in the pond and say \"<b>Quack, quack</b>!\"","Vịt có thể bơi trong ao và kêu \"Cạp, cạp!\""],["🐳","Next, under the sea, I see a huge <b>blue</b> whale and a little <b>red</b> crab.","Tiếp theo, dưới biển, con thấy một con cá voi xanh khổng lồ và một chú cua nhỏ màu đỏ."],["🦀","The whale can swim deep in the <b>water</b>, and the crab walks sideways like this!","Cá voi bơi sâu dưới nước, còn cua thì bò ngang thế này nè!"],["🤔","Animals make our world so fun! Which animal do you like?","Động vật làm thế giới của chúng ta thật vui! Mọi người thích con vật nào?"],["👋","Thank you for listening to me. Goodbye!","Cảm ơn mọi người đã lắng nghe con. Tạm biệt!"]],"swap":["<b>pigs</b> / <b>ducks</b> → cows / chickens","whale / crab → octopus / turtle"],"ask":["What animals are on the farm?","What can the whale do?","How does a crab walk?"]}]}
