<style>
:root{--accent:var(--sky);--accent-soft:var(--sky-soft)}
.nav a.rv{border-style:dashed}
.goals{background:var(--gold-soft);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:.98rem}
.goals ul{margin:4px 0 0;padding-left:1.2em}
.goals .en,.ck .en{font-weight:700}
.ltabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:14px;scroll-margin-top:64px}
.ltabs .chip{flex:none}
.ltabs .chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.l-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.l-tag{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--surface);border-radius:999px;padding:3px 12px}
.l-head h3{font-size:1.6rem}
.subj{font-weight:700;font-size:.85rem;border:2px solid var(--jade);color:var(--jade);border-radius:8px;padding:1px 10px}
.l-intro{margin:-4px 0 12px;color:var(--muted)}
.sw{display:inline-block;width:1em;height:1em;border-radius:50%;border:3px solid rgba(0,0,0,.18);vertical-align:middle}
.nb{display:inline-grid;place-items:center;min-width:1.25em;height:1.25em;padding:0 .12em;border-radius:.3em;background:var(--gold);color:#fff;font-family:var(--f-display);font-weight:800;font-size:.8em;line-height:1}
.shp{width:1em;height:1em;display:inline-block;vertical-align:middle}
.z-big{font-size:1.25em;line-height:1}
.z-small{font-size:.55em}
.talks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.talk{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:14px;padding:10px 12px}
.t-ic{font-size:2.4rem;line-height:1;flex:none}
.t-body{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.t-q{display:flex;gap:8px;align-items:center;font-weight:700;font-size:1.05rem}
.t-a{font-weight:700;color:var(--ok);font-size:1.05rem}
.t-show{font-size:.9rem;padding:4px 12px}
.comic{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.frame{background:var(--accent-soft);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.f-top{display:flex;align-items:center;gap:8px}
.f-n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--surface);font-weight:800;flex:none}
.f-bg{font-size:1.8rem;line-height:1;flex:1;letter-spacing:.1em}
.f-who{font-size:2rem;line-height:1}
.bub{display:flex;gap:8px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer}
.bub:hover{border-color:var(--accent)}
.bub.speaking{border-color:var(--gold);background:var(--gold-soft)}
.b-av{font-size:1.5rem;line-height:1.1;flex:none}
.b-tx{font-size:1.05rem}
.b-tx small{display:block;color:var(--muted);font-size:.85rem}
.value{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:12px;background:var(--lacquer-soft);border-radius:14px;padding:10px 14px}
.v-tag{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--lacquer)}
.v-en{font-family:var(--f-display);font-weight:800;font-size:1.5rem;color:var(--lacquer)}
.v-vi{color:var(--ink)}
.ask{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.phon{margin-bottom:14px}
.phon:last-child{margin-bottom:0}
.pline{display:flex;gap:8px;align-items:center;font-size:1.15rem;font-weight:600;flex-basis:100%}
.pline b{color:var(--lacquer)}
.ck-u{margin-bottom:12px}
.ck-u>a{font-weight:800;color:var(--accent);text-decoration:none}
.ck{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ck-b{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:8px 10px;cursor:pointer}
.ck-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;margin-top:2px}
.ck-b[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.ck-b[aria-pressed="true"] .ck-box{background:var(--ok);border-color:var(--ok)}
.ck-b[aria-pressed="true"] .ck-box::after{content:"✓";color:#fff;font-weight:800;font-size:.9rem}
.g-prompt.qa{flex-direction:row}
.read-q{font-family:var(--f-display);font-weight:800;font-size:1.7rem;text-align:center}
.g-opts.one{grid-template-columns:1fr;max-width:480px}
.next-tab{display:flex;justify-content:flex-end;margin:-4px 0 16px}
.guide h3{font-size:1.3rem;color:var(--accent);margin-bottom:6px}
.guide p,.guide ol{margin:8px 0 0}
.g-u{border-top:1px solid var(--line);padding:10px 0}
.g-u summary{cursor:pointer;font-size:1.05rem}
.g-u h4{font-family:var(--f-display);font-size:1.1rem;margin:14px 0 4px;color:var(--accent)}
.g-u ul,.g-u ol{margin:4px 0;padding-left:1.3em}
.g-u .tip{margin:6px 0;color:var(--ink)}
.g-w{margin:4px 0}
.g-t{border-collapse:collapse;width:100%;margin:6px 0;font-size:.95rem}
.g-t td{border-top:1px solid var(--line);padding:4px 8px 4px 0;vertical-align:top;width:50%}
.g-t td+td{color:var(--muted)}
.g-rv{border-top:1px solid var(--line);margin:0;padding:10px 0}
.g-rv a{font-weight:800;color:var(--accent);text-decoration:none}
.no-speech [data-playall]{display:none}
@media (max-width:560px){ .comic{grid-template-columns:1fr} .g-opts.one{max-width:none} .read-q{font-size:1.35rem} }
</style>

<script>
/* Mỗi Unit: goals (mục tiêu), lessons (4 bài), phonics (âm), chant.

window.UNITS={

  '<ol class="steps"><li><b>Lesson 1:</b> học 6–8 từ mới và một mẫu câu chính, luyện "Let\'s talk" (hỏi – đáp theo tranh).</li>'+
  '<li><b>Lesson 2:</b> thêm từ mới cùng chủ đề và mở rộng mẫu câu (một → nhiều, khẳng định → hỏi, "Yes / No").</li>'+
  '<li><b>Lesson 3:</b> truyện tranh 4 khung dùng lại từ và câu của Lesson 1–2, kèm câu giao tiếp (Thank you, I\'m sorry, Excuse me…) và một bài học thái độ (Value).</li>'+
  '<li><b>Lesson 4:</b> bài liên môn (Toán, Mĩ thuật, Khoa học, Sức khỏe) để dùng tiếng Anh vào việc khác.</li></ol>'+
  '<p>Sau đó là <b>Phonics &amp; Chant</b> (âm → từ → câu, rồi bài chant ôn lại cả Unit) và <b>Games</b> (nghe chọn hình, đọc chọn hình, nhìn hình chọn chữ, hỏi – đáp). Cứ 2 Unit có một bài <b>Review</b> để con tự tích "I can…".</p>'+
  '<p>Các Unit nối với những bài con đang học trên lớp: câu lệnh trong lớp (Starter), bài nói About Me (Unit 1), đồ dùng học tập và hình khối (Unit 2), cơ thể và hoạt động phòng tắm (Unit 4), các phòng, đồ vật trong nhà và vị trí in / on / under (Unit 6), bộ phận của cây (Unit 8).</p>'+
