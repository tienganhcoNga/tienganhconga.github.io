   cu:'1 chiếc đĩa tròn, 1 quyển sách hình chữ nhật, 1 chiếc khăn ăn gấp hình tam giác, 2 cây bút chì (hoặc 2 chiếc đũa) dài ngắn khác nhau, 1 sợi dây hoặc thước dây, thẻ chữ <b>C</b> và <b>T</b>.',
   vocab:[['Hình học (Shapes)','<i>circle</i> (hình tròn), <i>square</i> (hình vuông), <i>triangle</i> (hình tam giác), <i>rectangle</i> (hình chữ nhật), <i>side</i> (cạnh), <i>corner</i> (góc)'],
    ['Đo lường (Measurement)','<i>long – short</i> (dài – ngắn), <i>tall – short</i> (cao – thấp), <i>big – small</i> (to – nhỏ), <i>measure</i> (đo)']],
   say:["<i>What shape is it?</i> → <i>It's a circle.</i>",'<i>Which one is longer / shorter?</i> → <i>The blue pencil is longer.</i>'],
   parts:[['1. Khởi động và vẽ hình trên không',5,'Toán (hình) và TPR',['Hát bài về hình (Shape Song).','Tạo hình bằng cơ thể (Body Shapes), cô hô và làm mẫu: <i>Make a circle with your arms!</i> (vòng hai tay qua đầu); <i>Make a triangle with your fingers!</i> (chụm ngón cái và ngón trỏ); <i>Draw a big square in the air!</i>'],['Bắt chước động tác và hô to tên hình: <i>Circle! Triangle! Square!</i>']],
    ['2. Săn tìm hình trong nhà',10,'Toán và nói',['Shape Scavenger Hunt: cô giơ vật mẫu lên (hoặc lên camera) và ra lệnh trong 10 giây: <i>Go find something that is a circle!</i> (cái đĩa, nắp hộp); <i>Go find a rectangle!</i> (quyển sách, hộp bút).','Bé mang đồ về, cô hỏi: <i>What did you find? What shape is it? How many corners does it have?</i>'],['Chạy đi tìm đồ vật thật trong phòng.',"Giơ lên và trả lời: <i>It's a book. It's a rectangle!</i>"]],
    ['3. Thử thách đo lường',10,'Toán (đo lường)',['Giơ 2 cây bút chì dài ngắn khác nhau: <i>Look! This pencil is long</i> (dang rộng hai tay). <i>This pencil is short</i> (thu hai tay lại). <i>Which one is longer?</i>','Đo không chuẩn: bé dùng gang tay hoặc cây bút chì đo xem quyển sách dài bằng mấy cây bút chì.'],['Dang tay, thu tay theo cô.','Chỉ đúng vật dài hơn: <i>This one is longer!</i>','Tự đếm số lần đo: <i>One, two… Two pencils long!</i>']],
    ['4. Âm đầu (phonics) và chào kết',5,'Tiền đọc',['Đưa thẻ chữ <b>C</b> và <b>T</b>, luyện âm đầu: <i>/k/ /k/ corner!</i> (chạm vào góc bàn); <i>/t/ /t/ triangle!</i> (vẽ 3 nét thẳng nối nhau).','Lưu ý: chữ C trong <i>circle</i> đọc là /s/ (sơ-cồ), không phải /k/; luyện âm /k/ bằng <i>corner, car, cat</i>.','Khen ngợi và đập tay chào kết (High-five! Học trực tuyến thì giơ tay lên camera).'],['Phát âm đúng âm /k/ và /t/.','Nhận ra mặt chữ C và T khi cô giơ thẻ bất kỳ.']]],
   tips:['Bé 5 tuổi phụ trách chạy đi tìm đồ vật theo hình (Scavenger Hunt).','Bé 7 tuổi phụ trách đếm cạnh và góc (<i>4 sides, 4 corners</i>) và đọc kết quả đo bằng tiếng Anh (<i>The book is three pencils long.</i>).']},
  {units:['u10'],t:'Giáo án 2: Khoa học an toàn và giao thông (Safety & Traffic)',
   goal:'Bé nhận biết phương tiện, hiểu quy tắc đèn tín hiệu, phân biệt hành vi an toàn và nguy hiểm, đọc hiểu biển báo cơ bản.',
   cu:'3 tờ giấy màu (hoặc 3 quả bóng) đỏ, vàng, xanh lá; 1 chiếc xe đồ chơi; 1 chiếc mũ bảo hiểm; 1 tấm bìa chữ <b>STOP</b> (hình bát giác màu đỏ) và 1 tấm bìa chữ <b>GO</b> (màu xanh).',
   vocab:[['Giao thông (Traffic)','<i>traffic light</i> (đèn giao thông), <i>crosswalk / zebra crossing</i> (vạch qua đường), <i>helmet</i> (mũ bảo hiểm), <i>sidewalk</i> (vỉa hè), <i>car, motorbike, bicycle</i>'],
    ['Hành động và quy tắc (Safety rules)','<i>stop</i> (dừng lại), <i>slow down / wait</i> (đi chậm / chờ), <i>go</i> (đi), <i>look left, look right</i> (nhìn trái, nhìn phải), <i>safe</i> (an toàn), <i>dangerous</i> (nguy hiểm)']],
   say:['<i>What does the red light mean?</i> → <i>Red light means stop!</i>','<i>Is it safe or dangerous?</i> → <i>It is safe! / It is dangerous!</i>'],
   parts:[['1. Khởi động: trò chơi đèn giao thông',7,'Khoa học (giao thông) và TPR',['Luật chơi "Red Light, Green Light": bé giả vờ lái ô tô, xe máy tại chỗ.','Cô giơ lần lượt 3 màu: xanh → <i>Green light! Go!</i> (chạy bước nhỏ tại chỗ); vàng → <i>Yellow light! Slow down!</i> (chạy thật chậm); đỏ → <i>Red light! Stop!</i> (đứng im như tượng).'],['Phản xạ đúng theo màu và hô to: <i>Go! Slow down! Stop!</i>']],
    ['2. Sang đường và mũ bảo hiểm',8,'Kỹ năng sống và nói',['Giơ mũ bảo hiểm: <i>What is this? When we ride a motorbike, we must put on a helmet to be safe.</i> Bé giả vờ đội mũ và cài quai: <i>Click!</i>',"Ba bước qua vạch kẻ đường: 1. <i>Stop at the sidewalk!</i> 2. <i>Look left, look right, look left again!</i> 3. <i>Hold Mommy's hand and walk!</i>"],['Làm động tác đội mũ, quay đầu nhìn trái – phải.','Nói trọn cụm: <i>Put on a helmet! Look left, look right!</i>']],
    ['3. Thử thách: an toàn hay nguy hiểm?',10,'Tư duy phản biện',['Cô diễn các tình huống, bé giơ ngón cái lên (<i>Safe</i>) hoặc chúc xuống (<i>Dangerous</i>): chạy vụt qua đường không nhìn xe; ngồi ô tô thắt dây an toàn (<i>seatbelt</i>); thò tay gần ổ điện hoặc cầm kéo nhọn chạy nhảy.','Hỏi bé lớn: <i>Why is it dangerous?</i> (gợi ý: <i>Cars are fast. You can get hurt.</i>)'],['Phản xạ nhanh: <i>Dangerous!</i> hoặc <i>Safe!</i>','Giải thích đơn giản: <i>Because cars are very fast!</i>']],
    ['4. Đọc biển báo và chào kết',5,'Tiền đọc',['Giơ tấm bìa chữ <b>STOP</b> (đỏ) và <b>GO</b> (xanh). Giải thích: ra đường thấy chữ S-T-O-P màu đỏ là phải dừng lại ngay.','Bé đọc to STOP – GO 3 lần rồi đập tay chào kết.'],['Nhận ra và đọc đúng STOP, GO như đọc một bức tranh, không cần đánh vần.']]],
   tips:['Bé 7 tuổi đóng vai cảnh sát giao thông (<i>Traffic Police</i>), cầm thẻ đỏ – vàng – xanh điều khiển cho em 5 tuổi chạy, dừng trong trò khởi động.','Ở phần an toàn hay nguy hiểm, bé 5 tuổi giơ ngón cái; bé 7 tuổi giải thích <i>Why?</i> bằng một câu.']}],

  guide:{answers:['Về bản thân: tên → <i>My name is Bin.</i>; tuổi → <i>I\'m six years old.</i>; sống ở đâu → <i>I live in Ha Noi.</i>; lạc mẹ → <i>My mom\'s phone number is…</i> (bé đọc số thật); nhà mấy người → <i>Four people!</i>','Nghe và chọn: name 🏷️, years old 🎂, house 🏠, street 🛣️, city 🏙️, phone number 📞, family 👪, number 🔢.'],
   home:["Tập cho bé nói trọn câu bằng tiếng Việt <b>và</b> tiếng Anh: họ tên đầy đủ, tuổi, tên đường, thành phố.","Viết số điện thoại của ba hoặc mẹ to lên giấy. Mỗi tối bé đọc một lần bằng tiếng Việt, rồi tập đọc từng số bằng tiếng Anh: <i>zero, nine, one…</i>","Đóng vai bị lạc: ba mẹ làm chú bảo vệ hỏi <i>What's your name? What's your mom's phone number?</i>"],
   tips:["<i>Years old</i>: \"dia-zâu\", âm /z/ cuối <i>years</i> nối sang <i>old</i>.","<i>Street</i>: ba phụ âm /str/ đọc liền, cuối có /t/ nhẹ.","<i>Phone</i>: \"phôn\", âm /f/ răng trên chạm môi dưới, không đọc \"pôn\"."]},
  pre:{sum:['Họ tên, tuổi, địa chỉ, số điện thoại người thân; các thành viên trong gia đình','Chữ số 0–9 qua số điện thoại; đếm và so sánh số người trong nhà','Âm /n/ (<i>name</i>), /m/ (<i>my, mom</i>); tư thế ngồi, cầm bút 3 ngón; nét thẳng, nét ngang'],
   cu:'Ảnh gia đình, thẻ số 0–9 (hoặc giấy viết số), giấy 4 dòng kẻ hoặc vở ô ly, bút chì, một tờ giấy ghi to số điện thoại của ba mẹ.',
   parts:[['1. Khởi động và khám phá',8,'Khoa học<br>(bản thân)',['Cùng bé xem ảnh gia đình. Hỏi: "Đây là ai? Nhà mình có mấy người?"','Hỏi tư duy: "Nếu con bị lạc, con cần nói gì với chú bảo vệ?" (họ tên, tên ba mẹ, số điện thoại).','Tập nói trọn câu: "Con tên là… Con … tuổi. Nhà con ở đường…"'],['Nói trọn câu họ tên, tuổi, địa chỉ.','Biết nhờ người lớn đáng tin (chú bảo vệ, cô giáo) khi bị lạc.']],
    ['2. Trò chơi số lượng',10,'Toán',['Đặt thẻ số 0–9 lên bàn. Ba mẹ đọc chậm số điện thoại, bé tìm thẻ và xếp thành hàng.','Đếm người trong ảnh: "Có mấy người lớn? Mấy bạn nhỏ? Bên nào nhiều hơn?"','Hỏi: "Nhà mình thêm một em bé thì có mấy người?"'],['Nhận biết đúng chữ số 0–9.','Đếm, so sánh nhiều hơn – ít hơn trong phạm vi 10.']],
    ['3. Luyện âm và nét chữ',10,'Tiền đọc<br>tiền viết',['Âm: nói "<i>name</i>: /n/ /n/ <i>name</i>" và "<i>mom</i>: /m/ /m/ <i>mom</i>". Bé tìm đồ trong nhà bắt đầu bằng âm /m/ (<i>milk, mango</i>).','Tư thế: ngồi thẳng, hai chân chạm sàn, tay trái giữ giấy; cầm bút bằng 3 ngón (cái, trỏ, giữa).','Nét: tô 1 dòng nét thẳng đứng và 1 dòng nét ngang (nét của số 1 và chữ <i>l, t</i>).'],['Nghe ra âm /n/, /m/ ở đầu từ.','Ngồi đúng, cầm bút đúng, kẻ nét thẳng không run.']],
    ['4. Tổng kết và giao nhiệm vụ',2,'Kỹ năng sống',['Khen sự tập trung của bé.','Cùng bé dán số điện thoại của ba mẹ lên tủ lạnh.'],['Hào hứng khoe với cả nhà: "Con thuộc số của mẹ rồi!"']]],
   task:'Mỗi tối đọc to số điện thoại của ba hoặc mẹ một lần. Cuối tuần bé tự nói được không cần nhìn giấy.',
   en:'name, years old, house, street, city, phone number, family'}},

  speech:{t:"My Five Senses",intro:["Today, I will tell you about my five senses!","Hôm nay tớ sẽ kể về năm giác quan của tớ!"],lines:[["👀","I <b>see</b> with my eyes.","Tớ nhìn bằng mắt."],["👂","I <b>hear</b> with my ears.","Tớ nghe bằng tai."],["👃","I <b>smell</b> with my nose.","Tớ ngửi bằng mũi."],["👅","I <b>taste</b> with my tongue.","Tớ nếm bằng lưỡi."],["✋","I <b>touch</b> with my hands.","Tớ sờ bằng tay."],["🧼","I <b>wash my hands</b> before I eat.","Tớ rửa tay trước khi ăn."]],end:["I keep my body clean!","Tớ giữ cơ thể sạch sẽ!"]},

    {pic:'🎵',vi:'Bé nghe một bài hát.',en:"Listen to the music.",say:'What do you use?',o:[['👂','My ears!'],['👀','My eyes!'],['👅','My tongue!']],a:0},

    {pic:'🧸',vi:'Bé sờ con gấu bông mềm mại.',en:"Touch the teddy bear. It's soft.",say:'What do you use?',o:[['✋','My hands!'],['👅','My tongue!'],['👃','My nose!']],a:0}]},

  guide:{answers:['Giác quan nào: hoa → <i>My nose!</i>; nhạc → <i>My ears!</i>; kẹo → <i>My tongue!</i>; cầu vồng → <i>My eyes!</i>; gấu bông → <i>My hands!</i>','Giữ sạch: trước khi ăn → <i>I wash my hands.</i>; sáng ngủ dậy → <i>I brush my teeth.</i>; tối người bẩn → <i>I take a bath.</i>'],
   home:["Hộp bí mật: bỏ vài đồ vào hộp, bé nhắm mắt sờ rồi đoán; ngửi chanh, nếm muối – đường để nói <i>I smell… I taste…</i>","Mỗi lần rửa tay hát bài <i>This Is the Way We Wash Our Hands</i> đủ 20 giây.","Đi dạo, hỏi bé: <i>What can you see? What can you hear?</i>"],
   tips:["<i>See / smell</i>: âm /s/ rõ ở đầu, không đọc \"xi\" quá nhẹ.","<i>Taste</i>: cuối có /st/, đọc \"tây-st\".","<i>Teeth</i>: âm /θ/ cuối: đặt đầu lưỡi giữa hai hàm răng rồi thổi hơi."]},
  pre:{sum:['Năm giác quan, bộ phận cơ thể; rửa tay, đánh răng, tự phục vụ','Đếm ngón tay 1–10; bằng nhau (2 mắt = 2 tai), dấu =','Âm /s/ (<i>see, smell</i>), /t/ (<i>taste, touch</i>); nét xiên trái, nét xiên phải'],
   cu:'Một hộp giấy có khoét lỗ, khăn bịt mắt, vài đồ vật (quả chanh, viên đường, cục bông, cái chuông), xà phòng, khăn lau tay, giấy và bút chì.',
   parts:[['1. Khởi động và khám phá',8,'Khoa học<br>(cơ thể)',['Chơi hộp bí mật: bé thò tay sờ đoán đồ vật; bịt mắt ngửi chanh; lắc chuông cho bé nghe.','Hỏi tư duy: "Con biết đó là quả chanh nhờ bộ phận nào?"','Cùng rửa tay đúng 6 bước, vừa rửa vừa hát.'],['Nói trọn câu: "Con ngửi bằng mũi ạ."','Gọi đúng 5 giác quan và bộ phận tương ứng; rửa tay đủ 6 bước.']],
    ['2. Trò chơi số lượng',10,'Toán',['Đếm ngón tay một bàn (5), hai bàn (10). Giơ 3 ngón, hỏi "cần thêm mấy ngón nữa thì được 5?"','So sánh bằng nhau: 2 mắt – 2 tai – 2 tay. Giới thiệu dấu = ("bằng nhau").','Đặt 4 cục bông và 4 viên đường: "Hai bên thế nào?"'],['Đếm đúng đến 10 trên ngón tay.','Nhận ra hai nhóm bằng nhau và dùng dấu =.']],
    ['3. Luyện âm và nét chữ',10,'Tiền đọc<br>tiền viết',['Âm: "<i>see</i>: /s/ /s/, <i>smell</i>: /s/". Bé làm tiếng rắn "sssss" khi nghe từ bắt đầu bằng /s/.','Nét: dùng ngón trỏ vẽ nét xiên trên không như cầu trượt, rồi tô 1 dòng nét xiên trái và 1 dòng nét xiên phải (nét của chữ <i>v, w</i>).'],['Nghe ra âm /s/ ở đầu từ.','Tô nét xiên đúng chiều, đều tay.']],
    ['4. Tổng kết và giao nhiệm vụ',2,'Kỹ năng sống',['Khen bé rửa tay sạch.','Giao nhiệm vụ: tự rửa tay trước mỗi bữa ăn, tự đánh răng sáng và tối.'],['Tự giác rửa tay, đánh răng.']]],
   task:'Trước mỗi bữa ăn bé tự rửa tay và nói <i>I wash my hands!</i>; tối kể một thứ con nhìn thấy và một thứ con nghe thấy trong ngày.',
   en:'see, hear, smell, taste, touch, wash my hands, brush my teeth, take a bath'}},

 {id:'u3',n:'Unit 3',en:'The Secret Garden: Seeds Grow!',vi:'Khu vườn bí mật: hạt nảy mầm',ic:'🌱',review:'giác quan: I see with my eyes.',

  speech:{t:"My Bean Plant",intro:["Today, I will tell you about my bean plant!","Hôm nay tớ sẽ kể về cây đậu của tớ!"],lines:[["🌰","This is my <b>seed</b>. It's small.","Đây là hạt giống của tớ. Nó nhỏ xíu."],["🟫","I put it in the <b>soil</b>.","Tớ đặt nó vào đất."],["💧","I give it <b>water</b> every day.","Ngày nào tớ cũng tưới nước."],["☀️","It needs the <b>sun</b>, too.","Nó cũng cần nắng nữa."],["🌱","Look! A <b>sprout</b>! It has two <b>leaves</b>.","Nhìn này! Một mầm cây! Nó có hai chiếc lá."],["🌻","One day, it will be a big <b>plant</b>!","Một ngày nào đó nó sẽ thành một cái cây to!"]],end:["I love my garden!","Tớ yêu khu vườn của tớ!"]},

  hw:{"e":["Seed!","Yes! A small brown seed. It needs water!"],"s":["Để cốc đậu cạnh bình nước nhưng không tưới, chờ bé nhắc.","Mom, water the seed!"],"c":["Water or juice for the plant?","Water!"],"b":["What is the girl doing?","She waters the flowers!"],"x":"bean, cotton, cup, grow, root"},
  guide:{answers:['Trồng cây: nghe → bấm seed 🌰, soil 🟫, water 💧, sun ☀️ để bỏ vào xô.','Đếm hạt: đếm hình, chọn số đúng (1–10).','Cây cần gì: hạt → <i>Water and sun!</i>; cây héo → <i>Water, please!</i>; mầm thành → <i>A flower!</i>'],
   home:["Gieo hạt đậu vào cốc bông ẩm (theo giáo án), đặt cạnh cửa sổ. Mỗi sáng hỏi: <i>Is it big or small? Can you see a sprout?</i>","Chụp ảnh cốc đậu mỗi ngày, cuối tuần xếp ảnh theo thứ tự và kể lại.","Hát bài <i>Plant a Little Seed</i> kèm động tác."],
   tips:["<i>Seed</i>: âm /iː/ kéo dài, cuối có /d/ nhẹ: \"xii-đ\".","<i>Sprout</i>: /spr/ đọc liền, \"sprao-t\".","<i>Leaf / leaves</i>: số nhiều đổi f thành v: <i>leaves</i>."]},
  pre:{sum:['Hạt cần nước, đất, nắng để nảy mầm; quan sát cây lớn lên','Đếm hạt, tách – gộp trong phạm vi 7; trái – phải','Âm /s/ (<i>seed, sun, soil</i>), /w/ (<i>water</i>); nét cong hở phải (chữ <i>c</i>)'],
   cu:'10 hạt đậu (hoặc hạt ngô, sỏi), 1 cốc nhựa trong, bông gòn, 2 cái đĩa, 1 chiếc thìa, giấy 4 dòng kẻ hoặc vở ô ly, bút chì, thẻ chữ <b>s</b>, <b>w</b>.',
   parts:[['1. Khởi động và khám phá',8,'Khoa học',['Cho bé quan sát hạt đậu thật, sờ và tả hình dáng, màu sắc.','Hỏi tư duy: "Theo con, hạt đậu nhỏ xíu này cần gì để lớn lên thành cây?" (nước, đất, ánh nắng).','Cùng bé gieo hạt đậu vào cốc bông ẩm. Nói từ tiếng Anh đúng lúc: <i>seed, water, sun</i>.'],['Nói trọn câu: "Hạt đậu màu nâu, hình bầu dục ạ."','Nêu được cây cần nước và nắng để sống.']],
    ['2. Trò chơi số lượng',10,'Toán',['Đếm và tách gộp: đặt 7 hạt đậu lên bàn, bé đếm to, rồi chia vào 2 đĩa (ví dụ 4 bên trái, 3 bên phải).','Hỏi: "Bên nào nhiều hơn? Làm sao để hai bên bằng nhau?"','Định hướng: "Con đặt cốc hạt đậu ở bên phải quyển vở, đặt chiếc thìa ở bên trái nhé."'],['Đếm đúng, biết tách – gộp trong phạm vi 7.','Xác định đúng tay trái – tay phải và vị trí đồ vật.']],
    ['3. Luyện âm và nét chữ',10,'Tiền đọc<br>tiền viết',['Nhận diện chữ: đưa thẻ <b>s</b> (<i>seed, sun</i>) và <b>w</b> (<i>water</i>). Ba mẹ đọc âm /s/, /w/ (không đọc tên chữ), bé tìm thẻ đúng.','Nét cơ bản: bé dùng ngón trỏ "viết" nét cong hở phải (chữ <i>c</i>) lên không trung, rồi tô 1 dòng nét cong hở phải vào vở.'],['Phát âm đúng âm /s/, /w/.','Ngồi thẳng lưng, cầm bút đúng, tô tròn đều nét cong theo đường kẻ.']],

    ['3. Luyện âm và nét chữ',10,'Tiền đọc<br>tiền viết',['Âm: "<i>bee</i>: /b/ /b/". Bé vỗ tay mỗi khi nghe từ bắt đầu bằng /b/: <i>bee, bear, ball, dog, butterfly</i>.','Nét: tô 1 dòng nét móc xuôi và 1 dòng nét móc ngược (nét của chữ <i>n, u, h</i>).'],['Nghe ra âm /b/ và tách được từ không bắt đầu bằng /b/.','Tô nét móc đúng điểm đặt bút, đều nét.']],

  pre:{sum:['Chia đồ ăn cho cả nhà; ăn uống lành mạnh (trái cây)','Tách – gộp 5, 6, 7 bằng vật thật; thêm vào (cộng), bớt đi (trừ) trong phạm vi 10; dấu +, −, =','Âm /a/ (<i>apple, add</i>); ghép âm đầu tiên: <i>a-t = at</i>; nét cong kín (chữ <i>o, a</i>)'],
   cu:'10 quả nhỏ hoặc kẹo, 10 que tính, 2 cái đĩa, thẻ dấu + − =, thẻ số 0–10, giấy và bút chì.',
   parts:[['1. Khởi động và khám phá',8,'Khoa học<br>(ăn uống)',['Bày trái cây, hỏi: "Ăn trái cây giúp gì cho cơ thể?" (khỏe, đẹp da, không ốm).','Cùng bé chia trái cây cho cả nhà: mỗi người một quả, thiếu thì làm sao?'],['Nói trọn câu: "Ăn trái cây giúp con khỏe mạnh."','Biết chia đều cho mọi người.']],
    ['2. Trò chơi số lượng',10,'Toán',['Gộp: đĩa trái 3 que, đĩa phải 2 que. Dồn vào một đĩa: "Tất cả có mấy que?" Đặt thẻ 3 + 2 = 5 bên cạnh.','Tách: 6 viên kẹo chia hai đĩa theo nhiều cách (1 và 5, 2 và 4, 3 và 3).','Bớt: có 5 quả, "ăn" 1 quả: "Còn lại mấy quả?" Đặt thẻ 5 − 1 = 4.'],['Hiểu thêm vào là nhiều lên, bớt đi là ít đi.','Tách – gộp đúng trong phạm vi 7, tính nhẩm với đồ thật trong phạm vi 10.']],
    ['3. Luyện âm và nét chữ',10,'Tiền đọc<br>tiền viết',['Âm: "<i>apple</i>: /æ/ /æ/" (miệng mở rộng như "e" và "a"). Ghép âm đầu tiên: /æ/ + /t/ = <i>at</i>.','Nét: tô 1 dòng nét cong kín (chữ <i>o</i>), rồi 1 dòng chữ <i>a</i> (nét cong kín và nét móc).'],['Phát âm âm /æ/, ghép được <i>at</i>.','Tô nét cong kín tròn đều, khép kín.']],
    ['4. Tổng kết và giao nhiệm vụ',2,'Kỹ năng sống',['Khen bé chia đều.','Giao nhiệm vụ: giờ ăn trái cây, bé tự chia cho mọi người và nói còn lại mấy quả.'],['Biết chia sẻ, đếm và nói phép tính bằng lời.']]],
   task:'Mỗi bữa trái cây, ba mẹ đặt một câu đố thêm – bớt bằng đồ thật: <i>You have four. You eat one. How many are left?</i>',
   en:'plus, one more, altogether, take away, one less, zero, equals, how many'}},

  guide:{answers:['Nặng hay nhẹ: gạch, voi → <i>It\'s heavy!</i>; bóng bay, chiếc lá → <i>It\'s light!</i>','Dài, ngắn, cao: tàu → <i>It\'s long!</i>; sâu → <i>It\'s short!</i>; hươu và cánh cụt → <i>The giraffe is tall!</i>; hai bút bằng nhau → <i>They\'re the same!</i>; bút chì và bút sáp → <i>The blue pencil is longer.</i>; đũa và thìa → <i>The spoon is shorter.</i>; đo sách → <i>Two pencils long!</i>','Be long, be short: không có đáp án. Bé làm động tác theo lệnh.','Nghe và chọn: heavy 🧱, light 🎈, scale ⚖️, long 🚂, short 🐛, tall 🦒, measure 📏, the same 👯.'],

   cu:'Móc áo và 2 túi ni lông (làm cân), vài đồ vật (quả cam, cục bông, viên sỏi, chiếc thìa), chậu nước, que tính, giấy và bút chì.',

   cu:'Đèn pin, quả cam (làm Trái Đất), 2 thùng hoặc hộp có dán chữ <i>recycle / trash</i>, vài món "rác sạch" (chai nhựa, giấy, vỏ hộp), tranh 4 buổi trong ngày, giấy và bút chì.',
   parts:[['1. Khởi động và khám phá',8,'Khoa học<br>(tự nhiên, môi trường)',['Tắt đèn, soi đèn pin vào quả cam rồi xoay chậm: "Phía sáng là ban ngày, phía tối là ban đêm."','Hỏi tư duy: "Nếu ai cũng vứt rác xuống sông thì cá sẽ thế nào?"','Phân loại rác sạch vào 2 thùng.'],['Nói trọn câu: "Mặt trời chiếu sáng thì là ban ngày."','Phân loại đúng rác tái chế và rác thường.']],
    ['2. Trò chơi số lượng',10,'Toán',['Xếp 4 tranh theo thứ tự: sáng (thức dậy) → trưa (ăn trưa) → chiều (đi chơi) → tối (đi ngủ).','Đếm số rác ở mỗi thùng, so sánh &gt;, &lt;, =.','Hỏi: "Thêm 2 chai nữa thì thùng tái chế có mấy món?"'],['Sắp xếp đúng thứ tự thời gian trong ngày.','Đếm, so sánh và thêm trong phạm vi 10.']],

    ['4. Tổng kết và giao nhiệm vụ',2,'Kỹ năng sống',['Khen bé là "người bảo vệ Trái Đất".','Giao nhiệm vụ: mỗi ngày phân loại rác của cả nhà và nhắc mọi người khóa vòi nước.'],['Có ý thức tiết kiệm nước, bỏ rác đúng chỗ.']]],

   en:'day, night, star, windy, storm, save water, recycle, trash'}},

  hw:{"e":["Red!","Yes! Red light. Stop and wait!"],"s":["Trước khi lên xe máy, bố giả vờ quên mũ bảo hiểm của bé.","Daddy! My helmet, please!"],"c":["Stop or go? The light is red.","Stop!"],"b":["Is the boy safe?","No! He runs on the road!"],"x":"road, sidewalk, car, motorbike, socket"},
  guide:{answers:['Traffic light says: không có đáp án. Bé làm động tác khi máy nói "Traffic light says…".','An toàn hay không: đèn đỏ → <i>I stop and wait.</i>; bếp lửa → <i>No! It\'s hot!</i>; dao → <i>No! It\'s sharp!</i>; ổ điện → <i>Don\'t touch! Danger!</i>; lên xe máy → <i>I wear my helmet.</i>','An toàn hay nguy hiểm: chạy qua đường → <i>Dangerous! Cars are fast!</i>; thắt dây an toàn → <i>Safe!</i>; cầm kéo chạy → <i>Dangerous! You can get hurt!</i>; nắm tay mẹ qua đường → <i>Safe!</i>; ổ điện → <i>Dangerous!</i>','Đọc biển: STOP → <i>Stop!</i>; GO → <i>Go!</i>; đèn đỏ → <i>Red light means stop!</i>; đèn vàng → <i>Yellow light means slow down!</i>; đèn xanh → <i>Green light means go!</i>','Nghe và chọn: traffic light 🚦, stop 🛑, go 🟢, wait ⏳, crosswalk 🚸, helmet ⛑️, hot 🔥, sharp 🔪, school bag 🎒, safe ✅, dangerous ⚠️, seatbelt 💺.'],
   home:["Mỗi lần ra đường, đến ngã tư hỏi bé: <i>Red or green? Stop or go?</i>","Đi một vòng quanh nhà chỉ đồ nguy hiểm: ổ điện, bếp, dao, kéo, phích nước nóng; bé nói <i>Hot! Sharp! Danger!</i>","Cùng bé chuẩn bị cặp sách: đếm bút, gọi tên đồ dùng, tập tự đeo cặp và tự cất đồ."],
   tips:["<i>Traffic light</i>: TRA-fic lai-t.","<i>Helmet</i>: HEL-mít, âm /l/ rõ.","<i>Danger</i>: ĐÂY-giơ, âm /dʒ/ ở giữa."]},
  pre:{sum:['Đèn tín hiệu, biển báo cơ bản, đi bộ qua đường; tránh điện, lửa, vật sắc nhọn; chuẩn bị cặp sách','Trái – phải, trước – sau; đếm xe và đồ dùng học tập; ôn đếm, thêm – bớt','Âm /g/ (<i>go, green</i>), /r/ (<i>red, road</i>); ghép <i>r-e-d = red</i>; ôn các nét, tập viết tên mình'],
   cu:'Tấm bìa 3 màu đỏ – vàng – xanh (làm đèn), tranh vài biển báo, băng dính trắng dán vạch qua đường trên sàn, cặp sách và đồ dùng học tập, giấy và bút chì.',
   parts:[['1. Khởi động và khám phá',8,'Khoa học<br>(an toàn)',['Chơi đèn giao thông: ba mẹ giơ màu, bé đi – dừng – đi chậm trên "vạch qua đường" dán ở sàn.','Xem tranh biển báo: đường dành cho người đi bộ, cấm đi ngược chiều, trường học.','Hỏi tư duy: "Vì sao không được chạm vào ổ điện, bếp lửa, dao kéo?"'],['Nói trọn câu: "Đèn đỏ con dừng lại."','Biết 3 màu đèn và 3 thứ nguy hiểm trong nhà.']],
    ['2. Trò chơi số lượng',10,'Toán',['Qua đường: "Nhìn bên trái, nhìn bên phải, nhìn lại bên trái." Bé giơ đúng tay trái, tay phải.','Xếp hàng đồ chơi: "Ai đứng trước con gấu? Ai đứng sau?"','Soạn cặp: đếm bút, đếm vở; "Có 3 bút, thêm 2 bút là mấy bút?"'],['Phân biệt đúng trái – phải, trước – sau.','Đếm và thêm – bớt đồ dùng trong phạm vi 10.']],
    ['3. Luyện âm và nét chữ',10,'Tiền đọc<br>tiền viết',['Âm: "<i>go</i>: /g/", "<i>red</i>: /r/". Ghép âm: /r/ + /e/ + /d/ = <i>red</i>.','Ôn các nét đã học; tập viết tên của bé bằng chữ in hoa, mỗi chữ một ô.'],['Ghép được <i>red</i>, đọc được vài từ 3 âm.','Viết được tên mình.']],
    ['4. Tổng kết và giao nhiệm vụ',2,'Kỹ năng sống',['Khen bé đã sẵn sàng vào lớp 1.','Giao nhiệm vụ: mỗi tối tự soạn cặp sách cho ngày hôm sau.'],['Tự tin, tự lập, biết giữ an toàn khi ra đường.']]],

   en:'traffic light, stop, go, wait, crosswalk, helmet, hot, sharp, school bag'}}
