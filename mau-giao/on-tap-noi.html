 guide:'<h3>Vì sao có bài ôn nói?</h3>'+
  '<p>Mỗi Unit bé học 7–12 từ. Nếu không dùng lại, sau vài tuần bé sẽ quên. Bài ôn nói gom từ của <b>tất cả</b> các Unit đã học vào câu chuyện, cuộc trò chuyện và bài giới thiệu, để bé dùng từ cũ cùng từ mới một cách tự nhiên.</p>'+
  '<h3>Khi nào ôn?</h3>'+
  '<ul><li>Học xong <b>Unit 3</b> của Giai đoạn 1: ôn từ của Unit 1–3.</li><li>Sau đó cứ <b>2 Unit</b> ôn một lần: Unit 1–5, Unit 1–7, rồi sang Giai đoạn 2 vẫn tính tiếp (9, 11, 13, 15 Unit).</li><li>Học xong cả 16 Unit: <b>Big Show</b>.</li><li>Giai đoạn 3 tính tiếp: ôn sau Unit 3 (19 Unit), Unit 6 (22 Unit), Unit 8 (24 Unit), và học xong cả 26 Unit thì làm <b>Big Show 2</b>: tìm kho báu, bài ôn cuối cùng.</li></ul>'+
  '<h3>Một buổi ôn (khoảng 30 phút)</h3>'+
  '<ol><li><b>Khởi động (3 phút):</b> mở <i>Word bank</i>, bấm nghe nhanh các từ của 2 Unit mới (có nhãn NEW), bé chỉ và nói to.</li>'+
  '<li><b>Hai bài nói chính (15 phút):</b> chọn 2 trong 5 bài. Mỗi bài đi 4 bước: 👂 nghe mẫu → 🦜 nói theo (hoặc 🎭 đóng vai) → 🙈 tự nói khi chữ đã ẩn → 🌟 lên sân khấu.</li>'+
  '<li><b>Làm thành bài của bé (7 phút):</b> ô <i>🔄 Make it yours</i>: bé đổi từ in đậm bằng từ khác (màu khác, con vật khác, đồ ăn bé thích). Đây là bước giúp bé <b>nói tự nhiên</b> thay vì đọc thuộc.</li>'+
  '<li><b>Cô hỏi thêm (5 phút):</b> ô <i>❓ Teacher asks</i>: cô hỏi, bé trả lời bằng câu của mình. Bé trả lời một từ cũng được, cô nhắc lại thành câu đủ để bé nói theo.</li></ol>'+
  '<p>3 bài còn lại để buổi sau hoặc cho bé luyện ở nhà với bố mẹ.</p>'+
  '<p>Mỗi bài ôn có thêm tab <b>🎤 Speech</b>: một bài thuyết trình mẫu có tranh vẽ (con vật ở nông trại, màu sắc, dưới biển, cơ thể, đồ bé thích, cơ thể con vật, việc bé làm được, việc con vật làm được; Giai đoạn 3: vận động theo hướng, dài và ngắn, các vị, bản đồ kho báu). Bé luyện như các bài khác rồi đổi chi tiết thành của mình.</p>'+
  '<h3>🏠 Ôn ở nhà cùng con (dành cho ba mẹ)</h3>'+
  '<p>Bé học với cô 2 buổi một tuần. Bé nói được là nhờ ba mẹ nói cùng con <b>10–15 phút mỗi ngày</b>, chia nhỏ vào giờ ăn, giờ tắm và trước khi ngủ. Ba mẹ không cần giỏi tiếng Anh: dùng đúng câu trong bài, bấm 🔊 để nghe mẫu, bật nút <b>🇻🇳 Song ngữ</b> để xem nghĩa. Bé mẫu giáo chỉ cần nói <b>một từ hoặc cụm 2–3 từ</b>, không bắt bé nói cả câu.</p>'+
  '<ul><li><b>Sau mỗi bài ôn:</b> mỗi ngày làm 1 trong 3 bài nói chưa học trên lớp: 👂 nghe mẫu → 🦜 nói theo → 🙈 tự nói. Cuối tuần cho bé lên “sân khấu” nói cho cả nhà nghe.</li>'+
  '<li><b>🏠 Bài tập về nhà theo Unit:</b> nằm ở <b>cuối mỗi bài ôn</b> (khối <b>🏠 Homework</b>, mỗi tab là một Unit mới của bài ôn đó). Muốn chọn thẳng Unit 1–26 thì bấm <b>📚 All units</b> hoặc mục <b>Bài tập về nhà</b> trên menu. Mỗi Unit có 7 dạng bài tự chấm cho bé chưa biết đọc viết: <i>Listen and choose</i> (nghe chọn hình), <i>Look and choose</i> (nhìn hình chọn từ), <i>Yes or no</i>, <i>Match</i> (nối hình với chữ), <i>Memory</i> (lật thẻ), <i>Say it</i> (nhìn hình nói từ), <i>Talk at home</i> (4 tình huống nói chuyện với con, dùng đúng từ của Unit), và nút <b>🖨️ Worksheet</b> in phiếu: tô chữ, nghe ba mẹ đọc rồi khoanh hình, khoanh chữ, nối, vẽ và nói (có trang đáp án cho ba mẹ, mỗi lần in đổi từ). Mỗi ngày 2–3 bài, ngồi cùng con. Mỗi bài có 3 sao, sao lưu trên máy đang dùng.</li>'+
  '<li><b>Bài nói của bé (🎤 Speech):</b> mỗi tối bé nói cho cả nhà nghe, ba mẹ quay video, tuần sau xem lại cùng con: <i>Hello! I’m Bin. I’m five. I like ducks!</i></li></ul>'+
  '<h3>4 kỹ thuật vàng khi nói cùng con ở nhà</h3>'+
  '<ol><li><b>Mở rộng câu:</b> bé nói một từ, ba mẹ nhắc lại thành câu ngắn và thêm một ý (màu, số, tiếng kêu). Không chê, không bắt bé nói lại. <i>Cow! → Yes! A big cow. The cow says moo!</i></li>'+
  '<li><b>Tạo tình huống cần nói:</b> đừng đưa đồ quá nhanh. Cố tình quên một thứ hoặc nói sai cho bé sửa, chờ 5 giây để bé mở lời. Đưa bát mà quên thìa: <i>What do you need? → Spoon, please!</i> · Nói sai: <i>A duck says moo! → No! Quack quack!</i></li>'+
  '<li><b>Câu hỏi lựa chọn:</b> đưa 2 lựa chọn, từ bé cần nói đã có sẵn trong câu hỏi, bé chỉ cần chọn một từ. <i>Red or blue? → Red!</i> · <i>Banana or apple? → Banana, please!</i></li>'+
  '<li><b>Đọc sách tranh trước khi ngủ:</b> 10 phút, không cần đọc hết chữ. Chỉ vào tranh và hỏi <i>What is it? What color? How many? Where is the duck?</i> → <i>A fish! · Blue! · Three! · In the water!</i></li></ol>'+
  '<p><b>Thêm 3 cách từ giờ học của cô:</b></p>'+
  '<ul><li><b>Tường thuật:</b> ba mẹ “bình luận” việc bé đang làm bằng câu thật ngắn: <i>You’re washing your hands. Wash, wash! Now they’re clean!</i></li>'+
  '<li><b>Làm quá và dùng đồ thật:</b> nét mặt, động tác thật to; cho bé cầm, ngửi, nếm đồ thật rồi nói: <i>Peel it! Smell it! Take a big bite! Yummy!</i></li>'+
  '<li><b>Nói theo cụm:</b> ghép màu, số, con vật thành cụm thay vì từng từ rời: <i>a yellow duck · a big whale · three red apples · in the box</i>.</li></ul>'+
  '<p><b>Nhớ khi nói cùng con:</b> cứ 5 phút cho bé đứng dậy vận động (<i>Clap your hands! Jump! Touch your nose!</i>). Khen ngay khi bé mở lời (<i>Good job! Great talking!</i>). Bé nói một từ thì ba mẹ nói lại cả câu một lần, không bắt bé nhắc lại. Web chỉ để nghe mẫu và chơi 10 phút, phần còn lại là nói chuyện thật với đồ thật.</p>'+
  '<h3>Mẹo để bé nói tự nhiên</h3>'+
  '<ul><li>Gõ tên bé vào ô <b>My name</b>: tên bé hiện trong bài nói, bé thấy bài là “của mình”.</li>'+
  '<li>Không sửa lỗi giữa chừng. Bé nói xong, cô nhắc lại câu đúng một lần với giọng vui.</li>'+
  '<li>Bài <b>So sánh</b>: cho hai bé đứng cạnh nhau, mỗi bé nói một bên, câu giữa cả hai cùng nói.</li>'+
  '<li>Bài <b>Kể chuyện</b>: lần đầu cô kể, bé chỉ tranh. Lần sau đổi lại: bé kể, cô chỉ tranh.</li>'+
  '<li>Trên sân khấu, tick <b>Record my voice</b> để bé nghe lại giọng mình. Bé rất thích phần này.</li>'+
  '<li>Bài học của bé chỉ có tiếng Anh. Gợi ý dạy từng bài và nghĩa tiếng Việt của từng câu nằm ở mục <b>🔒 Cẩm nang</b> (mã PIN Đáp án).</li></ul>',
