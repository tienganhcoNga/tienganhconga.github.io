<script>
/* Lộ trình gợi ý cả năm (35 tuần, 4 tiết/tuần). Mỗi dòng: [tuần, mã Unit hoặc nhãn, ghi chú, bài ôn nói?] */
window.L4_PLAN=[
 ['term','Học kì 1 (tuần 1–18)'],
 ['1','s','Làm quen lại: chào hỏi, câu lệnh trong lớp, trò chơi ngoài trời'],

 ['14–15','u9','Tháng 6–12, ngày hội thể thao','r4'],
 ['15–16','u10','Thì quá khứ was / were: hè năm ngoái ở đâu'],
 ['17','Review 2','Ôn Unit 6–10 + phần mở rộng'],
 ['18','Kiểm tra','Kiểm tra cuối học kì 1'],
 ['term','Học kì 2 (tuần 19–35)'],
 ['19–20','u11','Địa chỉ nhà, con phố trông thế nào','r5'],
 ['20–21','u12','Nghề nghiệp và nơi làm việc'],
 ['22–23','u13','Tả ngoại hình','r6'],
 ['23–24','u14','Buổi trong ngày, việc nhà'],
 ['25–26','u15','Cuối tuần gia đình đi đâu, làm gì','r7'],
 ['27','Review 3','Ôn Unit 11–15 + phần mở rộng (tả người và con vật)'],
 ['28–29','u16','Thời tiết hôm qua, rủ bạn đi chơi'],
 ['29–30','u17','Biển báo, hỏi đường','r8'],
 ['31–32','u18','Vị trí cửa hàng, hỏi giá'],
 ['32–33','u19','Con vật và lí do mình thích','r9'],
 ['33–34','u20','Thì hiện tại tiếp diễn: ở trại hè các bạn đang làm gì','r10'],
 ['35','Review 4','Ôn Unit 16–20 + kiểm tra cuối năm']
];
window.L4_SPEAK={r1:'Speaking 1',r2:'Speaking 2',r3:'Speaking 3',r4:'Speaking 4',r5:'Speaking 5',r6:'Speaking 6',r7:'Speaking 7',r8:'Speaking 8',r9:'Speaking 9',r10:'Big Show'};

<script>
(function(){
"use strict";
var D=window.L4, U=D.units, ORDER=D.order, PLAN=window.L4_PLAN, SPK_N=window.L4_SPEAK;
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
/* tiếng Việt cho phụ huynh: chỉ hiện khi bật 🇻🇳 Song ngữ */
var viT=function(t,inl){return t?'<span class="vi-t'+(inl?' in':'')+'" lang="vi">'+esc(t)+'</span>':''};
var SPK='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>';
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

/* giọng đọc */
var hasSpeech="speechSynthesis" in window, voices=[];
if(!hasSpeech)document.documentElement.classList.add("no-speech");
function loadVoices(){voices=hasSpeech?speechSynthesis.getVoices().filter(function(v){return /^en[-_]/i.test(v.lang)}):[]}
if(hasSpeech){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,o){
  o=o||{}; if(!hasSpeech)return;
  if(!o.queue)speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(String(text).replace(/ – /g,". ").replace(/_{2,}|…/g,", "));u.lang="en-US";u.rate=o.rate||0.85;u.pitch=o.pitch||1;
  if(window.LopHocVoice)LopHocVoice.apply(u,o.voice||0);else if(voices.length)u.voice=voices[(o.voice||0)%voices.length];
  if(o.onstart)u.onstart=o.onstart; if(o.onend){u.onend=o.onend;u.onerror=o.onend}
  (window.__utts=window.__utts||[]).push(u); if(window.__utts.length>60)window.__utts.shift();
  speechSynthesis.speak(u);
}
function playAll(els){
  if(!hasSpeech||!els.length)return; speechSynthesis.cancel();
  els.forEach(function(el){speak(el.getAttribute("data-t"),{queue:true,
    onstart:function(){els.forEach(function(x){x.classList.remove("speaking")});el.classList.add("speaking")},
    onend:function(){el.classList.remove("speaking")}})});
}
function icon(s){
  s=String(s);
  if(s.indexOf("c:")===0)return '<span class="sw" style="background:'+esc(s.slice(2))+'"></span>';
  if(s.indexOf("n:")===0)return '<span class="nb">'+esc(s.slice(2))+'</span>';
  return s;
}
var speakOf=function(id){for(var i=0;i<PLAN.length;i++)if(PLAN[i][1]===id&&PLAN[i][3])return PLAN[i][3];return null};
var label=function(id){var u=U[id];return u?u.n+': '+u.en:id};

/* ---------- khung ---------- */
function nav(){
  $("#units").insertAdjacentHTML("beforeend",'<a href="#lo-trinh" data-id="lo-trinh">🗺️ Lộ trình</a><a href="#tu-dien" data-id="tu-dien">📒 All words</a>'+
    ORDER.map(function(id){return '<a class="sm" href="#'+id+'" data-id="'+id+'">'+U[id].ic+' '+(id==="s"?"Starter":"U"+id.slice(1))+'</a>'}).join(""));
}

/* ---------- lộ trình ---------- */
function guide(){
  var rows=PLAN.map(function(r){
    if(r[0]==="term")return '<tr class="term"><td colspan="5">'+esc(r[1])+'</td></tr>';
    var u=U[r[1]];
    if(!u)return '<tr class="rv"><td class="wk">'+esc(r[0])+'</td><td><b>'+esc(r[1])+'</b></td><td colspan="2">'+esc(r[2])+'</td><td></td></tr>';
    return '<tr><td class="wk">'+esc(r[0])+'</td><td><a href="#'+r[1]+'">'+u.ic+' '+esc(u.n)+'</a><br><b>'+esc(u.en)+'</b><br><small>'+esc(u.vi)+'</small></td>'+
      '<td>'+u.w.slice(0,8).map(function(w){return esc(w[1])}).join(", ")+(u.w.length>8?' <small>… ('+u.w.length+' từ)</small>':'')+'</td>'+
      '<td>'+u.p.slice(0,2).map(function(p){return esc(p[0].split(" – ")[0])}).join("<br>")+'<br><small>'+esc(r[2])+'</small></td>'+
      '<td>'+(r[3]?'<a class="sp" href="on-tap-noi.html#'+r[3]+'">🎤 '+esc(SPK_N[r[3]])+'</a>':'')+'</td></tr>';
  }).join("");
  var total=ORDER.reduce(function(a,id){return a+U[id].w.length},0);
  return '<div class="u-head"><span class="u-ic" aria-hidden="true">🗺️</span><div><div class="u-n">Lộ trình cả năm</div><h2>Tiếng Anh lớp 4</h2><div class="u-vi">Starter + 20 Unit · '+total+' từ · 10 buổi ôn nói</div></div></div>'+
  '<div class="block guide">'+
   '<h3>Một Unit học thế nào? (khoảng 6 tiết, 1,5 tuần)</h3>'+
   '<ol><li><b>Lesson 1 (tiết 1–2):</b> học nửa đầu từ mới và mẫu câu 1. Nghe – chỉ tranh – nói theo, rồi hỏi – đáp theo cặp.</li>'+
   '<li><b>Lesson 2 (tiết 3–4):</b> nửa sau từ mới và mẫu câu 2, luyện âm, bài hát / chant.</li>'+
   '<li><b>Lesson 3 (tiết 5–6):</b> đọc đoạn ngắn, viết 3–5 câu về bản thân, làm project nhỏ (vẽ, phỏng vấn bạn, thuyết trình 1 phút).</li></ol>'+
   '<h3>Học ở nhà với trang này (15–20 phút mỗi ngày)</h3>'+
   '<ul><li><b>Ngày 1:</b> mở Unit, bấm <b>🔊 Nghe tất cả</b>, chỉ vào hình và nói to theo. Bật <b>Ẩn nghĩa</b> để tự kiểm tra: nhìn hình, nói nghĩa.</li>'+
   '<li><b>Ngày 2:</b> bấm từng mẫu câu để nghe, rồi con thay từ khác vào để nói về chính mình (ví dụ <i>I get up at six thirty.</i>). Mở mục <b>🗣️ Dialogues</b>: nghe hội thoại trong bài và lời bài nghe, rồi bấm <b>🎭</b> để đóng vai một bạn.</li>'+
   '<li><b>Ngày 3:</b> chơi 3 trò <b>Nghe chọn từ → Nghĩa chọn từ → Viết từ</b>. Được 3 sao thì sang Unit sau; chưa được thì chơi lại trò sai nhiều.</li>'+
   '<li><b>Cuối tuần:</b> mở mục <b>📒 Tất cả từ</b>, gõ tìm những từ con hay quên, nghe lại và chép 2 lần vào vở.</li></ul>'+
   '<h3>Ôn tập nói</h3>'+
   '<p>Học xong <b>Unit 3</b> có buổi ôn nói đầu tiên (Starter + Unit 1–3). Sau đó cứ <b>2 Unit</b> một lần: Unit 1–5, 1–7, 1–9… cho đến <b>Big Show</b> cuối năm (cả 20 Unit). Mỗi buổi có 5 kiểu bài: hội thoại, kể chuyện, thuyết trình, so sánh và tự kể về mình, dùng lại toàn bộ từ đã học. Xem trang <a href="on-tap-noi.html#lo-trinh"><b>🎤 Ôn tập nói lớp 4</b></a>.</p>'+
   '<p class="muted">Số tuần chỉ là gợi ý cho năm học 35 tuần, 4 tiết/tuần. Cô điều chỉnh theo lịch của trường.</p>'+
  '</div>'+
  '<div class="block"><div class="b-head"><h3>Lịch học cả năm</h3></div><div class="tw"><table class="rt"><thead><tr><th>Tuần</th><th>Unit</th><th>Từ vựng chính</th><th>Mẫu câu</th><th>Ôn nói</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

/* ---------- tất cả từ ---------- */
function dict(){
  var all=[];ORDER.forEach(function(id){U[id].w.forEach(function(w){all.push({id:id,w:w})})});
  return '<div class="u-head"><span class="u-ic" aria-hidden="true">📒</span><div><div class="u-n">Word list</div><h2>Tất cả từ vựng</h2><div class="u-vi">'+all.length+' từ của cả năm. Gõ tiếng Anh hoặc tiếng Việt để tìm, bấm vào từ để nghe.</div></div></div>'+
  '<div class="block"><div class="dict-bar"><input id="dq" type="search" placeholder="Tìm từ… (vd: hospital, thứ Hai)" autocomplete="off" aria-label="Tìm từ"><span class="muted" id="dn"></span></div>'+
  '<div class="dict" id="dict">'+all.map(function(x){
    return '<button class="d-row" type="button" data-say="'+esc(x.w[1])+'" data-f="'+esc((x.w[1]+" "+x.w[2]).toLowerCase())+'"><span class="ic" aria-hidden="true">'+icon(x.w[0])+'</span><span><b>'+esc(x.w[1])+'</b><small>'+esc(x.w[2])+'</small></span><span class="u">'+esc(U[x.id].n)+'</span></button>';
  }).join("")+'</div></div>';
}
function filterDict(q){
  q=q.trim().toLowerCase();var n=0;
  $$("#dict .d-row").forEach(function(r){var ok=!q||r.getAttribute("data-f").indexOf(q)>=0;r.hidden=!ok;if(ok)n++});
  $("#dn").textContent=n+" từ";
}

/* ---------- một Unit ---------- */
var G={id:null,type:"listen",qs:[],i:0,score:0,tries:0};
/* Cho bé tự dùng: mỗi Unit là con đường các bước 📚 Words → 💬 Say → 🗣️ Talk (nếu có hội thoại) → 🎮 Play.
   Mỗi lần chỉ hiện một bước (data-step), vào bước nào máy đọc lời hướng dẫn, cuối bước có nút ▶ to, xong bước được ⭐ (localStorage). */
var KID=window.KID, STEP=null;
var STEP_INFO={words:{k:"words",ic:"📚",t:"Words",say:"Tap a word and listen!",vi:"Bấm vào từ để nghe"},pats:{k:"pats",ic:"💬",t:"Say",say:"Listen and say the sentences!",vi:"Nghe rồi nói theo các mẫu câu"},
  dlg:{k:"dlg",ic:"🗣️",t:"Talk",say:"Listen to the dialogue. Then play a role!",vi:"Nghe hội thoại rồi đóng vai"},play:{k:"play",ic:"🎮",t:"Play",say:"Let's play with the words!",vi:"Cùng chơi với từ"}};
KID.setup({store:"lophoc.l4.steps",id:function(){return G.id},say:function(t){speak(t)},stop:function(){dStop();if(hasSpeech)speechSynthesis.cancel()},talk:function(st){STEP=st.k;speak(st.say)}});
function markStep(key){KID.mark(key)}
function showStep(key,talk){KID.show(key,talk);STEP=KID.cur()}
function unitView(id){
  var u=U[id], k=ORDER.indexOf(id), sp=speakOf(id), prev=ORDER[k-1], next=ORDER[k+1];
  var dl=dialogs(id);
  STEP=KID.use([STEP_INFO.words,STEP_INFO.pats,dl?STEP_INFO.dlg:null,STEP_INFO.play],STEP,next?{href:"#"+next,ic:U[next].ic,label:"Next: "+label(next)}:null);
  return '<div class="u-head"><span class="u-ic" aria-hidden="true">'+u.ic+'</span><div><div class="u-n">'+esc(u.n)+'</div><h2>'+esc(u.en)+viT(u.vi)+'</h2><div class="u-vi">'+u.w.length+' words</div></div></div>'+'<div class="goal">🎯 <b>After this unit, I can say:</b>'+viT('Học xong Unit này con nói được:',1)+' '+u.p.map(function(p){return '<i>'+esc(p[0].split(" – ")[0])+'</i>'}).join(" · ")+'</div>'+
  KID.bar()+
  KID.panel("words",{id:"wordsBlock",extra:'<button class="btn all" type="button" id="playWords" aria-label="Listen to all">🔊 All</button>',body:'<div class="words">'+u.w.map(function(w){return '<button class="word" type="button" data-t="'+esc(w[1])+'"><span class="ic" aria-hidden="true">'+icon(w[0])+'</span><span class="w">'+esc(w[1])+'</span>'+viT(w[2])+'</button>'}).join("")+'</div>'})+
  KID.panel("pats",{extra:'<button class="btn all" type="button" id="playPat" aria-label="Listen to all">🔊 All</button>',body:'<div class="pats">'+u.p.map(function(p){return '<button class="pat" type="button" data-t="'+esc(p[0])+'"><span class="say" aria-hidden="true">'+SPK+'</span><span><span class="q">'+esc(p[0])+'</span>'+viT(p[1])+'</span></button>'}).join("")+'</div>'})+
  KID.panel("dlg",dl?{id:"dlgBlock",body:dl}:null)+
  KID.panel("play",{cls:"game-wrap",body:'<div class="gtabs" role="tablist">'+[["listen","👂 Listen and choose"],["mean","👀 Look and choose"],["spell","✍️ Write the word"]].map(function(x){var m=/^(\S+)\s+(.*)$/.exec(x[1]);return '<button class="chip gt" type="button" data-game="'+x[0]+'" aria-pressed="'+(G.type===x[0])+'"><span class="e" aria-hidden="true">'+m[1]+'</span><small>'+esc(m[2])+'</small></button>'}).join("")+'</div><div class="game" id="game" aria-live="polite"></div>'+(sp?'<div class="sp-link"><span class="e" aria-hidden="true">🎤</span><p><b>Speaking time!</b> After this unit, practise with <b>'+esc(SPK_N[sp])+'</b>: use the words from all the units you have learnt.'+viT('Học xong Unit này, con ôn nói với bài '+SPK_N[sp]+': gom từ của tất cả các Unit đã học.')+'</p><a class="btn primary" href="on-tap-noi.html#'+sp+'">Go to '+esc(SPK_N[sp])+' →</a></div>':'')})+
  '<div class="u-nav">'+(prev?'<a class="btn" href="#'+prev+'">← '+esc(label(prev))+'</a>':'<a class="btn" href="#lo-trinh">← 🗺️ Lộ trình</a>')+(next?'<a class="btn primary" href="#'+next+'">'+esc(label(next))+' →</a>':'')+'</div>';
}

/* ---------- hội thoại trong bài (window.L4_DLG, file assets/lop4-dialogues.js) ---------- */
var DLG=window.L4_DLG||{}, KIND={book:"📖 Book",listen:"🎧 Listening",chant:"🎵 Chant"};
function speakers(d){var s=[];d.lines.forEach(function(l){if(l[0]&&s.indexOf(l[0])<0)s.push(l[0])});return s}
function dialogs(id){
  var list=DLG[id]; if(!list||!list.length)return "";
  return '<p class="muted" style="margin:0 0 12px">Tap a line to listen. <b>🎭 Role-play</b>: choose a person. The computer reads the other part and waits for you to say yours.'+viT('Bấm từng câu để nghe. Đóng vai: chọn một bạn, máy đọc vai còn lại, đến câu của con thì máy chờ con nói.')+'</p><div class="dlgs">'+
   list.map(function(d,di){
     var sp=speakers(d);
     return '<div class="dlg" data-di="'+di+'"><div class="dlg-h"><span class="dlg-k '+esc(d.k)+'">'+(KIND[d.k]||esc(d.k))+'</span><b>'+esc(d.t)+'</b></div>'+
      '<div class="dlg-tools"><button class="chip" type="button" data-dplay="'+di+'">🔊 Listen to all</button>'+
      (sp.length>=2&&sp.length<=4?sp.map(function(n){return '<button class="chip" type="button" data-drole="'+di+'" data-who="'+esc(n)+'">🎭 '+esc(n)+'</button>'}).join(""):"")+'</div>'+
      d.lines.map(function(l,li){
        var k=sp.indexOf(l[0]), cls=!l[0]?" nar":k%2===1?" alt":"";
        return '<button class="ln'+cls+'" type="button" data-di="'+di+'" data-li="'+li+'"><span class="av" aria-hidden="true">'+(l[0]?esc(l[0].slice(0,2)):"♪")+'</span><span class="tx">'+(l[0]?'<span class="who">'+esc(l[0])+'</span>':'')+'<span class="en">'+esc(l[1])+'</span>'+viT(l[2]||"")+'</span></button>';
      }).join("")+'</div>';
   }).join("")+'</div>';
}
var DRUN={tok:null,timers:[]};
function dStop(){DRUN.tok=null;DRUN.timers.forEach(clearTimeout);DRUN.timers=[];if(hasSpeech)speechSynthesis.cancel();
  $$(".ln").forEach(function(n){n.classList.remove("speaking","turn")});$$("[data-dplay],[data-drole]").forEach(function(b){b.setAttribute("aria-pressed","false")})}
function voiceOf(d,who){var k=speakers(d).indexOf(who);return k<0?{voice:0,pitch:1}:{voice:k%2,pitch:k%2?1.35:1}}
function dRun(di,mine,btn){
  var d=DLG[G.id][di], els=$$('.ln[data-di="'+di+'"]'), i=0, tok={};
  dStop(); DRUN.tok=tok; if(btn)btn.setAttribute("aria-pressed","true");
  (function step(){
    if(DRUN.tok!==tok)return;
    els.forEach(function(n){n.classList.remove("speaking","turn")});
    if(i>=d.lines.length){dStop();if(mine)speak("Great job!");return}
    var l=d.lines[i], n=els[i]; n.scrollIntoView({block:"nearest",behavior:"smooth"});
    var next=function(){if(DRUN.tok!==tok)return;i++;DRUN.timers.push(setTimeout(step,350))};
    if(mine&&l[0]===mine){n.classList.add("turn");DRUN.timers.push(setTimeout(next,Math.max(2500,l[1].split(" ").length*650+1500)));return}
    n.classList.add("speaking");
    if(!hasSpeech){DRUN.timers.push(setTimeout(next,1500));return}
    var v=voiceOf(d,l[0]),done=false,go=function(){if(!done){done=true;next()}};
    speak(l[1],{voice:v.voice,pitch:v.pitch,onend:go}); DRUN.timers.push(setTimeout(go,4000+l[1].length*150));
  })();
}

/* trò chơi: 8 câu mỗi lượt */
function newGame(){
  var u=U[G.id]; G.qs=shuffle(u.w).slice(0,8); G.i=0; G.score=0; G.tries=0; showQ();
}
function opts(ans){
  var pool=U[G.id].w.filter(function(w){return w[1]!==ans[1]});
  return shuffle([ans].concat(shuffle(pool).slice(0,3)));
}
function showQ(){
  var box=$("#game"); if(!box)return;
  if(G.i>=G.qs.length){
    var n=G.qs.length, st=G.score>=n?3:G.score>=n-2?2:1;
    box.innerHTML='<div class="done"><div class="stars" aria-hidden="true">'+"⭐".repeat(st)+'</div><h3>'+G.score+' / '+n+' right the first time</h3><p class="muted">'+(st===3?'Great job! Try the next game.':'Play again to get 3 stars!')+'</p><button class="btn primary" type="button" data-g="again">↺ Play again</button></div>';
    if(st===3)speak("Excellent!"); return;
  }
  var q=G.qs[G.i], top='<div class="g-top"><span>'+(G.i+1)+' / '+G.qs.length+'</span><span>⭐ '+G.score+'</span></div>';
  G.tries=0;
  if(G.type==="listen"){
    box.innerHTML=top+'<div class="g-prompt"><button class="say big-say" type="button" data-g="hear" aria-label="Listen">'+SPK+'</button><span class="muted">Tap 🔊, listen and choose the word.'+viT("Bấm 🔊 để nghe, rồi chọn từ đúng")+'</span></div>'+
      '<div class="g-opts txt">'+opts(q).map(function(w){return '<button class="g-opt" type="button" data-pick="'+esc(w[1])+'">'+esc(w[1])+'</button>'}).join("")+'</div>';
    /* Không tự đọc: chỉ đọc khi bấm nút 🔊. */
  } else if(G.type==="mean"){
    box.innerHTML=top+'<div class="g-prompt"><span class="pic-q" aria-hidden="true">'+icon(q[0])+'</span><span class="muted">What is it?'+viT(q[2])+'</span></div>'+
      '<div class="g-opts txt">'+opts(q).map(function(w){return '<button class="g-opt" type="button" data-pick="'+esc(w[1])+'">'+esc(w[1])+'</button>'}).join("")+'</div>';
  } else {
    box.innerHTML=top+'<div class="g-prompt"><span class="pic-q" aria-hidden="true">'+icon(q[0])+'</span>'+viT(q[2])+'<button class="say" type="button" data-g="hear" aria-label="Listen">'+SPK+'</button></div>'+
      '<form class="g-input" id="spForm"><input id="spIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Write the word" placeholder="'+esc(hint(q[1],0))+'"><button class="btn primary" type="submit">Check</button><button class="btn" type="button" data-g="hint">💡 Help</button></form><div class="g-msg" id="spMsg"></div>';
    var inp=$("#spIn"); if(inp)inp.focus();
  }
}
function hint(word,level){ /* level 0: chỉ chữ đầu mỗi từ; tăng dần */
  var shown=0;
  return word.replace(/[A-Za-z]/g,function(c,i){var start=i===0||/[\s\-']/.test(word[i-1]);if(start||shown<level&&Math.random()<.5){shown++;return c}return "_"});
}
var norm=function(s){return s.toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g," ").trim()};
function pick(btn){
  var q=G.qs[G.i], ok=btn.getAttribute("data-pick")===q[1];
  if(btn.classList.contains("wrong")||btn.classList.contains("right"))return;
  if(ok){
    if(G.tries===0)G.score++;
    btn.classList.add("right"); $$("#game .g-opt").forEach(function(b){b.disabled=true});
    speak(q[1]); setTimeout(function(){G.i++;showQ()},1100);
  } else { G.tries++; btn.classList.add("wrong"); }
}
function check(){
  var q=G.qs[G.i], inp=$("#spIn"), msg=$("#spMsg"); if(!inp)return;
  if(norm(inp.value)===norm(q[1])){
    if(G.tries===0)G.score++;
    inp.className="right"; msg.className="g-msg ok"; msg.textContent="✔ Correct!"; speak(q[1]);
    inp.disabled=true; setTimeout(function(){G.i++;showQ()},1200);
  } else {
    G.tries++; inp.className="wrong"; msg.className="g-msg bad";
    msg.textContent=G.tries>=3?"Answer: "+q[1]+". Type it again!":"Not yet. Try again!";
    if(G.tries===2){inp.placeholder=hint(q[1],3)}
    inp.select();
  }
}

/* ---------- định tuyến ---------- */
function route(){
  dStop();
  var id=location.hash.slice(1), main=$("#unit");
  if(U[id]){if(G.id!==id)STEP=null;G.id=id;main.innerHTML=unitView(id);newGame();showStep(STEP,false);document.title=label(id)+" · Từ vựng lớp 4"}
  else if(id==="tu-dien"){main.innerHTML=dict();filterDict("");document.title="Tất cả từ vựng · Lớp 4"}
  else {id="lo-trinh";main.innerHTML=guide();document.title="Lộ trình · Từ vựng lớp 4"}
  $$("#units a[data-id]").forEach(function(a){a.setAttribute("aria-current",a.getAttribute("data-id")===id?"page":"false")});
  var on=$('#units a[aria-current="page"]'); if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"center"});
}
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.closest("[data-step-go],a.go-next,[data-ksay]"))return; /* nút bước: assets/steps.js */
  var dp=t.closest("[data-dplay]"); if(dp){if(dp.getAttribute("aria-pressed")==="true")dStop();else dRun(+dp.getAttribute("data-dplay"),null,dp);return}
  var dr=t.closest("[data-drole]"); if(dr){if(dr.getAttribute("aria-pressed")==="true")dStop();else dRun(+dr.getAttribute("data-drole"),dr.getAttribute("data-who"),dr);return}
  var ln=t.closest(".ln"); if(ln){dStop();var d=DLG[G.id][+ln.getAttribute("data-di")],l=d.lines[+ln.getAttribute("data-li")],v=voiceOf(d,l[0]);
    ln.classList.add("speaking");speak(l[1],{voice:v.voice,pitch:v.pitch,onend:function(){ln.classList.remove("speaking")}});return}
  var hd=t.closest("#hideDvi"); if(hd){var on2=hd.getAttribute("aria-pressed")!=="true";hd.setAttribute("aria-pressed",on2);$("#dlgBlock").classList.toggle("hide-dvi",on2);return}
  var w=t.closest(".word,.pat"); if(w){$$(".speaking").forEach(function(x){x.classList.remove("speaking")});speak(w.getAttribute("data-t"));return}
  var d=t.closest(".d-row"); if(d){speak(d.getAttribute("data-say"));return}
  if(t.closest("#playWords")){playAll($$("#wordsBlock .word"));return}
  if(t.closest("#playPat")){playAll($$(".pat"));return}
  var hv=t.closest("#hideVi"); if(hv){var on=hv.getAttribute("aria-pressed")!=="true";hv.setAttribute("aria-pressed",on);$("#wordsBlock").classList.toggle("hide-vi",on);return}
  var gt=t.closest("[data-game]"); if(gt){G.type=gt.getAttribute("data-game");$$("[data-game]").forEach(function(b){b.setAttribute("aria-pressed",b===gt)});newGame();return}
  var p=t.closest("[data-pick]"); if(p){pick(p);return}
  var g=t.closest("[data-g]"); if(!g)return;
  var a=g.getAttribute("data-g"), q=G.qs[G.i];
  if(a==="again")newGame();
  if(a==="hear"&&q)speak(q[1]);
  if(a==="hint"&&q){G.tries=Math.max(G.tries,1);var inp=$("#spIn");inp.value="";inp.placeholder=hint(q[1],2+G.tries);inp.focus()}
});
document.addEventListener("submit",function(e){if(e.target.id==="spForm"){e.preventDefault();check()}});
document.addEventListener("input",function(e){if(e.target.id==="dq")filterDict(e.target.value)});
nav(); route();
window.addEventListener("hashchange",function(){route();var m=$("#unit");if(m&&document.documentElement.scrollTop>m.offsetTop)m.scrollIntoView()});
})();
</script>
