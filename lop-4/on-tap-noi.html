   Mỗi bài ôn gom từ của TẤT CẢ các Unit đã học. Phần bài nói chỉ có tiếng Anh; tiếng Việt nằm ở mục Lộ trình, nút 🇻🇳 Song ngữ và Cẩm nang (khóa PIN). */

    Từ lấy ở kho từ (lop4-words.js); câu cho Fill the gap, Make a sentence lấy từ mẫu câu (p) và hội thoại (lop4-dialogues.js);
    Ask and answer lấy các cặp hỏi – đáp. Nghĩa tiếng Việt chỉ hiện khi bật 🇻🇳 Song ngữ. */
 homework:{key:'lophoc.hw.l4',maxWords:9,
  note:'Chọn Unit vừa học trên lớp. Mỗi ngày 2–3 bài, khoảng 15 phút; làm sai cứ chọn lại, mỗi bài có sao. Bài 🙋 Ask and answer: đọc câu hỏi, tự trả lời cả câu rồi mới bấm 👀 xem. Bấm 🖨️ Worksheet để in phiếu 6 phần có đáp án.',
  sentences:function(g){
   var out=[],u=window.L4.units[g]||{},D=(window.L4_DLG||{})[g]||[];
   var split=function(en,vi){var a=en.split(/ – | \/ /),b=String(vi||'').split(/ – | \/ /);a.forEach(function(x,i){out.push([x.replace(/["“”]/g,"'"),a.length===b.length?b[i]:''])})};
   (u.p||[]).forEach(function(p){split(p[0],p[1])});
   D.forEach(function(d){d.lines.forEach(function(l){if(l[1].split(' ').length>=3&&!/[A-Z]-[A-Z]/.test(l[1]))split(l[1],l[2])})});
   return out;},
  qa:function(g){
   var out=[],u=window.L4.units[g]||{},D=(window.L4_DLG||{})[g]||[];
   (u.p||[]).forEach(function(p){var a=p[0].split(' – '),b=String(p[1]).split(' – ');if(a.length===2)out.push([a[0],a[1],b[0]||'',b[1]||''])});
   D.forEach(function(d){for(var i=0;i+1<d.lines.length;i++){var x=d.lines[i],y=d.lines[i+1];
    if(/\?$/.test(x[1])&&!/\?$/.test(y[1])&&x[0]!==y[0]&&x[0]&&y[0])out.push([x[1],y[1],x[2],y[2]])}});
   return out;}},
 guide:'<h3>Vì sao có bài ôn nói?</h3>'+
  '<p>Trên lớp, mỗi Unit con học từ và mẫu câu riêng lẻ. Trang này giúp con <b>nối các Unit lại với nhau</b>: mỗi bài ôn gom từ của <b>tất cả</b> các Unit đã học vào 5 kiểu bài nói, để con dùng từ cũ cùng từ mới và nói thành đoạn 8–12 câu, không chỉ trả lời một câu.</p>'+
  '<h3>Khi nào ôn?</h3>'+
  '<ul><li>Học xong <b>Unit 3</b>: Speaking 1, từ của Starter và Unit 1–3.</li>'+
  '<li>Sau đó cứ <b>2 Unit</b> một lần, mỗi lần thêm 2 Unit mới: Unit 1–5, 1–7, 1–9, 1–11, 1–13, 1–15, 1–17, 1–19.</li>'+
  '<li>Cuối năm: <b>Big Show</b> dùng từ của cả 20 Unit, có thể tổ chức thành buổi biểu diễn cho phụ huynh xem.</li></ul>'+
  '<h3>Một buổi ôn (35–40 phút)</h3>'+
  '<ol><li><b>Khởi động (5 phút):</b> mở <i>Word bank</i>, ôn nhanh từ của 2 Unit mới (nhãn NEW). Cô chỉ hình, con nói từ và đặt ngay một câu về chính mình.</li>'+
  '<li><b>Hai hoặc ba bài nói (20 phút):</b> mỗi bài 4 bước: 👂 Listen → 🦜 Repeat (hoặc 🎭 Be A / Be B: máy đọc vai kia, con nói vai mình) → 🙈 Say it alone (chữ ẩn, chỉ còn từ khóa) → 🌟 On stage.</li>'+
  '<li><b>Make it yours (8 phút):</b> con đổi từ in đậm thành thông tin thật của mình (giờ dậy của con, môn con thích, nghề của bố mẹ, cuối tuần nhà con…). Đây là bước giúp con <b>nói tự nhiên</b>, không đọc thuộc.</li>'+
  '<li><b>Teacher asks (5 phút):</b> cô hỏi thêm, con trả lời bằng 2–3 câu: một câu trả lời, một câu giải thích (<i>because…</i>), một câu hỏi lại (<i>What about you?</i>).</li></ol>'+
  '<p>Bài nào chưa làm trên lớp thì giao về nhà: con tự luyện đến bước 🙈, rồi quay video bước 🌟 gửi cô.</p>'+
  '<h3>5 kiểu bài và kỹ năng con luyện</h3>'+
  '<ul><li><b>Talk together (hội thoại):</b> hỏi – đáp, giữ lượt nói, phản hồi tự nhiên (<i>Really? Me too! That sounds fun! What about you?</i>).</li>'+
  '<li><b>Tell a story (kể chuyện):</b> kể theo tranh ở ngôi thứ ba (He / She / They), có mở đầu, rắc rối, cách giải quyết và bài học.</li>'+
  '<li><b>Show and tell (thuyết trình):</b> đứng trước lớp, có câu chào, 3 ý chính và câu cảm ơn. Nhìn các bạn, nói to, dùng tay chỉ tranh.</li>'+
  '<li><b>Compare (so sánh):</b> hai bạn đứng cạnh nhau, mỗi bạn một bên; luyện <i>but, too, both, and</i>.</li>'+
  '<li><b>My story (tự sự):</b> con kể chuyện của chính mình theo thứ tự <i>First → Then → After that → Finally</i>, hoặc như một trang nhật kí.</li></ul>'+
  '<h3>🏠 Bài tập về nhà theo Unit</h3>'+
  '<p>Cuối mỗi bài ôn có khối <b>🏠 Homework</b>, mỗi tab là một Unit mới của bài ôn đó (bấm <b>📚 All units</b> hoặc mục <b>Bài tập về nhà</b> trên menu để chọn thẳng Starter, Unit 1–20). Mỗi Unit có các dạng bài tự chấm, có sao: <i>Listen and choose, Look and choose, Yes or no, Match, Missing letter, Spell it, Write the word, Fill the gap</i> (điền từ vào mẫu câu và câu hội thoại trong bài), <i>Make a sentence</i> (xếp câu), <i>Memory, Say it</i> và <i>🙋 Ask and answer</i> (hỏi – đáp theo mẫu câu của Unit, câu trả lời được che để con tự nói trước). Bài chỉ có tiếng Anh; bật <b>🇻🇳 Song ngữ</b> để xem nghĩa từng câu. Nút <b>🖨️ Worksheet</b> in phiếu 6 phần có đáp án.</p>'+
  '<ul><li>Mỗi ngày 2–3 bài, khoảng 15 phút. Con tự làm, ba mẹ xem số sao ở tab Unit (⭐ 5/12).</li>'+
  '<li>Bài <b>Ask and answer</b>: ba mẹ đọc câu hỏi (hoặc bấm 🔊), con trả lời thành câu đủ rồi mới bấm 👀 xem lại.</li>'+
  '<li>Sao lưu trên máy đang dùng.</li></ul>'+
  '<h3>Mẹo</h3>'+
  '<ul><li>Gõ tên con vào ô <b>My name</b>: tên con hiện trong bài.</li><li>Không ngắt lời để sửa. Con nói xong, cô nhắc lại câu đúng một lần.</li>'+
  '<li>Trên sân khấu, tick <b>Record my voice</b> để con nghe lại và tự nhận xét: “Mình nói to chưa? Rõ chưa? Có ngập ngừng không?”</li>'+
  '<li>Nút <b>🇻🇳 Song ngữ</b> (góc phải thanh trên) hiện nghĩa tiếng Việt dưới mọi chữ cho phụ huynh. Khi con luyện thì tắt đi.</li>'+
  '<li>Từ nào con quên: mở <a href="units-lop-4.html#tu-dien">📒 Tất cả từ vựng</a> để tra và nghe lại.</li></ul>',

    ["L","📝","<b>In the evening</b>, I <b>do homework</b>.","Buổi tối, tớ làm bài tập."],

   lines:[["🌅","First, <b>in the morning</b>, I <b>get up</b> at six fifteen and make my bed.","Đầu tiên, buổi sáng, tớ dậy lúc sáu giờ mười lăm và dọn giường."],
    ["🌱","Then I <b>water the plants</b> in the <b>garden</b>.","Sau đó tớ tưới cây ngoài vườn."],

    ["🧹","After that, <b>in the afternoon</b>, I <b>clean the floor</b> and <b>wash the clothes</b> with my sister.","Sau đó, buổi chiều, tớ lau nhà và giặt quần áo cùng chị."],

   lines:[["A","Hello! Welcome to the <b>gift shop</b>. Can I help you?","Xin chào! Chào mừng đến cửa hàng quà tặng. Tôi giúp gì được cho cháu?"],
    ["B","Yes, please. It\'s my mum\'s <b>birthday</b> in <b>May</b>. I want a present for her.","Dạ vâng. Sinh nhật mẹ cháu vào tháng Năm. Cháu muốn mua quà cho mẹ."],
    ["A","How about this <b>skirt</b>? It\'s very nice.","Chân váy này thì sao? Nó rất đẹp."],
    ["B","How much is the skirt?","Chân váy này giá bao nhiêu ạ?"],
    ["A","It\'s two hundred <b>thousand dong</b>.","Hai trăm nghìn đồng."],
    ["B","Oh, that\'s a lot. How much is that <b>T-shirt</b> with a <b>peacock</b> on it?","Ôi, đắt quá. Còn cái áo phông có hình con công kia giá bao nhiêu ạ?","👕"],
    ["A","It\'s ninety thousand dong.","Chín mươi nghìn đồng."],
    ["B","Great! My mum likes peacocks, because they <b>dance beautifully</b>.","Tuyệt! Mẹ cháu thích con công vì chúng múa rất đẹp."],
    ["A","Here you are. Anything else?","Của cháu đây. Cháu mua gì nữa không?"],
    ["B","Yes. Where\'s the <b>bookshop</b>? I want a card, too.","Dạ có. Hiệu sách ở đâu ạ? Cháu muốn mua thêm một tấm thiệp."],
    ["A","It\'s <b>opposite</b> the <b>cinema</b>, <b>next to</b> the <b>bakery</b>.","Nó ở đối diện rạp chiếu phim, bên cạnh tiệm bánh."],
    ["B","Thank you very much! Goodbye!","Cháu cảm ơn ạ! Tạm biệt!"]],
   swap:["<b>skirt</b> / <b>T-shirt</b> → shoes / jacket","ninety <b>thousand dong</b> → your price","<b>opposite</b> → behind / between / near"],
   ask:["How much is your school bag?","Where\'s the bookshop in your town?","What present do you want for your birthday?"]},

  {type:'story',title:'The Little Crocodile',ic:'🐊',
   tip:'Bài học: bảo vệ động vật, không mua bán động vật hoang dã. Hỏi con: "Động vật nên sống ở đâu?" Con kể ở ngôi thứ ba, dùng các cụm running quickly, roaring loudly…',
   lines:[["🦁","Last <b>summer</b>, Akiko and her dad were at the <b>zoo</b> in <b>Tokyo</b>.","Mùa hè năm ngoái, Akiko và bố ở sở thú tại Tô-ki-ô."],
    ["🦒","They saw <b>giraffes</b>, <b>hippos</b> and <b>lions</b>. The lions were <b>roaring loudly</b>!","Hai bố con thấy hươu cao cổ, hà mã và sư tử. Sư tử đang gầm rất to!"],
    ["🐊","Near the river, they saw a sad little <b>crocodile</b> in a small box.","Gần con sông, họ thấy một chú cá sấu nhỏ buồn bã trong một chiếc hộp nhỏ."],
    ["🧑","A man said: Do you want it? It\'s five hundred <b>thousand dong</b>.","Một người đàn ông nói: Cháu có muốn mua nó không? Năm trăm nghìn đồng."],
    ["🙅","Akiko said: No, thank you. Animals are not toys!","Akiko nói: Không, cảm ơn chú. Động vật không phải đồ chơi!"],
    ["🧑‍⚕️","Her dad called a zoo <b>doctor</b>. The doctor took the crocodile to the river.","Bố bạn ấy gọi một bác sĩ thú y. Bác sĩ mang cá sấu về sông."],
    ["🏞️","The little crocodile swam away, <b>running quickly</b> to its family.","Chú cá sấu nhỏ bơi đi, nhanh chóng về với gia đình."],
    ["🦚","The <b>peacocks</b> were <b>dancing beautifully</b>, and the <b>parrots</b> were <b>singing merrily</b>.","Những con công đang múa thật đẹp, và lũ vẹt đang hót vui vẻ."],
    ["❤️","Akiko smiled. We must protect animals!","Akiko mỉm cười. Chúng ta phải bảo vệ động vật!"]],
   swap:["<b>crocodile</b> → monkey / parrot","<b>Tokyo</b> → Sydney / London / Bangkok","<b>doctor</b> → policeman"],
   ask:["Where were Akiko and her dad?","What animals did they see?","Why didn\'t Akiko buy the crocodile?","How can we protect animals?"]},

  {type:'show',title:'My Favourite Animal',ic:'🐘',
   tip:'Con chọn một con vật, mang tranh hoặc đồ chơi lên. Bài nói có đủ: tên, ngoại hình, nơi sống, hoạt động (đang làm gì giỏi), lý do thích (because). Khuyến khích con bắt chước động tác con vật.',
   lines:[["🐘","My favourite animal is the <b>elephant</b>.","Con vật tớ thích nhất là con voi."],
    ["🦒","Elephants are very <b>big</b> and <b>tall</b>. They have <b>big</b> ears and small <b>eyes</b>.","Voi rất to và cao. Chúng có đôi tai to và đôi mắt nhỏ."],
    ["🇹🇭","They live in <b>Thailand</b>, in <b>Viet Nam</b> and in Africa.","Chúng sống ở Thái Lan, Việt Nam và châu Phi."],
    ["💦","They like water. They can <b>swim</b> in the river on <b>hot</b> days.","Chúng thích nước. Chúng có thể bơi dưới sông vào những ngày nóng."],
    ["🍇","They eat grass, leaves and fruit. They drink a lot of <b>water</b>.","Chúng ăn cỏ, lá cây và quả. Chúng uống rất nhiều nước."],
    ["🏃","They can\'t run quickly like <b>lions</b>, but they are very strong.","Chúng không chạy nhanh như sư tử, nhưng chúng rất khỏe."],
    ["❤️","Why do I like elephants? Because they are kind and they love their family.","Tại sao tớ thích voi? Vì chúng hiền lành và yêu gia đình mình."],
    ["🦁","Last weekend, I was at the <b>zoo</b>. I took a photo with an elephant!","Cuối tuần trước, tớ ở sở thú. Tớ chụp ảnh với một chú voi!"]],
   swap:["<b>elephant</b> → giraffe / monkey / peacock / hippo","<b>Thailand</b> → Australia / Japan","<b>swim</b> → climb trees / sing / dance"],
   ask:["What\'s your favourite animal?","Why do you like it?","What can it do?","Where does it live?"]},

  {type:'me',title:'My Day at the Zoo',ic:'🦒',
   tip:'Con kể lại một chuyến đi sở thú hoặc công viên theo thứ tự First… Then… After that… Finally… Mỗi con vật con nói 1 câu: chúng đang làm gì. Khuyến khích con nói thêm cảm xúc.',
   lines:[["☀️","Last <b>Sunday</b> was <b>sunny</b> and <b>windy</b>. My family went to the <b>zoo</b>.","Chủ nhật tuần trước trời nắng và có gió. Gia đình tớ đi sở thú."],
    ["⬅️","First, we <b>went straight</b> from the gate and <b>turned left</b>. We saw the <b>lions</b>.","Đầu tiên, nhà tớ đi thẳng từ cổng rồi rẽ trái. Nhà tớ thấy sư tử."],
    ["🦁","They were <b>roaring loudly</b>! My little sister was scared.","Chúng đang gầm rất to! Em gái tớ sợ quá."],
    ["🐊","Then we saw <b>crocodiles</b> and <b>hippos</b> <b>near</b> the water.","Sau đó nhà tớ thấy cá sấu và hà mã gần hồ nước."],
    ["🦚","After that, we watched the <b>peacocks</b>. They were <b>dancing beautifully</b>.","Tiếp theo, nhà tớ xem những con công. Chúng đang múa thật đẹp."],
    ["🦜","The <b>parrots</b> were <b>singing merrily</b>. One parrot said Hello!","Lũ vẹt đang hót vui vẻ. Một con vẹt còn nói Hello!"],
    ["🎁","Finally, we went to the <b>gift shop</b>. I bought a <b>T-shirt</b> with a <b>giraffe</b> on it.","Cuối cùng, nhà tớ vào cửa hàng quà tặng. Tớ mua một cái áo phông có hình hươu cao cổ."],
    ["😊","It was eighty <b>thousand dong</b>. I love it! I want to go to the zoo again.","Nó giá tám mươi nghìn đồng. Tớ rất thích! Tớ muốn đi sở thú nữa."]],

 {id:'r10',n:'Big Show',ic:'🏆',title:'My English Year',span:'Cả năm: Units 1–20',when:'Sau Unit 20 (cuối năm)',

  tasks:[
  {type:'talk',title:'Calling from Summer Camp',ic:'📱',
   roles:{A:['👨','Dad'],B:['🧒','{name}']},
   tip:'Con gọi điện "về nhà" kể về trại hè. Bố / mẹ (hoặc bạn) hỏi rất nhiều câu từ các Unit trong năm: thời tiết, giờ giấc, bạn mới đến từ đâu, đang làm gì. Bài tổng hợp nhiều mẫu câu nhất.',
   lines:[["A","Hello, {name}! How are you? How is the <b>summer camp</b>?","Alô, …! Con khỏe không? Trại hè thế nào?"],
    ["B","Hi, Dad! I\'m great! It\'s so much fun.","Chào bố! Con rất vui! Trại hè vui lắm."],
    ["A","What\'s the <b>weather</b> like there?","Ở đó thời tiết thế nào?"],
    ["B","It\'s <b>sunny</b> in the day, but <b>windy</b> <b>in the evening</b>.","Ban ngày trời nắng, nhưng buổi tối có gió."],
    ["A","What time do you <b>get up</b>?","Con dậy lúc mấy giờ?"],
    ["B","I get up at six <b>fifteen</b>. Then we <b>have breakfast</b> together.","Con dậy lúc sáu giờ mười lăm. Sau đó cả trại ăn sáng cùng nhau."],
    ["A","Do you have new friends?","Con có bạn mới không?"],
    ["B","Yes! This is Jack. He\'s from <b>Australia</b>. He\'s <b>tall</b> and has <b>short hair</b>.","Có ạ! Đây là Jack. Bạn ấy đến từ Úc. Bạn ấy cao và có tóc ngắn."],
    ["A","What are you doing now?","Bây giờ con đang làm gì?"],
    ["B","We\'re <b>building a campfire</b>. My friends are <b>putting up a tent</b>.","Chúng con đang đốt lửa trại. Các bạn con đang dựng lều.","🔥"],
    ["A","That sounds fun! And what are your teachers doing?","Nghe vui quá! Thế các thầy cô đang làm gì?"],
    ["B","They\'re <b>taking a photo</b>. Tonight we\'re <b>dancing around the campfire</b>!","Thầy cô đang chụp ảnh. Tối nay chúng con sẽ nhảy quanh lửa trại!","📸"],
    ["A","Have fun, and be careful! Love you!","Chơi vui nhé, và cẩn thận nhé! Bố yêu con!"],
    ["B","Love you too, Dad! Bye!","Con cũng yêu bố! Tạm biệt bố!"]],
   swap:["<b>Australia</b> → Britain / America / Japan / Singapore","<b>building a campfire</b> → playing tug of war / singing songs","<b>sunny</b> → cloudy / rainy"],
   ask:["What are you doing now?","What are your friends doing?","Where were you last summer?","What do you want to do at summer camp?"]},

  {type:'story',title:'The Tug of War',ic:'🤸',
   tip:'Bài học: tinh thần đồng đội. Câu chuyện dùng từ của rất nhiều Unit. Chia lớp thành 2 đội, vừa kể vừa diễn kéo co bằng dây thật. Con kể ở ngôi thứ ba.',
   lines:[["⛺","It was <b>July</b>. Twenty children were at <b>summer camp</b> in the <b>mountains</b>.","Đó là tháng Bảy. Hai mươi bạn nhỏ ở trại hè trên vùng núi."],
    ["🇻🇳","There were children from <b>Viet Nam</b>, <b>Japan</b>, <b>Britain</b> and <b>Singapore</b>.","Có các bạn đến từ Việt Nam, Nhật Bản, Anh và Xin-ga-po."],
    ["🤸","On <b>Friday</b> afternoon, they were <b>playing tug of war</b>: the Red <b>team</b> and the Blue team.","Chiều thứ Sáu, các bạn chơi kéo co: đội Đỏ và đội Xanh."],
    ["😤","Minh was in the Red team. He was <b>big</b> and strong. He said: I can <b>win</b> alone!","Minh ở đội Đỏ. Bạn ấy to và khỏe. Bạn ấy nói: Tớ có thể tự thắng một mình!"],
    ["😢","He didn\'t listen to his friends. The Red team fell down. The Blue team won.","Bạn ấy không nghe các bạn. Đội Đỏ ngã nhào. Đội Xanh thắng."],
    ["🤝","Akiko said: Minh, we\'re a team. Let\'s pull together: one, two, three!","Akiko nói: Minh ơi, chúng ta là một đội. Cùng kéo nào: một, hai, ba!"],
    ["📣","They played again. Everyone <b>cheered</b>. This time, the Red team won!","Các bạn chơi lại. Mọi người cổ vũ. Lần này đội Đỏ thắng!"],
    ["🔥","In the evening, they were <b>building a campfire</b> and <b>singing songs</b> together.","Buổi tối, các bạn đốt lửa trại và cùng nhau hát."],
    ["📸","Miss Hoa was <b>taking a photo</b>. Minh smiled: Teamwork is the best!","Cô Hoa chụp ảnh. Minh cười: Làm việc nhóm là tuyệt nhất!"]],
   swap:["<b>mountains</b> → countryside / beach","<b>playing tug of war</b> → playing card games","<b>Friday</b> → Saturday / Sunday"],
   ask:["Where was the summer camp?","Why did the Red team lose the first time?","What were they doing in the evening?","Why is teamwork important?"]},
